# Judge0 configuration (consumed by both the server and its db/redis).
# This is a LOCAL/DEV default. Do not commit production secrets here — in
# production these values come from your secret store / terraform.

################################################################################
# Authentication (optional)
################################################################################
# Leave AUTHN_TOKEN empty for local dev (no auth). To require an X-Auth-Token
# header, set AUTHN_TOKEN below AND put the same value in the backend mount file
# `.mount/terraform/judge0-auth-token.key` (read by getJudge0AuthToken()).
AUTHN_HEADER=X-Auth-Token
AUTHN_TOKEN=

################################################################################
# PostgreSQL (Judge0's own database)
################################################################################
POSTGRES_HOST=db
POSTGRES_PORT=5432
POSTGRES_DB=judge0
POSTGRES_USER=judge0
POSTGRES_PASSWORD=judge0-local-password

################################################################################
# Redis (Judge0's own queue/store)
################################################################################
REDIS_HOST=redis
REDIS_PORT=6379
REDIS_PASSWORD=judge0-local-password

################################################################################
# Resource limits (safety caps; per-submission limits are sent by the backend)
################################################################################
# Max CPU time (seconds) a single run may consume.
MAX_CPU_TIME_LIMIT=15
# Max wall-clock time (seconds).
MAX_WALL_TIME_LIMIT=20
# Max memory (KB).
MAX_MEMORY_LIMIT=512000
# Allow enough processes/threads for JVM-based languages.
MAX_PROCESSES_AND_OR_THREADS=120
# Cap batch size to match the largest expected testcase count per problem.
MAX_SUBMISSION_BATCH_SIZE=100
# Disable network access inside the sandbox (no outbound from user code).
ENABLE_NETWORK=false

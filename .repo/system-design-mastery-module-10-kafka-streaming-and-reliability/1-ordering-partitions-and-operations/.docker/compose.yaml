# Kiến trúc: partitionKey bắt buộc; consumer-slow delay 3s → quan sát lag trên Kafka UI.
# (EN: Required partitionKey; consumer-slow 3s delay → observe consumer lag in Kafka UI.)
#
# Demo gợi ý: Gửi cùng partitionKey liên tiếp; so sánh fast vs slow consumer
#
# Thư mục làm việc: 1-ordering-partitions-and-operations/.docker
# (EN: Working directory: 1-ordering-partitions-and-operations/.docker)
#
# Khởi chạy stack:
# (EN: Start stack:)
#   cd 1-ordering-partitions-and-operations/.docker && docker compose up -d --build
#
# Xem log:
# (EN: View logs:)
#   docker compose logs -f
#
# Dọn dẹp:
# (EN: Cleanup:)
#   docker compose down -v
#
name: 1-ordering-partitions-and-operations

services:
  # Kafka KRaft broker — log phân vùng cho lesson.
  # (EN: Kafka KRaft broker — partitioned log for the lesson.)
  # Kafka broker — partitioned log.
  # (EN: Kafka broker — partitioned log.)
  # Kafka broker.
  # (EN: Kafka broker.)
  kafka:
    image: apache/kafka:3.8.0
    container_name: kafka
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
    ports:
      # Broker Kafka PLAINTEXT.
      # (EN: Kafka broker PLAINTEXT port.)
      - "9092:9092"
    networks:
      - 1-ordering-partitions-and-operations
    restart: unless-stopped

  # Kafka UI — xem topic, offset, consumer lag.
  # (EN: Kafka UI — inspect topics, offsets, consumer lag.)
  # Kafka UI — topic / lag / offset.
  # (EN: Kafka UI — topics, lag, offsets.)
  # Kafka UI — lag/offset.
  # (EN: Kafka UI — lag/offset.)
  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: kafka-ui
    ports:
      # Giao diện Kafka UI.
      # (EN: Kafka UI web port.)
      - "8081:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092
    depends_on:
      - kafka
    networks:
      - 1-ordering-partitions-and-operations
    restart: unless-stopped

  # Producer — bắt buộc partitionKey trong body.
  # (EN: Producer — requires partitionKey in body.)
  ordering-producer:
    build:
      context: ../ordering-producer
    image: starciacademy/advanced-message-broker-ordering-producer:latest
    container_name: 1-ordering-partitions-and-operations-ordering-producer
    ports:
      # Cổng HTTP API host → container.
      # (EN: HTTP API host → container port.)
      - "3001:3000"
    environment:
      KAFKA_BROKERS: kafka:9092
      KAFKA_TOPIC: ordering-events
      KAFKA_CLIENT_ID: ordering-producer
      PORT: 3000
    depends_on:
      - kafka
    networks:
      - 1-ordering-partitions-and-operations
    restart: unless-stopped

  # Consumer nhanh — không delay.
  # (EN: Fast consumer — no artificial delay.)
  consumer-fast:
    build:
      context: ../consumer-fast
    image: starciacademy/advanced-message-broker-consumer-fast:latest
    container_name: 1-ordering-partitions-and-operations-consumer-fast
    environment:
      KAFKA_BROKERS: kafka:9092
      KAFKA_TOPIC: ordering-events
      KAFKA_CLIENT_ID: consumer-fast
      KAFKA_GROUP_ID: broker-lesson1-group
    depends_on:
      - kafka
    networks:
      - 1-ordering-partitions-and-operations
    restart: unless-stopped

  # Consumer chậm — CONSUMER_DELAY_MS=3000 (demo lag).
  # (EN: Slow consumer — CONSUMER_DELAY_MS=3000 (lag demo).)
  consumer-slow:
    build:
      context: ../consumer-slow
    image: starciacademy/advanced-message-broker-consumer-slow:latest
    container_name: 1-ordering-partitions-and-operations-consumer-slow
    environment:
      KAFKA_BROKERS: kafka:9092
      KAFKA_TOPIC: ordering-events
      KAFKA_CLIENT_ID: consumer-slow
      KAFKA_GROUP_ID: broker-lesson1-group
      CONSUMER_DELAY_MS: "3000"
    depends_on:
      - kafka
    networks:
      - 1-ordering-partitions-and-operations
    restart: unless-stopped

networks:
  1-ordering-partitions-and-operations:
    name: 1-ordering-partitions-and-operations

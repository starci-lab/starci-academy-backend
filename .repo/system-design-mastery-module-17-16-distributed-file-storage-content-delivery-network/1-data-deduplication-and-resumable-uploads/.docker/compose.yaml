# Docker Compose stack cho bai hoc 1-data-deduplication-and-resumable-uploads.
# (EN: Docker Compose stack for lesson 1-data-deduplication-and-resumable-uploads.)
#
# Thu muc lam viec: 1-data-deduplication-and-resumable-uploads/.docker
# (EN: Working directory: 1-data-deduplication-and-resumable-uploads/.docker)
#
# Khoi dong: docker compose up -d --build
# (EN: Start: docker compose up -d --build)
#
# Xem log: docker compose logs -f api
# (EN: Logs: docker compose logs -f api)
#
# Don tai nguyen: docker compose down -v
# (EN: Cleanup: docker compose down -v)

# Tien to project Compose, dung lam ten stack/container.
# (EN: Compose project prefix used as stack/container name.)
name: 1-data-deduplication-and-resumable-uploads

services:
  # API NestJS cua bai hoc.
  # (EN: Lesson NestJS API.)
  api:
    image: starciacademy/1-data-deduplication-and-resumable-uploads-upload-service:latest
    container_name: 1-data-deduplication-and-resumable-uploads-api
    build:
      context: ../upload-service
      dockerfile: Dockerfile
    ports:
      # Anh xa cong host 3000 sang container 3000 cho HTTP API.
      # (EN: Map host port 3000 to container port 3000 for the HTTP API.)
      - "3000:3000"
    env_file:
      - ../upload-service/.env
    networks:
      - 1-data-deduplication-and-resumable-uploads-network

  # Redis mo phong ha tang cache/queue phu tro cho bai hoc.
  # (EN: Redis simulates supporting cache/queue infrastructure for the lesson.)
  redis:
    image: redis:7-alpine
    container_name: 1-data-deduplication-and-resumable-uploads-redis
    networks:
      - 1-data-deduplication-and-resumable-uploads-network

networks:
  1-data-deduplication-and-resumable-uploads-network:
    name: 1-data-deduplication-and-resumable-uploads-network

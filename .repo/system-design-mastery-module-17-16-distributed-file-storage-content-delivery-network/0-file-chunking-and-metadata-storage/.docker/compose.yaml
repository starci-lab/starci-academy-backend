# Docker Compose stack cho bai hoc 0-file-chunking-and-metadata-storage.
# (EN: Docker Compose stack for lesson 0-file-chunking-and-metadata-storage.)
#
# Thu muc lam viec: 0-file-chunking-and-metadata-storage/.docker
# (EN: Working directory: 0-file-chunking-and-metadata-storage/.docker)
#
# Khoi dong: docker compose up -d --build
# (EN: Start: docker compose up -d --build)
#
# Xem log: docker compose logs -f api
# (EN: Logs: docker compose logs -f api)
#
# Don tai nguyen: docker compose down -v
# (EN: Cleanup: docker compose down -v)

# Tien to project Compose, dung lam ten stack/container.
# (EN: Compose project prefix used as stack/container name.)
name: 0-file-chunking-and-metadata-storage

services:
  # API NestJS cua bai hoc.
  # (EN: Lesson NestJS API.)
  api:
    image: starciacademy/0-file-chunking-and-metadata-storage-metadata-service:latest
    container_name: 0-file-chunking-and-metadata-storage-api
    build:
      context: ../metadata-service
      dockerfile: Dockerfile
    ports:
      # Anh xa cong host 3000 sang container 3000 cho HTTP API.
      # (EN: Map host port 3000 to container port 3000 for the HTTP API.)
      - "3000:3000"
    env_file:
      - ../metadata-service/.env
    networks:
      - 0-file-chunking-and-metadata-storage-network

  # Redis mo phong ha tang cache/queue phu tro cho bai hoc.
  # (EN: Redis simulates supporting cache/queue infrastructure for the lesson.)
  redis:
    image: redis:7-alpine
    container_name: 0-file-chunking-and-metadata-storage-redis
    networks:
      - 0-file-chunking-and-metadata-storage-network

networks:
  0-file-chunking-and-metadata-storage-network:
    name: 0-file-chunking-and-metadata-storage-network

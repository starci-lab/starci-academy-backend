# ──────────────────────────────────────────────
# Indexing & Query Optimization — demo hiệu năng truy vấn có/không index.
# PostgreSQL chứa bảng products (10 000 row), NestJS backend gọi EXPLAIN ANALYZE.
# (EN: Indexing & Query Optimization — demo query performance with/without index.
# PostgreSQL holds products table (10 000 rows), NestJS backend runs EXPLAIN ANALYZE.)
#
# Thư mục làm việc / Working directory:
#   cd system-design-mastery-module-database-fundamentals/1-indexing-and-query-optimization/.docker
#
# Khởi động / Start:
#   docker compose up -d
#
# Xem log / Logs:
#   docker compose logs -f backend
#
# Dọn dẹp / Cleanup:
#   docker compose down -v
# ──────────────────────────────────────────────

# Tiền tố project Compose (tên stack / tiền tố container).
# (EN: Compose project prefix (stack / container name prefix).)
name: 1-indexing-and-query-optimization

services:
  # ──────────────────────────────────────────────
  # PostgreSQL — lưu bảng products, mount init.sql + seed.sql.
  # (EN: PostgreSQL — stores products table, mount init.sql + seed.sql.)
  # ──────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: 1-indexing-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: Cuong123_A
      POSTGRES_DB: indexing_db
    ports:
      # Ánh xạ cổng host 5432 → container 5432 (PostgreSQL).
      # (EN: Map host port 5432 → container 5432 (PostgreSQL).)
      - "5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
      # Mount SQL khởi tạo — tạo bảng và seed dữ liệu mẫu.
      # (EN: Mount init SQL — create table and seed sample data.)
      - ../.sql/init.sql:/docker-entrypoint-initdb.d/01-init.sql
      - ../.sql/seed.sql:/docker-entrypoint-initdb.d/02-seed.sql
    restart: unless-stopped

  # ──────────────────────────────────────────────
  # Backend NestJS — REST API demo index và query optimization.
  # (EN: Backend NestJS — REST API for index and query optimization demo.)
  # ──────────────────────────────────────────────
  backend:
    build:
      context: ../0-typescript
      dockerfile: Dockerfile
    container_name: 1-indexing-backend
    ports:
      # REST API tại http://localhost:3001.
      # (EN: REST API at http://localhost:3001.)
      - "3001:3001"
    environment:
      PORT: "3001"
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: Cuong123_A
      POSTGRES_DB: indexing_db
    depends_on:
      - postgres
    restart: unless-stopped

# ──────────────────────────────────────────────
# Volumes — dữ liệu persistent cho PostgreSQL.
# (EN: Volumes — persistent data for PostgreSQL.)
# ──────────────────────────────────────────────
volumes:
  pg_data: {}

# ──────────────────────────────────────────────
# Network — Compose tự quản lý, không dùng `external: true`.
# (EN: Network — Compose-managed, no `external: true`.)
# ──────────────────────────────────────────────
networks:
  default:
    name: 1-indexing-and-query-optimization

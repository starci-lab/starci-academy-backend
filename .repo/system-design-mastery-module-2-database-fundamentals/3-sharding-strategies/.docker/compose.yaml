# ──────────────────────────────────────────────
# Sharding Strategies — MongoDB sharded cluster với 2 shard, config server, mongos router.
# Demo hashed sharding (userId) và zone-based sharding (country).
# (EN: Sharding Strategies — MongoDB sharded cluster with 2 shards, config server, mongos router.
# Demo hashed sharding (userId) and zone-based sharding (country).)
#
# Thư mục làm việc / Working directory:
#   cd system-design-mastery-module-database-fundamentals/3-sharding-strategies/.docker
#
# Khởi động / Start:
#   docker compose up -d
#
# Xem log / Logs:
#   docker compose logs -f backend
#
# Dọn dẹp / Cleanup:
#   docker compose down -v
# ──────────────────────────────────────────────

# Tiền tố project Compose (tên stack / tiền tố container).
# (EN: Compose project prefix (stack / container name prefix).)
name: 3-sharding-strategies

services:
  # ──────────────────────────────────────────────
  # Config Server — metadata cluster (replica set configReplSet).
  # (EN: Config Server — cluster metadata (replica set configReplSet).)
  # ──────────────────────────────────────────────
  config-server:
    image: mongo:7
    container_name: config-server
    # Chạy mongod ở chế độ config server với replica set configReplSet.
    # (EN: Run mongod in config server mode with replica set configReplSet.)
    command: mongod --configsvr --replSet configReplSet --port 27019 --bind_ip_all
    ports:
      # Cổng config server (27019).
      # (EN: Config server port (27019).)
      - "27019:27019"
    volumes:
      - config-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--port", "27019", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  # ──────────────────────────────────────────────
  # Init Config Server — khởi tạo replica set cho config server.
  # (EN: Init Config Server — initialize replica set for config server.)
  # ──────────────────────────────────────────────
  init-config:
    image: mongo:7
    container_name: init-config
    depends_on:
      config-server:
        condition: service_healthy
    # rs.initiate() — tạo replica set configReplSet với 1 member.
    # (EN: rs.initiate() — create configReplSet replica set with 1 member.)
    command: >
      mongosh --host config-server --port 27019 --eval '
        rs.initiate({
          _id: "configReplSet",
          configsvr: true,
          members: [{ _id: 0, host: "config-server:27019" }]
        });
      '
    restart: "no"

  # ──────────────────────────────────────────────
  # Shard 1 — data shard đầu tiên (replica set shard1ReplSet, port 27018).
  # (EN: Shard 1 — first data shard (replica set shard1ReplSet, port 27018).)
  # ──────────────────────────────────────────────
  shard1:
    image: mongo:7
    container_name: shard1
    # Chạy mongod ở chế độ shard server.
    # (EN: Run mongod in shard server mode.)
    command: mongod --shardsvr --replSet shard1ReplSet --port 27018 --bind_ip_all
    ports:
      # Cổng shard 1 (27018).
      # (EN: Shard 1 port (27018).)
      - "27018:27018"
    volumes:
      - shard1-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--port", "27018", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  # ──────────────────────────────────────────────
  # Init Shard 1 — khởi tạo replica set cho shard 1.
  # (EN: Init Shard 1 — initialize replica set for shard 1.)
  # ──────────────────────────────────────────────
  init-shard1:
    image: mongo:7
    container_name: init-shard1
    depends_on:
      shard1:
        condition: service_healthy
    # rs.initiate() — tạo replica set shard1ReplSet với 1 member.
    # (EN: rs.initiate() — create shard1ReplSet replica set with 1 member.)
    command: >
      mongosh --host shard1 --port 27018 --eval '
        rs.initiate({
          _id: "shard1ReplSet",
          members: [{ _id: 0, host: "shard1:27018" }]
        });
      '
    restart: "no"

  # ──────────────────────────────────────────────
  # Shard 2 — data shard thứ hai (replica set shard2ReplSet, port 27028).
  # (EN: Shard 2 — second data shard (replica set shard2ReplSet, port 27028).)
  # ──────────────────────────────────────────────
  shard2:
    image: mongo:7
    container_name: shard2
    # Chạy mongod ở chế độ shard server.
    # (EN: Run mongod in shard server mode.)
    command: mongod --shardsvr --replSet shard2ReplSet --port 27028 --bind_ip_all
    ports:
      # Cổng shard 2 (27028).
      # (EN: Shard 2 port (27028).)
      - "27028:27028"
    volumes:
      - shard2-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--port", "27028", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  # ──────────────────────────────────────────────
  # Init Shard 2 — khởi tạo replica set cho shard 2.
  # (EN: Init Shard 2 — initialize replica set for shard 2.)
  # ──────────────────────────────────────────────
  init-shard2:
    image: mongo:7
    container_name: init-shard2
    depends_on:
      shard2:
        condition: service_healthy
    # rs.initiate() — tạo replica set shard2ReplSet với 1 member.
    # (EN: rs.initiate() — create shard2ReplSet replica set with 1 member.)
    command: >
      mongosh --host shard2 --port 27028 --eval '
        rs.initiate({
          _id: "shard2ReplSet",
          members: [{ _id: 0, host: "shard2:27028" }]
        });
      '
    restart: "no"

  # ──────────────────────────────────────────────
  # Mongos Router — điểm truy cập duy nhất cho client (port 27017).
  # Kết nối tới config server để biết data nằm ở shard nào.
  # (EN: Mongos Router — single entry point for clients (port 27017).
  # Connects to config server to know which shard holds the data.)
  # ──────────────────────────────────────────────
  mongos:
    image: mongo:7
    container_name: mongos
    # Chạy mongos router kết nối tới config server.
    # (EN: Run mongos router connecting to config server.)
    command: mongos --configdb configReplSet/config-server:27019 --port 27017 --bind_ip_all
    ports:
      # Cổng mongos router cho client kết nối (27017).
      # (EN: Mongos router port for client connections (27017).)
      - "27017:27017"
    depends_on:
      init-config:
        condition: service_completed_successfully
      init-shard1:
        condition: service_completed_successfully
      init-shard2:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "mongosh", "--port", "27017", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  # ──────────────────────────────────────────────
  # Init Router — thêm shard vào cluster và chạy script sharding từ .sql/.
  # (EN: Init Router — add shards to cluster and run sharding scripts from .sql/.)
  # ──────────────────────────────────────────────
  init-router:
    image: mongo:7
    container_name: init-router
    depends_on:
      mongos:
        condition: service_healthy
    volumes:
      # Mount script từ thư mục .sql/ (ngang hàng với .docker/).
      # (EN: Mount scripts from .sql/ directory (sibling of .docker/).)
      - ../.sql/init-shard.js:/scripts/init-shard.js:ro
    # Thêm 2 shard vào cluster, sau đó chạy init-shard.js (hashed sharding trên userId).
    # init-zones.js KHÔNG chạy tự động — zone-based sharding cần range/compound shard key.
    # (EN: Add 2 shards to cluster, then run init-shard.js (hashed sharding on userId).
    # init-zones.js is NOT run automatically — zone-based sharding requires range/compound shard key.)
    command: >
      mongosh --host mongos --port 27017 --eval '
        sh.addShard("shard1ReplSet/shard1:27018");
        sh.addShard("shard2ReplSet/shard2:27028");
        load("/scripts/init-shard.js");
      '
    restart: "no"

  # ──────────────────────────────────────────────
  # Backend — NestJS API kết nối tới mongos router.
  # (EN: Backend — NestJS API connecting to mongos router.)
  # ──────────────────────────────────────────────
  backend:
    # Build locally from the TypeScript lesson source (no DockerHub pull/push).
    # (VI: Build cục bộ từ source TypeScript của bài học — không pull/push DockerHub.)
    build:
      context: ../0-typescript
      dockerfile: Dockerfile
    container_name: sharding-strategies-backend
    ports:
      # REST API tại http://localhost:3003.
      # (EN: REST API at http://localhost:3003.)
      - "3003:3003"
    environment:
      # Cổng HTTP cho NestJS.
      # (EN: HTTP port for NestJS.)
      PORT: "3003"
      # URI kết nối tới mongos router trong mạng Compose.
      # (EN: Connection URI to mongos router inside Compose network.)
      MONGO_URI: mongodb://mongos:27017/app
    depends_on:
      init-router:
        condition: service_completed_successfully
    restart: unless-stopped

# ──────────────────────────────────────────────
# Volumes — dữ liệu persistent cho config server và các shard.
# (EN: Volumes — persistent data for config server and shards.)
# ──────────────────────────────────────────────
volumes:
  config-data: {}
  shard1-data: {}
  shard2-data: {}

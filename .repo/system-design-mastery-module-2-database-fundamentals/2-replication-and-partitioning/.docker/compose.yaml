# ──────────────────────────────────────────────
# Replication & Partitioning — PostgreSQL streaming replication (primary + replica)
# với bảng orders phân vùng theo RANGE(created_at).
# Backend NestJS đọc từ replica, ghi vào primary.
# (EN: Replication & Partitioning — PostgreSQL streaming replication (primary + replica)
# with orders table partitioned by RANGE(created_at).
# NestJS backend reads from replica, writes to primary.)
#
# Thư mục làm việc / Working directory:
#   cd system-design-mastery-module-database-fundamentals/2-replication-and-partitioning/.docker
#
# Khởi động / Start:
#   docker compose up -d
#
# Xem log / Logs:
#   docker compose logs -f backend
#
# Dọn dẹp / Cleanup:
#   docker compose down -v
# ──────────────────────────────────────────────

# Tiền tố project Compose (tên stack / tiền tố container).
# (EN: Compose project prefix (stack / container name prefix).)
name: 2-replication-and-partitioning

services:
  # ──────────────────────────────────────────────
  # PostgreSQL Primary — node ghi chính, WAL streaming tới replica.
  # (EN: PostgreSQL Primary — main write node, WAL streaming to replica.)
  # ──────────────────────────────────────────────
  primary:
    image: postgres:16-alpine
    container_name: pg-primary
    environment:
      # Database và credentials mặc định.
      # (EN: Default database and credentials.)
      POSTGRES_DB: orders_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: Cuong123_A
    ports:
      # Ánh xạ cổng host 5432 → container 5432 (primary).
      # (EN: Map host port 5432 → container 5432 (primary).)
      - "5432:5432"
    volumes:
      # Dữ liệu persistent cho primary.
      # (EN: Persistent data for primary.)
      - primary_data:/var/lib/postgresql/data
      # Script khởi tạo schema + partition + replication user.
      # (EN: Init script for schema + partition + replication user.)
      - ../.sql/init-primary.sql:/docker-entrypoint-initdb.d/01-init.sql
      # Seed dữ liệu mẫu.
      # (EN: Seed sample data.)
      - ../.sql/seed.sql:/docker-entrypoint-initdb.d/02-seed.sql
      # Cấu hình xác thực cho replication.
      # (EN: Authentication config for replication.)
      - ../.sql/pg_hba.conf:/etc/pg_hba.conf
    # Cấu hình WAL cho streaming replication.
    # (EN: WAL config for streaming replication.)
    command: >
      postgres
        -c wal_level=replica
        -c max_wal_senders=3
        -c max_replication_slots=3
        -c hot_standby=on
        -c hba_file=/etc/pg_hba.conf
        -c listen_addresses='*'
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d orders_db"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  # ──────────────────────────────────────────────
  # PostgreSQL Replica — hot standby, nhận WAL từ primary.
  # (EN: PostgreSQL Replica — hot standby, receives WAL from primary.)
  # ──────────────────────────────────────────────
  replica:
    image: postgres:16-alpine
    container_name: pg-replica
    environment:
      # Credentials cho pg_basebackup từ primary.
      # (EN: Credentials for pg_basebackup from primary.)
      PGUSER: replicator
      PGPASSWORD: replicator_pass
    ports:
      # Ánh xạ cổng host 5433 → container 5432 (replica).
      # (EN: Map host port 5433 → container 5432 (replica).)
      - "5433:5432"
    volumes:
      # Dữ liệu persistent cho replica.
      # (EN: Persistent data for replica.)
      - replica_data:/var/lib/postgresql/data
    depends_on:
      primary:
        condition: service_healthy
    # Entrypoint tuỳ chỉnh — pg_basebackup lần đầu rồi chạy standby.
    # (EN: Custom entrypoint — pg_basebackup on first run then start as standby.)
    entrypoint: |
      bash -c "
      if [ ! -f /var/lib/postgresql/data/PG_VERSION ]; then
        echo 'Tạo base backup từ primary... (EN: Taking base backup from primary...)'
        until pg_basebackup -h primary -p 5432 -U replicator -D /var/lib/postgresql/data -Fp -Xs -P -R
        do
          echo 'Chờ primary sẵn sàng... (EN: Waiting for primary to be ready...)'
          sleep 2
        done
        echo 'Base backup hoàn tất. (EN: Base backup completed.)'
        touch /var/lib/postgresql/data/standby.signal
        chown -R postgres:postgres /var/lib/postgresql/data
      fi
      exec docker-entrypoint.sh postgres -c hot_standby=on
      "
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  # ──────────────────────────────────────────────
  # Backend NestJS — REST API, ghi master / đọc replica.
  # (EN: NestJS Backend — REST API, write to master / read from replica.)
  # ──────────────────────────────────────────────
  backend:
    # Build image locally from the TypeScript NestJS source (no DockerHub pull/push).
    build:
      context: ../0-typescript
      dockerfile: Dockerfile
    container_name: repl-backend
    ports:
      # REST API tại http://localhost:3002.
      # (EN: REST API at http://localhost:3002.)
      - "3002:3002"
    environment:
      PORT: "3002"
      # Kết nối master (primary) — ghi.
      # (EN: Master (primary) connection — writes.)
      POSTGRES_MASTER_HOST: primary
      POSTGRES_MASTER_PORT: "5432"
      # Kết nối replica (slave) — đọc.
      # (EN: Replica (slave) connection — reads.)
      POSTGRES_REPLICA_HOST: replica
      POSTGRES_REPLICA_PORT: "5432"
      # Credentials chung.
      # (EN: Shared credentials.)
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: Cuong123_A
      POSTGRES_DB: orders_db
    depends_on:
      primary:
        condition: service_healthy
      replica:
        condition: service_healthy
    restart: unless-stopped

# ──────────────────────────────────────────────
# Volumes — dữ liệu persistent cho primary và replica.
# (EN: Volumes — persistent data for primary and replica.)
# ──────────────────────────────────────────────
volumes:
  primary_data: {}
  replica_data: {}

# ──────────────────────────────────────────────
# Network — Compose tự quản lý, không dùng `external: true`.
# (EN: Network — Compose-managed, no `external: true`.)
# ──────────────────────────────────────────────
networks:
  default:
    name: 2-replication-and-partitioning

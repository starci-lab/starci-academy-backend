# ============================================================
# Cấu hình xác thực PostgreSQL — cho phép replication từ replica.
# (EN: PostgreSQL authentication config — allow replication from replica.)
# ============================================================

# TYPE  DATABASE        USER            ADDRESS                 METHOD

# Kết nối local mặc định.
# (EN: Default local connections.)
local   all             all                                     trust
host    all             all             127.0.0.1/32            trust
host    all             all             ::1/128                 trust

# Cho phép mọi container trong mạng Docker kết nối.
# (EN: Allow any container on the Docker network.)
host    all             all             0.0.0.0/0               md5

# Kết nối replication từ replica.
# (EN: Replication connections from the replica.)
host    replication     all             0.0.0.0/0               md5

server:
  port: 3002

spring:
  jpa:
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

# Custom datasource configuration to be read by Java code
datasource:
  primary:
    url: jdbc:postgresql://${POSTGRES_MASTER_HOST:localhost}:${POSTGRES_MASTER_PORT:5432}/${POSTGRES_DB:orders_db}
    username: ${POSTGRES_USER:postgres}
    password: ${POSTGRES_PASSWORD:Cuong123_A}
    driver-class-name: org.postgresql.Driver
  replica:
    url: jdbc:postgresql://${POSTGRES_REPLICA_HOST:localhost}:${POSTGRES_REPLICA_PORT:5433}/${POSTGRES_DB:orders_db}
    username: ${POSTGRES_USER:postgres}
    password: ${POSTGRES_PASSWORD:Cuong123_A}
    driver-class-name: org.postgresql.Driver

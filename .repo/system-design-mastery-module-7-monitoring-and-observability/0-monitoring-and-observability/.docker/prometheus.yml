# VI: Cấu hình Prometheus — scrape `/metrics` từ service Compose `app` (DNS nội bộ).
# EN: Prometheus config — scrape `/metrics` from Compose service `app` (internal DNS).

# VI: Chu kỳ scrape toàn cục (mặc định lab).
# EN: Global scrape interval (lab default).

global:
  scrape_interval: 15s

# VI: Danh sách job scrape — một job trỏ Nest metrics-api.
# EN: Scrape job list — one job targeting Nest metrics-api.

scrape_configs:
  # VI: Job đặt tên tuỳ ý để nhận biết trên UI Prometheus.
  # EN: Arbitrary job name for Prometheus UI identification.

  - job_name: nestjs-app-lesson0
    metrics_path: /metrics
    static_configs:
      - targets:
          # VI: `app` là tên service trong compose.yaml (cùng Docker network lesson).
          # EN: `app` is the service name in compose.yaml (same lesson Docker network).

          - app:3000

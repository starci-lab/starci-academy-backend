# Kiến trúc: Stack Docker lesson: distributed tracing.
# (EN: Docker stack for lesson: distributed tracing.)
#
# Demo: HTTP API cổng 3000 (hoặc theo compose); xem README module.
#
# Thư mục làm việc: 3-distributed-tracing/.docker
# (EN: Working directory: 3-distributed-tracing/.docker)
#
# Khởi chạy stack:
# (EN: Start stack:)
#   cd 3-distributed-tracing/.docker && docker compose up -d --build
#
# Xem log:
# (EN: View logs:)
#   docker compose logs -f
#
# Dọn dẹp:
# (EN: Cleanup:)
#   docker compose down -v
#
# =============================================================================
# Docker Compose — lesson `3-distributed-tracing` (tracing-api + Jaeger OTLP).
# (EN: Docker Compose — lesson `3-distributed-tracing` (tracing-api + Jaeger OTLP).)
#
# Làm việc trong thư mục chứa file này: `.../3-distributed-tracing/.docker/`
# (EN: Run commands from this file's directory: `.../3-distributed-tracing/.docker/`)
#
# Compose tự tạo network `3-distributed-tracing` khi `up` (không cần `docker network create`).
# (EN: Compose creates network `3-distributed-tracing` on `up` (no manual `docker network create`).)
#
# Khởi chạy nền + build tracing-api (Jaeger chỉ pull image public):
# (EN: Start detached + build tracing-api (Jaeger uses public image only).)
#     docker compose up -d --build
#
# Gọi API (host 3005 → container 3000) và mở Jaeger UI (host 16687 nếu 16686 đã bị stack khác dùng):
# (EN: Call API (host 3005 → container 3000) and open Jaeger UI (host 16687 if 16686 is taken by another stack).)
#     curl http://localhost:3005/checkout
#     open http://localhost:16687
#
# Dừng và gỡ container:
# (EN: Stop and remove containers.)
#     docker compose down
# =============================================================================

# Tiền tố project Compose — trùng tên thư mục bài học (slug).
# (EN: Compose project prefix — matches lesson folder slug.)
name: 3-distributed-tracing

services:
  # VI: Jaeger all-in-one — trong container vẫn :16686 / :4318; map host 16687/4319 để tránh đụng Jaeger khác trên máy.
  # EN: Jaeger all-in-one — in-container still :16686 / :4318; host 16687/4319 avoids clashes with another local Jaeger.
  jaeger:
    image: jaegertracing/all-in-one:1.57
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
    ports:
      - "16687:16686"
      - "4319:4318"
    networks:
      - "3-distributed-tracing"

  # VI: NestJS export trace OTLP — host 3005 → app :3000 (tránh đụng metrics lesson 0 trên :3000).
  # EN: NestJS OTLP trace export — host 3005 → app :3000 (avoid lesson 0 metrics on :3000).
  tracing-api:
    build:
      context: ../tracing-api
      dockerfile: Dockerfile
    environment:
      # Endpoint đầy đủ `/v1/traces` khớp exporter HTTP mặc định của lab.
      # (EN: Full `/v1/traces` path matches lab default HTTP exporter.)
      OTEL_EXPORTER_OTLP_TRACES_ENDPOINT: http://jaeger:4318/v1/traces
    depends_on:
      - jaeger
    ports:
      - "3005:3000"
    networks:
      - "3-distributed-tracing"

# Network do Compose tạo; `name` trùng slug bài (không `external`).
# (EN: Compose-managed network; `name` matches lesson slug (not `external`).)
networks:
  "3-distributed-tracing":
    name: "3-distributed-tracing"

# Kiến trúc: Token bucket Redis (RATE_LIMIT_MAX/window) + BullMQ priority queue (OTP ưu tiên hơn Marketing).
# (EN: Redis token bucket rate limit + BullMQ priority queue (OTP before Marketing).)
#
# Demo gợi ý: Spam cùng userId → 429; OTP vẫn qua; so sánh thứ tự job
#
# Thư mục làm việc: 1-rate-limiting-and-priority-queues/.docker
# (EN: Working directory: 1-rate-limiting-and-priority-queues/.docker)
#
# Khởi chạy stack:
# (EN: Start stack:)
#   cd 1-rate-limiting-and-priority-queues/.docker && docker compose up -d --build
#
# Xem log:
# (EN: View logs:)
#   docker compose logs -f
#
# Dọn dẹp:
# (EN: Cleanup:)
#   docker compose down -v
#
name: 1-rate-limiting-and-priority-queues

services:
  # NestJS API — Rate Limiter + Priority Queue Producer/Consumer
  # NestJS HTTP API — entry lesson.
  # (EN: NestJS HTTP API — lesson entrypoint.)
  # NestJS HTTP API.
  # (EN: NestJS HTTP API.)
  api:
    container_name: 1-rate-limiting-api
    image: starciacademy/rate-limiting-and-priority-queues-rate-limit-service:latest
    ports:
      # HTTP API lesson.
      # (EN: Lesson HTTP API port.)
      # Cổng HTTP API host → container.
      # (EN: HTTP API host → container port.)
      - "3000:3000"
    environment:
      - PORT=3000
      - POSTGRES_HOST=db
      - POSTGRES_PORT=5432
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=rate_limit_service
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - SMTP_HOST=mailhog
      - SMTP_PORT=1025
      - SMTP_USER=
      - SMTP_PASS=
      - SMTP_FROM=noreply@starci-academy.dev
      - RATE_LIMIT_MAX=5
      - RATE_LIMIT_WINDOW_SECONDS=60
    networks:
      - 1-rate-limiting-network
    depends_on:
      - db
      - redis
      - mailhog

  # PostgreSQL — Lưu trữ notification log.
  # PostgreSQL — persistence lesson.
  # (EN: PostgreSQL — lesson persistence.)
  # PostgreSQL persistence.
  # (EN: PostgreSQL persistence.)
  db:
    image: postgres:16-alpine
    container_name: 1-rate-limiting-db
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=rate_limit_service
    ports:
      - "5432:5432"
    networks:
      - 1-rate-limiting-network

  # Redis — Token Bucket store + BullMQ backend.
  # Redis — BullMQ backend + token bucket.
  # (EN: Redis — BullMQ backend + token bucket.)
  # Redis — cache / queue / rate limit.
  # (EN: Redis — cache / queue / rate limit.)
  # Redis cache/queue/rate-limit.
  # (EN: Redis cache/queue/rate-limit.)
  redis:
    image: redis:7-alpine
    container_name: 1-rate-limiting-redis
    ports:
      - "6379:6379"
    networks:
      - 1-rate-limiting-network

  # MailHog — Mock SMTP.
  # MailHog SMTP mock — UI http://localhost:8025.
  # (EN: MailHog mock SMTP — UI at http://localhost:8025.)
  # MailHog SMTP mock — inbox UI :8025.
  # (EN: MailHog mock SMTP — inbox UI :8025.)
  # MailHog SMTP mock :8025.
  # (EN: MailHog SMTP mock.)
  mailhog:
    image: mailhog/mailhog:latest
    container_name: 1-rate-limiting-mailhog
    ports:
      - "1025:1025"
      # MailHog web inbox.
      # (EN: MailHog web inbox port.)
      - "8025:8025"
    networks:
      - 1-rate-limiting-network

networks:
  1-rate-limiting-network:
    name: 1-rate-limiting-network

syntax = "proto3";

package user;

option java_multiple_files = true;
option java_package = "com.starci.grpc";

message Empty {}

message User {
  int32 id = 1;
  string name = 2;
  string email = 3;
}

message UserList {
  repeated User users = 1;
}

message UserById {
  int32 id = 1;
}

message CreateUserInput {
  string name = 1;
  string email = 2;
}

service UserService {
  rpc FindAll (Empty) returns (UserList) {}
  rpc FindOne (UserById) returns (User) {}
  rpc Create (CreateUserInput) returns (User) {}
}

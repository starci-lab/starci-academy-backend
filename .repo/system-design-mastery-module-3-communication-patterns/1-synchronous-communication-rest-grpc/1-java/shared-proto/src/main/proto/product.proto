syntax = "proto3";

package product;

option java_multiple_files = true;
option java_package = "com.starci.grpc";

message Product {
  int32 id = 1;
  string name = 2;
  double price = 3;
  int32 stock = 4;
}

message ProductById {
  int32 id = 1;
}

service ProductService {
  rpc FindOne (ProductById) returns (Product) {}
}

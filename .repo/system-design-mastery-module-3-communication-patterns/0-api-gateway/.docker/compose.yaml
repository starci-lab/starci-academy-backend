# Docker Compose — lesson `0-api-gateway` (TypeScript stack: Kong Gateway + 3 NestJS services).
# Working directory: 0-api-gateway/.docker
#
#   docker compose up -d --build      # start detached + build the NestJS services locally
#   docker compose logs -f kong
#   docker compose down -v            # stop and remove containers + network
#
# Build-local: the 3 NestJS services build from source via their Dockerfiles.
# Kong runs DB-less: its routing map is the declarative file `kong.yml`
# (mounted read-only), so no Postgres / migrations are needed.
name: 0-api-gateway

services:
  # Kong Gateway (DB-less) — main reverse proxy on :8000, Admin API on :8001.
  # Routes are loaded from the declarative config kong.yml.
  kong:
    image: kong:latest
    environment:
      KONG_DATABASE: "off"
      KONG_DECLARATIVE_CONFIG: /kong/kong.yml
      KONG_PROXY_LISTEN: 0.0.0.0:8000
      KONG_ADMIN_LISTEN: 0.0.0.0:8001
    volumes:
      - ./kong.yml:/kong/kong.yml:ro
    ports:
      # Host 8000 → Kong proxy (client traffic).
      - "8000:8000"
      # Host 8001 → Kong Admin API (read-only inspection).
      - "8001:8001"
    depends_on:
      - user-service
      - product-service
      - order-service
    networks:
      - "0-api-gateway"
    restart: unless-stopped

  # User Service — NestJS backend (:3001).
  user-service:
    build:
      context: ../user-service
    environment:
      PORT: 3001
    ports:
      - "3001:3001"
    networks:
      - "0-api-gateway"
    restart: unless-stopped

  # Product Service — NestJS backend (:3002).
  product-service:
    build:
      context: ../product-service
    environment:
      PORT: 3002
    ports:
      - "3002:3002"
    networks:
      - "0-api-gateway"
    restart: unless-stopped

  # Order Service — NestJS backend (:3003).
  order-service:
    build:
      context: ../order-service
    environment:
      PORT: 3003
    ports:
      - "3003:3003"
    networks:
      - "0-api-gateway"
    restart: unless-stopped

# Compose-managed network; `name` sets the Docker network name to match the lesson.
networks:
  "0-api-gateway":
    name: "0-api-gateway"

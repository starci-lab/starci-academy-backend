# Docker Compose — lesson `2-asynchronous-event-driven` (TypeScript track, canonical runnable).
# (Kafka + Kafka UI + 3 NestJS backends: Order producer, Inventory/Notification consumers.)
#
# Working directory: 2-asynchronous-event-driven/.docker
#
# Start the full stack (build images locally — no registry/push):
#   docker compose up -d --build
#
# Tail consumer logs:
#   docker compose logs -f inventory-service notification-service
#
# Stop and remove containers + volumes:
#   docker compose down -v
# =============================================================================

# Compose project prefix (stack / container name prefix).
name: 2-asynchronous-event-driven

services:
  # ──────────────────────────────────────────────
  # Kafka broker (KRaft mode — no Zookeeper). Upstream image (not built locally).
  # ──────────────────────────────────────────────
  kafka:
    image: apache/kafka:3.8.0
    container_name: kafka
    environment:
      # KRaft cluster id.
      KAFKA_CLUSTER_ID: starci-kafka-cluster
      # Node roles: both broker and controller.
      KAFKA_PROCESS_ROLES: broker,controller
      # Node id in the cluster.
      KAFKA_NODE_ID: 1
      # Quorum voters for KRaft mode.
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      # Controller listener name (internal).
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      # Kafka listeners.
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093
      # Advertised listener for client connections inside the Compose network.
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      # Listener name -> security protocol mapping.
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT
      # Inter-broker listener.
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      # Offset topic replication factor (single-node dev).
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
    ports:
      # Kafka broker port for clients.
      - "9092:9092"
    restart: unless-stopped

  # ──────────────────────────────────────────────
  # Kafka UI — web interface for topics, lag, offsets. Upstream image.
  # ──────────────────────────────────────────────
  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: kafka-ui
    ports:
      # Web UI for monitoring topics and messages.
      - "8080:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092
    depends_on:
      - kafka
    restart: unless-stopped

  # ──────────────────────────────────────────────
  # Order Service (Producer) — REST API for POST /orders, emits a Kafka event.
  # Built locally from ../order (no DockerHub image).
  # ──────────────────────────────────────────────
  order-service:
    build:
      context: ../0-typescript/order
      dockerfile: Dockerfile
    container_name: order-service
    ports:
      # REST API for client order creation.
      - "3001:3001"
    environment:
      # HTTP port (matches the published port and Dockerfile EXPOSE).
      PORT: 3001
      # Kafka broker address inside the Compose network.
      KAFKA_BROKERS: kafka:9092
    depends_on:
      - kafka
    restart: unless-stopped

  # ──────────────────────────────────────────────
  # Inventory Consumer — listens on `order-events`, updates stock.
  # Built locally from ../inventory.
  # ──────────────────────────────────────────────
  inventory-service:
    build:
      context: ../0-typescript/inventory
      dockerfile: Dockerfile
    container_name: inventory-service
    environment:
      KAFKA_BROKERS: kafka:9092
    depends_on:
      - kafka
    restart: unless-stopped

  # ──────────────────────────────────────────────
  # Notification Consumer — listens on `order-events`, sends a notification.
  # Built locally from ../notification.
  # ──────────────────────────────────────────────
  notification-service:
    build:
      context: ../0-typescript/notification
      dockerfile: Dockerfile
    container_name: notification-service
    environment:
      KAFKA_BROKERS: kafka:9092
    depends_on:
      - kafka
    restart: unless-stopped

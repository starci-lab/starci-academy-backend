# Docker Compose stack cho bai hoc 1-url-frontier-and-bloom-filters.
# (EN: Docker Compose stack for lesson 1-url-frontier-and-bloom-filters.)
#
# Thu muc lam viec: 1-url-frontier-and-bloom-filters/.docker
# (EN: Working directory: 1-url-frontier-and-bloom-filters/.docker)
#
# Khoi dong: docker compose up -d --build
# (EN: Start: docker compose up -d --build)
#
# Xem log: docker compose logs -f api
# (EN: Logs: docker compose logs -f api)
#
# Don tai nguyen: docker compose down -v
# (EN: Cleanup: docker compose down -v)

# Tien to project Compose, dung lam ten stack/container.
# (EN: Compose project prefix used as stack/container name.)
name: 1-url-frontier-and-bloom-filters

services:
  # API NestJS cua bai hoc.
  # (EN: Lesson NestJS API.)
  api:
    image: starciacademy/1-url-frontier-and-bloom-filters-frontier-service:latest
    container_name: 1-url-frontier-and-bloom-filters-api
    build:
      context: ../frontier-service
      dockerfile: Dockerfile
    ports:
      # Anh xa cong host 3000 sang container 3000 cho HTTP API.
      # (EN: Map host port 3000 to container port 3000 for the HTTP API.)
      - "3000:3000"
    env_file:
      - ../frontier-service/.env
    networks:
      - 1-url-frontier-and-bloom-filters-network

  # Redis mo phong ha tang cache/queue phu tro cho bai hoc.
  # (EN: Redis simulates supporting cache/queue infrastructure for the lesson.)
  redis:
    image: redis:7-alpine
    container_name: 1-url-frontier-and-bloom-filters-redis
    networks:
      - 1-url-frontier-and-bloom-filters-network

networks:
  1-url-frontier-and-bloom-filters-network:
    name: 1-url-frontier-and-bloom-filters-network

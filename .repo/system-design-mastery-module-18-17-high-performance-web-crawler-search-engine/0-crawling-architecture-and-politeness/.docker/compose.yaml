# Docker Compose stack cho bai hoc 0-crawling-architecture-and-politeness.
# (EN: Docker Compose stack for lesson 0-crawling-architecture-and-politeness.)
#
# Thu muc lam viec: 0-crawling-architecture-and-politeness/.docker
# (EN: Working directory: 0-crawling-architecture-and-politeness/.docker)
#
# Khoi dong: docker compose up -d --build
# (EN: Start: docker compose up -d --build)
#
# Xem log: docker compose logs -f api
# (EN: Logs: docker compose logs -f api)
#
# Don tai nguyen: docker compose down -v
# (EN: Cleanup: docker compose down -v)

# Tien to project Compose, dung lam ten stack/container.
# (EN: Compose project prefix used as stack/container name.)
name: 0-crawling-architecture-and-politeness

services:
  # API NestJS cua bai hoc.
  # (EN: Lesson NestJS API.)
  api:
    image: starciacademy/0-crawling-architecture-and-politeness-crawler-service:latest
    container_name: 0-crawling-architecture-and-politeness-api
    build:
      context: ../crawler-service
      dockerfile: Dockerfile
    ports:
      # Anh xa cong host 3000 sang container 3000 cho HTTP API.
      # (EN: Map host port 3000 to container port 3000 for the HTTP API.)
      - "3000:3000"
    env_file:
      - ../crawler-service/.env
    networks:
      - 0-crawling-architecture-and-politeness-network

  # Redis mo phong ha tang cache/queue phu tro cho bai hoc.
  # (EN: Redis simulates supporting cache/queue infrastructure for the lesson.)
  redis:
    image: redis:7-alpine
    container_name: 0-crawling-architecture-and-politeness-redis
    networks:
      - 0-crawling-architecture-and-politeness-network

networks:
  0-crawling-architecture-and-politeness-network:
    name: 0-crawling-architecture-and-politeness-network

# Docker Compose stack cho bai hoc 2-html-parsing-indexing-pagerank.
# (EN: Docker Compose stack for lesson 2-html-parsing-indexing-pagerank.)
#
# Thu muc lam viec: 2-html-parsing-indexing-pagerank/.docker
# (EN: Working directory: 2-html-parsing-indexing-pagerank/.docker)
#
# Khoi dong: docker compose up -d --build
# (EN: Start: docker compose up -d --build)
#
# Xem log: docker compose logs -f api
# (EN: Logs: docker compose logs -f api)
#
# Don tai nguyen: docker compose down -v
# (EN: Cleanup: docker compose down -v)

# Tien to project Compose, dung lam ten stack/container.
# (EN: Compose project prefix used as stack/container name.)
name: 2-html-parsing-indexing-pagerank

services:
  # API NestJS cua bai hoc.
  # (EN: Lesson NestJS API.)
  api:
    image: starciacademy/2-html-parsing-indexing-pagerank-indexer-service:latest
    container_name: 2-html-parsing-indexing-pagerank-api
    build:
      context: ../indexer-service
      dockerfile: Dockerfile
    ports:
      # Anh xa cong host 3000 sang container 3000 cho HTTP API.
      # (EN: Map host port 3000 to container port 3000 for the HTTP API.)
      - "3000:3000"
    env_file:
      - ../indexer-service/.env
    networks:
      - 2-html-parsing-indexing-pagerank-network

  # Redis mo phong ha tang cache/queue phu tro cho bai hoc.
  # (EN: Redis simulates supporting cache/queue infrastructure for the lesson.)
  redis:
    image: redis:7-alpine
    container_name: 2-html-parsing-indexing-pagerank-redis
    networks:
      - 2-html-parsing-indexing-pagerank-network

networks:
  2-html-parsing-indexing-pagerank-network:
    name: 2-html-parsing-indexing-pagerank-network

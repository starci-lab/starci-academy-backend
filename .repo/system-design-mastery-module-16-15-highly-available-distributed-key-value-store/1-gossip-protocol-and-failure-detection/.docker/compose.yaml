# Docker Compose stack cho bài học 1-gossip-protocol-and-failure-detection.
# (EN: Docker Compose stack for lesson 1-gossip-protocol-and-failure-detection.)
#
# Thư mục làm việc: 1-gossip-protocol-and-failure-detection/.docker
# (EN: Working directory: 1-gossip-protocol-and-failure-detection/.docker)
#
# Khởi động: docker compose up -d --build
# (EN: Start: docker compose up -d --build)
#
# Xem log: docker compose logs -f api
# (EN: Logs: docker compose logs -f api)
#
# Dọn tài nguyên: docker compose down -v
# (EN: Cleanup: docker compose down -v)

# Tiền tố project Compose, dùng làm tên stack/container.
# (EN: Compose project prefix used as stack/container name.)
name: 1-gossip-protocol-and-failure-detection

services:
  # API NestJS của bài học.
  # (EN: Lesson NestJS API.)
  api:
    image: starciacademy/1-gossip-protocol-and-failure-detection-cluster-node:latest
    container_name: 1-gossip-protocol-and-failure-detection-api
    build:
      context: ../cluster-node
      dockerfile: Dockerfile
    ports:
      # Ánh xạ cổng host 3000 sang container 3000 cho HTTP API.
      # (EN: Map host port 3000 to container port 3000 for the HTTP API.)
      - "3000:3000"
    env_file:
      - ../cluster-node/.env
    networks:
      - 1-gossip-protocol-and-failure-detection-network

  # Redis mô phỏng hạ tầng cache/pub-sub thường gặp trong bài học.
  # (EN: Redis simulates common cache/pub-sub infrastructure for the lesson.)
  redis:
    image: redis:7-alpine
    container_name: 1-gossip-protocol-and-failure-detection-redis
    networks:
      - 1-gossip-protocol-and-failure-detection-network

networks:
  1-gossip-protocol-and-failure-detection-network:
    name: 1-gossip-protocol-and-failure-detection-network

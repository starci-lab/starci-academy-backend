# Docker Compose stack cho bài học 0-consistent-hashing-partitioning.
# (EN: Docker Compose stack for lesson 0-consistent-hashing-partitioning.)
#
# Thư mục làm việc: 0-consistent-hashing-partitioning/.docker
# (EN: Working directory: 0-consistent-hashing-partitioning/.docker)
#
# Khởi động: docker compose up -d --build
# (EN: Start: docker compose up -d --build)
#
# Xem log: docker compose logs -f api
# (EN: Logs: docker compose logs -f api)
#
# Dọn tài nguyên: docker compose down -v
# (EN: Cleanup: docker compose down -v)

# Tiền tố project Compose, dùng làm tên stack/container.
# (EN: Compose project prefix used as stack/container name.)
name: 0-consistent-hashing-partitioning

services:
  # API NestJS của bài học.
  # (EN: Lesson NestJS API.)
  api:
    image: starciacademy/0-consistent-hashing-partitioning-consistent-hash:latest
    container_name: 0-consistent-hashing-partitioning-api
    build:
      context: ../consistent-hash
      dockerfile: Dockerfile
    ports:
      # Ánh xạ cổng host 3000 sang container 3000 cho HTTP API.
      # (EN: Map host port 3000 to container port 3000 for the HTTP API.)
      - "3000:3000"
    env_file:
      - ../consistent-hash/.env
    networks:
      - 0-consistent-hashing-partitioning-network

  # Redis mô phỏng hạ tầng cache/pub-sub thường gặp trong bài học.
  # (EN: Redis simulates common cache/pub-sub infrastructure for the lesson.)
  redis:
    image: redis:7-alpine
    container_name: 0-consistent-hashing-partitioning-redis
    networks:
      - 0-consistent-hashing-partitioning-network

networks:
  0-consistent-hashing-partitioning-network:
    name: 0-consistent-hashing-partitioning-network

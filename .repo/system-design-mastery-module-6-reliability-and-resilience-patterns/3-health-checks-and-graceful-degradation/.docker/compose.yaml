# Kiến trúc: Stack Docker lesson: health checks and graceful degradation.
# (EN: Docker stack for lesson: health checks and graceful degradation.)
#
# Demo: HTTP API cổng 3000 (hoặc theo compose); xem README module.
#
# Thư mục làm việc: 3-health-checks-and-graceful-degradation/.docker
# (EN: Working directory: 3-health-checks-and-graceful-degradation/.docker)
#
# Khởi chạy stack:
# (EN: Start stack:)
#   cd 3-health-checks-and-graceful-degradation/.docker && docker compose up -d --build
#
# Xem log:
# (EN: View logs:)
#   docker compose logs -f
#
# Dọn dẹp:
# (EN: Cleanup:)
#   docker compose down -v
#
# =============================================================================
# Docker Compose — lesson `3-health-checks-and-graceful-degradation`.
# (EN: Docker Compose — lesson `3-health-checks-and-graceful-degradation`.)
#
# Làm việc trong thư mục chứa file này:
# (EN: Run commands from this file's directory.)
#     .../3-health-checks-and-graceful-degradation/.docker/
#
# Khởi chạy:
# (EN: Start detached.)
#     docker compose up -d
#
# Dừng và gỡ tài nguyên:
# (EN: Stop and remove resources.)
#     docker compose down
# =============================================================================

name: 3-health-checks-and-graceful-degradation

services:
  # NestJS demo app cho Health Check + Graceful Degradation.
  # (EN: NestJS demo app for Health Check + Graceful Degradation.)
  ecommerce-app:
    image: starciacademy/reliability-and-resilience-patterns-healthchecks-ecommerce-app:latest
    environment:
      PORT: 3000
      DEGRADE_HEAP_THRESHOLD_MB: 120
      HEALTH_HEAP_THRESHOLD_BYTES: 209715200
      DATABASE_HEALTH_STATUS: up
    ports:
      # Cổng HTTP API host → container.

      # (EN: HTTP API host → container port.)

      - "3000:3000"
    networks:
      - "3-health-checks-and-graceful-degradation"

networks:
  "3-health-checks-and-graceful-degradation":
    name: "3-health-checks-and-graceful-degradation"

# KEDA Helm chart (kedacore/keda from https://github.com/kedacore/charts).
# Pair with lab Prometheus values under ../prometheus/values.yaml (Bitnami OCI chart).
# Install:
#   helm repo add kedacore https://kedacore.github.io/charts
#   helm repo update
#   helm install keda kedacore/keda --namespace keda --create-namespace \
#     -f .helm/keda/values.yaml
#
# Defaults match upstream; below tweaks suit local / lab clusters.

clusterName: scaling-lab

image:
  pullPolicy: IfNotPresent

operator:
  replicaCount: 1

metricsServer:
  replicaCount: 1

webhooks:
  replicaCount: 1

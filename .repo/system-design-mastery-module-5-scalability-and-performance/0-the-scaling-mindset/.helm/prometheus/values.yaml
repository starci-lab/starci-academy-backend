# Bitnami Prometheus chart — overrides for the Module 5 lab.
# Install (OCI chart; pair with ../keda/values.yaml for KEDA):
#   helm install prometheus oci://registry-1.docker.io/bitnamicharts/prometheus \
#     --namespace default -f .helm/prometheus/values.yaml
# (default namespace always exists — no --create-namespace needed.)
#
# Legacy image catalog: docker.io/bitnamilegacy/* (see Bitnami legacy containers).
# Chart default tags still apply when only repository/registry are overridden.

global:
  security:
    allowInsecureImages: true

fullnameOverride: prometheus

alertmanager:
  enabled: false
  image:
    registry: docker.io
    repository: bitnamilegacy/alertmanager

server:
  image:
    registry: docker.io
    repository: bitnamilegacy/prometheus
  scrapeInterval: 5s
  evaluationInterval: 5s
  service:
    type: ClusterIP
    ports:
      http: 9090
  thanos:
    image:
      registry: docker.io
      repository: bitnamilegacy/thanos
  extraScrapeConfigs:
    - job_name: kubernetes-pods
      honor_labels: true
      kubernetes_sd_configs:
        - role: pod
          namespaces:
            names:
              - default
      relabel_configs:
        - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_scrape]
          action: keep
          regex: true
        - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_path]
          action: replace
          target_label: __metrics_path__
          regex: (.+)
        - source_labels: [__address__, __meta_kubernetes_pod_annotation_prometheus_io_port]
          action: replace
          regex: ([^:]+)(?::\d+)?;(\d+)
          replacement: $1:$2
          target_label: __address__
        - action: labelmap
          regex: __meta_kubernetes_pod_label_(.+)
        - source_labels: [__meta_kubernetes_namespace]
          action: replace
          target_label: kubernetes_namespace
        - source_labels: [__meta_kubernetes_pod_name]
          action: replace
          target_label: kubernetes_pod_name

volumePermissions:
  image:
    registry: docker.io
    repository: bitnamilegacy/os-shell

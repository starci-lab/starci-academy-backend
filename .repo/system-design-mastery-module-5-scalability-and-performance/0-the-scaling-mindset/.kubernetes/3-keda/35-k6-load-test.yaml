# k6 load for KEDA + Prometheus track (high RPS ramp to cross ScaledObject threshold).
# Scale: kubectl scale deploy k6-keda-load-generator --replicas=1
apiVersion: v1
kind: ConfigMap
metadata:
  name: k6-keda-test-script
data:
  load-test.js: |
    import http from 'k6/http';
    import { sleep } from 'k6';

    export const options = {
      scenarios: {
        ramping_load: {
          executor: 'ramping-arrival-rate',
          startRate: 10,
          timeUnit: '1s',
          preAllocatedVUs: 50,
          maxVUs: 200,
          stages: [
            { target: 1000, duration: '3m' }, // Ramp up to 1000 RPS over 3 minutes
            { target: 1000, duration: '5m' }, // Stay at 1000 RPS for 5 minutes
            { target: 0, duration: '1m' },    // Ramp down to 0
          ],
        },
      },
    };

    export default function () {
      http.get('http://api-service:3000/');
    }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: k6-keda-load-generator
  labels:
    app: k6-keda-load-generator
spec:
  replicas: 0
  selector:
    matchLabels:
      app: k6-keda-load-generator
  template:
    metadata:
      labels:
        app: k6-keda-load-generator
    spec:
      containers:
        - name: k6
          image: grafana/k6:latest
          command: ["k6", "run", "/scripts/load-test.js"]
          volumeMounts:
            - name: scripts
              mountPath: /scripts
      volumes:
        - name: scripts
          configMap:
            name: k6-keda-test-script

# k6 load for VPA track: drives HTTP traffic to api-service (port 3000) so the VPA recommender has usage signal.
# Plateau ~30s at high arrival rate (lesson step 6); short ramp up/down. Re-scale the Deployment to re-run.
# Scale the Deployment to 1 replica when ready: kubectl scale deploy k6-vpa-load-generator --replicas=1
apiVersion: v1
kind: ConfigMap
metadata:
  name: k6-vpa-test-script
data:
  load-test.js: |
    import http from 'k6/http';
    import { sleep } from 'k6';

    export const options = {
      scenarios: {
        vpa_sustain: {
          executor: 'ramping-arrival-rate',
          startRate: 10,
          timeUnit: '1s',
          preAllocatedVUs: 20,
          maxVUs: 100,
          stages: [
            { target: 500, duration: '30s' },
            { target: 1000, duration: '5m' },
            { target: 0, duration: '30s' },
          ],
        },
      },
    };

    export default function () {
      http.get('http://api-service:3000/');
      sleep(0.05);
    }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: k6-vpa-load-generator
  labels:
    app: k6-vpa-load-generator
spec:
  replicas: 0
  selector:
    matchLabels:
      app: k6-vpa-load-generator
  template:
    metadata:
      labels:
        app: k6-vpa-load-generator
    spec:
      containers:
        - name: k6
          image: grafana/k6:latest
          command: ["k6", "run", "/scripts/load-test.js"]
          volumeMounts:
            - name: scripts
              mountPath: /scripts
      volumes:
        - name: scripts
          configMap:
            name: k6-vpa-test-script

# Stack lab "The Data Bottleneck" — Postgres HA (1 primary + 2 read replicas) + Redis cache-aside + NestJS API.
# (EN: "The Data Bottleneck" lab stack — Postgres HA replication + Redis cache-aside + NestJS API.)
#
# Thư mục làm việc: 1-the-data-bottleneck/.docker
# (EN: Working directory: 1-the-data-bottleneck/.docker)
#
# Khởi chạy:  docker compose up -d --build
# (EN: Start:  docker compose up -d --build)
#
# Xem log:    docker compose logs -f api-service
# (EN: Logs:  docker compose logs -f api-service)
#
# Dọn dẹp:   docker compose down -v
# (EN: Teardown: docker compose down -v)

# Tiền tố project Compose (tên stack / tiền tố container).
# (EN: Compose project prefix (stack / container name prefix).)
name: 1-the-data-bottleneck

services:
  # PostgreSQL Primary — master ghi dữ liệu, streaming replication sang 2 read replicas.
  # (EN: PostgreSQL Primary — write master, streams WAL to 2 read replicas.)
  postgresql-primary:
    image: docker.io/bitnami/postgresql:16
    environment:
      POSTGRESQL_REPLICATION_MODE: master
      POSTGRESQL_REPLICATION_USER: repl_user
      POSTGRESQL_REPLICATION_PASSWORD: repl_password
      POSTGRESQL_USERNAME: postgres
      POSTGRESQL_PASSWORD: password
      POSTGRESQL_DATABASE: bottleneck_lab
    volumes:
      - pg_primary_data:/bitnami/postgresql
    ports:
      # Ánh xạ cổng host 5432 → container 5432 (Postgres primary).
      # (EN: Map host port 5432 → container 5432 (Postgres primary).)
      - "5432:5432"
    networks:
      - 1-the-data-bottleneck
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d bottleneck_lab -h 127.0.0.1 -p 5432 || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 30s

  # PostgreSQL Read Replica 1 — slave streaming replication từ primary.
  # (EN: PostgreSQL Read Replica 1 — streaming replication slave from primary.)
  postgresql-read-1:
    image: docker.io/bitnami/postgresql:16
    depends_on:
      postgresql-primary:
        condition: service_healthy
    environment:
      POSTGRESQL_REPLICATION_MODE: slave
      POSTGRESQL_REPLICATION_USER: repl_user
      POSTGRESQL_REPLICATION_PASSWORD: repl_password
      POSTGRESQL_MASTER_HOST: postgresql-primary
      POSTGRESQL_MASTER_PORT_NUMBER: "5432"
      POSTGRESQL_PASSWORD: password
    volumes:
      - pg_read1_data:/bitnami/postgresql
    ports:
      # Ánh xạ cổng host 5433 → container 5432 (read replica 1).
      # (EN: Map host port 5433 → container 5432 (read replica 1).)
      - "5433:5432"
    networks:
      - 1-the-data-bottleneck

  # PostgreSQL Read Replica 2 — slave streaming replication từ primary.
  # (EN: PostgreSQL Read Replica 2 — streaming replication slave from primary.)
  postgresql-read-2:
    image: docker.io/bitnami/postgresql:16
    depends_on:
      postgresql-primary:
        condition: service_healthy
    environment:
      POSTGRESQL_REPLICATION_MODE: slave
      POSTGRESQL_REPLICATION_USER: repl_user
      POSTGRESQL_REPLICATION_PASSWORD: repl_password
      POSTGRESQL_MASTER_HOST: postgresql-primary
      POSTGRESQL_MASTER_PORT_NUMBER: "5432"
      POSTGRESQL_PASSWORD: password
    volumes:
      - pg_read2_data:/bitnami/postgresql
    ports:
      # Ánh xạ cổng host 5434 → container 5432 (read replica 2).
      # (EN: Map host port 5434 → container 5432 (read replica 2).)
      - "5434:5432"
    networks:
      - 1-the-data-bottleneck

  # Redis — cache layer cho pattern Cache-Aside (Keyv → @keyv/redis).
  # (EN: Redis — cache layer for Cache-Aside pattern (Keyv → @keyv/redis).)
  # Redis — cache / queue / rate limit.
  # (EN: Redis — cache / queue / rate limit.)
  # Redis cache/queue/rate-limit.
  # (EN: Redis cache/queue/rate-limit.)
  redis:
    image: docker.io/bitnami/redis:7.4
    environment:
      ALLOW_EMPTY_PASSWORD: "yes"
    volumes:
      - redis_data:/bitnami/redis/data
    ports:
      # Ánh xạ cổng host 6379 → container 6379 (Redis).
      # (EN: Map host port 6379 → container 6379 (Redis).)
      - "6379:6379"
    networks:
      - 1-the-data-bottleneck

  # NestJS API Service — TypeORM replication (read/write split) + CacheModule (Keyv → Redis).
  # (EN: NestJS API Service — TypeORM replication (read/write split) + CacheModule (Keyv → Redis).)
  api-service:
    image: starciacademy/the-data-bottleneck-api-service:latest
    # build:
    #   context: ../api-service
    #   dockerfile: Dockerfile
    environment:
      PORT: "3000"
      POSTGRES_MASTER_HOST: postgresql-primary
      POSTGRES_MASTER_PORT: "5432"
      POSTGRES_READ_HOST_1: postgresql-read-1
      POSTGRES_READ_HOST_2: postgresql-read-2
      POSTGRES_READ_PORT: "5432"
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DATABASE: bottleneck_lab
      REDIS_HOST: redis
      REDIS_PORT: "6379"
    depends_on:
      postgresql-primary:
        condition: service_healthy
    ports:
      # Ánh xạ cổng host 3000 → container 3000 (HTTP API).
      # (EN: Map host port 3000 → container 3000 (HTTP API).)
      # Cổng HTTP API host → container.
      # (EN: HTTP API host → container port.)
      - "3000:3000"
    networks:
      - 1-the-data-bottleneck

volumes:
  pg_primary_data:
  pg_read1_data:
  pg_read2_data:
  redis_data:

# Mạng nội bộ Compose — tên trùng lesson, Compose tự tạo/xóa.
# (EN: Compose-managed network — name matches lesson, auto created/removed.)
networks:
  1-the-data-bottleneck:
    name: 1-the-data-bottleneck

# Stack lab "Secret Management" — HashiCorp Vault + PostgreSQL + NestJS App.
# (EN: "Secret Management" lab stack — HashiCorp Vault + PostgreSQL + NestJS App.)
#
# Thư mục làm việc: 0-secret-manager/.docker
# (EN: Working directory: 0-secret-manager/.docker)
#
# Khởi chạy:
# 1. docker compose up -d vault postgres
# 2. docker exec vault vault kv put secret/my-app DB_PASSWORD=123456
# 3. docker compose up -d api-service --build
#
# Dọn dẹp: docker compose down -v

name: 0-secret-manager

services:
  # HashiCorp Vault — Secret Manager chạy ở chế độ dev (memory storage, root token: root).
  # (EN: HashiCorp Vault — Secret Manager in dev mode (memory storage, root token: root).)
  vault:
    image: hashicorp/vault:1.15
    environment:
      VAULT_DEV_ROOT_TOKEN_ID: "root"
      VAULT_DEV_LISTEN_ADDRESS: "0.0.0.0:8200"
    ports:
      - "8200:8200"
    cap_add:
      - IPC_LOCK
    networks:
      - 0-secret-manager

  # PostgreSQL — Database lưu trữ dữ liệu (Password được khởi tạo tĩnh, nhưng App không biết trước).
  # (EN: PostgreSQL — Database (Password initialized statically, but App doesn't know it upfront).)
  # PostgreSQL — persistence lesson.
  # (EN: PostgreSQL — lesson persistence.)
  # PostgreSQL persistence.
  # (EN: PostgreSQL persistence.)
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: userdb
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: 123456
    ports:
      - "5432:5432"
    networks:
      - 0-secret-manager
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d userdb || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  # NestJS API Service — Khởi động, gọi Vault lấy mật khẩu, rồi mới kết nối DB.
  # (EN: NestJS API Service — Boots up, fetches password from Vault, then connects to DB.)
  api-service:
    build:
      context: ../secret-api
      dockerfile: Dockerfile
    environment:
      PORT: "3000"
      VAULT_ADDR: "http://vault:8200"
      VAULT_TOKEN: "root"
      DB_HOST: "postgres"
      DB_PORT: "5432"
      DB_USER: "admin"
      DB_NAME: "userdb"
      # Chú ý: KHÔNG CÓ biến môi trường DB_PASSWORD ở đây.
      # (EN: Note: NO DB_PASSWORD environment variable here.)
    ports:
      # Cổng HTTP API host → container.
      # (EN: HTTP API host → container port.)
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
      vault:
        condition: service_started
    networks:
      - 0-secret-manager

networks:
  0-secret-manager:
    name: 0-secret-manager

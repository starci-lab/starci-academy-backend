# Docker Compose stack cho bài học 1-change-data-capture-cdc-with-debezium.
# (EN: Docker Compose stack for lesson 1-change-data-capture-cdc-with-debezium.)
#
# Thư mục làm việc: 1-change-data-capture-cdc-with-debezium/.docker
# (EN: Working directory: 1-change-data-capture-cdc-with-debezium/.docker)
#
# Khởi động: docker compose up -d --build
# (EN: Start: docker compose up -d --build)
#
# Xem log: docker compose logs -f api
# (EN: Logs: docker compose logs -f api)
#
# Dọn tài nguyên: docker compose down -v
# (EN: Cleanup: docker compose down -v)

# Tiền tố project Compose, dùng làm tên stack/container.
# (EN: Compose project prefix used as stack/container name.)
name: 1-change-data-capture-cdc-with-debezium

services:
  # API NestJS của bài học.
  # (EN: Lesson NestJS API.)
  api:
    image: starciacademy/1-change-data-capture-cdc-with-debezium-search-consumer:latest
    container_name: 1-change-data-capture-cdc-with-debezium-api
    build:
      context: ../search-consumer
      dockerfile: Dockerfile
    ports:
      # Ánh xạ cổng host 3000 sang container 3000 cho HTTP API.
      # (EN: Map host port 3000 to container port 3000 for the HTTP API.)
      - "3000:3000"
    env_file:
      - ../search-consumer/.env
    networks:
      - 1-change-data-capture-cdc-with-debezium-network

  # Redis mô phỏng hạ tầng cache/pub-sub thường gặp trong bài học.
  # (EN: Redis simulates common cache/pub-sub infrastructure for the lesson.)
  redis:
    image: redis:7-alpine
    container_name: 1-change-data-capture-cdc-with-debezium-redis
    networks:
      - 1-change-data-capture-cdc-with-debezium-network

networks:
  1-change-data-capture-cdc-with-debezium-network:
    name: 1-change-data-capture-cdc-with-debezium-network

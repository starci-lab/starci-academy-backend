# Docker Compose stack cho bài học 0-trie-data-structure-for-autocomplete.
# (EN: Docker Compose stack for lesson 0-trie-data-structure-for-autocomplete.)
#
# Thư mục làm việc: 0-trie-data-structure-for-autocomplete/.docker
# (EN: Working directory: 0-trie-data-structure-for-autocomplete/.docker)
#
# Khởi động: docker compose up -d --build
# (EN: Start: docker compose up -d --build)
#
# Xem log: docker compose logs -f api
# (EN: Logs: docker compose logs -f api)
#
# Dọn tài nguyên: docker compose down -v
# (EN: Cleanup: docker compose down -v)

# Tiền tố project Compose, dùng làm tên stack/container.
# (EN: Compose project prefix used as stack/container name.)
name: 0-trie-data-structure-for-autocomplete

services:
  # API NestJS của bài học.
  # (EN: Lesson NestJS API.)
  api:
    image: starciacademy/0-trie-data-structure-for-autocomplete-autocomplete-service:latest
    container_name: 0-trie-data-structure-for-autocomplete-api
    build:
      context: ../autocomplete-service
      dockerfile: Dockerfile
    ports:
      # Ánh xạ cổng host 3000 sang container 3000 cho HTTP API.
      # (EN: Map host port 3000 to container port 3000 for the HTTP API.)
      - "3000:3000"
    env_file:
      - ../autocomplete-service/.env
    networks:
      - 0-trie-data-structure-for-autocomplete-network

  # Redis mô phỏng hạ tầng cache/pub-sub thường gặp trong bài học.
  # (EN: Redis simulates common cache/pub-sub infrastructure for the lesson.)
  redis:
    image: redis:7-alpine
    container_name: 0-trie-data-structure-for-autocomplete-redis
    networks:
      - 0-trie-data-structure-for-autocomplete-network

networks:
  0-trie-data-structure-for-autocomplete-network:
    name: 0-trie-data-structure-for-autocomplete-network

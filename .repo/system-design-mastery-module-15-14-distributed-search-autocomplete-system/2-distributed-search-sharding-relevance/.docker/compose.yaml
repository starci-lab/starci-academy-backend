# Docker Compose stack cho bài học 2-distributed-search-sharding-relevance.
# (EN: Docker Compose stack for lesson 2-distributed-search-sharding-relevance.)
#
# Thư mục làm việc: 2-distributed-search-sharding-relevance/.docker
# (EN: Working directory: 2-distributed-search-sharding-relevance/.docker)
#
# Khởi động: docker compose up -d --build
# (EN: Start: docker compose up -d --build)
#
# Xem log: docker compose logs -f api
# (EN: Logs: docker compose logs -f api)
#
# Dọn tài nguyên: docker compose down -v
# (EN: Cleanup: docker compose down -v)

# Tiền tố project Compose, dùng làm tên stack/container.
# (EN: Compose project prefix used as stack/container name.)
name: 2-distributed-search-sharding-relevance

services:
  # API NestJS của bài học.
  # (EN: Lesson NestJS API.)
  api:
    image: starciacademy/2-distributed-search-sharding-relevance-search-api:latest
    container_name: 2-distributed-search-sharding-relevance-api
    build:
      context: ../search-api
      dockerfile: Dockerfile
    ports:
      # Ánh xạ cổng host 3000 sang container 3000 cho HTTP API.
      # (EN: Map host port 3000 to container port 3000 for the HTTP API.)
      - "3000:3000"
    env_file:
      - ../search-api/.env
    networks:
      - 2-distributed-search-sharding-relevance-network

  # Redis mô phỏng hạ tầng cache/pub-sub thường gặp trong bài học.
  # (EN: Redis simulates common cache/pub-sub infrastructure for the lesson.)
  redis:
    image: redis:7-alpine
    container_name: 2-distributed-search-sharding-relevance-redis
    networks:
      - 2-distributed-search-sharding-relevance-network

networks:
  2-distributed-search-sharding-relevance-network:
    name: 2-distributed-search-sharding-relevance-network

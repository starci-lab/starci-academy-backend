name: CI

on:
  pull_request:
    branches:
      - main
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Checkout private course data
        uses: actions/checkout@v4
        with:
          repository: starci-lab/data
          ssh-key: ${{ secrets.STARCI_DATA_DEPLOY_KEY }}
          path: .gitmounts/data

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "25.2.1"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint (check only)
        run: npm run lint:check

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Unit tests with coverage
        env:
          COVERAGE_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before || github.sha }}
        run: npm run test:ci

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          files: coverage/lcov.info
          disable_search: true
          fail_ci_if_error: true
          use_oidc: true

  # E2E is an independent behavior lane. It never creates, mutates or blocks
  # the unit LCOV consumed by Codecov. Sonar is disabled for this legacy
  # deployment at the owner's request; the remaining verification stays on.
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      E2E_MINIO_IMAGE: academy-ci/minio:release-20250422
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Checkout private course data
        uses: actions/checkout@v4
        with:
          repository: starci-lab/data
          ssh-key: ${{ secrets.STARCI_DATA_DEPLOY_KEY }}
          path: .gitmounts/data

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "25.2.1"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Configure MinIO test image cache
        uses: docker/setup-buildx-action@v3

      - name: Build the pinned MinIO release for disposable E2E
        uses: docker/build-push-action@v6
        with:
          context: testing-support/minio
          file: testing-support/minio/Dockerfile
          load: true
          tags: ${{ env.E2E_MINIO_IMAGE }}
          cache-from: type=gha,scope=academy-e2e-minio
          cache-to: type=gha,mode=max,scope=academy-e2e-minio

      - name: End-to-end behavior
        run: npm run test:e2e

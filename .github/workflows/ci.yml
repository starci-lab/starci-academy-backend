# .github/workflows/ci.yml
# Continuous integration: validate every PR and every push to main BEFORE it can deploy.
name: CI

# TEMP DISABLED: CI is paused for now (instructor) — runs only on manual dispatch.
# Re-enable later by restoring the `pull_request` + `workflow_call` triggers below
# and the `verify` gate (needs: verify) in deploy-core-vps.yml.
on:
  workflow_dispatch:
  # pull_request:
  #   branches:
  #     - main
  # workflow_call:

# Don't run doc/content-only changes through the full build.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "25.2.1"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint (check only, no auto-fix)
        run: npx eslint "{src,apps,libs,test}/**/*.ts" --max-warnings=0

      - name: Build (type-check via nest build)
        run: npx nest build core

      - name: Unit tests
        run: npm test -- --ci --passWithNoTests

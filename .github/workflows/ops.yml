name: VPS Ops

on:
  workflow_dispatch:
    inputs:
      cmd:
        description: Bash command on the Academy VPS; keep credentials out of output.
        required: true
        type: string

permissions:
  contents: read

jobs:
  ops:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: core-vps
    timeout-minutes: 10
    steps:
      - name: Run command using the Academy deployment key
        env:
          CMD: ${{ inputs.cmd }}
          VPS_HOST: ${{ vars.VPS_HOST }}
          VPS_USER: ${{ vars.VPS_USER }}
          VPS_PORT: ${{ vars.VPS_PORT }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          test "$VPS_HOST" = '103.142.27.9'
          test "$VPS_USER" = 'nivo'
          test "$VPS_PORT" = '22'
          install -d -m 700 ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/academy_deploy
          printf '%s\n' "$VPS_KNOWN_HOSTS" > ~/.ssh/academy_known_hosts
          chmod 600 ~/.ssh/academy_deploy ~/.ssh/academy_known_hosts
          printf '%s\n' "$CMD" | ssh -T -p "$VPS_PORT" -i ~/.ssh/academy_deploy \
            -o IdentitiesOnly=yes -o BatchMode=yes -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile=~/.ssh/academy_known_hosts \
            -o ServerAliveInterval=20 "$VPS_USER@$VPS_HOST" 'bash -se'

      - name: Remove ephemeral SSH credentials
        if: always()
        run: rm -f ~/.ssh/academy_deploy ~/.ssh/academy_known_hosts

name: Check Tokens

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    uses: ./.github/workflows/ops.yml
    secrets: inherit
    with:
      cmd: |
        docker exec -i academy-core node - <<'JS'
        const fs = require('node:fs');
        const root = '/usr/src/app/.mount/terraform/';
        async function check(file, label, url) {
          if (!fs.existsSync(root + file)) {
            console.log(label + ' MISSING');
            return;
          }
          try {
            const token = fs.readFileSync(root + file, 'utf8').trim();
            const response = await fetch(url, {
              headers: { Authorization: 'Bearer ' + token },
              signal: AbortSignal.timeout(15000),
            });
            console.log(label + ' HTTP ' + response.status);
          } catch {
            console.log(label + ' CHECK_FAILED');
          }
        }
        (async () => {
          await check('github-access-token.key', 'team PAT', 'https://api.github.com/orgs/StarCi-Academy/teams?per_page=1');
          await check('data-git-token.key', 'data PAT', 'https://api.github.com/repos/starci-lab/data');
          console.log('OAuth secret ' + (fs.existsSync(root + 'github-secret-key.key') ? 'PRESENT' : 'MISSING'));
          console.log('200=OK; 401=invalid/expired; 403=scope/rate limit; 404=no access or owner mismatch');
        })().catch(() => { console.error('Token check failed'); process.exitCode = 1; });
        JS

# .github/workflows/deploy-core-vps.yml
name: Deploy Core VPS

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: self-hosted
    environment: core-vps

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Show docker info
        run: |
          docker --version
          docker compose version

      - name: Deploy core with Docker Compose
        env:
          POSTGRESQL_PRIMARY_HOST: ${{ secrets.POSTGRESQL_PRIMARY_HOST }}
          POSTGRESQL_PRIMARY_PORT: ${{ secrets.POSTGRESQL_PRIMARY_PORT }}
          POSTGRESQL_PRIMARY_PASSWORD: ${{ secrets.POSTGRESQL_PRIMARY_PASSWORD }}

          QDRANT_URL: ${{ secrets.QDRANT_URL }}
          QDRANT_API_KEY: ${{ secrets.QDRANT_API_KEY }}

          REDIS_BULLMQ_HOST: ${{ secrets.REDIS_BULLMQ_HOST }}
          REDIS_BULLMQ_PORT: ${{ secrets.REDIS_BULLMQ_PORT }}
          REDIS_BULLMQ_PASSWORD: ${{ secrets.REDIS_BULLMQ_PASSWORD }}

          REDIS_THROTTLER_HOST: ${{ secrets.REDIS_THROTTLER_HOST }}
          REDIS_THROTTLER_PORT: ${{ secrets.REDIS_THROTTLER_PORT }}
          REDIS_THROTTLER_PASSWORD: ${{ secrets.REDIS_THROTTLER_PASSWORD }}

          REDIS_ADAPTER_HOST: ${{ secrets.REDIS_ADAPTER_HOST }}
          REDIS_ADAPTER_PORT: ${{ secrets.REDIS_ADAPTER_PORT }}
          REDIS_ADAPTER_PASSWORD: ${{ secrets.REDIS_ADAPTER_PASSWORD }}

          REDIS_CACHE_HOST: ${{ secrets.REDIS_CACHE_HOST }}
          REDIS_CACHE_PORT: ${{ secrets.REDIS_CACHE_PORT }}
          REDIS_CACHE_PASSWORD: ${{ secrets.REDIS_CACHE_PASSWORD }}

          CORS_ORIGIN_1: ${{ vars.CORS_ORIGIN_1 }}

          # Parent-domain scope for the JS-readable csrf_token cookie so the SPA
          # (academy.starci.org) can read what the API (api.academy.starci.org) sets.
          COOKIE_DOMAIN: ${{ vars.COOKIE_DOMAIN }}

          # Self-hosted Judge0 (coding-practice sandbox) on the VPS — Docker Desktop's
          # cgroup v2 can't run isolate, so prod points at the cgroup-v1 VPS instance.
          JUDGE0_BASE_URL: ${{ vars.JUDGE0_BASE_URL }}

          # Filesystem context (.contexts) root → mounted volume so the git-init checkout + marker survive redeploys.
          CONTEXT_1_URL: ${{ vars.CONTEXT_1_URL }}

          # Init seed/sync scope is configured in .mount/config/seed.yaml (not env).
          # Background synchronizer master switch (runtime, separate from init scope).
          SYNCHRONIZER_ENABLE: ${{ vars.SYNCHRONIZER_ENABLE }}

          # Container paths (/usr/src/app/.mount/...), not host /root/academy/...
          TERRAFORM_KEYCLOAK_ADMIN_MOUNT_PATH: ${{ vars.TERRAFORM_KEYCLOAK_ADMIN_MOUNT_PATH }}
          TERRAFORM_GITHUB_ACCESS_TOKEN_MOUNT_PATH: ${{ vars.TERRAFORM_GITHUB_ACCESS_TOKEN_MOUNT_PATH }}
          TERRAFORM_GITHUB_SECRET_KEY_MOUNT_PATH: ${{ vars.TERRAFORM_GITHUB_SECRET_KEY_MOUNT_PATH }}
          TERRAFORM_S3_SECRET_ACCESS_KEY_MOUNT_PATH: ${{ vars.TERRAFORM_S3_SECRET_ACCESS_KEY_MOUNT_PATH }}
          TERRAFORM_KEYCLOAK_CLIENT_SECRET_MOUNT_PATH: ${{ vars.TERRAFORM_KEYCLOAK_CLIENT_SECRET_MOUNT_PATH }}
          TERRAFORM_PAYOS_API_KEY_MOUNT_PATH: ${{ vars.TERRAFORM_PAYOS_API_KEY_MOUNT_PATH }}
          TERRAFORM_GEMINI_API_KEY_MOUNT_PATH: ${{ vars.TERRAFORM_GEMINI_API_KEY_MOUNT_PATH }}
          TERRAFORM_OPENAI_API_KEY_MOUNT_PATH: ${{ vars.TERRAFORM_OPENAI_API_KEY_MOUNT_PATH }}
          TERRAFORM_SEPAY_API_KEY_MOUNT_PATH: ${{ vars.TERRAFORM_SEPAY_API_KEY_MOUNT_PATH }}
          TERRAFORM_BREVO_SMTP_PASSWORD_MOUNT_PATH: ${{ vars.TERRAFORM_BREVO_SMTP_PASSWORD_MOUNT_PATH }}
          TERRAFORM_ENCRYPTION_KEY_MOUNT_PATH: ${{ vars.TERRAFORM_ENCRYPTION_KEY_MOUNT_PATH }}
          TERRAFORM_GCP_SERVICE_ACCOUNT_JSON_MOUNT_PATH: ${{ vars.TERRAFORM_GCP_SERVICE_ACCOUNT_JSON_MOUNT_PATH }}

          CORE_PORT: ${{ vars.CORE_PORT }}
 
          KEYCLOAK_URL: ${{ secrets.KEYCLOAK_URL }}
          KEYCLOAK_REDIRECT_URI: ${{ secrets.KEYCLOAK_REDIRECT_URI }}

          S3_MINIO_ENDPOINT: ${{ secrets.S3_MINIO_ENDPOINT }}
          S3_MINIO_PUBLIC_ENDPOINT: ${{ secrets.S3_MINIO_PUBLIC_ENDPOINT }}
          S3_MINIO_SECRET_ACCESS_KEY: ${{ secrets.S3_MINIO_SECRET_ACCESS_KEY }}

          ELASTICSEARCH_NODE: ${{ secrets.ELASTICSEARCH_NODE }}
          ELASTICSEARCH_PASSWORD: ${{ secrets.ELASTICSEARCH_PASSWORD }}

          NATS_SERVER_1_HOST: ${{ secrets.NATS_SERVER_1_HOST }}
          NATS_AUTH_TOKEN: ${{ secrets.NATS_AUTH_TOKEN }}

          S3_REGION: ${{ secrets.S3_REGION }}
          S3_ACCESS_KEY_ID: ${{ secrets.S3_ACCESS_KEY_ID }}

          POSTGRESQL_KEYCLOAK_HOST: ${{ secrets.POSTGRESQL_KEYCLOAK_HOST }}
          BACKUP_ENCRYPT_PASSWORD: ${{ secrets.BACKUP_ENCRYPT_PASSWORD }}

          GITHUB_OAUTH_REDIRECT_URI: ${{ secrets._GITHUB_OAUTH_REDIRECT_URI }}
        run: |
          docker compose -f apps/core/vps-compose.yaml down || true
          docker compose -f apps/core/vps-compose.yaml up --build -d 
name: Deploy Core VPS

on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - '.claude/**'
      - 'scratch/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: academy-production
  cancel-in-progress: false

jobs:
  # Deploys straight from main: unit and E2E run in CI on pull requests but do not gate
  # this job. The readiness check and image rollback in deploy-production.sh are the guard.
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: core-vps
    env:
      IMAGE: academy/core:${{ github.sha }}
      VPS_HOST: ${{ vars.VPS_HOST }}
      VPS_USER: ${{ vars.VPS_USER }}
      VPS_PORT: ${{ vars.VPS_PORT }}
    steps:
      - name: Checkout the verified revision
        uses: actions/checkout@v4

      - name: Configure Docker build cache
        uses: docker/setup-buildx-action@v3

      - name: Build the immutable image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/core/Dockerfile
          load: true
          tags: ${{ env.IMAGE }}
          labels: org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=academy-core
          cache-to: type=gha,mode=max,scope=academy-core

      - name: Configure verified SSH access
        env:
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          test "$VPS_HOST" = '103.142.27.9'
          test "$VPS_USER" = 'nivo'
          test "$VPS_PORT" = '22'
          test -n "$VPS_SSH_KEY"
          test -n "$VPS_KNOWN_HOSTS"
          install -d -m 700 ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/academy_deploy
          printf '%s\n' "$VPS_KNOWN_HOSTS" > ~/.ssh/academy_known_hosts
          chmod 600 ~/.ssh/academy_deploy ~/.ssh/academy_known_hosts
          cat > ~/.ssh/config <<EOF
          Host academy-vps
            HostName $VPS_HOST
            User $VPS_USER
            Port $VPS_PORT
            IdentityFile ~/.ssh/academy_deploy
            IdentitiesOnly yes
            BatchMode yes
            StrictHostKeyChecking yes
            UserKnownHostsFile ~/.ssh/academy_known_hosts
            ServerAliveInterval 20
            ServerAliveCountMax 6
          EOF

      - name: Transfer image and release scripts
        env:
          REVISION: ${{ github.sha }}
        run: |
          set -euo pipefail
          docker save "$IMAGE" | gzip -1 | ssh academy-vps 'gzip -d | docker load'
          ssh academy-vps "install -d -m 700 /home/nivo/academy/releases/$REVISION"
          tar -czf - apps/core/production-compose.yaml apps/core/deploy-production.sh apps/core/judge0 apps/core/setup-kibana-token.py |
            ssh academy-vps "tar -xzf - -C /home/nivo/academy/releases/$REVISION"

      - name: Record the running release before rollout
        run: |
          set -euo pipefail
          ssh academy-vps 'docker inspect academy-core --format "previous image={{.Config.Image}} id={{.Image}} revision={{index .Config.Labels \"org.opencontainers.image.revision\"}} started={{.State.StartedAt}} health={{if .State.Health}}{{.State.Health.Status}}{{end}}" 2>/dev/null || echo "previous image=none (academy-core is not running)"'
          ssh academy-vps 'cat /home/nivo/academy/operations/deployed-image.txt 2>/dev/null || true'

      - name: Deploy and verify readiness with rollback
        env:
          REVISION: ${{ github.sha }}
        run: ssh academy-vps "bash /home/nivo/academy/releases/$REVISION/apps/core/deploy-production.sh '$IMAGE'"

      - name: Confirm the running release
        run: |
          set -euo pipefail
          running=$(ssh academy-vps 'docker inspect academy-core --format "{{.Config.Image}} {{if .State.Health}}{{.State.Health.Status}}{{end}}"')
          echo "running image and health: $running"
          test "$running" = "$IMAGE healthy"

      - name: Remove ephemeral SSH credentials
        if: always()
        run: rm -f ~/.ssh/academy_deploy ~/.ssh/academy_known_hosts ~/.ssh/config

# =============================================================================
#  StarCi Academy — Init Control (seed.yaml)
# =============================================================================
#
#  Điều khiển init lúc boot: PHASE 1 seed (mount → PostgreSQL) rồi PHASE 2 sync
#  (PostgreSQL → CDN / Elasticsearch / repo).
#
#  ƯU TIÊN: block chi tiết `seed:` / `sync:` > `mode`.
#    - Có ÍT NHẤT 1 trong 2 block → dùng block (parser dựng thẳng config) và init
#      ÉP reseed (forceReseed): pull FRESH từ remote, bỏ qua short-circuit theo SHA.
#    - KHÔNG có block nào → `mode` quyết:
#        all  → full reseed/sync mọi course (kệ diff).
#        diff → (mặc định) chỉ seed/sync phần ĐỔI so với marker.
#        none → tắt hẳn cả 2 phase (boot no-op).
#
#  Scope grammar (dùng chung): all | "0-19" / "0,2,4" / "1-3,7" | [1,2] | false/[]/off
#
#  seed.courses entry:
#    all / "0-3" / [1,2]            → shorthand: chỉ modules; milestones/flashcards/interviewQuestions off
#    { modules, milestones, flashcards, interviewQuestions }  → object: milestones true=all|false|scope
#    (interviewQuestions: seed technical mock-interview questions từ courses/{course}/mock-interview/,
#     giống flashcards — 1 global pass, bật nếu BẤT KỲ course nào opt-in)
#
#  sync.courses entry:
#    all / scope / true|false       → shorthand: áp cho MỌI sink của cả 2 track
#    { modules: {cdn,elasticsearch,repo}, milestones: {...} }  → per-sink object
#    (sink/track bỏ trống = off)
#
#  sync.<domain> entry (foundations/codingProblems/flashcards/headhunting/cv):
#    true|false  hoặc  { cdn, elasticsearch }   (domain hiện chỉ chạy sink ES)
#
#  sync.reindex: DROP + tạo lại index ES TRƯỚC khi sync.
#    none | all | [modules, contents, milestones, flashcard-decks, ...]  (tên index friendly)
#    QUY TẮC: index nào reindex → ES-sync của nó TỰ ÉP = full trên TOÀN BỘ course/domain
#             (drop xong luôn repopulate đầy, không để index trống).
#    sync.sinks: master cứng từng sink — sink=false thì zero sink đó ở mọi nơi.
# -----------------------------------------------------------------------------
# Master switch: false = SKIP TOÀN BỘ init (không pull git, không seed, không sync)
# → backend boot nhanh nhất. Mặc định true (bỏ trống = bật). Set false khi dev local.
# LOCAL: false = boot nhanh (bỏ qua init). true = full seed + sync (pull remote,
# ghi đè DB, rebuild ES/CDN). Sau khi seed xong, set lại false nếu muốn boot nhanh.
# Flashcard cloze markers (2026-07-05) already applied to PostgreSQL + Elasticsearch
# directly (scratch/reseed-flashcard-answers.cjs + scratch/reindex-flashcard-es.cjs),
# so NO reseed is needed on boot. To reseed the proper way instead, enable the
# FLASHCARD RESEED block below (pull fresh data repo → PG + ES reindex) then set back
# to false. Default: fast local boot (init no-op).
enable: false
mode: none
seed:
    enabled: false
sync:
    enabled: false
# ── FULL RESEED (tắt) — bật lại khi cần seed/sync toàn bộ course ─────────────
# seed:
#   enabled: true
#   courses:
#     fullstack-mastery:     { modules: all, milestones: true, flashcards: true }
#     system-design-mastery: { modules: all, milestones: true, flashcards: true }
#     devops-mastery:        { modules: all, milestones: true, flashcards: true }
#     ai-llm-mastery:        { modules: all, milestones: true, flashcards: true }
#     claude-mastery:        { modules: all, milestones: true, flashcards: true }
#   foundations: true
#   aiModels: true
#   advertisements: true
#   changelog: true
#   blog: true
#   achievements: true
#
# sync:
#   enabled: true
#   reindex: all
#   sinks:
#     cdn: true
#     elasticsearch: true
#     repo: false
#   courses:
#     fullstack-mastery:     all
#     system-design-mastery: all
#     devops-mastery:        all
#     ai-llm-mastery:        all
#     claude-mastery:        all
#   foundations: true
#   codingProblems: true
#   flashcards: true
#   headhunting: true
#   cv: true
# =============================================================================
#  FIX FLASHCARD ANSWERS — reseed flashcard decks mọi course + rebuild index ES
# =============================================================================
#  BUG: parser mount nuốt `# answer` vào `# tags` (section tags có số separator
#  lẻ làm cờ verbatim-leaf còn dính), nên MỌI flashcard card bị answer=null +
#  tag cuối phình to. Đã fix ở extract-json-from-md.service.ts (splitSections chỉ
#  toggle cờ trong section verbatim-leaf thật sự). Có block seed:/sync: → init ÉP
#  reseed: pull FRESH remote `StarCi-Academy/data` và RE-PARSE, nên fix vào DB dù
#  content SHA không đổi.
#
# ── PHASE 1: SEED — re-parse flashcard decks (mount → PostgreSQL) ────────────
#  modules/milestones: false → SKIP (không prune, modules/contents/milestones
#  giữ nguyên). Flashcard pass re-parse toàn bộ deck → upsert PG; parser rebuild
#  link `# contentRefs` / `# moduleRefs` từ source (contents/modules đã có sẵn).
# DISABLED — reseed of the 3 audited Fullstack decks already ran (2026-07-12/13)
# and PG+ES are already in sync with the pushed data repo. Re-enable (uncomment)
# only if another content fix needs a fresh boot reseed.
# seed:
#   enabled: true
#   courses:
#     fullstack-mastery:     { modules: false, milestones: false, flashcards: true }
# ── PHASE 2: SYNC — drop + rebuild flashcard ES index từ PG vừa seed ─────────
#  Single-deck read (flashcardDeck) serve từ ES → BẮT BUỘC reindex để fix vào ES.
#  `reindex: [flashcard-decks]` tự ép flashcards ES-sync = full trên toàn domain.
#  cdn/repo: false → không đụng tới CDN và repo.
# sync:
#   enabled: true
#   reindex: [flashcard-decks]
#   sinks:
#     cdn: false
#     elasticsearch: true
#     repo: false
# ── PHASE 1: SEED (mount → PostgreSQL) — tham khảo ──────────────────────────
# seed:
#   enabled: true
#   courses:
#     fullstack-mastery: { modules: all, milestones: true, flashcards: true }
#     system-design-mastery: all
#     devops-mastery: { modules: "0-5", milestones: false }
#   foundations: true
#   aiModels: true
#   advertisements: true   # seed .mount/data/advertisements/advertisements.yaml → `advertisements`
#   changelog: true        # seed .mount/data/changelog/changelog.yaml → `changelog_entries`
#   achievements: true     # seed .mount/data/achievements/achievements.md → `achievements`
# ── SEED chỉ ads + changelog + achievements (right rail + badges) — ĐANG BẬT ──
#  Có block seed: → init ÉP reseed (pull fresh remote), nhưng CHỈ seed domain
#  set true ở đây; courses/foundations/milestones… VẮNG → default false → SKIP
#  (KHÔNG reseed content/milestone). Seeder đọc <snapshot>/<domain>/<file>,
#  fallback .mount/data/<domain>/<file>.
# ── SEED course ROOT (coverImageUrl + pricing) + ads/changelog/blog/achievements ──
#  courses {modules:all, milestones:true, flashcards:true} → FULL reseed: pull fresh remote
#  and re-parse EVERY course's modules + content + milestones + flashcards into PostgreSQL
#  (content prune + rebuild). Covers (assets/courses/<slug>.png) are rewritten too, and the
#  AssetsService pushes the PNGs → MinIO inside the init window on boot.
#  → To reseed only part of a course, narrow scope, e.g. { modules: "0-3" } or false.
# ── PHASE 2: SYNC chi tiết per-sink — tham khảo ─────────────────────────────
# sync:
#   enabled: true
#   reindex: none                       # none | all | [milestones, ...]
#   sinks: { cdn: true, elasticsearch: true, repo: true }
#   courses:
#     fullstack-mastery:
#       modules:    { cdn: all, elasticsearch: all, repo: all }
#       milestones: { cdn: all, elasticsearch: all, repo: off }
#     system-design-mastery: all
#   foundations: { cdn: true, elasticsearch: true }
#   codingProblems: { elasticsearch: true }

<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>MiaMia · Học & ôn tập · Proposal r1</title>
  <style>
    :root{--bg:#fff8ef;--paper:#fffdfa;--ink:#211927;--muted:#796d78;--pink:#ff3d96;--pink-soft:#ffe6f1;--yellow:#ffd84f;--mint:#87e5c4;--blue:#e7f5ff;--line:#2a2230;--soft:#eee4df;--shadow:4px 5px 0 var(--line)}
    *{box-sizing:border-box} body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 Inter,ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif} button{font:inherit;color:inherit} h1,h2,h3,p{margin:0} h1{font-size:24px;line-height:1.1} h2{font-size:28px;line-height:1.12} h3{font-size:17px}.muted{color:var(--muted)}
    .proposal{position:sticky;top:0;z-index:50;display:flex;gap:14px;align-items:center;justify-content:space-between;padding:12px 18px;border-bottom:2px solid var(--line);background:rgba(255,248,239,.96);backdrop-filter:blur(12px)}
    .proposal__brand{display:flex;gap:10px;align-items:center}.mark{display:grid;place-items:center;width:36px;height:36px;border:2px solid var(--line);border-radius:11px;background:var(--pink);color:white;font-weight:900;box-shadow:2px 2px 0 var(--line)}.eyebrow{font-size:11px;font-weight:900;letter-spacing:.08em;text-transform:uppercase;color:#dc267f}
    .direction-tabs,.state-tabs{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end}.pill{cursor:pointer;border:2px solid var(--line);border-radius:999px;background:var(--paper);padding:8px 13px;font-weight:800}.pill[aria-selected=true]{background:var(--ink);color:white;box-shadow:inset 0 -3px 0 var(--pink)}
    .decision{display:flex;gap:10px;align-items:center;padding:10px 18px;border-bottom:1px solid var(--line);background:var(--paper)}.decision strong{margin-right:auto}.state-tabs .pill{padding:6px 11px;font-size:13px}
    .shell{display:grid;grid-template-columns:252px minmax(0,1fr);min-height:calc(100vh - 116px)}.sidebar{position:sticky;top:116px;align-self:start;height:calc(100vh - 116px);padding:22px 16px;border-right:2px solid var(--line);background:var(--paper)}.logo{display:flex;align-items:center;gap:10px;font-weight:950;font-size:20px;margin-bottom:26px}.logo .mark{width:30px;height:30px}.nav-label{margin:18px 8px 8px;font-size:10px;font-weight:900;letter-spacing:.1em;color:var(--muted)}.nav-item{display:flex;align-items:center;gap:10px;width:100%;padding:11px 12px;border:0;border-radius:12px;background:transparent;text-align:left;font-weight:800}.nav-item.active{background:var(--pink);color:white;box-shadow:2px 3px 0 var(--line)}.nav-icon{width:25px;height:25px;display:grid;place-items:center;border-radius:8px;background:rgba(42,34,48,.08)}
    main{min-width:0;padding:28px}.page{max-width:1120px;margin:0 auto}.page-head{display:flex;align-items:end;justify-content:space-between;gap:20px;margin-bottom:22px}.page-head p{max-width:650px;margin-top:7px}.fact-run{display:flex;gap:8px;flex-wrap:wrap}.fact{padding:6px 10px;border:1.5px solid var(--line);border-radius:999px;background:white;font-size:12px;font-weight:800}.grid{display:grid;gap:18px}.grid.two{grid-template-columns:1.25fr .75fr}.grid.cards{grid-template-columns:repeat(3,minmax(0,1fr))}.surface{border:2px solid var(--line);border-radius:20px;background:var(--paper);box-shadow:var(--shadow);padding:20px}.surface.flat{box-shadow:none}.surface.pink{background:var(--pink-soft)}.surface.yellow{background:#fff4be}.surface.mint{background:#e4fbf3}.surface.blue{background:var(--blue)}
    .hero{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:22px;align-items:center}.hero-copy{display:grid;gap:10px}.hero h2{font-size:34px}.hero-art{width:128px;height:128px;border:2px solid var(--line);border-radius:32px;background:linear-gradient(145deg,var(--yellow),#ff9ccb);box-shadow:4px 5px 0 var(--line);display:grid;place-items:center;font-size:56px}.btn{cursor:pointer;border:2px solid var(--line);border-radius:12px;padding:10px 16px;background:white;font-weight:900;box-shadow:2px 3px 0 var(--line)}.btn.primary{background:var(--pink);color:white}.btn.yellow{background:var(--yellow)}.btn.ghost{box-shadow:none}.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:4px}.section{margin-top:26px}.section-head{display:flex;justify-content:space-between;align-items:baseline;gap:16px;margin-bottom:12px}.topic{display:flex;min-width:0;flex-direction:column;gap:9px;border:2px solid var(--line);border-radius:16px;background:var(--paper);padding:16px}.topic .top{display:flex;justify-content:space-between;gap:10px}.badge{display:inline-flex;width:max-content;padding:4px 8px;border:1.5px solid var(--line);border-radius:999px;background:var(--mint);font-size:11px;font-weight:900}.badge.yellow{background:var(--yellow)}.progress{height:9px;border:1.5px solid var(--line);border-radius:999px;background:white;overflow:hidden}.progress>i{display:block;height:100%;background:var(--pink)}
    .row{display:flex;align-items:center;gap:14px;padding:14px 0;border-bottom:1px solid var(--soft)}.row:last-child{border-bottom:0}.row-copy{min-width:0;flex:1}.row strong{display:block}.row .btn{padding:7px 11px;font-size:13px}.source{padding:4px 8px;border-radius:8px;background:var(--yellow);font-size:11px;font-weight:900}.split-lanes{display:grid;grid-template-columns:1fr 1fr;gap:18px}.lane{display:flex;flex-direction:column;gap:14px}.lane-head{display:flex;align-items:center;gap:12px}.lane-icon{width:48px;height:48px;border:2px solid var(--line);border-radius:14px;display:grid;place-items:center;background:var(--pink);color:white;font-size:23px}.lane:nth-child(2) .lane-icon{background:var(--yellow);color:var(--ink)}
    .timeline{display:grid;gap:0}.step{display:grid;grid-template-columns:38px 1fr;gap:12px;min-height:78px}.step-dot{width:28px;height:28px;border:2px solid var(--line);border-radius:50%;display:grid;place-items:center;background:white;font-weight:900}.step.done .step-dot{background:var(--mint)}.step.current .step-dot{background:var(--pink);color:white}.step-copy{padding-bottom:18px;border-left:2px solid var(--line);padding-left:18px;margin-left:-27px}.step:last-child .step-copy{border-left-color:transparent}.metric{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.metric>div{padding:14px;border-radius:14px;background:white;border:1.5px solid var(--line)}.metric b{display:block;font-size:24px}.gap-note{border:2px dashed #9a7900;border-radius:14px;background:#fff8d9;padding:13px;font-size:13px}.hide{display:none!important}.session{max-width:760px;margin:0 auto}.study-card{min-height:330px;display:grid;place-items:center;text-align:center}.study-card h2{font-size:38px}.choices{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:18px}.choice{padding:14px;border:2px solid var(--line);border-radius:12px;background:white;text-align:left;font-weight:800}.choice.good{background:#dff9ef}.result-lead{text-align:center;display:grid;gap:12px;justify-items:center}.score{display:grid;place-items:center;width:120px;height:120px;border:3px solid var(--line);border-radius:50%;background:var(--yellow);font-size:34px;font-weight:950;box-shadow:4px 5px 0 var(--line)}.ui-board{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px}.swatches{display:flex;gap:10px;flex-wrap:wrap}.swatch{width:54px;height:54px;border:2px solid var(--line);border-radius:14px}.mobile-bar{display:none}
    @media(max-width:820px){.proposal{position:static;align-items:flex-start;flex-direction:column}.direction-tabs{justify-content:flex-start}.decision{position:sticky;top:0;z-index:30;overflow:auto}.decision strong{display:none}.state-tabs{flex-wrap:nowrap}.shell{display:block}.sidebar{display:none}main{padding:18px 14px 92px}.page-head{align-items:flex-start;flex-direction:column}.grid.two,.grid.cards,.split-lanes,.ui-board{grid-template-columns:1fr}.hero{grid-template-columns:1fr}.hero-art{display:none}.hero h2{font-size:29px}.metric{grid-template-columns:1fr 1fr}.choices{grid-template-columns:1fr}.mobile-bar{position:fixed;bottom:0;left:0;right:0;z-index:40;display:flex;justify-content:space-around;border-top:2px solid var(--line);background:var(--paper);padding:10px 6px}.mobile-bar span{font-size:11px;font-weight:850}.mobile-bar .active{color:#d51e78}.page{max-width:100%}}
  </style>
</head>
<body>
  <header class="proposal">
    <div class="proposal__brand"><span class="mark">M</span><div><div class="eyebrow">Design plan · r1</div><h1>MiaMia · Học & ôn tập</h1></div></div>
    <div class="direction-tabs" role="tablist" aria-label="Hướng thiết kế">
      <button class="pill" data-direction="a" aria-selected="true">A · Học tiếp</button>
      <button class="pill" data-direction="b" aria-selected="false">B · Lộ trình kép</button>
      <button class="pill" data-direction="c" aria-selected="false">C · Ôn đúng chỗ yếu</button>
    </div>
  </header>
  <div class="decision"><strong>Xem cùng một hướng qua bốn trạng thái:</strong><div class="state-tabs" role="tablist"><button class="pill" data-state="home" aria-selected="true">Tổng quan</button><button class="pill" data-state="session" aria-selected="false">Buổi học</button><button class="pill" data-state="result" aria-selected="false">Hoàn thành</button><button class="pill" data-state="ui" aria-selected="false">Bộ UI</button></div></div>
  <div class="shell">
    <aside class="sidebar"><div class="logo"><span class="mark">M</span>MiaMia</div><div class="nav-label">HỌC TẬP</div><button class="nav-item"><span class="nav-icon">⌂</span>Trang chủ</button><button class="nav-item"><span class="nav-icon">✓</span>Thi thử</button><button class="nav-item active"><span class="nav-icon">Aa</span>Học & ôn tập</button><div class="nav-label">THI ĐẤU</div><button class="nav-item"><span class="nav-icon">◆</span>Trò chơi</button><button class="nav-item"><span class="nav-icon">★</span>Xếp hạng</button><div class="nav-label">CÁ NHÂN</div><button class="nav-item"><span class="nav-icon">●</span>Hồ sơ</button></aside>
    <main><div id="view" class="page"></div></main>
  </div>
  <nav class="mobile-bar"><span>⌂<br>Trang chủ</span><span>✓<br>Thi thử</span><span class="active">Aa<br>Học tập</span><span>◆<br>Trò chơi</span><span>★<br>Xếp hạng</span></nav>
  <script>
    const data={
      a:{name:'Học tiếp',why:'Vì backend đã biết chủ đề đang dở và cụm từ cần ôn, hướng này đưa người học trở lại đúng chỗ trước khi yêu cầu chọn nội dung mới.',hero:'Quay lại đúng chỗ bạn đang học',cta:'Học tiếp “Gọi món ăn”'},
      b:{name:'Lộ trình kép',why:'Vì MiaMia có hai trụ nội dung ngang hàng, hướng này cho Từ vựng và Ngữ pháp hai lane rõ ràng để người học nhìn thấy toàn bộ lộ trình.',hero:'Một lộ trình, hai cách tiến bộ',cta:'Tiếp tục lộ trình B1'},
      c:{name:'Ôn đúng chỗ yếu',why:'Vì hàng ôn cá nhân là nhiên liệu chung của học và game, hướng này dẫn bằng nội dung vừa sai, vừa bôi đen và chưa thuộc.',hero:'Hôm nay ôn đúng thứ bạn hay vấp',cta:'Bắt đầu hàng ôn cá nhân'}
    };
    const topics=`<div class="grid cards"><article class="topic"><div class="top"><span class="badge">A2 · 4 cụm</span><span>0/4</span></div><h3>Gọi món ăn</h3><p class="muted">Cụm từ lịch sự để hỏi thực đơn và gọi món.</p><div class="progress"><i style="width:0%"></i></div><button class="btn ghost">Mở chủ đề</button></article><article class="topic"><div class="top"><span class="badge">B2 · 5 cụm</span><span>0/5</span></div><h3>Từ vựng đề thi THPT (1)</h3><p class="muted">Luyện đúng cụm từ trong ngữ cảnh đề thi.</p><div class="progress"><i style="width:0%"></i></div><button class="btn ghost">Mở chủ đề</button></article><article class="topic yellow"><div class="top"><span class="badge yellow">B1 · 2 bài</span><span>Ngữ pháp</span></div><h3>Các thì cơ bản</h3><p class="muted">Quá khứ đơn, hiện tại hoàn thành và mốc thời gian.</p><div class="gap-note">Có dữ liệu thật; cần API catalogue ngữ pháp.</div></article></div>`;
    function home(d){
      if(d==='b')return `<div class="page-head"><div><div class="eyebrow">Hướng B · Lộ trình kép</div><h2>Học & ôn tập</h2><p class="muted">Đi theo trình độ của bạn, chuyển linh hoạt giữa cụm từ và ngữ pháp.</p></div><div class="fact-run"><span class="fact">2 chủ đề từ vựng</span><span class="fact">8 chủ đề ngữ pháp</span></div></div><section class="surface pink hero"><div class="hero-copy"><span class="badge">Lộ trình B1</span><h2>Một lộ trình, hai cách tiến bộ</h2><p class="muted">Hoàn thành một bước từ vựng và một bước ngữ pháp để giữ nhịp học cân bằng.</p><div class="actions"><button class="btn primary">Tiếp tục lộ trình B1 →</button><button class="btn ghost">Xem toàn bộ</button></div></div><div class="hero-art">↗</div></section><section class="section split-lanes"><div class="lane surface"><div class="lane-head"><span class="lane-icon">Aa</span><div><h3>Từ vựng theo chủ đề</h3><p class="muted">9 cụm từ đang mở</p></div></div><div class="timeline"><div class="step done"><span class="step-dot">✓</span><div class="step-copy"><b>Nền tảng A2</b><p class="muted">Gọi món ăn</p></div></div><div class="step current"><span class="step-dot">2</span><div class="step-copy"><b>Ngữ cảnh đề thi B2</b><p class="muted">5 cụm từ</p></div></div></div></div><div class="lane surface yellow"><div class="lane-head"><span class="lane-icon">¶</span><div><h3>Ngữ pháp theo cấp độ</h3><p class="muted">8 chủ đề · 11 ghi chú</p></div></div><div class="timeline"><div class="step current"><span class="step-dot">1</span><div class="step-copy"><b>Các thì cơ bản</b><p class="muted">2 ghi chú · B1</p></div></div><div class="step"><span class="step-dot">2</span><div class="step-copy"><b>Câu điều kiện</b><p class="muted">2 ghi chú · B1</p></div></div></div><div class="gap-note">Lane này cần query grammar catalogue/detail trước Apply.</div></div></section>`;
      if(d==='c')return `<div class="page-head"><div><div class="eyebrow">Hướng C · Ôn đúng chỗ yếu</div><h2>Học & ôn tập</h2><p class="muted">Không bắt bạn chọn lại từ đầu: MiaMia gom đúng nội dung vừa sai, vừa tra và chưa thuộc.</p></div><div class="fact-run"><span class="fact">Free cho mọi người</span><span class="fact">Mastery 3 lần đúng</span></div></div><section class="surface yellow hero"><div class="hero-copy"><span class="badge yellow">Đề xuất theo hành vi</span><h2>Hôm nay ôn đúng thứ bạn hay vấp</h2><p class="muted">Một hàng ôn, ba nguồn: câu làm sai · đoạn đã bôi đen · cụm từ chưa thuộc.</p><div class="actions"><button class="btn primary">Bắt đầu hàng ôn cá nhân →</button><button class="btn ghost">Chọn chủ đề khác</button></div></div><div class="hero-art">◎</div></section><section class="section grid two"><div class="surface"><div class="section-head"><h3>Hàng ôn của bạn</h3><span class="muted">Ưu tiên yếu nhất</span></div><div class="row"><span class="source">Làm sai</span><div class="row-copy"><strong>retain unfamiliar phrases</strong><span class="muted">Từ đề An Giang · vừa làm</span></div><button class="btn ghost">Ôn</button></div><div class="row"><span class="source">Bôi đen</span><div class="row-copy"><strong>had prepared earlier</strong><span class="muted">Cấu trúc điều kiện</span></div><button class="btn ghost">Ôn</button></div><div class="row"><span class="source">Chưa thuộc</span><div class="row-copy"><strong>Could I see the menu?</strong><span class="muted">Đúng liên tiếp 0/3</span></div><button class="btn ghost">Ôn</button></div><div class="gap-note">Queue gộp 3 nguồn là business đã chốt nhưng chưa có query tổng hợp.</div></div><div class="surface mint"><h3>Tiến độ không gây áp lực</h3><p class="muted">Chỉ nói bạn đã đi được bao xa; không trộn “điểm yếu Pro” vào tiến trình Free.</p><div class="metric" style="margin-top:16px"><div><b>0/9</b><span class="muted">Cụm đã thuộc</span></div><div><b>1</b><span class="muted">Ngày học</span></div><div><b>20%</b><span class="muted">Điểm thi tốt nhất</span></div></div></div></section><section class="section"><div class="section-head"><h3>Khám phá chủ đề</h3><span class="muted">Khi muốn học mới</span></div>${topics}</section>`;
      return `<div class="page-head"><div><div class="eyebrow">Hướng A · Học tiếp</div><h2>Học & ôn tập</h2><p class="muted">Trở lại đúng chỗ đang dở, rồi mới khám phá nội dung tiếp theo.</p></div><div class="fact-run"><span class="fact">9 cụm từ</span><span class="fact">0 đã thuộc</span><span class="fact">1 ngày học</span></div></div><section class="surface pink hero"><div class="hero-copy"><span class="badge">Học tiếp</span><h2>Quay lại đúng chỗ bạn đang học</h2><p class="muted">Chủ đề Gọi món ăn · A2 · 4 cụm từ. Không cần tìm lại bài cũ.</p><div class="actions"><button class="btn primary">Học tiếp “Gọi món ăn” →</button><button class="btn ghost">Ôn một cụm từ</button></div></div><div class="hero-art">↺</div></section><section class="section grid two"><div><div class="section-head"><h3>Chọn nội dung mới</h3><span class="muted">2 chủ đề đang mở</span></div>${topics}</div><aside class="surface mint"><h3>Nhịp học của bạn</h3><p class="muted" style="margin-top:6px">Tiến trình Free, dùng để động viên.</p><div class="metric" style="margin-top:16px"><div><b>0/9</b><span class="muted">Đã thuộc</span></div><div><b>1</b><span class="muted">Ngày học</span></div><div><b>25</b><span class="muted">XP</span></div></div><div class="gap-note" style="margin-top:16px">Ngữ pháp có 8 chủ đề thật nhưng cần API catalogue/detail trước khi mở tab.</div></aside></section>`;
    }
    function session(d){const label=d==='b'?'Lộ trình B1 · Từ vựng':d==='c'?'Hàng ôn cá nhân · Làm sai':'Gọi món ăn · A2';return `<div class="session"><div class="page-head"><div><div class="eyebrow">${data[d].name} · Buổi học</div><h2>${label}</h2></div><span class="fact">Câu 1/4</span></div><div class="progress"><i style="width:25%"></i></div><section class="surface study-card section"><div><span class="badge">Chọn cụm từ đúng</span><p class="muted" style="margin-top:18px">Bạn có thể cho tôi xem thực đơn không?</p><h2 style="margin-top:10px">Could I see the menu?</h2><div class="choices"><button class="choice good">Could I see the menu?</button><button class="choice">Could I pay by card?</button><button class="choice">What do you recommend?</button><button class="choice">The bill, please.</button></div></div></section><div class="actions" style="justify-content:flex-end"><button class="btn ghost">Thoát & lưu</button><button class="btn primary">Tiếp tục →</button></div></div>`}
    function result(d){return `<div class="session"><div class="result-lead"><div class="eyebrow">${data[d].name} · Hoàn thành</div><div class="score">3/4</div><h2>Bạn vừa tiến thêm một bước</h2><p class="muted">3 cụm đúng · 1 cụm cần gặp lại · +10 XP</p></div><section class="surface section"><div class="section-head"><h3>Điểm cần ôn tiếp</h3><span class="badge yellow">Đúng liên tiếp 1/3</span></div><div class="row"><div class="row-copy"><strong>What do you recommend?</strong><span class="muted">Bạn đã chọn “The bill, please.”</span></div><button class="btn ghost">Xem lại</button></div></section><div class="actions" style="justify-content:center;margin-top:22px"><button class="btn primary">Ôn cụm còn yếu →</button><button class="btn ghost">Về Học & ôn tập</button></div></div>`}
    function ui(d){return `<div class="page-head"><div><div class="eyebrow">${data[d].name} · Bộ UI</div><h2>Ngôn ngữ bề mặt MiaMia</h2><p class="muted">Cùng pattern StarCi FE; MiaMia chỉ đổi token qua global CSS và composition đã duyệt.</p></div></div><div class="ui-board"><section class="surface"><h3>Surface</h3><p class="muted" style="margin:8px 0 16px">Một nhóm nghĩa = một edge. Không card trong card.</p><div class="surface flat pink">Primary learning surface · nền hồng nhạt</div><div class="surface flat mint" style="margin-top:12px">Progress/support · nền mint</div></section><section class="surface"><h3>Button</h3><p class="muted" style="margin:8px 0 16px">Mỗi surface một primary; action phụ giảm một bậc.</p><div class="actions"><button class="btn primary">Học tiếp →</button><button class="btn yellow">Bắt đầu ôn</button><button class="btn ghost">Xem chi tiết</button></div></section><section class="surface"><h3>Typography</h3><p class="eyebrow" style="margin-top:12px">Nhãn định hướng</p><h2 style="margin-top:8px">Một thông điệp dẫn</h2><h3 style="margin-top:12px">Tên section nói kết luận</h3><p class="muted" style="margin-top:6px">Mô tả hỗ trợ, không tranh vai trò với CTA.</p></section><section class="surface"><h3>Token</h3><div class="swatches" style="margin-top:14px"><span class="swatch" style="background:var(--bg)"></span><span class="swatch" style="background:var(--pink)"></span><span class="swatch" style="background:var(--yellow)"></span><span class="swatch" style="background:var(--mint)"></span><span class="swatch" style="background:var(--ink)"></span></div><p class="muted" style="margin-top:12px">Cream ground · pink action · yellow attention · mint progress · ink boundary.</p></section></div>`}
    let direction='a',state='home';
    const render=()=>{document.querySelectorAll('[data-direction]').forEach(x=>x.setAttribute('aria-selected',x.dataset.direction===direction));document.querySelectorAll('[data-state]').forEach(x=>x.setAttribute('aria-selected',x.dataset.state===state));document.getElementById('view').innerHTML=state==='home'?home(direction):state==='session'?session(direction):state==='result'?result(direction):ui(direction)};
    document.addEventListener('click',e=>{const d=e.target.closest('[data-direction]'),s=e.target.closest('[data-state]');if(d){direction=d.dataset.direction;render()}if(s){state=s.dataset.state;render()}});render();
  </script>
</body>
</html>

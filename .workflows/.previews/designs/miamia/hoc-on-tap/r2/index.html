<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>MiaMia · Học & ôn tập · Proposal r2</title>
  <style>
    :root{--bg:#fff8ef;--paper:#fffdfa;--ink:#211927;--muted:#786c77;--pink:#ff3d96;--pink2:#ffe5f1;--yellow:#ffd84f;--mint:#87e5c4;--line:#2a2230;--soft:#eee4df;--shadow:4px 5px 0 var(--line)}
    *{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 Inter,system-ui,sans-serif}button,input{font:inherit;color:inherit}button{cursor:pointer}h1,h2,h3,p{margin:0}h1{font-size:24px}h2{font-size:30px;line-height:1.12}h3{font-size:17px}.muted{color:var(--muted)}
    .top{position:sticky;top:0;z-index:50;display:flex;justify-content:space-between;align-items:center;gap:14px;padding:12px 18px;border-bottom:2px solid var(--line);background:rgba(255,248,239,.96)}.brand{display:flex;align-items:center;gap:10px}.mark{display:grid;place-items:center;width:36px;height:36px;border:2px solid var(--line);border-radius:11px;background:var(--pink);color:#fff;font-weight:950;box-shadow:2px 2px 0 var(--line)}.eyebrow{font-size:11px;font-weight:950;letter-spacing:.08em;text-transform:uppercase;color:#d51e78}
    .tabs,.states,.actions,.facts{display:flex;gap:8px;flex-wrap:wrap}.pill{padding:8px 13px;border:2px solid var(--line);border-radius:999px;background:var(--paper);font-weight:850}.pill[aria-selected=true]{background:var(--ink);color:#fff;box-shadow:inset 0 -3px var(--pink)}.statebar{display:flex;align-items:center;gap:12px;padding:10px 18px;border-bottom:1px solid var(--line);background:var(--paper)}.statebar strong{margin-right:auto}.states .pill{padding:6px 11px;font-size:13px}
    .shell{display:grid;grid-template-columns:252px minmax(0,1fr);min-height:calc(100vh - 116px)}aside{position:sticky;top:116px;height:calc(100vh - 116px);padding:22px 16px;border-right:2px solid var(--line);background:var(--paper)}.logo{display:flex;gap:10px;align-items:center;margin-bottom:24px;font-size:20px;font-weight:950}.logo .mark{width:30px;height:30px}.nav-label{margin:18px 8px 8px;font-size:10px;font-weight:900;letter-spacing:.1em;color:var(--muted)}.nav{display:flex;align-items:center;gap:10px;width:100%;padding:11px 12px;border:0;border-radius:12px;background:transparent;text-align:left;font-weight:850}.nav.active{background:var(--pink);color:#fff;box-shadow:2px 3px 0 var(--line)}.nav i{display:grid;place-items:center;width:25px;height:25px;border-radius:8px;background:#2a223014;font-style:normal}
    main{min-width:0;padding:28px}.page{max-width:1120px;margin:auto}.pagehead{display:flex;align-items:end;justify-content:space-between;gap:18px;margin-bottom:22px}.pagehead p{max-width:650px;margin-top:7px}.fact{padding:6px 10px;border:1.5px solid var(--line);border-radius:999px;background:#fff;font-size:12px;font-weight:850}.surface{padding:20px;border:2px solid var(--line);border-radius:20px;background:var(--paper);box-shadow:var(--shadow)}.pink{background:var(--pink2)}.mint{background:#e4fbf3}.yellow{background:#fff4be}.hero{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:22px;align-items:center}.hero-copy{display:grid;gap:10px}.hero h2{font-size:35px}.hero-art{display:grid;place-items:center;width:128px;height:128px;border:2px solid var(--line);border-radius:32px;background:linear-gradient(145deg,var(--yellow),#ff9ccb);box-shadow:var(--shadow);font-size:56px}.btn{padding:10px 16px;border:2px solid var(--line);border-radius:12px;background:#fff;font-weight:900;box-shadow:2px 3px 0 var(--line)}.btn.primary{background:var(--pink);color:#fff}.btn.ghost{box-shadow:none}.section{margin-top:26px}.sectionhead{display:flex;justify-content:space-between;align-items:baseline;gap:12px;margin-bottom:12px}.grid{display:grid;gap:18px}.two{grid-template-columns:1.2fr .8fr}.cards{grid-template-columns:repeat(3,minmax(0,1fr))}
    .topic{display:grid;gap:9px;padding:16px;border:2px solid var(--line);border-radius:16px;background:var(--paper)}.topic-top{display:flex;justify-content:space-between;gap:8px}.badge{display:inline-flex;width:max-content;padding:4px 8px;border:1.5px solid var(--line);border-radius:999px;background:var(--mint);font-size:11px;font-weight:900}.progress{height:9px;border:1.5px solid var(--line);border-radius:99px;background:#fff;overflow:hidden}.progress i{display:block;height:100%;background:var(--pink)}.metric{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.metric div{padding:14px;border:1.5px solid var(--line);border-radius:14px;background:#fff}.metric b{display:block;font-size:24px}.gap{padding:13px;border:2px dashed #9a7900;border-radius:14px;background:#fff8d9;font-size:13px}
    .catalogbar{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:12px;align-items:center;margin-bottom:18px}.search{display:flex;align-items:center;gap:10px;padding:12px 14px;border:2px solid var(--line);border-radius:14px;background:#fff;box-shadow:2px 3px 0 var(--line)}.search span{font-size:20px}.search input{width:100%;border:0;outline:0;background:transparent;font-weight:750}.filterbar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}.filter{padding:7px 11px;border:1.5px solid var(--line);border-radius:999px;background:#fff;font-size:13px;font-weight:850}.filter.active{background:var(--yellow)}.resultcount{font-weight:850}.notice{padding:30px;text-align:center;border:2px dashed var(--line);border-radius:18px;background:#fff}.session{max-width:760px;margin:auto}.study{min-height:330px;display:grid;place-items:center;text-align:center}.choices{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:18px}.choice{padding:14px;border:2px solid var(--line);border-radius:12px;background:#fff;text-align:left;font-weight:850}.choice.good{background:#dff9ef}.row{display:flex;align-items:center;gap:14px;padding:14px 0;border-bottom:1px solid var(--soft)}.row:last-child{border:0}.row div{flex:1}.score{display:grid;place-items:center;width:120px;height:120px;margin:auto;border:3px solid var(--line);border-radius:50%;background:var(--yellow);box-shadow:var(--shadow);font-size:34px;font-weight:950}.center{text-align:center}.ui{grid-template-columns:repeat(2,minmax(0,1fr))}.mobile{display:none}
    @media(max-width:820px){.top{position:static;align-items:flex-start;flex-direction:column}.tabs{flex-wrap:nowrap;max-width:100%;overflow:auto}.statebar{position:sticky;top:0;z-index:30;overflow:auto}.statebar strong{display:none}.states{flex-wrap:nowrap}.shell{display:block}aside{display:none}main{padding:18px 14px 92px}.pagehead{align-items:flex-start;flex-direction:column}.two,.cards,.ui{grid-template-columns:1fr}.hero{grid-template-columns:1fr}.hero-art{display:none}.catalogbar{grid-template-columns:1fr}.metric{grid-template-columns:1fr 1fr}.choices{grid-template-columns:1fr}.mobile{position:fixed;z-index:40;left:0;right:0;bottom:0;display:flex;justify-content:space-around;padding:10px 6px;border-top:2px solid var(--line);background:var(--paper)}.mobile span{font-size:11px;font-weight:850}.mobile .active{color:#d51e78}}
  </style>
</head>
<body>
  <header class="top"><div class="brand"><span class="mark">M</span><div><div class="eyebrow">Design plan · r2</div><h1>MiaMia · Học & ôn tập</h1></div></div><div class="tabs" role="tablist" aria-label="Hướng thiết kế"><button class="pill" data-direction="a" aria-selected="true">A · Học tiếp + Khám phá</button><button class="pill" data-direction="b" aria-selected="false">B · Lộ trình kép</button><button class="pill" data-direction="c" aria-selected="false">C · Ôn đúng chỗ yếu</button></div></header>
  <div class="statebar"><strong>Xem hướng đã chọn qua năm bề mặt:</strong><div class="states" role="tablist"><button class="pill" data-state="home" aria-selected="true">Học tiếp</button><button class="pill" data-state="catalog" aria-selected="false">Khám phá</button><button class="pill" data-state="session" aria-selected="false">Buổi học</button><button class="pill" data-state="result" aria-selected="false">Hoàn thành</button><button class="pill" data-state="ui" aria-selected="false">Bộ UI</button></div></div>
  <div class="shell"><aside><div class="logo"><span class="mark">M</span>MiaMia</div><div class="nav-label">HỌC TẬP</div><button class="nav"><i>⌂</i>Trang chủ</button><button class="nav"><i>✓</i>Thi thử</button><button class="nav active"><i>Aa</i>Học & ôn tập</button><div class="nav-label">THI ĐẤU</div><button class="nav"><i>◆</i>Trò chơi</button><button class="nav"><i>★</i>Xếp hạng</button><div class="nav-label">CÁ NHÂN</div><button class="nav"><i>●</i>Hồ sơ</button></aside><main><div id="view" class="page"></div></main></div>
  <nav class="mobile"><span>⌂<br>Trang chủ</span><span>✓<br>Thi thử</span><span class="active">Aa<br>Học tập</span><span>◆<br>Trò chơi</span><span>★<br>Xếp hạng</span></nav>
  <script>
    const allTopics=[
      {name:'Gọi món ăn',level:'A2',count:4,desc:'Cụm từ lịch sự để hỏi thực đơn và gọi món.'},
      {name:'Từ vựng đề thi THPT (1)',level:'B2',count:5,desc:'Luyện đúng cụm từ trong ngữ cảnh đề thi.'}
    ];
    let direction='a',state='home',query='';
    const card=t=>`<article class="topic"><div class="topic-top"><span class="badge">${t.level} · ${t.count} cụm</span><span>0/${t.count}</span></div><h3>${t.name}</h3><p class="muted">${t.desc}</p><div class="progress"><i style="width:0%"></i></div><button class="btn ghost">Mở chủ đề</button></article>`;
    function head(kicker,title,desc,facts=''){return `<div class="pagehead"><div><div class="eyebrow">${kicker}</div><h2>${title}</h2><p class="muted">${desc}</p></div><div class="facts">${facts}</div></div>`}
    function home(){
      if(direction==='b')return head('Hướng B · Lộ trình kép','Một lộ trình, hai cách tiến bộ','Từ vựng và ngữ pháp ngang vai; cần Grammar API để chạy thật.')+`<section class="surface yellow"><div class="gap">Hướng này đã không được chọn ở r1. Giữ lại để so quyết định.</div></section>`;
      if(direction==='c')return head('Hướng C · Ôn đúng chỗ yếu','Ôn đúng thứ bạn hay vấp','Hàng ôn cá nhân cần query tổng hợp ba nguồn trước khi chạy thật.')+`<section class="surface yellow"><div class="gap">Hướng này đã không được chọn ở r1. Giữ lại để so quyết định.</div></section>`;
      return head('Hướng A đã chọn · Học tiếp','Học & ôn tập','Landing trả người học về đúng chỗ; catalogue là route riêng, không bị nhồi dưới hero.',`<span class="fact">9 cụm từ</span><span class="fact">2 chủ đề</span>`)+`<section class="surface pink hero"><div class="hero-copy"><span class="badge">Học tiếp</span><h2>Quay lại đúng chỗ bạn đang học</h2><p class="muted">Gọi món ăn · A2 · 4 cụm từ. Không cần tìm lại bài cũ.</p><div class="actions"><button class="btn primary">Học tiếp “Gọi món ăn” →</button><button class="btn ghost" data-go="catalog">Khám phá chủ đề</button></div></div><div class="hero-art">↺</div></section><section class="section grid two"><div class="surface"><div class="sectionhead"><h3>Sắp tới trong nhịp học</h3><span class="muted">Theo tiến trình thật</span></div><div class="row"><div><b>Ôn lại 1 cụm chưa thuộc</b><p class="muted">Could I see the menu? · đúng liên tiếp 0/3</p></div><button class="btn ghost">Ôn nhanh</button></div><div class="row"><div><b>Chủ đề tiếp theo</b><p class="muted">Từ vựng đề thi THPT (1) · B2</p></div><button class="btn ghost">Xem</button></div></div><div class="surface mint"><h3>Nhịp học của bạn</h3><div class="metric section"><div><b>0/9</b><span class="muted">Đã thuộc</span></div><div><b>1</b><span class="muted">Ngày học</span></div><div><b>25</b><span class="muted">XP</span></div></div></div></section>`;
    }
    function catalog(){const q=query.trim().toLowerCase();const found=allTopics.filter(t=>`${t.name} ${t.level} ${t.desc}`.toLowerCase().includes(q));return head('Route riêng · Khám phá','Khám phá chủ đề','Tìm theo tên, mô tả hoặc trình độ. Backend hiện trả toàn bộ topic; phase đầu lọc client-side trên dữ liệu thật.',`<span class="fact">${found.length}/${allTopics.length} chủ đề</span>`)+`<section class="surface"><div class="catalogbar"><label class="search"><span>⌕</span><input id="search" value="${query.replaceAll('"','&quot;')}" placeholder="Tìm chủ đề, ví dụ: A2 hoặc đề thi" aria-label="Tìm chủ đề học"></label><span class="resultcount">${found.length} kết quả</span></div><div class="filterbar"><button class="filter active">Tất cả</button><button class="filter">A2</button><button class="filter">B2</button><button class="filter">Từ vựng</button><button class="filter">Ngữ pháp · sắp có</button></div>${found.length?`<div class="grid cards">${found.map(card).join('')}</div>`:`<div class="notice"><h3>Không tìm thấy chủ đề phù hợp</h3><p class="muted">Thử tên khác hoặc xoá bộ lọc.</p><button class="btn ghost section" data-clear>Hiện tất cả</button></div>`}<div class="gap section">Tên miền đúng hiện tại là “chủ đề”, chưa phải “khóa học”. Nếu sản phẩm muốn Course catalogue thật, cần Backend Feature Plan riêng.</div></section>`}
    function session(){return head('Học tiếp · Buổi học','Gọi món ăn · A2','Một prompt, một quyết định, giữ tiến trình rõ ràng.',`<span class="fact">Câu 1/4</span>`)+`<div class="progress"><i style="width:25%"></i></div><section class="surface study section"><div><span class="badge">Chọn cụm từ đúng</span><p class="muted section">Bạn có thể cho tôi xem thực đơn không?</p><h2>Could I see the menu?</h2><div class="choices"><button class="choice good">Could I see the menu?</button><button class="choice">Could I pay by card?</button><button class="choice">What do you recommend?</button><button class="choice">The bill, please.</button></div></div></section>`}
    function result(){return `<div class="session center"><div class="eyebrow">Học tiếp · Hoàn thành</div><div class="score section">3/4</div><h2 class="section">Bạn vừa tiến thêm một bước</h2><p class="muted">3 cụm đúng · 1 cụm cần gặp lại · +10 XP</p><div class="actions section" style="justify-content:center"><button class="btn primary">Ôn cụm còn yếu →</button><button class="btn ghost">Về Học tiếp</button></div></div>`}
    function ui(){return head('Hướng A · Bộ UI','Ngôn ngữ bề mặt MiaMia','Giữ pattern StarCi FE, MiaMia override token qua global CSS.')+`<div class="grid ui"><section class="surface"><h3>Surface</h3><p class="muted section">Landing continuity và catalogue là hai page owner; không card trong card.</p><div class="surface pink">Primary learning surface</div></section><section class="surface"><h3>Search</h3><p class="muted section">SearchBox + count cùng owner; empty state giữ page identity.</p><label class="search"><span>⌕</span><input placeholder="Tìm chủ đề"></label></section><section class="surface"><h3>Button</h3><div class="actions section"><button class="btn primary">Học tiếp →</button><button class="btn ghost">Khám phá</button></div></section><section class="surface mint"><h3>Token</h3><p class="muted section">Cream ground · pink action · yellow attention · mint progress · ink boundary.</p></section></div>`}
    function render(){document.querySelectorAll('[data-direction]').forEach(x=>x.setAttribute('aria-selected',x.dataset.direction===direction));document.querySelectorAll('[data-state]').forEach(x=>x.setAttribute('aria-selected',x.dataset.state===state));document.getElementById('view').innerHTML=state==='home'?home():state==='catalog'?catalog():state==='session'?session():state==='result'?result():ui();const search=document.getElementById('search');if(search){search.focus();search.setSelectionRange(search.value.length,search.value.length)}}
    document.addEventListener('click',e=>{const d=e.target.closest('[data-direction]'),s=e.target.closest('[data-state]'),go=e.target.closest('[data-go]');if(d){direction=d.dataset.direction;state='home'}if(s)state=s.dataset.state;if(go)state=go.dataset.go;if(e.target.closest('[data-clear]'))query='';render()});
    document.addEventListener('input',e=>{if(e.target.id==='search'){query=e.target.value;render()}});render();
  </script>
</body>
</html>

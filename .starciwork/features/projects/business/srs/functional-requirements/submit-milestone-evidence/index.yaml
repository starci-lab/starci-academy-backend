      mainFlow:
        id: FR-PROJ-02.MAIN
        trigger: Open the selected milestone
        steps:
          - id: FR-PROJ-02.MAIN.S1
            actor: learner
            request: Open the selected milestone
            systemResponse: Show its criteria and required evidence
            businessEffect: The learner sees which project and milestone revision is targeted.
            acceptanceRefs:
              - FR-PROJ-02.AC.M1
          - id: FR-PROJ-02.MAIN.S2
            actor: learner
            request: Attach source, demo, run instructions and supporting evidence
            systemResponse: Preview the submission and intended reviewer visibility
            businessEffect: Only permitted material is included.
            acceptanceRefs:
              - FR-PROJ-02.AC.M2
          - id: FR-PROJ-02.MAIN.S3
            actor: learner
            request: Submit the reviewed package
            systemResponse: Record a versioned submission and begin checking input completeness
            businessEffect: A receipt identifies the same submitted package.
            acceptanceRefs:
              - FR-PROJ-02.AC.M3
          - id: FR-PROJ-02.MAIN.S4
            actor: learner
            request: Inspect readiness for review
            systemResponse: Identify inaccessible or missing evidence, or show ready for review
            businessEffect: Input readiness is distinct from a successful project result.
            acceptanceRefs:
              - FR-PROJ-02.AC.M4
        end:
          type: completed-main-flow
          outcome: Input readiness is distinct from a successful project result.
      alternativeFlows:
        - id: FR-PROJ-02.ALT1
          title: The learner cancels before submission
          fromStep: FR-PROJ-02.MAIN.S2
          condition: The learner cancels before submission
          steps:
            - id: FR-PROJ-02.ALT1.S1
              actor: learner
              request: Cancel the package
              systemResponse: Keep permitted drafts according to the stated draft behavior
              businessEffect: No review is started.
              acceptanceRefs:
                - FR-PROJ-02.AC.ALT1
          resume:
            type: end
            outcome: No review is started.
          postconditions:
            - No review is started.
          continuation: This flow instance ends with the stated outcome. A permitted correction, status lookup
            or deliberate new request follows the response and current policy; it does not imply a
            successful main outcome.
          acceptanceRefs:
            - FR-PROJ-02.AC.ALT1
      exceptionFlows:
        - id: FR-PROJ-02.EX1
          title: A repository/demo cannot be accessed or evidence is missing
          fromStep: FR-PROJ-02.MAIN.S4
          condition: A repository/demo cannot be accessed or evidence is missing
          steps:
            - id: FR-PROJ-02.EX1.S1
              actor: learner
              request: Inspect the completeness report
              systemResponse: List the exact evidence needed and how to resubmit
              businessEffect: Keep the submitted revision; no invented implementation finding.
              acceptanceRefs:
                - FR-PROJ-02.AC.EX1
          resume:
            type: end
            outcome: Keep the submitted revision; no invented implementation finding.
          postconditions:
            - Keep the submitted revision; no invented implementation finding.
          continuation: This flow instance ends with the stated outcome. A permitted correction, status lookup
            or deliberate new request follows the response and current policy; it does not imply a
            successful main outcome.
          acceptanceRefs:
            - FR-PROJ-02.AC.EX1
        - id: FR-PROJ-02.EX2
          title: The same submission key is reused with different content
          fromStep: FR-PROJ-02.MAIN.S3
          condition: The same submission key is reused with different content
          steps:
            - id: FR-PROJ-02.EX2.S1
              actor: learner
              request: Submit the changed package
              systemResponse: Return a conflict requiring an explicit new revision
              businessEffect: Do not overwrite the original submission.
              acceptanceRefs:
                - FR-PROJ-02.AC.EX2
          resume:
            type: end
            outcome: Do not overwrite the original submission.
          postconditions:
            - Do not overwrite the original submission.
          continuation: This flow instance ends with the stated outcome. A permitted correction, status lookup
            or deliberate new request follows the response and current policy; it does not imply a
            successful main outcome.
          acceptanceRefs:
            - FR-PROJ-02.AC.EX2
      postconditions:
        success:
          - The learner sees which project and milestone revision is targeted.
          - Only permitted material is included.
          - A receipt identifies the same submitted package.
          - Input readiness is distinct from a successful project result.
        failure:
          - Only effects explicitly completed before the branch remain, with their original
            attribution.
          - No rejected or unresolved operation is presented as the successful main outcome.
          - Keep the submitted revision; no invented implementation finding.
          - Do not overwrite the original submission.

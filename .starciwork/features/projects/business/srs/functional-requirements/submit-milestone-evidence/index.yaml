      id: FR-PROJ-02
      title: Submit project evidence for a milestone
      domain: projects
      goal: Submit project evidence for a milestone
      priority: release-priority-awaits-D01
      actors:
        - learner
      preconditions:
        - The learner owns the project proposal or the evidence to be reviewed.
        - Each protected step checks the acting identity, current resource/action/audience rights
          and any applicable entitlement.
        - Policy-dependent effects run only with the relevant approved policy; unresolved values
          remain explicit decision dependencies and do not block writing/reviewing this draft.
      inputs:
        - id: FR-PROJ-02.IN1
          name: milestoneVersion
          validation: Selected accepted milestone and criteria
          dataRefs:
            - DATA-project
            - DATA-submission
            - DATA-evidence
            - DATA-usage
        - id: FR-PROJ-02.IN2
          name: evidencePackage
          validation: Owned/permitted source, demo, run instructions and exact revision
          dataRefs:
            - DATA-project
            - DATA-submission
            - DATA-evidence
            - DATA-usage
      outputs:
        - name: result-1
          fromStep: FR-PROJ-02.MAIN.S1
          meaning: Show its criteria and required evidence
          effect: The learner sees which project and milestone revision is targeted.
        - name: result-2
          fromStep: FR-PROJ-02.MAIN.S2
          meaning: Preview the submission and intended reviewer visibility
          effect: Only permitted material is included.
        - name: result-3
          fromStep: FR-PROJ-02.MAIN.S3
          meaning: Record a versioned submission and begin checking input completeness
          effect: A receipt identifies the same submitted package.
        - name: result-4
          fromStep: FR-PROJ-02.MAIN.S4
          meaning: Identify inaccessible or missing evidence, or show ready for review
          effect: Input readiness is distinct from a successful project result.
      businessRuleRefs:

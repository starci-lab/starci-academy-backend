  work3:
    srs:
      schema: starci/srs-functional-requirement@1
      status: draft
      authority: proposed-detail-from-accepted-product-scope
      id: FR-PROJ-03
      title: Review a milestone and verify improvements
      domain: projects
      goal: Review a milestone and verify improvements
      priority: release-priority-awaits-D01
      actors:
        - learner
      preconditions:
        - The learner owns the project proposal or the evidence to be reviewed.
        - Each protected step checks the acting identity, current resource/action/audience rights
          and any applicable entitlement.
        - Policy-dependent effects run only with the relevant approved policy; unresolved values
          remain explicit decision dependencies and do not block writing/reviewing this draft.
      inputs:
        - id: FR-PROJ-03.IN1
          name: readySubmission
          validation: Inspectable accepted evidence version
          dataRefs:
            - DATA-project
            - DATA-submission
            - DATA-review
            - DATA-evidence
            - DATA-progress
        - id: FR-PROJ-03.IN2
          name: reviewOrRevisionChoice
          validation: Requested method, clarification or explicit new revision and applicable usage
          dataRefs:
            - DATA-project
            - DATA-submission
            - DATA-review
            - DATA-evidence
            - DATA-progress
      outputs:
        - name: result-1
          fromStep: FR-PROJ-03.MAIN.S1
          meaning: Identify the submission, rubric, reviewer method and applicable usage
          effect: The request is linked to an immutable target.
        - name: result-2
          fromStep: FR-PROJ-03.MAIN.S2
          meaning: Distinguish waiting, reviewing, incomplete evidence and review error
          effect: An accepted request is not a completed review.
        - name: result-3
          fromStep: FR-PROJ-03.MAIN.S3
          meaning: Show strengths, issues, severity, cited evidence and useful next steps
          effect: Claims are limited to the evidence actually available.
        - name: result-4
          fromStep: FR-PROJ-03.MAIN.S4
          meaning: Retain feedback and link relevant concepts for learning
          effect: Disagreement can be explained without altering historical evidence.
        - name: result-5
          fromStep: FR-PROJ-03.MAIN.S5
          meaning: Assess old findings against the new revision and current criteria
          effect: Only demonstrated improvements update applicable progress.

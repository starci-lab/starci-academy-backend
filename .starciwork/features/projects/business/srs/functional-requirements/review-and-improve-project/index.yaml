        cross-cutting rules and measurement targets. Open policies are not selected by this draft.
      mainFlow:
        id: FR-PROJ-03.MAIN
        trigger: Request review of a ready submission
        steps:
          - id: FR-PROJ-03.MAIN.S1
            actor: learner
            request: Request review of a ready submission
            systemResponse: Identify the submission, rubric, reviewer method and applicable usage
            businessEffect: The request is linked to an immutable target.
            acceptanceRefs:
              - FR-PROJ-03.AC.M1
          - id: FR-PROJ-03.MAIN.S2
            actor: learner
            request: Inspect review progress
            systemResponse: Distinguish waiting, reviewing, incomplete evidence and review error
            businessEffect: An accepted request is not a completed review.
            acceptanceRefs:
              - FR-PROJ-03.AC.M2
          - id: FR-PROJ-03.MAIN.S3
            actor: learner
            request: Read feedback
            systemResponse: Show strengths, issues, severity, cited evidence and useful next steps
            businessEffect: Claims are limited to the evidence actually available.
            acceptanceRefs:
              - FR-PROJ-03.AC.M3
          - id: FR-PROJ-03.MAIN.S4
            actor: learner
            request: Ask for clarification or revise the work
            systemResponse: Retain feedback and link relevant concepts for learning
            businessEffect: Disagreement can be explained without altering historical evidence.
            acceptanceRefs:
              - FR-PROJ-03.AC.M4
          - id: FR-PROJ-03.MAIN.S5
            actor: learner
            request: Submit a corrected revision and compare reviews
            systemResponse: Assess old findings against the new revision and current criteria
            businessEffect: Only demonstrated improvements update applicable progress.
            acceptanceRefs:
              - FR-PROJ-03.AC.M5
        end:
          type: completed-main-flow
          outcome: Only demonstrated improvements update applicable progress.
      alternativeFlows:
        - id: FR-PROJ-03.ALT1
          title: The learner disputes a finding with additional evidence
          fromStep: FR-PROJ-03.MAIN.S4
          condition: The learner disputes a finding with additional evidence
          steps:
            - id: FR-PROJ-03.ALT1.S1
              actor: learner
              request: Provide a scoped clarification
              systemResponse: Show the follow-up review and evidence attribution
              businessEffect: The original review remains attributable.
              acceptanceRefs:
                - FR-PROJ-03.AC.ALT1
          resume:
            type: end
            outcome: The original review remains attributable.
          postconditions:
            - The original review remains attributable.
          continuation: This flow instance ends with the stated outcome. A permitted correction, status lookup
            or deliberate new request follows the response and current policy; it does not imply a
            successful main outcome.
          acceptanceRefs:
            - FR-PROJ-03.AC.ALT1
      exceptionFlows:
        - id: FR-PROJ-03.EX1
          title: Evidence cannot support a requested conclusion
          fromStep: FR-PROJ-03.MAIN.S3
          condition: Evidence cannot support a requested conclusion
          steps:
            - id: FR-PROJ-03.EX1.S1
              actor: learner
              request: Inspect the review
              systemResponse: Mark the criterion not demonstrated and identify missing proof
              businessEffect: No assertion that a feature works solely from its description.
              acceptanceRefs:
                - FR-PROJ-03.AC.EX1
          resume:
            type: end
            outcome: No assertion that a feature works solely from its description.
          postconditions:
            - No assertion that a feature works solely from its description.
          continuation: This flow instance ends with the stated outcome. A permitted correction, status lookup
            or deliberate new request follows the response and current policy; it does not imply a
            successful main outcome.
          acceptanceRefs:
            - FR-PROJ-03.AC.EX1
        - id: FR-PROJ-03.EX2
          title: Review processing fails or usage permission is unavailable
          fromStep: FR-PROJ-03.MAIN.S2
          condition: Review processing fails or usage permission is unavailable
          steps:
            - id: FR-PROJ-03.EX2.S1
              actor: learner
              request: Read the same request status
              systemResponse: Preserve the submission and explain retry/access conditions
              businessEffect: No false failing grade or undisclosed duplicate usage.
              acceptanceRefs:
                - FR-PROJ-03.AC.EX2
          resume:
            type: end
            outcome: No false failing grade or undisclosed duplicate usage.
          postconditions:
            - No false failing grade or undisclosed duplicate usage.
          continuation: This flow instance ends with the stated outcome. A permitted correction, status lookup
            or deliberate new request follows the response and current policy; it does not imply a
            successful main outcome.
          acceptanceRefs:
            - FR-PROJ-03.AC.EX2
        - id: FR-PROJ-03.EX3
          title: Evidence contains instructions to ignore criteria or reveal hidden reviewer data
          fromStep: FR-PROJ-03.MAIN.S3
          condition: Evidence contains instructions to ignore criteria or reveal hidden reviewer data
          steps:
            - id: FR-PROJ-03.EX3.S1
              actor: learner
              request: Read the review result
              systemResponse: Treat embedded instructions as untrusted submission content and assess the approved
                criteria
              businessEffect: No privilege escalation, secret disclosure or manufactured positive finding.
              acceptanceRefs:
                - FR-PROJ-03.AC.EX3
          resume:
            type: end
            outcome: No privilege escalation, secret disclosure or manufactured positive finding.
          postconditions:
            - No privilege escalation, secret disclosure or manufactured positive finding.
          continuation: This flow instance ends with the stated outcome. A permitted correction, status lookup
            or deliberate new request follows the response and current policy; it does not imply a
            successful main outcome.
          acceptanceRefs:
            - FR-PROJ-03.AC.EX3
      postconditions:
        success:
          - The request is linked to an immutable target.
          - An accepted request is not a completed review.
          - Claims are limited to the evidence actually available.
          - Disagreement can be explained without altering historical evidence.
          - Only demonstrated improvements update applicable progress.
        failure:
          - Only effects explicitly completed before the branch remain, with their original
            attribution.
          - No rejected or unresolved operation is presented as the successful main outcome.
          - No assertion that a feature works solely from its description.
          - No false failing grade or undisclosed duplicate usage.
          - No privilege escalation, secret disclosure or manufactured positive finding.

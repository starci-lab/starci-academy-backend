schema: work/node@2
id: starci-next.business.srs.data.learning-evidence
kind: business
required: true
state: todo
description: Versioned source, demo or learning proof
refs:
  - starci-next.business.srs.business-rules.policy-decisions.evaluation-and-recognition
  - starci-next.business.srs.business-rules.policy-decisions.privacy-and-sharing
extensions:
  work3:
    srs:
      schema: starci/srs-data-definition@1
      status: draft
      authority: proposed-detail-from-accepted-product-scope
      id: DATA-evidence
      title: Versioned source, demo or learning proof
      modelLevel: Proposed logical business contract; physical storage, indexes and APIs belong to SDS.
      owner: evidence owner
      fields:
        - name: id
          meaning: Stable logical record identity
          validation: Required, unique and not changed by a state transition
          classification: context-scoped
        - name: version
          meaning: Record/content revision used for attribution and confirmation
          validation: Identify the reviewed version; changed content must not impersonate an earlier revision
          classification: context-scoped
        - name: kindAndLocation
          meaning: Source, demo, artifact or result reference
          validation: Permitted type and owned/authorized origin required
          classification: private
        - name: versionIdentity
          meaning: Exact content/revision reviewed
          validation: Required stable identity; mutable URLs disclose limitations
          classification: private
        - name: claimContext
          meaning: What criterion or career claim it supports
          validation: Must match the evidence scope
          classification: private
        - name: accessAndIntegrity
          meaning: Current inspection permission and availability
          validation: Check current audience; distinguish unavailable from disproven
          classification: restricted
      relations:
        - dataRef: DATA-project
          meaning: Referenced business identity/version; lookup never grants access by itself.
        - dataRef: DATA-submission
          meaning: Referenced business identity/version; lookup never grants access by itself.
        - dataRef: DATA-review
          meaning: Referenced business identity/version; lookup never grants access by itself.
        - dataRef: DATA-share-grant
          meaning: Referenced business identity/version; lookup never grants access by itself.
      states:
        - draft
        - submitted
        - available
        - unavailable
        - withdrawn
      transitions:
        - id: DATA-evidence.T1
          from: draft
          to: submitted
          event: Select evidence for review
          guard: Owner and version identified
        - id: DATA-evidence.T2
          from: submitted
          to: available
          event: Validate access and required content
          guard: Reviewer can inspect permitted required evidence
        - id: DATA-evidence.T3
          from: submitted
          to: unavailable
          event: Required evidence cannot be inspected
          guard: Explain missing input
        - id: DATA-evidence.T4
          from: available
          to: unavailable
          event: Origin becomes inaccessible
          guard: Preserve past provenance and current limit
        - id: DATA-evidence.T5
          from: available
          to: withdrawn
          event: Owner withdraws sharing
          guard: Apply D08 current-access policy
      invariants:
        - Evidence withdrawal is not permission to expose cached private content.
      decisionRefs:
        - D05
        - D08
      privacy:
        access: Apply current owner, role, resource and audience grants. A selected-public field is exposed
          only after authorized publication.
        retention: D08 selects retention/export/closure behavior. No storage duration or automatic deletion
          policy is inferred.
        referenceWithdrawal: Preserve permitted provenance while preventing newly unauthorized source
          access; retained snapshots require approved D08 purpose and scope.
      validationCases:
        - given: An actor without current rights references this evidence.
          when: Read or mutate the record.
          then: Deny the unauthorized action without disclosing restricted fields.
        - given: A record in a declared state and an attributed authorized event.
          when: Apply a listed transition.
          then: Require its guard, retain the prior version attribution and reject a transition unsupported by
            policy.
      featureOwner: projects
      ownership: Defined once in this feature. Other features reference the stable
        requirement/data/journey ID and current Work node ID.

schema: work/node@2
id: starci-next.business.srs.data.review
kind: business
required: true
state: todo
description: AI, human or peer review and request
refs:
  - starci-next.business.srs.business-rules.policy-decisions.evaluation-and-recognition
  - starci-next.business.srs.business-rules.policy-decisions.failed-ai-usage
  - starci-next.business.srs.business-rules.policy-decisions.privacy-and-sharing
  - starci-next.business.srs.business-rules.policy-decisions.mentor-service
extensions:
  work3:
    srs:
      schema: starci/srs-data-definition@1
      status: draft
      authority: proposed-detail-from-accepted-product-scope
      id: DATA-review
      title: AI, human or peer review and request
      modelLevel: Proposed logical business contract; physical storage, indexes and APIs belong to SDS.
      owner: evidence owner; assigned reviewer within grant
      fields:
        - name: id
          meaning: Stable logical record identity
          validation: Required, unique and not changed by a state transition
          classification: context-scoped
        - name: version
          meaning: Record/content revision used for attribution and confirmation
          validation: Identify the reviewed version; changed content must not impersonate an earlier revision
          classification: context-scoped
        - name: reviewType
          meaning: AI, mentor or peer review
          validation: Required provenance classification
          classification: private
        - name: subjectVersion
          meaning: Attempt/evidence being reviewed
          validation: Exact version required
          classification: private
        - name: criteriaAndAssessor
          meaning: Rubric and accountable reviewer/method
          validation: Required when a judgment is produced
          classification: private
        - name: findings
          meaning: Criterion feedback, limitations and next steps
          validation: Unsupported criteria remain unevaluated; no overwrite of test outcomes
          classification: private
        - name: requestDisposition
          meaning: Acceptance, cancellation or delivery state
          validation: Human request acceptance is distinct from completed feedback
          classification: private
      relations:
        - dataRef: DATA-submission
          meaning: Referenced business identity/version; lookup never grants access by itself.
        - dataRef: DATA-evidence
          meaning: Referenced business identity/version; lookup never grants access by itself.
        - dataRef: DATA-assessment
          meaning: Referenced business identity/version; lookup never grants access by itself.
        - dataRef: DATA-usage
          meaning: Referenced business identity/version; lookup never grants access by itself.
        - dataRef: DATA-share-grant
          meaning: Referenced business identity/version; lookup never grants access by itself.
      states:
        - requested
        - accepted
        - needs-input
        - processing
        - completed
        - failed
        - declined
        - cancelled
        - access-withdrawn
      transitions:
        - id: DATA-review.T1
          from: requested
          to: accepted
          event: Reviewer accepts eligible request
          guard: Current scope and D10 terms allow it
        - id: DATA-review.T2
          from: requested
          to: declined
          event: Reviewer declines
          guard: No service completion asserted
        - id: DATA-review.T3
          from: requested
          to: cancelled
          event: Requester cancels
          guard: Applicable policy permits cancellation
        - id: DATA-review.T4
          from: accepted
          to: processing
          event: Start authorized review
          guard: Evidence and allowance/service terms valid
        - id: DATA-review.T5
          from: requested
          to: processing
          event: Start eligible AI review
          guard: Valid evidence and AI policy
        - id: DATA-review.T6
          from: processing
          to: needs-input
          event: Evidence insufficient
          guard: Specific limitation recorded
        - id: DATA-review.T7
          from: processing
          to: completed
          event: Deliver review
          guard: Versioned findings and provenance recorded
        - id: DATA-review.T8
          from: processing
          to: failed
          event: Review process fails
          guard: Failure distinguished from negative learner result
        - id: DATA-review.T9
          from: accepted
          to: access-withdrawn
          event: Owner withdraws permission
          guard: Further private access denied
        - id: DATA-review.T10
          from: processing
          to: access-withdrawn
          event: Permission lost during review
          guard: No newly unauthorized disclosure
      invariants:
        - A reported processing error is not a failed learner criterion.
        - Retries keep original request history and use explicit D07 treatment.
      decisionRefs:
        - D05
        - D07
        - D08
        - D10
      privacy:
        access: Apply current owner, role, resource and audience grants. A selected-public field is exposed
          only after authorized publication.
        retention: D08 selects retention/export/closure behavior. No storage duration or automatic deletion
          policy is inferred.
        referenceWithdrawal: Preserve permitted provenance while preventing newly unauthorized source
          access; retained snapshots require approved D08 purpose and scope.
      validationCases:
        - given: An actor without current rights references this review.
          when: Read or mutate the record.
          then: Deny the unauthorized action without disclosing restricted fields.
        - given: A record in a declared state and an attributed authorized event.
          when: Apply a listed transition.
          then: Require its guard, retain the prior version attribution and reject a transition unsupported by
            policy.
      featureOwner: projects
      ownership: Defined once in this feature. Other features reference the stable
        requirement/data/journey ID and current Work node ID.

extensions:
  work3:
    srs:
      schema: starci/srs-functional-requirement@1
      status: draft
      authority: proposed-detail-from-accepted-product-scope
      id: FR-CON-02
      title: Study a structured and versioned concept
      domain: concepts
      goal: Study a structured and versioned concept
      priority: release-priority-awaits-D01
      actors:
        - learner
      preconditions:
        - The selected published content and applicable content-access rules are identifiable.
        - Each protected step checks the acting identity, current resource/action/audience rights
          and any applicable entitlement.
        - Policy-dependent effects run only with the relevant approved policy; unresolved values
          remain explicit decision dependencies and do not block writing/reviewing this draft.
      inputs:
        - id: FR-CON-02.IN1
          name: conceptVersion
          validation: Selected available Concept and language
          dataRefs:
            - DATA-concept
            - DATA-progress
        - id: FR-CON-02.IN2
          name: studyInteraction
          validation: Section, learner response or requested next activity
          dataRefs:
            - DATA-concept
            - DATA-progress
      outputs:
        - name: result-1
          fromStep: FR-CON-02.MAIN.S1
          meaning: Show outcomes, prerequisites and the ordered lesson sections
          effect: The current study context names the concept and version.
        - name: result-2
          fromStep: FR-CON-02.MAIN.S2
          meaning: Present each section in its own learning role with source context
          effect: Viewing content records only applicable reading/activity progress.
        - name: result-3
          fromStep: FR-CON-02.MAIN.S3
          meaning: Capture the learner response and show the corresponding explanation or result
          effect: Practice evidence is distinct from sections merely viewed.
        - name: result-4
          fromStep: FR-CON-02.MAIN.S4
          meaning: Restore the saved position and version context where available
          effect: The learner can continue without converting reading into mastery.
        - name: result-5
          fromStep: FR-CON-02.MAIN.S5
          meaning: Show the linked activity and its prerequisites
          effect: The selected activity retains its concept context.
      businessRuleRefs:
        - BR-CONCEPT
        - BR-MASTERY
        - BR-VERSION
      dataRefs:
        - DATA-concept
        - DATA-progress
      nonFunctionalRefs:
        - NFR-SEC
        - NFR-PRIV
        - NFR-INTEGRITY
        - NFR-RELIABILITY
        - NFR-REPEAT
        - NFR-LATENCY
        - NFR-USABILITY
        - NFR-LANGUAGE
        - NFR-AUDIT
      decisionRefs:
        - D05
        - D08
        - D11
        - D03
        - D07
        - D12
        - D01
        - D06
      directPolicyRefs:
        - D05
      decisionTreatment: Direct policy refs affect the named feature behavior; inherited refs govern
        cross-cutting rules and measurement targets. Open policies are not selected by this draft.
      mainFlow:
        id: FR-CON-02.MAIN
        trigger: Open an available concept version
        steps:
          - id: FR-CON-02.MAIN.S1
            actor: learner
            request: Open an available concept version
            systemResponse: Show outcomes, prerequisites and the ordered lesson sections
            businessEffect: The current study context names the concept and version.
            acceptanceRefs:
              - FR-CON-02.AC.M1
          - id: FR-CON-02.MAIN.S2
            actor: learner
            request: Read explanations and inspect diagrams, simulations and source examples
            systemResponse: Present each section in its own learning role with source context
            businessEffect: Viewing content records only applicable reading/activity progress.
            acceptanceRefs:
              - FR-CON-02.AC.M2
          - id: FR-CON-02.MAIN.S3
            actor: learner
            request: Perform an embedded prediction or practice activity
            systemResponse: Capture the learner response and show the corresponding explanation or result
            businessEffect: Practice evidence is distinct from sections merely viewed.
            acceptanceRefs:
              - FR-CON-02.AC.M3
          - id: FR-CON-02.MAIN.S4
            actor: learner
            request: Leave and return to the concept
            systemResponse: Restore the saved position and version context where available
            businessEffect: The learner can continue without converting reading into mastery.
            acceptanceRefs:
              - FR-CON-02.AC.M4
          - id: FR-CON-02.MAIN.S5
            actor: learner
            request: Choose a related challenge or next learning step
            systemResponse: Show the linked activity and its prerequisites
            businessEffect: The selected activity retains its concept context.
            acceptanceRefs:
              - FR-CON-02.AC.M5
        end:
          type: completed-main-flow
          outcome: The selected activity retains its concept context.
      alternativeFlows:
        - id: FR-CON-02.ALT1
          title: An alternate supported language exists
          fromStep: FR-CON-02.MAIN.S2
          condition: An alternate supported language exists
          steps:
            - id: FR-CON-02.ALT1.S1
              actor: learner
              request: Switch language
              systemResponse: Show equivalent content for the chosen available version
              businessEffect: Concept identity remains shared; language-specific progress behavior is explicit.
              acceptanceRefs:
                - FR-CON-02.AC.ALT1
          resume:
            type: main-step
            stepRef: FR-CON-02.MAIN.S3
          postconditions:
            - Concept identity remains shared; language-specific progress behavior is explicit.
          continuation: Continue at FR-CON-02.MAIN.S3.
          acceptanceRefs:
            - FR-CON-02.AC.ALT1
      exceptionFlows:
        - id: FR-CON-02.EX1
          title: A source example or interactive asset cannot load
          fromStep: FR-CON-02.MAIN.S2
          condition: A source example or interactive asset cannot load
          steps:
            - id: FR-CON-02.EX1.S1
              actor: learner
              request: Open the affected section
              systemResponse: Keep accessible content and identify the unavailable activity
              businessEffect: No practice completion is recorded for an activity that did not run.
              acceptanceRefs:
                - FR-CON-02.AC.EX1
          resume:
            type: end
            outcome: No practice completion is recorded for an activity that did not run.
          postconditions:
            - No practice completion is recorded for an activity that did not run.
          continuation: This flow instance ends with the stated outcome. A permitted correction, status lookup
            or deliberate new request follows the response and current policy; it does not imply a
            successful main outcome.
          acceptanceRefs:
            - FR-CON-02.AC.EX1
        - id: FR-CON-02.EX2
          title: The published concept version changed
          fromStep: FR-CON-02.MAIN.S4
          condition: The published concept version changed
          steps:
            - id: FR-CON-02.EX2.S1
              actor: learner
              request: Resume the older study context
              systemResponse: Explain retained progress and the new version; offer an explicit transition
              businessEffect: No old assessment is silently relabeled as evidence for new content.
              acceptanceRefs:
                - FR-CON-02.AC.EX2
          resume:
            type: end
            outcome: No old assessment is silently relabeled as evidence for new content.
          postconditions:
            - No old assessment is silently relabeled as evidence for new content.
          continuation: This flow instance ends with the stated outcome. A permitted correction, status lookup
            or deliberate new request follows the response and current policy; it does not imply a
            successful main outcome.
          acceptanceRefs:
            - FR-CON-02.AC.EX2
      postconditions:
        success:
          - The current study context names the concept and version.
          - Viewing content records only applicable reading/activity progress.
          - Practice evidence is distinct from sections merely viewed.
          - The learner can continue without converting reading into mastery.
          - The selected activity retains its concept context.
        failure:
          - Only effects explicitly completed before the branch remain, with their original
            attribution.
          - No rejected or unresolved operation is presented as the successful main outcome.
          - No practice completion is recorded for an activity that did not run.
          - No old assessment is silently relabeled as evidence for new content.
      acceptanceCriteria:
        - id: FR-CON-02.AC.M1
          flowRef: FR-CON-02.MAIN
          stepRefs:
            - FR-CON-02.MAIN.S1
          given:
            - The selected published content and applicable content-access rules are identifiable.
            - Each protected step checks the acting identity, current resource/action/audience
              rights and any applicable entitlement.
            - Policy-dependent effects run only with the relevant approved policy; unresolved values
              remain explicit decision dependencies and do not block writing/reviewing this draft.
          when: Open an available concept version
          then:
            - Show outcomes, prerequisites and the ordered lesson sections
            - The current study context names the concept and version.
        - id: FR-CON-02.AC.M2
          flowRef: FR-CON-02.MAIN
          stepRefs:
            - FR-CON-02.MAIN.S2
          given:
            - The previous main-flow step FR-CON-02.MAIN.S1 completed with its stated result.
            - Each protected step checks the acting identity, current resource/action/audience
              rights and any applicable entitlement.
            - Policy-dependent effects run only with the relevant approved policy; unresolved values
              remain explicit decision dependencies and do not block writing/reviewing this draft.
          when: Read explanations and inspect diagrams, simulations and source examples
          then:
            - Present each section in its own learning role with source context
            - Viewing content records only applicable reading/activity progress.
        - id: FR-CON-02.AC.M3
          flowRef: FR-CON-02.MAIN
          stepRefs:
            - FR-CON-02.MAIN.S3
          given:
            - The previous main-flow step FR-CON-02.MAIN.S2 completed with its stated result.
            - Each protected step checks the acting identity, current resource/action/audience
              rights and any applicable entitlement.
            - Policy-dependent effects run only with the relevant approved policy; unresolved values
              remain explicit decision dependencies and do not block writing/reviewing this draft.
          when: Perform an embedded prediction or practice activity
          then:
            - Capture the learner response and show the corresponding explanation or result
            - Practice evidence is distinct from sections merely viewed.
        - id: FR-CON-02.AC.M4
          flowRef: FR-CON-02.MAIN
          stepRefs:
            - FR-CON-02.MAIN.S4
          given:
            - The previous main-flow step FR-CON-02.MAIN.S3 completed with its stated result.
            - Each protected step checks the acting identity, current resource/action/audience
              rights and any applicable entitlement.
            - Policy-dependent effects run only with the relevant approved policy; unresolved values
              remain explicit decision dependencies and do not block writing/reviewing this draft.
          when: Leave and return to the concept
          then:
            - Restore the saved position and version context where available
            - The learner can continue without converting reading into mastery.
        - id: FR-CON-02.AC.M5
          flowRef: FR-CON-02.MAIN
          stepRefs:
            - FR-CON-02.MAIN.S5
          given:
            - The previous main-flow step FR-CON-02.MAIN.S4 completed with its stated result.
            - Each protected step checks the acting identity, current resource/action/audience
              rights and any applicable entitlement.
            - Policy-dependent effects run only with the relevant approved policy; unresolved values
              remain explicit decision dependencies and do not block writing/reviewing this draft.
          when: Choose a related challenge or next learning step
          then:
            - Show the linked activity and its prerequisites
            - The selected activity retains its concept context.
        - id: FR-CON-02.AC.ALT1
          flowRef: FR-CON-02.ALT1
          stepRefs:
            - FR-CON-02.ALT1.S1
          given:
            - Execution reaches FR-CON-02.MAIN.S2.
            - An alternate supported language exists
          when: Switch language
          then:
            - Show equivalent content for the chosen available version
            - Concept identity remains shared; language-specific progress behavior is explicit.
            - Continue at FR-CON-02.MAIN.S3 with current authority and reviewed context.
        - id: FR-CON-02.AC.EX1
          flowRef: FR-CON-02.EX1
          stepRefs:
            - FR-CON-02.EX1.S1
          given:
            - Execution reaches FR-CON-02.MAIN.S2.
            - A source example or interactive asset cannot load
          when: Open the affected section
          then:
            - Keep accessible content and identify the unavailable activity
            - No practice completion is recorded for an activity that did not run.
        - id: FR-CON-02.AC.EX2
          flowRef: FR-CON-02.EX2
          stepRefs:
            - FR-CON-02.EX2.S1
          given:
            - Execution reaches FR-CON-02.MAIN.S4.
            - The published concept version changed
          when: Resume the older study context
          then:
            - Explain retained progress and the new version; offer an explicit transition
            - No old assessment is silently relabeled as evidence for new content.
      nonFunctionalApplication:
        - id: NFR-SEC
          scope: Main flow and every alternative/exception, including re-entry and current-rights checks.
        - id: NFR-PRIV
          scope: Main flow and every alternative/exception, including re-entry and current-rights checks.
        - id: NFR-INTEGRITY
          scope: Main flow and every alternative/exception, including re-entry and current-rights checks.
        - id: NFR-RELIABILITY
          scope: Main flow and every alternative/exception, including re-entry and current-rights checks.
        - id: NFR-REPEAT
          scope: Main flow and every alternative/exception, including re-entry and current-rights checks.
        - id: NFR-LATENCY
          scope: Main flow and every alternative/exception, including re-entry and current-rights checks.
        - id: NFR-USABILITY
          scope: Main flow and every alternative/exception, including re-entry and current-rights checks.
        - id: NFR-LANGUAGE
          scope: Main flow and every alternative/exception, including re-entry and current-rights checks.
        - id: NFR-AUDIT
          scope: Main flow and every alternative/exception, including re-entry and current-rights checks.
      designHandoff: SDS must map these requirement/flow/step IDs to actual entry points, boundaries, data
        operations, failure paths and verification evidence. This SRS chooses no monolith,
        microservice, source file, queue or database design.
      featureOwner: concepts
      ownership: Defined once in this feature. Other features reference the stable
        requirement/data/journey ID and current Work node ID.
      authorityRefs:
        - artifact: SRC-BUSINESS
          sections:
            - "4.1"
        - artifact: SRC-BRIEF
          sections:
            - "4"
            - "5"
            - "6"
            - "7"
      trigger: Open an available concept version

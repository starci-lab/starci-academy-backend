extensions:
  work3:
    srs:
      schema: starci/srs-business-rule@1
      status: draft
      authority: proposed-detail-from-accepted-product-scope
      id: BR-CONCEPT
      title: Concept identity and composition
      statements:
        - A Concept is a reusable learning unit; a category classifies it and a learning path
          sequences learning toward a goal.
        - Structured content includes teaching, visual/interactive explanation, source/example,
          practice and assessment roles as applicable; missing required parts are explicit.
        - The seven target categories are Backend, Frontend, Testing, DevOps, Cloud, AI Harness and
          System Design; one Concept may be reused across them.
      decisionRefs: []
      example: Two paths link the same Concept identity without cloning its competency evidence.
      acceptanceCriteria:
        - id: BR-CONCEPT.AC1
          given: A feature reaches a condition governed by this rule.
          when: The governed business outcome is produced or inspected.
          then: A Concept is a reusable learning unit; a category classifies it and a learning path sequences
            learning toward a goal.
        - id: BR-CONCEPT.AC2
          given: A feature reaches a condition governed by this rule.
          when: The governed business outcome is produced or inspected.
          then: Structured content includes teaching, visual/interactive explanation, source/example, practice
            and assessment roles as applicable; missing required parts are explicit.
        - id: BR-CONCEPT.AC3
          given: A feature reaches a condition governed by this rule.
          when: The governed business outcome is produced or inspected.
          then: The seven target categories are Backend, Frontend, Testing, DevOps, Cloud, AI Harness and
            System Design; one Concept may be reused across them.
      featureOwner: concepts
      ownership: Defined once in this feature. Other features reference the stable
        requirement/data/journey ID and current Work node ID.

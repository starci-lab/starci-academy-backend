schema: work/node@2
id: starci-next.business.srs.data.submission
kind: business
required: true
state: todo
description: Versioned learner attempt
refs:
  - starci-next.business.srs.business-rules.policy-decisions.evaluation-and-recognition
  - starci-next.business.srs.business-rules.policy-decisions.failed-ai-usage
extensions:
  work3:
    srs:
      schema: starci/srs-data-definition@1
      status: draft
      authority: proposed-detail-from-accepted-product-scope
      id: DATA-submission
      title: Versioned learner attempt
      modelLevel: Proposed logical business contract; physical storage, indexes and APIs belong to SDS.
      owner: learner
      fields:
        - name: id
          meaning: Stable logical record identity
          validation: Required, unique and not changed by a state transition
          classification: context-scoped
        - name: version
          meaning: Record/content revision used for attribution and confirmation
          validation: Identify the reviewed version; changed content must not impersonate an earlier revision
          classification: context-scoped
        - name: taskVersion
          meaning: Assessment or project milestone being answered
          validation: Required exact target version
          classification: private
        - name: payload
          meaning: Answer, code or selected artifact references
          validation: Validate required form, permitted type and ownership; safety/size limits require
            approved policy
          classification: private
        - name: parentAttempt
          meaning: Earlier version being improved
          validation: Optional existing owned attempt; cannot point to itself
          classification: private
        - name: assistanceUsed
          meaning: Hint/solution context
          validation: Record actual assistance without inventing independent mastery
          classification: private
      relations:
        - dataRef: DATA-assessment
          meaning: Referenced business identity/version; lookup never grants access by itself.
        - dataRef: DATA-project
          meaning: Referenced business identity/version; lookup never grants access by itself.
        - dataRef: DATA-evidence
          meaning: Referenced business identity/version; lookup never grants access by itself.
        - dataRef: DATA-review
          meaning: Referenced business identity/version; lookup never grants access by itself.
        - dataRef: DATA-test-result
          meaning: Referenced business identity/version; lookup never grants access by itself.
      states:
        - draft
        - submitted
        - evaluation-pending
        - evaluated
        - needs-input
      transitions:
        - id: DATA-submission.T1
          from: draft
          to: submitted
          event: Confirm attempt
          guard: Required input and current submission authority validated
        - id: DATA-submission.T2
          from: submitted
          to: evaluation-pending
          event: Accept evaluation request
          guard: Evaluation method and versions identified
        - id: DATA-submission.T3
          from: submitted
          to: needs-input
          event: Detect insufficient evidence
          guard: Specific missing fields explained
        - id: DATA-submission.T4
          from: evaluation-pending
          to: evaluated
          event: Evaluation completed
          guard: Result provenance available
        - id: DATA-submission.T5
          from: needs-input
          to: submitted
          event: Submit corrected new revision
          guard: Keep earlier attempt and feedback lineage
      invariants:
        - Submitting again intentionally creates a distinct revision; repeating the same delivery
          does not.
        - Processing failure does not delete the accepted submission.
      decisionRefs:
        - D05
        - D07
      privacy:
        access: Apply current owner, role, resource and audience grants. A selected-public field is exposed
          only after authorized publication.
        retention: D08 selects retention/export/closure behavior. No storage duration or automatic deletion
          policy is inferred.
        referenceWithdrawal: Preserve permitted provenance while preventing newly unauthorized source
          access; retained snapshots require approved D08 purpose and scope.
      validationCases:
        - given: An actor without current rights references this submission.
          when: Read or mutate the record.
          then: Deny the unauthorized action without disclosing restricted fields.
        - given: A record in a declared state and an attributed authorized event.
          when: Apply a listed transition.
          then: Require its guard, retain the prior version attribution and reject a transition unsupported by
            policy.
      featureOwner: challenges
      ownership: Defined once in this feature. Other features reference the stable
        requirement/data/journey ID and current Work node ID.

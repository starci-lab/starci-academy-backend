schema: work/node@2
id: starci-next.business.srs.data.test-result
kind: business
required: true
state: todo
description: Objective execution result
refs:
  - starci-next.business.srs.business-rules.policy-decisions.evaluation-and-recognition
  - starci-next.business.srs.business-rules.policy-decisions.delivery-and-service-targets
extensions:
  work3:
    srs:
      schema: starci/srs-data-definition@1
      status: draft
      authority: proposed-detail-from-accepted-product-scope
      id: DATA-test-result
      title: Objective execution result
      modelLevel: Proposed logical business contract; physical storage, indexes and APIs belong to SDS.
      owner: learner evidence owner; assessment execution capability
      fields:
        - name: id
          meaning: Stable logical record identity
          validation: Required, unique and not changed by a state transition
          classification: context-scoped
        - name: version
          meaning: Record/content revision used for attribution and confirmation
          validation: Identify the reviewed version; changed content must not impersonate an earlier revision
          classification: context-scoped
        - name: submissionVersion
          meaning: Exact executed attempt
          validation: Required; no substitution after execution
          classification: private
        - name: testDefinition
          meaning: Check and environment definition version
          validation: Required provenance for result interpretation
          classification: restricted
        - name: outcomes
          meaning: Passed, failed and unexecuted checks
          validation: Actual execution only; infrastructure errors separate
          classification: private
        - name: failureClass
          meaning: Learner output versus unavailable/unsafe execution
          validation: Required classification for incomplete execution
          classification: private
      relations:
        - dataRef: DATA-submission
          meaning: Referenced business identity/version; lookup never grants access by itself.
        - dataRef: DATA-assessment
          meaning: Referenced business identity/version; lookup never grants access by itself.
      states:
        - pending
        - running
        - completed
        - process-failed
        - rejected-input
      transitions:
        - id: DATA-test-result.T1
          from: pending
          to: running
          event: Begin permitted execution
          guard: Input and assessment context valid
        - id: DATA-test-result.T2
          from: pending
          to: rejected-input
          event: Detect invalid/unsafe input
          guard: Explain input rejection without fabricated grade
        - id: DATA-test-result.T3
          from: running
          to: completed
          event: Execution returns actual check results
          guard: Exact source and test versions recorded
        - id: DATA-test-result.T4
          from: running
          to: process-failed
          event: Execution unavailable or interrupted
          guard: No invented test pass/fail
      invariants:
        - AI feedback cannot mutate actual execution evidence.
        - Untrusted code cannot obtain other learners data or platform secrets.
      decisionRefs:
        - D05
        - D12
      privacy:
        access: Apply current owner, role, resource and audience grants. A selected-public field is exposed
          only after authorized publication.
        retention: D08 selects retention/export/closure behavior. No storage duration or automatic deletion
          policy is inferred.
        referenceWithdrawal: Preserve permitted provenance while preventing newly unauthorized source
          access; retained snapshots require approved D08 purpose and scope.
      validationCases:
        - given: An actor without current rights references this test-result.
          when: Read or mutate the record.
          then: Deny the unauthorized action without disclosing restricted fields.
        - given: A record in a declared state and an attributed authorized event.
          when: Apply a listed transition.
          then: Require its guard, retain the prior version attribution and reject a transition unsupported by
            policy.
      featureOwner: challenges
      ownership: Defined once in this feature. Other features reference the stable
        requirement/data/journey ID and current Work node ID.

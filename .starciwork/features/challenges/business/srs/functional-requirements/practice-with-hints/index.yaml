extensions:
  work3:
    srs:
      schema: starci/srs-functional-requirement@1
      status: draft
      authority: proposed-detail-from-accepted-product-scope
      id: FR-CH-01
      title: Start a challenge and choose incremental assistance
      domain: challenges
      goal: Start a challenge and choose incremental assistance
      priority: release-priority-awaits-D01
      actors:
        - learner
      preconditions:
        - A versioned challenge, criteria and permitted assistance policy are identifiable.
        - Each protected step checks the acting identity, current resource/action/audience rights
          and any applicable entitlement.
        - Policy-dependent effects run only with the relevant approved policy; unresolved values
          remain explicit decision dependencies and do not block writing/reviewing this draft.
      inputs:
        - id: FR-CH-01.IN1
          name: challengeVersion
          validation: Selected task, prerequisites and assistance policy
          dataRefs:
            - DATA-assessment
            - DATA-submission
            - DATA-entitlement
        - id: FR-CH-01.IN2
          name: draftAndHintChoice
          validation: Learner answer/code and explicitly chosen assistance depth
          dataRefs:
            - DATA-assessment
            - DATA-submission
            - DATA-entitlement
      outputs:
        - name: result-1
          fromStep: FR-CH-01.MAIN.S1
          meaning: Show the objective, inputs, expected outputs, rubric and prerequisites
          effect: The learner sees the challenge version and available assistance.
        - name: result-2
          fromStep: FR-CH-01.MAIN.S2
          meaning: Keep a learner-owned draft
          effect: The attempt is not complete merely because it was opened.
        - name: result-3
          fromStep: FR-CH-01.MAIN.S3
          meaning: Reveal the chosen incremental assistance and preserve room for an independent attempt
          effect: Assistance used is recorded as context.
        - name: result-4
          fromStep: FR-CH-01.MAIN.S4
          meaning: Preserve the current answer and route to the applicable evaluation
          effect: Evaluation uses the challenge and rubric versions shown.
      businessRuleRefs:
        - BR-HINTS
        - BR-VERSION
        - BR-RIGHTS
      dataRefs:
        - DATA-assessment
        - DATA-submission
        - DATA-entitlement
      nonFunctionalRefs:
        - NFR-SEC
        - NFR-PRIV
        - NFR-AI
        - NFR-INTEGRITY
        - NFR-RELIABILITY
        - NFR-REPEAT
        - NFR-LATENCY
        - NFR-USABILITY
        - NFR-COST
        - NFR-AUDIT
        - NFR-SUBMISSION
      decisionRefs:
        - D05
        - D08
        - D11
        - D06
        - D07
        - D03
        - D12
        - D02
      directPolicyRefs:
        - D05
      decisionTreatment: Direct policy refs affect the named feature behavior; inherited refs govern
        cross-cutting rules and measurement targets. Open policies are not selected by this draft.
      mainFlow:
        id: FR-CH-01.MAIN
        trigger: Open a concept or code challenge
        steps:
          - id: FR-CH-01.MAIN.S1
            actor: learner
            request: Open a concept or code challenge
            systemResponse: Show the objective, inputs, expected outputs, rubric and prerequisites
            businessEffect: The learner sees the challenge version and available assistance.
            acceptanceRefs:
              - FR-CH-01.AC.M1
          - id: FR-CH-01.MAIN.S2
            actor: learner
            request: Start working on an answer or code
            systemResponse: Keep a learner-owned draft
            businessEffect: The attempt is not complete merely because it was opened.
            acceptanceRefs:
              - FR-CH-01.AC.M2
          - id: FR-CH-01.MAIN.S3
            actor: learner
            request: Request a hint if needed
            systemResponse: Reveal the chosen incremental assistance and preserve room for an independent attempt
            businessEffect: Assistance used is recorded as context.
            acceptanceRefs:
              - FR-CH-01.AC.M3
          - id: FR-CH-01.MAIN.S4
            actor: learner
            request: Choose to continue or submit
            systemResponse: Preserve the current answer and route to the applicable evaluation
            businessEffect: Evaluation uses the challenge and rubric versions shown.
            acceptanceRefs:
              - FR-CH-01.AC.M4
        end:
          type: completed-main-flow
          outcome: Evaluation uses the challenge and rubric versions shown.
      alternativeFlows:
        - id: FR-CH-01.ALT1
          title: The learner explicitly chooses to view the solution
          fromStep: FR-CH-01.MAIN.S3
          condition: The learner explicitly chooses to view the solution
          steps:
            - id: FR-CH-01.ALT1.S1
              actor: learner
              request: Confirm the request to view the solution
              systemResponse: Show it according to the activity policy
              businessEffect: Record solution use separately from independently demonstrated performance.
              acceptanceRefs:
                - FR-CH-01.AC.ALT1
          resume:
            type: end
            outcome: Record solution use separately from independently demonstrated performance.
          postconditions:
            - Record solution use separately from independently demonstrated performance.
          continuation: This flow instance ends with the stated outcome. A permitted correction, status lookup
            or deliberate new request follows the response and current policy; it does not imply a
            successful main outcome.
          acceptanceRefs:
            - FR-CH-01.AC.ALT1
      exceptionFlows:
        - id: FR-CH-01.EX1
          title: The selected challenge is unavailable or outside entitlement
          fromStep: FR-CH-01.MAIN.S1
          condition: The selected challenge is unavailable or outside entitlement
          steps:
            - id: FR-CH-01.EX1.S1
              actor: learner
              request: Open the challenge
              systemResponse: Explain the access/unavailability state
              businessEffect: No protected prompt or solution disclosure.
              acceptanceRefs:
                - FR-CH-01.AC.EX1
          resume:
            type: end
            outcome: No protected prompt or solution disclosure.
          postconditions:
            - No protected prompt or solution disclosure.
          continuation: This flow instance ends with the stated outcome. A permitted correction, status lookup
            or deliberate new request follows the response and current policy; it does not imply a
            successful main outcome.
          acceptanceRefs:
            - FR-CH-01.AC.EX1
        - id: FR-CH-01.EX2
          title: The task definition changed during the attempt
          fromStep: FR-CH-01.MAIN.S4
          condition: The task definition changed during the attempt
          steps:
            - id: FR-CH-01.EX2.S1
              actor: learner
              request: Submit against the original version
              systemResponse: Explain applicable version policy and retain the draft
              businessEffect: No hidden rubric substitution; unresolved migration policy is surfaced.
              acceptanceRefs:
                - FR-CH-01.AC.EX2
          resume:
            type: end
            outcome: No hidden rubric substitution; unresolved migration policy is surfaced.
          postconditions:
            - No hidden rubric substitution; unresolved migration policy is surfaced.
          continuation: This flow instance ends with the stated outcome. A permitted correction, status lookup
            or deliberate new request follows the response and current policy; it does not imply a
            successful main outcome.
          acceptanceRefs:
            - FR-CH-01.AC.EX2
      postconditions:
        success:
          - The learner sees the challenge version and available assistance.
          - The attempt is not complete merely because it was opened.
          - Assistance used is recorded as context.
          - Evaluation uses the challenge and rubric versions shown.
        failure:
          - Only effects explicitly completed before the branch remain, with their original
            attribution.
          - No rejected or unresolved operation is presented as the successful main outcome.
          - No protected prompt or solution disclosure.
          - No hidden rubric substitution; unresolved migration policy is surfaced.
      acceptanceCriteria:
        - id: FR-CH-01.AC.M1
          flowRef: FR-CH-01.MAIN
          stepRefs:
            - FR-CH-01.MAIN.S1
          given:
            - A versioned challenge, criteria and permitted assistance policy are identifiable.
            - Each protected step checks the acting identity, current resource/action/audience
              rights and any applicable entitlement.
            - Policy-dependent effects run only with the relevant approved policy; unresolved values
              remain explicit decision dependencies and do not block writing/reviewing this draft.
          when: Open a concept or code challenge
          then:
            - Show the objective, inputs, expected outputs, rubric and prerequisites
            - The learner sees the challenge version and available assistance.
        - id: FR-CH-01.AC.M2
          flowRef: FR-CH-01.MAIN
          stepRefs:
            - FR-CH-01.MAIN.S2
          given:
            - The previous main-flow step FR-CH-01.MAIN.S1 completed with its stated result.
            - Each protected step checks the acting identity, current resource/action/audience
              rights and any applicable entitlement.
            - Policy-dependent effects run only with the relevant approved policy; unresolved values
              remain explicit decision dependencies and do not block writing/reviewing this draft.
          when: Start working on an answer or code
          then:
            - Keep a learner-owned draft
            - The attempt is not complete merely because it was opened.
        - id: FR-CH-01.AC.M3
          flowRef: FR-CH-01.MAIN
          stepRefs:
            - FR-CH-01.MAIN.S3
          given:
            - The previous main-flow step FR-CH-01.MAIN.S2 completed with its stated result.
            - Each protected step checks the acting identity, current resource/action/audience
              rights and any applicable entitlement.
            - Policy-dependent effects run only with the relevant approved policy; unresolved values
              remain explicit decision dependencies and do not block writing/reviewing this draft.
          when: Request a hint if needed
          then:
            - Reveal the chosen incremental assistance and preserve room for an independent attempt
            - Assistance used is recorded as context.
        - id: FR-CH-01.AC.M4
          flowRef: FR-CH-01.MAIN
          stepRefs:
            - FR-CH-01.MAIN.S4
          given:
            - The previous main-flow step FR-CH-01.MAIN.S3 completed with its stated result.
            - Each protected step checks the acting identity, current resource/action/audience
              rights and any applicable entitlement.
            - Policy-dependent effects run only with the relevant approved policy; unresolved values
              remain explicit decision dependencies and do not block writing/reviewing this draft.
          when: Choose to continue or submit
          then:
            - Preserve the current answer and route to the applicable evaluation
            - Evaluation uses the challenge and rubric versions shown.
        - id: FR-CH-01.AC.ALT1
          flowRef: FR-CH-01.ALT1
          stepRefs:
            - FR-CH-01.ALT1.S1
          given:
            - Execution reaches FR-CH-01.MAIN.S3.
            - The learner explicitly chooses to view the solution
          when: Confirm the request to view the solution
          then:
            - Show it according to the activity policy
            - Record solution use separately from independently demonstrated performance.
        - id: FR-CH-01.AC.EX1
          flowRef: FR-CH-01.EX1
          stepRefs:
            - FR-CH-01.EX1.S1
          given:
            - Execution reaches FR-CH-01.MAIN.S1.
            - The selected challenge is unavailable or outside entitlement
          when: Open the challenge
          then:
            - Explain the access/unavailability state
            - No protected prompt or solution disclosure.
        - id: FR-CH-01.AC.EX2
          flowRef: FR-CH-01.EX2
          stepRefs:
            - FR-CH-01.EX2.S1
          given:
            - Execution reaches FR-CH-01.MAIN.S4.
            - The task definition changed during the attempt
          when: Submit against the original version
          then:
            - Explain applicable version policy and retain the draft
            - No hidden rubric substitution; unresolved migration policy is surfaced.
      nonFunctionalApplication:
        - id: NFR-SEC
          scope: Main flow and every alternative/exception, including re-entry and current-rights checks.
        - id: NFR-PRIV
          scope: Main flow and every alternative/exception, including re-entry and current-rights checks.
        - id: NFR-AI
          scope: Main flow and every alternative/exception, including re-entry and current-rights checks.
        - id: NFR-INTEGRITY
          scope: Main flow and every alternative/exception, including re-entry and current-rights checks.
        - id: NFR-RELIABILITY
          scope: Main flow and every alternative/exception, including re-entry and current-rights checks.
        - id: NFR-REPEAT
          scope: Main flow and every alternative/exception, including re-entry and current-rights checks.
        - id: NFR-LATENCY
          scope: Main flow and every alternative/exception, including re-entry and current-rights checks.
        - id: NFR-USABILITY
          scope: Main flow and every alternative/exception, including re-entry and current-rights checks.
        - id: NFR-COST
          scope: Main flow and every alternative/exception, including re-entry and current-rights checks.
        - id: NFR-AUDIT
          scope: Main flow and every alternative/exception, including re-entry and current-rights checks.
        - id: NFR-SUBMISSION
          scope: Main flow and every alternative/exception, including re-entry and current-rights checks.
      designHandoff: SDS must map these requirement/flow/step IDs to actual entry points, boundaries, data
        operations, failure paths and verification evidence. This SRS chooses no monolith,
        microservice, source file, queue or database design.
      featureOwner: challenges
      ownership: Defined once in this feature. Other features reference the stable
        requirement/data/journey ID and current Work node ID.
      authorityRefs:
        - artifact: SRC-BUSINESS
          sections:
            - "6"
        - artifact: SRC-BRIEF
          sections:
            - "4"
            - "5"
            - "6"
            - "7"
      trigger: Open a concept or code challenge

extensions:
  work3:
    srs:
      schema: starci/srs-functional-requirement@1
      status: draft
      authority: proposed-detail-from-accepted-product-scope
      id: FR-CH-03
      title: Revise a challenge solution and compare attempts
      domain: challenges
      goal: Revise a challenge solution and compare attempts
      priority: release-priority-awaits-D01
      actors:
        - learner
      preconditions:
        - A versioned challenge, criteria and permitted assistance policy are identifiable.
        - Each protected step checks the acting identity, current resource/action/audience rights
          and any applicable entitlement.
        - Policy-dependent effects run only with the relevant approved policy; unresolved values
          remain explicit decision dependencies and do not block writing/reviewing this draft.
      inputs:
        - id: FR-CH-03.IN1
          name: priorAttempt
          validation: Owned attempt and its actual result
          dataRefs:
            - DATA-submission
            - DATA-review
            - DATA-test-result
            - DATA-progress
        - id: FR-CH-03.IN2
          name: newRevision
          validation: Edited solution and deliberate new submission choice
          dataRefs:
            - DATA-submission
            - DATA-review
            - DATA-test-result
            - DATA-progress
      outputs:
        - name: result-1
          fromStep: FR-CH-03.MAIN.S1
          meaning: Show the exact submitted source, results and feedback
          effect: Historical evidence remains attributable.
        - name: result-2
          fromStep: FR-CH-03.MAIN.S2
          meaning: Keep the old revision intact and show the new draft
          effect: The draft has no inherited passing result.
        - name: result-3
          fromStep: FR-CH-03.MAIN.S3
          meaning: Create a distinct revision linked to the earlier attempt
          effect: Current retry and usage rules apply.
        - name: result-4
          fromStep: FR-CH-03.MAIN.S4
          meaning: Show which prior issues are resolved, remain or cannot be compared
          effect: Progress changes only from applicable current evidence.
      businessRuleRefs:
        - BR-EVIDENCE
        - BR-MASTERY
        - BR-REPEAT
      dataRefs:
        - DATA-submission
        - DATA-review
        - DATA-test-result
        - DATA-progress
      nonFunctionalRefs:
        - NFR-SEC
        - NFR-PRIV
        - NFR-AI
        - NFR-INTEGRITY
        - NFR-RELIABILITY
        - NFR-REPEAT
        - NFR-LATENCY
        - NFR-USABILITY
        - NFR-COST
        - NFR-AUDIT
        - NFR-SUBMISSION
      decisionRefs:
        - D05
        - D07
        - D03
        - D08
        - D11
        - D06
        - D12
        - D02
      directPolicyRefs:
        - D05
        - D07
      decisionTreatment: Direct policy refs affect the named feature behavior; inherited refs govern
        cross-cutting rules and measurement targets. Open policies are not selected by this draft.
      mainFlow:
        id: FR-CH-03.MAIN
        trigger: Open a previous evaluation
        steps:
          - id: FR-CH-03.MAIN.S1
            actor: learner
            request: Open a previous evaluation
            systemResponse: Show the exact submitted source, results and feedback
            businessEffect: Historical evidence remains attributable.
            acceptanceRefs:
              - FR-CH-03.AC.M1
          - id: FR-CH-03.MAIN.S2
            actor: learner
            request: Edit a new solution revision
            systemResponse: Keep the old revision intact and show the new draft
            businessEffect: The draft has no inherited passing result.
            acceptanceRefs:
              - FR-CH-03.AC.M2
          - id: FR-CH-03.MAIN.S3
            actor: learner
            request: Submit the revision for permitted evaluation
            systemResponse: Create a distinct revision linked to the earlier attempt
            businessEffect: Current retry and usage rules apply.
            acceptanceRefs:
              - FR-CH-03.AC.M3
          - id: FR-CH-03.MAIN.S4
            actor: learner
            request: Compare old and new results
            systemResponse: Show which prior issues are resolved, remain or cannot be compared
            businessEffect: Progress changes only from applicable current evidence.
            acceptanceRefs:
              - FR-CH-03.AC.M4
        end:
          type: completed-main-flow
          outcome: Progress changes only from applicable current evidence.
      alternativeFlows:
        - id: FR-CH-03.ALT1
          title: The learner decides not to submit the draft
          fromStep: FR-CH-03.MAIN.S2
          condition: The learner decides not to submit the draft
          steps:
            - id: FR-CH-03.ALT1.S1
              actor: learner
              request: Keep or discard the draft
              systemResponse: Return to the historical attempt
              businessEffect: No new completed assessment.
              acceptanceRefs:
                - FR-CH-03.AC.ALT1
          resume:
            type: end
            outcome: No new completed assessment.
          postconditions:
            - No new completed assessment.
          continuation: This flow instance ends with the stated outcome. A permitted correction, status lookup
            or deliberate new request follows the response and current policy; it does not imply a
            successful main outcome.
          acceptanceRefs:
            - FR-CH-03.AC.ALT1
      exceptionFlows:
        - id: FR-CH-03.EX1
          title: The rubric or challenge changed between attempts
          fromStep: FR-CH-03.MAIN.S4
          condition: The rubric or challenge changed between attempts
          steps:
            - id: FR-CH-03.EX1.S1
              actor: learner
              request: Compare results
              systemResponse: Label the changed criteria and limits of comparison
              businessEffect: No false score equivalence across incompatible rubrics.
              acceptanceRefs:
                - FR-CH-03.AC.EX1
          resume:
            type: end
            outcome: No false score equivalence across incompatible rubrics.
          postconditions:
            - No false score equivalence across incompatible rubrics.
          continuation: This flow instance ends with the stated outcome. A permitted correction, status lookup
            or deliberate new request follows the response and current policy; it does not imply a
            successful main outcome.
          acceptanceRefs:
            - FR-CH-03.AC.EX1
        - id: FR-CH-03.EX2
          title: The evaluation result is delayed or response is lost
          fromStep: FR-CH-03.MAIN.S3
          condition: The evaluation result is delayed or response is lost
          steps:
            - id: FR-CH-03.EX2.S1
              actor: learner
              request: Inspect the same revision status
              systemResponse: Show pending/unresolved and the permitted continuation
              businessEffect: No new revision is created merely to recover a result.
              acceptanceRefs:
                - FR-CH-03.AC.EX2
          resume:
            type: end
            outcome: No new revision is created merely to recover a result.
          postconditions:
            - No new revision is created merely to recover a result.
          continuation: This flow instance ends with the stated outcome. A permitted correction, status lookup
            or deliberate new request follows the response and current policy; it does not imply a
            successful main outcome.
          acceptanceRefs:
            - FR-CH-03.AC.EX2
      postconditions:
        success:
          - Historical evidence remains attributable.
          - The draft has no inherited passing result.
          - Current retry and usage rules apply.
          - Progress changes only from applicable current evidence.
        failure:
          - Only effects explicitly completed before the branch remain, with their original
            attribution.
          - No rejected or unresolved operation is presented as the successful main outcome.
          - No false score equivalence across incompatible rubrics.
          - No new revision is created merely to recover a result.
      acceptanceCriteria:
        - id: FR-CH-03.AC.M1
          flowRef: FR-CH-03.MAIN
          stepRefs:
            - FR-CH-03.MAIN.S1
          given:
            - A versioned challenge, criteria and permitted assistance policy are identifiable.
            - Each protected step checks the acting identity, current resource/action/audience
              rights and any applicable entitlement.
            - Policy-dependent effects run only with the relevant approved policy; unresolved values
              remain explicit decision dependencies and do not block writing/reviewing this draft.
          when: Open a previous evaluation
          then:
            - Show the exact submitted source, results and feedback
            - Historical evidence remains attributable.
        - id: FR-CH-03.AC.M2
          flowRef: FR-CH-03.MAIN
          stepRefs:
            - FR-CH-03.MAIN.S2
          given:
            - The previous main-flow step FR-CH-03.MAIN.S1 completed with its stated result.
            - Each protected step checks the acting identity, current resource/action/audience
              rights and any applicable entitlement.
            - Policy-dependent effects run only with the relevant approved policy; unresolved values
              remain explicit decision dependencies and do not block writing/reviewing this draft.
          when: Edit a new solution revision
          then:
            - Keep the old revision intact and show the new draft
            - The draft has no inherited passing result.
        - id: FR-CH-03.AC.M3
          flowRef: FR-CH-03.MAIN
          stepRefs:
            - FR-CH-03.MAIN.S3
          given:
            - The previous main-flow step FR-CH-03.MAIN.S2 completed with its stated result.
            - Each protected step checks the acting identity, current resource/action/audience
              rights and any applicable entitlement.
            - Policy-dependent effects run only with the relevant approved policy; unresolved values
              remain explicit decision dependencies and do not block writing/reviewing this draft.
          when: Submit the revision for permitted evaluation
          then:
            - Create a distinct revision linked to the earlier attempt
            - Current retry and usage rules apply.
        - id: FR-CH-03.AC.M4
          flowRef: FR-CH-03.MAIN
          stepRefs:
            - FR-CH-03.MAIN.S4
          given:
            - The previous main-flow step FR-CH-03.MAIN.S3 completed with its stated result.
            - Each protected step checks the acting identity, current resource/action/audience
              rights and any applicable entitlement.
            - Policy-dependent effects run only with the relevant approved policy; unresolved values
              remain explicit decision dependencies and do not block writing/reviewing this draft.
          when: Compare old and new results
          then:
            - Show which prior issues are resolved, remain or cannot be compared
            - Progress changes only from applicable current evidence.
        - id: FR-CH-03.AC.ALT1
          flowRef: FR-CH-03.ALT1
          stepRefs:
            - FR-CH-03.ALT1.S1
          given:
            - Execution reaches FR-CH-03.MAIN.S2.
            - The learner decides not to submit the draft
          when: Keep or discard the draft
          then:
            - Return to the historical attempt
            - No new completed assessment.
        - id: FR-CH-03.AC.EX1
          flowRef: FR-CH-03.EX1
          stepRefs:
            - FR-CH-03.EX1.S1
          given:
            - Execution reaches FR-CH-03.MAIN.S4.
            - The rubric or challenge changed between attempts
          when: Compare results
          then:
            - Label the changed criteria and limits of comparison
            - No false score equivalence across incompatible rubrics.
        - id: FR-CH-03.AC.EX2
          flowRef: FR-CH-03.EX2
          stepRefs:
            - FR-CH-03.EX2.S1
          given:
            - Execution reaches FR-CH-03.MAIN.S3.
            - The evaluation result is delayed or response is lost
          when: Inspect the same revision status
          then:
            - Show pending/unresolved and the permitted continuation
            - No new revision is created merely to recover a result.
      nonFunctionalApplication:
        - id: NFR-SEC
          scope: Main flow and every alternative/exception, including re-entry and current-rights checks.
        - id: NFR-PRIV
          scope: Main flow and every alternative/exception, including re-entry and current-rights checks.
        - id: NFR-AI
          scope: Main flow and every alternative/exception, including re-entry and current-rights checks.
        - id: NFR-INTEGRITY
          scope: Main flow and every alternative/exception, including re-entry and current-rights checks.
        - id: NFR-RELIABILITY
          scope: Main flow and every alternative/exception, including re-entry and current-rights checks.
        - id: NFR-REPEAT
          scope: Main flow and every alternative/exception, including re-entry and current-rights checks.
        - id: NFR-LATENCY
          scope: Main flow and every alternative/exception, including re-entry and current-rights checks.
        - id: NFR-USABILITY
          scope: Main flow and every alternative/exception, including re-entry and current-rights checks.
        - id: NFR-COST
          scope: Main flow and every alternative/exception, including re-entry and current-rights checks.
        - id: NFR-AUDIT
          scope: Main flow and every alternative/exception, including re-entry and current-rights checks.
        - id: NFR-SUBMISSION
          scope: Main flow and every alternative/exception, including re-entry and current-rights checks.

extensions:
  work3:
    srs:
      schema: starci/srs-functional-requirement@1
      status: draft
      authority: proposed-detail-from-accepted-product-scope
      id: FR-CH-02
      title: Submit a versioned solution and inspect its evaluation
      domain: challenges
      goal: Submit a versioned solution and inspect its evaluation
      priority: release-priority-awaits-D01
      actors:
        - learner
      preconditions:
        - A versioned challenge, criteria and permitted assistance policy are identifiable.
        - Each protected step checks the acting identity, current resource/action/audience rights
          and any applicable entitlement.
        - Policy-dependent effects run only with the relevant approved policy; unresolved values
          remain explicit decision dependencies and do not block writing/reviewing this draft.
      inputs:
        - id: FR-CH-02.IN1
          name: solutionRevision
          validation: Complete answer/code under the shown challenge and rubric
          dataRefs:
            - DATA-assessment
            - DATA-submission
            - DATA-test-result
            - DATA-review
            - DATA-usage
        - id: FR-CH-02.IN2
          name: submissionIntent
          validation: Identify the logical request to distinguish retry from a new revision
          dataRefs:
            - DATA-assessment
            - DATA-submission
            - DATA-test-result
            - DATA-review
            - DATA-usage
      outputs:
        - name: result-1
          fromStep: FR-CH-02.MAIN.S1
          meaning: Show the selected challenge/rubric and submission contents
          effect: The learner knows which revision will be evaluated.
        - name: result-2
          fromStep: FR-CH-02.MAIN.S2
          meaning: Record an immutable submission revision and acknowledge evaluation pending
          effect: The accepted submission survives loss of the immediate response.
        - name: result-3
          fromStep: FR-CH-02.MAIN.S3
          meaning: Show queued/running, test result and AI feedback as separate states
          effect: Runner failure is distinct from failed tests.
        - name: result-4
          fromStep: FR-CH-02.MAIN.S4
          meaning: Present actual test outcomes and rubric-based feedback linked to the submission
          effect: AI feedback cannot turn a failed test into pass.
        - name: result-5
          fromStep: FR-CH-02.MAIN.S5
          meaning: Open the related explanation or solution editor
          effect: The prior evaluation remains attached to its original revision.
      businessRuleRefs:
        - BR-EVIDENCE
        - BR-AI
        - BR-REPEAT
        - BR-USAGE
      dataRefs:
        - DATA-assessment
        - DATA-submission
        - DATA-test-result
        - DATA-review
        - DATA-usage
      nonFunctionalRefs:
        - NFR-SEC
        - NFR-PRIV
        - NFR-AI
        - NFR-INTEGRITY
        - NFR-RELIABILITY
        - NFR-REPEAT
        - NFR-LATENCY
        - NFR-USABILITY
        - NFR-COST
        - NFR-AUDIT
        - NFR-SUBMISSION
      decisionRefs:
        - D05
        - D07
        - D06
        - D02
        - D03
        - D08
        - D11
        - D12
      directPolicyRefs:
        - D05
        - D07
      decisionTreatment: Direct policy refs affect the named feature behavior; inherited refs govern
        cross-cutting rules and measurement targets. Open policies are not selected by this draft.
      mainFlow:
        id: FR-CH-02.MAIN
        trigger: Review the challenge and current solution
        steps:
          - id: FR-CH-02.MAIN.S1
            actor: learner
            request: Review the challenge and current solution
            systemResponse: Show the selected challenge/rubric and submission contents
            businessEffect: The learner knows which revision will be evaluated.
            acceptanceRefs:
              - FR-CH-02.AC.M1
          - id: FR-CH-02.MAIN.S2
            actor: learner
            request: Submit the reviewed solution
            systemResponse: Record an immutable submission revision and acknowledge evaluation pending
            businessEffect: The accepted submission survives loss of the immediate response.
            acceptanceRefs:
              - FR-CH-02.AC.M2
          - id: FR-CH-02.MAIN.S3
            actor: learner
            request: Inspect execution and review progress
            systemResponse: Show queued/running, test result and AI feedback as separate states
            businessEffect: Runner failure is distinct from failed tests.
            acceptanceRefs:
              - FR-CH-02.AC.M3
          - id: FR-CH-02.MAIN.S4
            actor: learner
            request: Read the completed evaluation
            systemResponse: Present actual test outcomes and rubric-based feedback linked to the submission
            businessEffect: AI feedback cannot turn a failed test into pass.
            acceptanceRefs:
              - FR-CH-02.AC.M4
          - id: FR-CH-02.MAIN.S5
            actor: learner
            request: Choose a problem to correct
            systemResponse: Open the related explanation or solution editor
            businessEffect: The prior evaluation remains attached to its original revision.
            acceptanceRefs:
              - FR-CH-02.AC.M5
        end:
          type: completed-main-flow
          outcome: The prior evaluation remains attached to its original revision.
      alternativeFlows:
        - id: FR-CH-02.ALT1
          title: The same unchanged submission request is repeated
          fromStep: FR-CH-02.MAIN.S2
          condition: The same unchanged submission request is repeated
          steps:
            - id: FR-CH-02.ALT1.S1
              actor: learner
              request: Look up the original submission request
              systemResponse: Return the existing evaluation reference
              businessEffect: No duplicate logical attempt or accidental additional charge.
              acceptanceRefs:
                - FR-CH-02.AC.ALT1
          resume:
            type: end
            outcome: No duplicate logical attempt or accidental additional charge.
          postconditions:
            - No duplicate logical attempt or accidental additional charge.
          continuation: This flow instance ends with the stated outcome. A permitted correction, status lookup
            or deliberate new request follows the response and current policy; it does not imply a
            successful main outcome.
          acceptanceRefs:
            - FR-CH-02.AC.ALT1
      exceptionFlows:
        - id: FR-CH-02.EX1
          title: Required files or inputs are invalid
          fromStep: FR-CH-02.MAIN.S2
          condition: Required files or inputs are invalid
          steps:
            - id: FR-CH-02.EX1.S1
              actor: learner
              request: Submit the solution
              systemResponse: Identify the invalid submission requirements
              businessEffect: No evaluation represented as complete; retain the editable solution.
              acceptanceRefs:
                - FR-CH-02.AC.EX1
          resume:
            type: end
            outcome: No evaluation represented as complete; retain the editable solution.
          postconditions:
            - No evaluation represented as complete; retain the editable solution.
          continuation: This flow instance ends with the stated outcome. A permitted correction, status lookup
            or deliberate new request follows the response and current policy; it does not imply a
            successful main outcome.
          acceptanceRefs:
            - FR-CH-02.AC.EX1
        - id: FR-CH-02.EX2
          title: Execution infrastructure fails
          fromStep: FR-CH-02.MAIN.S3
          condition: Execution infrastructure fails
          steps:
            - id: FR-CH-02.EX2.S1
              actor: learner
              request: Inspect the evaluation
              systemResponse: Show execution-error/unresolved and permitted retry
              businessEffect: Do not mark learner code incorrect solely due to runner failure.
              acceptanceRefs:
                - FR-CH-02.AC.EX2
          resume:
            type: end
            outcome: Do not mark learner code incorrect solely due to runner failure.
          postconditions:
            - Do not mark learner code incorrect solely due to runner failure.
          continuation: This flow instance ends with the stated outcome. A permitted correction, status lookup
            or deliberate new request follows the response and current policy; it does not imply a
            successful main outcome.
          acceptanceRefs:
            - FR-CH-02.AC.EX2
        - id: FR-CH-02.EX3
          title: AI review fails after tests finish
          fromStep: FR-CH-02.MAIN.S4
          condition: AI review fails after tests finish
          steps:
            - id: FR-CH-02.EX3.S1
              actor: learner
              request: Read the evaluation
              systemResponse: Keep test results visible and show review failure separately
              businessEffect: No loss or reinterpretation of actual execution evidence.
              acceptanceRefs:
                - FR-CH-02.AC.EX3
          resume:
            type: end
            outcome: No loss or reinterpretation of actual execution evidence.
          postconditions:
            - No loss or reinterpretation of actual execution evidence.
          continuation: This flow instance ends with the stated outcome. A permitted correction, status lookup
            or deliberate new request follows the response and current policy; it does not imply a
            successful main outcome.
          acceptanceRefs:
            - FR-CH-02.AC.EX3
        - id: FR-CH-02.EX4
          title: Submitted code attempts unauthorized access or exceeds permitted execution resources
          fromStep: FR-CH-02.MAIN.S3
          condition: Submitted code attempts unauthorized access or exceeds permitted execution resources
          steps:
            - id: FR-CH-02.EX4.S1
              actor: learner
              request: Inspect the evaluation state
              systemResponse: Stop or reject unsafe execution and show a process/input limitation
              businessEffect: No cross-user data, platform secret or uncontrolled external effect; no fabricated
                test result.
              acceptanceRefs:
                - FR-CH-02.AC.EX4
          resume:
            type: end
            outcome: No cross-user data, platform secret or uncontrolled external effect; no fabricated test
              result.
          postconditions:
            - No cross-user data, platform secret or uncontrolled external effect; no fabricated
              test result.
          continuation: This flow instance ends with the stated outcome. A permitted correction, status lookup
            or deliberate new request follows the response and current policy; it does not imply a
            successful main outcome.
          acceptanceRefs:
            - FR-CH-02.AC.EX4
      postconditions:
        success:
          - The learner knows which revision will be evaluated.
          - The accepted submission survives loss of the immediate response.
          - Runner failure is distinct from failed tests.
          - AI feedback cannot turn a failed test into pass.
          - The prior evaluation remains attached to its original revision.
        failure:
          - Only effects explicitly completed before the branch remain, with their original
            attribution.
          - No rejected or unresolved operation is presented as the successful main outcome.
          - No evaluation represented as complete; retain the editable solution.
          - Do not mark learner code incorrect solely due to runner failure.
          - No loss or reinterpretation of actual execution evidence.
          - No cross-user data, platform secret or uncontrolled external effect; no fabricated test
            result.
      acceptanceCriteria:
        - id: FR-CH-02.AC.M1
          flowRef: FR-CH-02.MAIN
          stepRefs:
            - FR-CH-02.MAIN.S1
          given:
            - A versioned challenge, criteria and permitted assistance policy are identifiable.
            - Each protected step checks the acting identity, current resource/action/audience
              rights and any applicable entitlement.
            - Policy-dependent effects run only with the relevant approved policy; unresolved values
              remain explicit decision dependencies and do not block writing/reviewing this draft.
          when: Review the challenge and current solution
          then:
            - Show the selected challenge/rubric and submission contents
            - The learner knows which revision will be evaluated.
        - id: FR-CH-02.AC.M2
          flowRef: FR-CH-02.MAIN
          stepRefs:
            - FR-CH-02.MAIN.S2
          given:
            - The previous main-flow step FR-CH-02.MAIN.S1 completed with its stated result.
            - Each protected step checks the acting identity, current resource/action/audience
              rights and any applicable entitlement.
            - Policy-dependent effects run only with the relevant approved policy; unresolved values
              remain explicit decision dependencies and do not block writing/reviewing this draft.
          when: Submit the reviewed solution
          then:
            - Record an immutable submission revision and acknowledge evaluation pending
            - The accepted submission survives loss of the immediate response.
        - id: FR-CH-02.AC.M3
          flowRef: FR-CH-02.MAIN
          stepRefs:
            - FR-CH-02.MAIN.S3
          given:
            - The previous main-flow step FR-CH-02.MAIN.S2 completed with its stated result.
            - Each protected step checks the acting identity, current resource/action/audience
              rights and any applicable entitlement.
            - Policy-dependent effects run only with the relevant approved policy; unresolved values
              remain explicit decision dependencies and do not block writing/reviewing this draft.
          when: Inspect execution and review progress
          then:
            - Show queued/running, test result and AI feedback as separate states
            - Runner failure is distinct from failed tests.
        - id: FR-CH-02.AC.M4
          flowRef: FR-CH-02.MAIN
          stepRefs:
            - FR-CH-02.MAIN.S4
          given:
            - The previous main-flow step FR-CH-02.MAIN.S3 completed with its stated result.
            - Each protected step checks the acting identity, current resource/action/audience
              rights and any applicable entitlement.
            - Policy-dependent effects run only with the relevant approved policy; unresolved values
              remain explicit decision dependencies and do not block writing/reviewing this draft.
          when: Read the completed evaluation
          then:
            - Present actual test outcomes and rubric-based feedback linked to the submission
            - AI feedback cannot turn a failed test into pass.
        - id: FR-CH-02.AC.M5
          flowRef: FR-CH-02.MAIN
          stepRefs:
            - FR-CH-02.MAIN.S5
          given:
            - The previous main-flow step FR-CH-02.MAIN.S4 completed with its stated result.
            - Each protected step checks the acting identity, current resource/action/audience
              rights and any applicable entitlement.
            - Policy-dependent effects run only with the relevant approved policy; unresolved values
              remain explicit decision dependencies and do not block writing/reviewing this draft.
          when: Choose a problem to correct
          then:
            - Open the related explanation or solution editor
            - The prior evaluation remains attached to its original revision.
        - id: FR-CH-02.AC.ALT1
          flowRef: FR-CH-02.ALT1
          stepRefs:
            - FR-CH-02.ALT1.S1
          given:
            - Execution reaches FR-CH-02.MAIN.S2.
            - The same unchanged submission request is repeated
          when: Look up the original submission request
          then:
            - Return the existing evaluation reference
            - No duplicate logical attempt or accidental additional charge.
        - id: FR-CH-02.AC.EX1
          flowRef: FR-CH-02.EX1
          stepRefs:
            - FR-CH-02.EX1.S1
          given:
            - Execution reaches FR-CH-02.MAIN.S2.
            - Required files or inputs are invalid
          when: Submit the solution
          then:
            - Identify the invalid submission requirements
            - No evaluation represented as complete; retain the editable solution.
        - id: FR-CH-02.AC.EX2
          flowRef: FR-CH-02.EX2
          stepRefs:
            - FR-CH-02.EX2.S1
          given:
            - Execution reaches FR-CH-02.MAIN.S3.
            - Execution infrastructure fails
          when: Inspect the evaluation
          then:
            - Show execution-error/unresolved and permitted retry
            - Do not mark learner code incorrect solely due to runner failure.
        - id: FR-CH-02.AC.EX3
          flowRef: FR-CH-02.EX3
          stepRefs:
            - FR-CH-02.EX3.S1
          given:
            - Execution reaches FR-CH-02.MAIN.S4.
            - AI review fails after tests finish
          when: Read the evaluation
          then:
            - Keep test results visible and show review failure separately
            - No loss or reinterpretation of actual execution evidence.
        - id: FR-CH-02.AC.EX4
          flowRef: FR-CH-02.EX4
          stepRefs:
            - FR-CH-02.EX4.S1
          given:
            - Execution reaches FR-CH-02.MAIN.S3.
            - Submitted code attempts unauthorized access or exceeds permitted execution resources
          when: Inspect the evaluation state
          then:
            - Stop or reject unsafe execution and show a process/input limitation
            - No cross-user data, platform secret or uncontrolled external effect; no fabricated
              test result.
      nonFunctionalApplication:
        - id: NFR-SEC
          scope: Main flow and every alternative/exception, including re-entry and current-rights checks.
        - id: NFR-PRIV
          scope: Main flow and every alternative/exception, including re-entry and current-rights checks.
        - id: NFR-AI
          scope: Main flow and every alternative/exception, including re-entry and current-rights checks.
        - id: NFR-INTEGRITY
          scope: Main flow and every alternative/exception, including re-entry and current-rights checks.
        - id: NFR-RELIABILITY
          scope: Main flow and every alternative/exception, including re-entry and current-rights checks.
        - id: NFR-REPEAT
          scope: Main flow and every alternative/exception, including re-entry and current-rights checks.
        - id: NFR-LATENCY
          scope: Main flow and every alternative/exception, including re-entry and current-rights checks.
        - id: NFR-USABILITY
          scope: Main flow and every alternative/exception, including re-entry and current-rights checks.
        - id: NFR-COST
          scope: Main flow and every alternative/exception, including re-entry and current-rights checks.
        - id: NFR-AUDIT
          scope: Main flow and every alternative/exception, including re-entry and current-rights checks.
        - id: NFR-SUBMISSION
          scope: Main flow and every alternative/exception, including re-entry and current-rights checks.
      designHandoff: SDS must map these requirement/flow/step IDs to actual entry points, boundaries, data
        operations, failure paths and verification evidence. This SRS chooses no monolith,
        microservice, source file, queue or database design.
      featureOwner: challenges
      ownership: Defined once in this feature. Other features reference the stable
        requirement/data/journey ID and current Work node ID.
      authorityRefs:
        - artifact: SRC-BUSINESS
          sections:
            - "6"
        - artifact: SRC-BRIEF
          sections:

extensions:
  work3:
    srs:
      schema: starci/srs-functional-requirement@1
      status: draft
      authority: proposed-detail-from-accepted-product-scope
      id: FR-INT-02
      title: Use interview feedback to plan and repeat practice
      domain: interviews
      goal: Use interview feedback to plan and repeat practice
      priority: release-priority-awaits-D01
      actors:
        - learner
      preconditions:
        - The learner can select permitted practice questions and owned/authorized evidence.
        - Each protected step checks the acting identity, current resource/action/audience rights
          and any applicable entitlement.
        - Policy-dependent effects run only with the relevant approved policy; unresolved values
          remain explicit decision dependencies and do not block writing/reviewing this draft.
      inputs:
        - id: FR-INT-02.IN1
          name: practiceRound
          validation: Owned completed round and feedback
          dataRefs:
            - DATA-interview
            - DATA-review
            - DATA-learning-plan
            - DATA-progress
        - id: FR-INT-02.IN2
          name: nextPracticeChoice
          validation: Learning activity or new round reviewed by the learner
          dataRefs:
            - DATA-interview
            - DATA-review
            - DATA-learning-plan
            - DATA-progress
      outputs:
        - name: result-1
          fromStep: FR-INT-02.MAIN.S1
          meaning: Show questions, answers, rubric and feedback
          effect: The learner sees the evidence behind each assessment.
        - name: result-2
          fromStep: FR-INT-02.MAIN.S2
          meaning: Explain missing reasoning and link relevant concepts or project work
          effect: Suggestions are separated from achieved competency.
        - name: result-3
          fromStep: FR-INT-02.MAIN.S3
          meaning: Preview the next practice scope
          effect: The learner chooses whether to adopt the recommendation.
        - name: result-4
          fromStep: FR-INT-02.MAIN.S4
          meaning: Compare compatible criteria with clear versions
          effect: Repeated practice does not overwrite earlier answers or create a recruiting certification.
      businessRuleRefs:
        - BR-EVIDENCE
        - BR-MASTERY
        - BR-PLAN
      dataRefs:
        - DATA-interview
        - DATA-review
        - DATA-learning-plan
        - DATA-progress
      nonFunctionalRefs:
        - NFR-SEC
        - NFR-PRIV
        - NFR-AI
        - NFR-INTEGRITY
        - NFR-RELIABILITY
        - NFR-REPEAT
        - NFR-LATENCY
        - NFR-USABILITY
        - NFR-COST
        - NFR-AUDIT
        - NFR-SUBMISSION
      decisionRefs:
        - D05
        - D07
        - D01
        - D08
        - D11
        - D06
        - D03
        - D12
        - D02
      directPolicyRefs:
        - D05
      decisionTreatment: Direct policy refs affect the named feature behavior; inherited refs govern
        cross-cutting rules and measurement targets. Open policies are not selected by this draft.
      mainFlow:
        id: FR-INT-02.MAIN
        trigger: Open a completed practice round
        steps:
          - id: FR-INT-02.MAIN.S1
            actor: learner
            request: Open a completed practice round
            systemResponse: Show questions, answers, rubric and feedback
            businessEffect: The learner sees the evidence behind each assessment.
            acceptanceRefs:
              - FR-INT-02.AC.M1
          - id: FR-INT-02.MAIN.S2
            actor: learner
            request: Inspect a weak criterion
            systemResponse: Explain missing reasoning and link relevant concepts or project work
            businessEffect: Suggestions are separated from achieved competency.
            acceptanceRefs:
              - FR-INT-02.AC.M2
          - id: FR-INT-02.MAIN.S3
            actor: learner
            request: Choose an improvement activity or another round
            systemResponse: Preview the next practice scope
            businessEffect: The learner chooses whether to adopt the recommendation.
            acceptanceRefs:
              - FR-INT-02.AC.M3
          - id: FR-INT-02.MAIN.S4
            actor: learner
            request: Complete a later round and compare
            systemResponse: Compare compatible criteria with clear versions
            businessEffect: Repeated practice does not overwrite earlier answers or create a recruiting
              certification.
            acceptanceRefs:
              - FR-INT-02.AC.M4
        end:
          type: completed-main-flow
          outcome: Repeated practice does not overwrite earlier answers or create a recruiting certification.
      alternativeFlows:
        - id: FR-INT-02.ALT1
          title: The learner chooses to revisit concepts first
          fromStep: FR-INT-02.MAIN.S3
          condition: The learner chooses to revisit concepts first
          steps:
            - id: FR-INT-02.ALT1.S1
              actor: learner
              request: Open the linked learning material
              systemResponse: Preserve the interview context for later return
              businessEffect: No new interview is automatically started.
              acceptanceRefs:
                - FR-INT-02.AC.ALT1
          resume:
            type: end
            outcome: No new interview is automatically started.
          postconditions:
            - No new interview is automatically started.
          continuation: This flow instance ends with the stated outcome. A permitted correction, status lookup
            or deliberate new request follows the response and current policy; it does not imply a
            successful main outcome.
          acceptanceRefs:
            - FR-INT-02.AC.ALT1
      exceptionFlows:
        - id: FR-INT-02.EX1
          title: The two rounds use materially different rubrics
          fromStep: FR-INT-02.MAIN.S4
          condition: The two rounds use materially different rubrics
          steps:
            - id: FR-INT-02.EX1.S1
              actor: learner
              request: Compare outcomes
              systemResponse: Explain what can and cannot be compared
              businessEffect: No misleading combined score.
              acceptanceRefs:
                - FR-INT-02.AC.EX1
          resume:
            type: end
            outcome: No misleading combined score.
          postconditions:
            - No misleading combined score.
          continuation: This flow instance ends with the stated outcome. A permitted correction, status lookup
            or deliberate new request follows the response and current policy; it does not imply a
            successful main outcome.
          acceptanceRefs:
            - FR-INT-02.AC.EX1
        - id: FR-INT-02.EX2
          title: The viewer is not authorized for the practice history
          fromStep: FR-INT-02.MAIN.S1
          condition: The viewer is not authorized for the practice history
          steps:
            - id: FR-INT-02.EX2.S1
              actor: learner
              request: Open another person round
              systemResponse: Deny access without exposing answers
              businessEffect: Private practice history remains private.
              acceptanceRefs:
                - FR-INT-02.AC.EX2
          resume:
            type: end
            outcome: Private practice history remains private.
          postconditions:
            - Private practice history remains private.
          continuation: This flow instance ends with the stated outcome. A permitted correction, status lookup
            or deliberate new request follows the response and current policy; it does not imply a
            successful main outcome.
          acceptanceRefs:
            - FR-INT-02.AC.EX2
      postconditions:
        success:
          - The learner sees the evidence behind each assessment.
          - Suggestions are separated from achieved competency.
          - The learner chooses whether to adopt the recommendation.
          - Repeated practice does not overwrite earlier answers or create a recruiting
            certification.
        failure:
          - Only effects explicitly completed before the branch remain, with their original
            attribution.
          - No rejected or unresolved operation is presented as the successful main outcome.
          - No misleading combined score.
          - Private practice history remains private.
      acceptanceCriteria:
        - id: FR-INT-02.AC.M1
          flowRef: FR-INT-02.MAIN
          stepRefs:
            - FR-INT-02.MAIN.S1
          given:
            - The learner can select permitted practice questions and owned/authorized evidence.
            - Each protected step checks the acting identity, current resource/action/audience
              rights and any applicable entitlement.
            - Policy-dependent effects run only with the relevant approved policy; unresolved values
              remain explicit decision dependencies and do not block writing/reviewing this draft.
          when: Open a completed practice round
          then:
            - Show questions, answers, rubric and feedback
            - The learner sees the evidence behind each assessment.
        - id: FR-INT-02.AC.M2
          flowRef: FR-INT-02.MAIN
          stepRefs:
            - FR-INT-02.MAIN.S2
          given:
            - The previous main-flow step FR-INT-02.MAIN.S1 completed with its stated result.
            - Each protected step checks the acting identity, current resource/action/audience
              rights and any applicable entitlement.
            - Policy-dependent effects run only with the relevant approved policy; unresolved values
              remain explicit decision dependencies and do not block writing/reviewing this draft.
          when: Inspect a weak criterion
          then:
            - Explain missing reasoning and link relevant concepts or project work
            - Suggestions are separated from achieved competency.
        - id: FR-INT-02.AC.M3
          flowRef: FR-INT-02.MAIN
          stepRefs:
            - FR-INT-02.MAIN.S3
          given:
            - The previous main-flow step FR-INT-02.MAIN.S2 completed with its stated result.
            - Each protected step checks the acting identity, current resource/action/audience
              rights and any applicable entitlement.
            - Policy-dependent effects run only with the relevant approved policy; unresolved values
              remain explicit decision dependencies and do not block writing/reviewing this draft.
          when: Choose an improvement activity or another round
          then:
            - Preview the next practice scope
            - The learner chooses whether to adopt the recommendation.
        - id: FR-INT-02.AC.M4
          flowRef: FR-INT-02.MAIN
          stepRefs:
            - FR-INT-02.MAIN.S4
          given:
            - The previous main-flow step FR-INT-02.MAIN.S3 completed with its stated result.
            - Each protected step checks the acting identity, current resource/action/audience
              rights and any applicable entitlement.
            - Policy-dependent effects run only with the relevant approved policy; unresolved values
              remain explicit decision dependencies and do not block writing/reviewing this draft.
          when: Complete a later round and compare
          then:
            - Compare compatible criteria with clear versions
            - Repeated practice does not overwrite earlier answers or create a recruiting
              certification.
        - id: FR-INT-02.AC.ALT1
          flowRef: FR-INT-02.ALT1
          stepRefs:
            - FR-INT-02.ALT1.S1
          given:
            - Execution reaches FR-INT-02.MAIN.S3.
            - The learner chooses to revisit concepts first
          when: Open the linked learning material
          then:
            - Preserve the interview context for later return
            - No new interview is automatically started.
        - id: FR-INT-02.AC.EX1
          flowRef: FR-INT-02.EX1
          stepRefs:
            - FR-INT-02.EX1.S1
          given:
            - Execution reaches FR-INT-02.MAIN.S4.
            - The two rounds use materially different rubrics
          when: Compare outcomes
          then:
            - Explain what can and cannot be compared
            - No misleading combined score.
        - id: FR-INT-02.AC.EX2
          flowRef: FR-INT-02.EX2
          stepRefs:
            - FR-INT-02.EX2.S1
          given:
            - Execution reaches FR-INT-02.MAIN.S1.
            - The viewer is not authorized for the practice history
          when: Open another person round
          then:
            - Deny access without exposing answers
            - Private practice history remains private.
      nonFunctionalApplication:
        - id: NFR-SEC
          scope: Main flow and every alternative/exception, including re-entry and current-rights checks.
        - id: NFR-PRIV
          scope: Main flow and every alternative/exception, including re-entry and current-rights checks.
        - id: NFR-AI
          scope: Main flow and every alternative/exception, including re-entry and current-rights checks.
        - id: NFR-INTEGRITY
          scope: Main flow and every alternative/exception, including re-entry and current-rights checks.
        - id: NFR-RELIABILITY
          scope: Main flow and every alternative/exception, including re-entry and current-rights checks.
        - id: NFR-REPEAT
          scope: Main flow and every alternative/exception, including re-entry and current-rights checks.
        - id: NFR-LATENCY
          scope: Main flow and every alternative/exception, including re-entry and current-rights checks.
        - id: NFR-USABILITY
          scope: Main flow and every alternative/exception, including re-entry and current-rights checks.
        - id: NFR-COST
          scope: Main flow and every alternative/exception, including re-entry and current-rights checks.
        - id: NFR-AUDIT
          scope: Main flow and every alternative/exception, including re-entry and current-rights checks.
        - id: NFR-SUBMISSION
          scope: Main flow and every alternative/exception, including re-entry and current-rights checks.

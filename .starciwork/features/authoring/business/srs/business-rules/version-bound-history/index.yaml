extensions:
  work3:
    srs:
      schema: starci/srs-business-rule@1
      status: draft
      authority: proposed-detail-from-accepted-product-scope
      id: BR-VERSION
      title: Version-bound evidence
      statements:
        - Published content, rubrics, submissions, reviews and commercial terms retain their own
          version identity.
        - Editing a source or changing a rubric does not silently rewrite past results, approval or
          consent.
        - A stale confirmation must be reviewed against current changed terms before creating a
          different effect.
      decisionRefs:
        - D05
        - D08
      example: A project revision produces a new submission; the earlier review remains about its original
        source.
      acceptanceCriteria:
        - id: BR-VERSION.AC1
          given: A feature reaches a condition governed by this rule.
          when: The governed business outcome is produced or inspected.
          then: Published content, rubrics, submissions, reviews and commercial terms retain their own version
            identity.
        - id: BR-VERSION.AC2
          given: A feature reaches a condition governed by this rule.
          when: The governed business outcome is produced or inspected.
          then: Editing a source or changing a rubric does not silently rewrite past results, approval or
            consent.
        - id: BR-VERSION.AC3
          given: A feature reaches a condition governed by this rule.
          when: The governed business outcome is produced or inspected.
          then: A stale confirmation must be reviewed against current changed terms before creating a
            different effect.
      featureOwner: authoring
      ownership: Defined once in this feature. Other features reference the stable
        requirement/data/journey ID and current Work node ID.

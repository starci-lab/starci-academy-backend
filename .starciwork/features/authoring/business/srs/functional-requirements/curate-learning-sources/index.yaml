        - id: FR-AUTH-02.AC.ALT1
          flowRef: FR-AUTH-02.ALT1
          stepRefs:
            - FR-AUTH-02.ALT1.S1
          given:
            - Execution reaches FR-AUTH-02.MAIN.S2.
            - The source conflicts with an official lesson
          when: Refer both claims for content resolution
          then:
            - Keep the conflict visible and the candidate unapproved
            - Community popularity does not decide source truth.
        - id: FR-AUTH-02.AC.EX1
          flowRef: FR-AUTH-02.EX1
          stepRefs:
            - FR-AUTH-02.EX1.S1
          given:
            - Execution reaches FR-AUTH-02.MAIN.S3.
            - Reviewer authority or contributor consent was withdrawn
          when: Approve the candidate
          then:
            - Refuse publication or reuse outside current rights
            - No automatic promotion from a reported or popular answer.
        - id: FR-AUTH-02.AC.EX2
          flowRef: FR-AUTH-02.EX2
          stepRefs:
            - FR-AUTH-02.EX2.S1
          given:
            - Execution reaches FR-AUTH-02.MAIN.S4.
            - A source was withdrawn after an answer used it
          when: Open the historical citation
          then:
            - Show current unavailability and historical provenance within current rights
            - Do not claim the withdrawn source remains currently verified.

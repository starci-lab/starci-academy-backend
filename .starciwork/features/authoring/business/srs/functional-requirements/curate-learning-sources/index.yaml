        - Policy-dependent effects run only with the relevant approved policy; unresolved values
          remain explicit decision dependencies and do not block writing/reviewing this draft.
      inputs:
        - id: FR-AUTH-02.IN1
          name: sourceCandidate
          validation: Origin, version, trust class, reuse rights and known conflicts
          dataRefs:
            - DATA-content-source
            - DATA-concept
            - DATA-discussion
            - DATA-rag-session
        - id: FR-AUTH-02.IN2
          name: curationDecision
          validation: Attributed reviewer decision on exact candidate
          dataRefs:
            - DATA-content-source
            - DATA-concept
            - DATA-discussion
            - DATA-rag-session
      outputs:
        - name: result-1
          fromStep: FR-AUTH-02.MAIN.S1
          meaning: Show its origin, version, audience and current trust state
          effect: A community contribution remains community content during review.
        - name: result-2
          fromStep: FR-AUTH-02.MAIN.S2
          meaning: Capture the authorized reviewer rationale and applicable curation policy
          effect: Private contributor data cannot be promoted without valid permission.
        - name: result-3
          fromStep: FR-AUTH-02.MAIN.S3
          meaning: Record an attributable trust decision for the exact source version
          effect: Only approved permitted sources enter the corresponding trusted collection.
        - name: result-4
          fromStep: FR-AUTH-02.MAIN.S4
          meaning: Apply the current trust/access state to future answers and explain affected historical
            citations
          effect: Prior answer provenance is preserved without continuing unauthorized disclosure.

      mainFlow:
        id: FR-AUTH-02.MAIN
        trigger: Select a candidate official or community source
        steps:
          - id: FR-AUTH-02.MAIN.S1
            actor: author-editor
            request: Select a candidate official or community source
            systemResponse: Show its origin, version, audience and current trust state
            businessEffect: A community contribution remains community content during review.
            acceptanceRefs:
              - FR-AUTH-02.AC.M1
          - id: FR-AUTH-02.MAIN.S2
            actor: author-editor
            request: Review accuracy, conflicts and permission to reuse
            systemResponse: Capture the authorized reviewer rationale and applicable curation policy
            businessEffect: Private contributor data cannot be promoted without valid permission.
            acceptanceRefs:
              - FR-AUTH-02.AC.M2
          - id: FR-AUTH-02.MAIN.S3
            actor: author-editor
            request: Approve, reject or keep the candidate unresolved
            systemResponse: Record an attributable trust decision for the exact source version
            businessEffect: Only approved permitted sources enter the corresponding trusted collection.
            acceptanceRefs:
              - FR-AUTH-02.AC.M3
          - id: FR-AUTH-02.MAIN.S4
            actor: author-editor
            request: Inspect source use or withdraw approval
            systemResponse: Apply the current trust/access state to future answers and explain affected
              historical citations
            businessEffect: Prior answer provenance is preserved without continuing unauthorized disclosure.
            acceptanceRefs:
              - FR-AUTH-02.AC.M4
        end:
          type: completed-main-flow
          outcome: Prior answer provenance is preserved without continuing unauthorized disclosure.
      alternativeFlows:
        - id: FR-AUTH-02.ALT1
          title: The source conflicts with an official lesson
          fromStep: FR-AUTH-02.MAIN.S2
          condition: The source conflicts with an official lesson
          steps:
            - id: FR-AUTH-02.ALT1.S1
              actor: author-editor
              request: Refer both claims for content resolution
              systemResponse: Keep the conflict visible and the candidate unapproved
              businessEffect: Community popularity does not decide source truth.
              acceptanceRefs:
                - FR-AUTH-02.AC.ALT1
          resume:
            type: end
            outcome: Community popularity does not decide source truth.
          postconditions:
            - Community popularity does not decide source truth.
          continuation: This flow instance ends with the stated outcome. A permitted correction, status lookup
            or deliberate new request follows the response and current policy; it does not imply a
            successful main outcome.
          acceptanceRefs:
            - FR-AUTH-02.AC.ALT1
      exceptionFlows:
        - id: FR-AUTH-02.EX1
          title: Reviewer authority or contributor consent was withdrawn
          fromStep: FR-AUTH-02.MAIN.S3
          condition: Reviewer authority or contributor consent was withdrawn
          steps:
            - id: FR-AUTH-02.EX1.S1
              actor: author-editor
              request: Approve the candidate
              systemResponse: Refuse publication or reuse outside current rights
              businessEffect: No automatic promotion from a reported or popular answer.
              acceptanceRefs:
                - FR-AUTH-02.AC.EX1
          resume:
            type: end
            outcome: No automatic promotion from a reported or popular answer.
          postconditions:
            - No automatic promotion from a reported or popular answer.
          continuation: This flow instance ends with the stated outcome. A permitted correction, status lookup
            or deliberate new request follows the response and current policy; it does not imply a
            successful main outcome.
          acceptanceRefs:
            - FR-AUTH-02.AC.EX1
        - id: FR-AUTH-02.EX2
          title: A source was withdrawn after an answer used it
          fromStep: FR-AUTH-02.MAIN.S4
          condition: A source was withdrawn after an answer used it
          steps:
            - id: FR-AUTH-02.EX2.S1
              actor: author-editor
              request: Open the historical citation
              systemResponse: Show current unavailability and historical provenance within current rights
              businessEffect: Do not claim the withdrawn source remains currently verified.
              acceptanceRefs:
                - FR-AUTH-02.AC.EX2
          resume:
            type: end
            outcome: Do not claim the withdrawn source remains currently verified.
          postconditions:
            - Do not claim the withdrawn source remains currently verified.
          continuation: This flow instance ends with the stated outcome. A permitted correction, status lookup
            or deliberate new request follows the response and current policy; it does not imply a
            successful main outcome.
          acceptanceRefs:
            - FR-AUTH-02.AC.EX2
      postconditions:
        success:
          - A community contribution remains community content during review.
          - Private contributor data cannot be promoted without valid permission.
          - Only approved permitted sources enter the corresponding trusted collection.
          - Prior answer provenance is preserved without continuing unauthorized disclosure.
        failure:
          - Only effects explicitly completed before the branch remain, with their original
            attribution.
          - No rejected or unresolved operation is presented as the successful main outcome.
          - No automatic promotion from a reported or popular answer.
          - Do not claim the withdrawn source remains currently verified.
      acceptanceCriteria:
        - id: FR-AUTH-02.AC.M1
          flowRef: FR-AUTH-02.MAIN
          stepRefs:

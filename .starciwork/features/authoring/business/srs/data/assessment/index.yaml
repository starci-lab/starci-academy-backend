schema: work/node@2
id: starci-next.business.srs.data.assessment
kind: business
required: true
state: todo
description: Assessment, challenge and rubric version
refs:
  - starci-next.business.srs.business-rules.policy-decisions.evaluation-and-recognition
extensions:
  work3:
    srs:
      schema: starci/srs-data-definition@1
      status: draft
      authority: proposed-detail-from-accepted-product-scope
      id: DATA-assessment
      title: Assessment, challenge and rubric version
      modelLevel: Proposed logical business contract; physical storage, indexes and APIs belong to SDS.
      owner: assessment owner
      fields:
        - name: id
          meaning: Stable logical record identity
          validation: Required, unique and not changed by a state transition
          classification: context-scoped
        - name: version
          meaning: Record/content revision used for attribution and confirmation
          validation: Identify the reviewed version; changed content must not impersonate an earlier revision
          classification: context-scoped
        - name: assessmentType
          meaning: Quiz, code challenge, interview question or project rubric
          validation: Required method classification
          classification: content-rights
        - name: promptAndInputs
          meaning: Task objective, inputs and expected behavior
          validation: Required sufficient instructions for a valid attempt
          classification: content-rights
        - name: criteria
          meaning: Objective checks and judgment rubric
          validation: Versioned criteria; outcome meanings explicit
          classification: content-rights
        - name: assistanceRules
          meaning: Hints/solutions and evaluation implications
          validation: Approved rules disclosed before affected attempt
          classification: content-rights
      relations:
        - dataRef: DATA-concept
          meaning: Referenced business identity/version; lookup never grants access by itself.
      states:
        - draft
        - in-review
        - published
        - retired
      transitions:
        - id: DATA-assessment.T1
          from: draft
          to: in-review
          event: Submit criteria candidate
          guard: Prompt, result semantics and assistance rules complete
        - id: DATA-assessment.T2
          from: in-review
          to: published
          event: Approve exact criteria
          guard: Authorized assessment review
        - id: DATA-assessment.T3
          from: in-review
          to: draft
          event: Request revision
          guard: Reviewer identifies unresolved criteria
        - id: DATA-assessment.T4
          from: published
          to: retired
          event: Stop new attempts for version
          guard: Existing references preserved
      invariants:
        - A rubric revision never silently rewrites an earlier test result.
      decisionRefs:
        - D05
      privacy:
        access: Apply current owner, role, resource and audience grants. A selected-public field is exposed
          only after authorized publication.
        retention: D08 selects retention/export/closure behavior. No storage duration or automatic deletion
          policy is inferred.
        referenceWithdrawal: Preserve permitted provenance while preventing newly unauthorized source
          access; retained snapshots require approved D08 purpose and scope.
      validationCases:
        - given: An actor without current rights references this assessment.
          when: Read or mutate the record.
          then: Deny the unauthorized action without disclosing restricted fields.
        - given: A record in a declared state and an attributed authorized event.
          when: Apply a listed transition.
          then: Require its guard, retain the prior version attribution and reject a transition unsupported by
            policy.
      featureOwner: authoring
      ownership: Defined once in this feature. Other features reference the stable
        requirement/data/journey ID and current Work node ID.

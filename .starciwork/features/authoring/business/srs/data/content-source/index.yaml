schema: work/node@2
id: starci-next.business.srs.data.content-source
kind: business
required: true
state: todo
description: Knowledge source trust and reuse decision
refs:
  - starci-next.business.srs.business-rules.policy-decisions.knowledge-and-ai-quality
  - starci-next.business.srs.business-rules.policy-decisions.privacy-and-sharing
  - starci-next.business.srs.business-rules.policy-decisions.community-policy
extensions:
  work3:
    srs:
      schema: starci/srs-data-definition@1
      status: draft
      authority: proposed-detail-from-accepted-product-scope
      id: DATA-content-source
      title: Knowledge source trust and reuse decision
      modelLevel: Proposed logical business contract; physical storage, indexes and APIs belong to SDS.
      owner: content owner; source contributor rights
      fields:
        - name: id
          meaning: Stable logical record identity
          validation: Required, unique and not changed by a state transition
          classification: context-scoped
        - name: version
          meaning: Record/content revision used for attribution and confirmation
          validation: Identify the reviewed version; changed content must not impersonate an earlier revision
          classification: context-scoped
        - name: originAndVersion
          meaning: Official lesson, external source or community contribution
          validation: Source class and exact revision required
          classification: audience-scoped
        - name: reusePermission
          meaning: Audience/purpose under which source may be used
          validation: Current content rights and contributor permission required
          classification: restricted
        - name: trustDecision
          meaning: Reviewer, policy, rationale and status
          validation: Approval applies only to exact reviewed version
          classification: restricted
        - name: conflictsAndWithdrawal
          meaning: Known disputes and current availability
          validation: Historical citations retain source identity and current limits
          classification: audience-scoped
      relations:
        - dataRef: DATA-concept
          meaning: Referenced business identity/version; lookup never grants access by itself.
        - dataRef: DATA-discussion
          meaning: Referenced business identity/version; lookup never grants access by itself.
        - dataRef: DATA-rag-session
          meaning: Referenced business identity/version; lookup never grants access by itself.
      states:
        - candidate
        - in-review
        - approved
        - conflicted
        - rejected
        - withdrawn
      transitions:
        - id: DATA-content-source.T1
          from: candidate
          to: in-review
          event: Submit source candidate
          guard: Origin and permitted review context available
        - id: DATA-content-source.T2
          from: in-review
          to: approved
          event: Authorized source approval
          guard: D06/D09 accuracy and reuse criteria satisfied
        - id: DATA-content-source.T3
          from: in-review
          to: conflicted
          event: Unresolved source conflict
          guard: Record conflicting claims without false resolution
        - id: DATA-content-source.T4
          from: in-review
          to: rejected
          event: Reject candidate
          guard: Reviewer explains applicable criterion
        - id: DATA-content-source.T5
          from: approved
          to: withdrawn
          event: Withdraw trust or permission
          guard: Future source use must reflect current decision
        - id: DATA-content-source.T6
          from: approved
          to: conflicted
          event: Discover material conflict
          guard: Suspend unsupported trust claims pending review
      invariants:
        - Popularity does not grant official-source status.
      decisionRefs:
        - D06
        - D08
        - D09
      privacy:
        access: Apply current owner, role, resource and audience grants. A selected-public field is exposed
          only after authorized publication.
        retention: D08 selects retention/export/closure behavior. No storage duration or automatic deletion
          policy is inferred.
        referenceWithdrawal: Preserve permitted provenance while preventing newly unauthorized source
          access; retained snapshots require approved D08 purpose and scope.
      validationCases:
        - given: An actor without current rights references this content-source.
          when: Read or mutate the record.
          then: Deny the unauthorized action without disclosing restricted fields.
        - given: A record in a declared state and an attributed authorized event.
          when: Apply a listed transition.
          then: Require its guard, retain the prior version attribution and reject a transition unsupported by
            policy.
      featureOwner: authoring
      ownership: Defined once in this feature. Other features reference the stable
        requirement/data/journey ID and current Work node ID.

schema: work/node@2
id: starci-next.business.srs.data.support-case
kind: business
required: true
state: todo
description: Scoped support and personal-data request
refs:
  - starci-next.business.srs.business-rules.policy-decisions.subscription-policy
  - starci-next.business.srs.business-rules.policy-decisions.academy-transition
  - starci-next.business.srs.business-rules.policy-decisions.privacy-and-sharing
extensions:
  work3:
    srs:
      schema: starci/srs-data-definition@1
      status: draft
      authority: proposed-detail-from-accepted-product-scope
      id: DATA-support-case
      title: Scoped support and personal-data request
      modelLevel: Proposed logical business contract; physical storage, indexes and APIs belong to SDS.
      owner: requesting user; assigned operations authority
      fields:
        - name: id
          meaning: Stable logical record identity
          validation: Required, unique and not changed by a state transition
          classification: context-scoped
        - name: version
          meaning: Record/content revision used for attribution and confirmation
          validation: Identify the reviewed version; changed content must not impersonate an earlier revision
          classification: context-scoped
        - name: subjectAndPurpose
          meaning: Account, purchase, right or data request being handled
          validation: Only permitted relevant context
          classification: restricted
        - name: requesterAndAssignee
          meaning: Owner and scoped operator
          validation: No unrelated private account access
          classification: restricted
        - name: evidenceAndPolicy
          meaning: Observed facts and required decision basis
          validation: Unknown policy references named owner
          classification: restricted
        - name: resolution
          meaning: Authorized action and actual result
          validation: Pending is distinct from fulfilled
          classification: private
      relations:
        - dataRef: DATA-account
          meaning: Referenced business identity/version; lookup never grants access by itself.
        - dataRef: DATA-purchase
          meaning: Referenced business identity/version; lookup never grants access by itself.
        - dataRef: DATA-entitlement
          meaning: Referenced business identity/version; lookup never grants access by itself.
      states:
        - received
        - in-review
        - awaiting-evidence
        - awaiting-policy
        - resolved
        - cancelled
      transitions:
        - id: DATA-support-case.T1
          from: received
          to: in-review
          event: Assign authorized operator
          guard: Purpose and scope established
        - id: DATA-support-case.T2
          from: in-review
          to: awaiting-evidence
          event: Need authoritative facts
          guard: Explain specific missing evidence
        - id: DATA-support-case.T3
          from: in-review
          to: awaiting-policy
          event: Policy not defined
          guard: Decision ID and owner recorded
        - id: DATA-support-case.T4
          from: in-review
          to: resolved
          event: Verify authorized outcome
          guard: Resolution supported by actual result
        - id: DATA-support-case.T5
          from: awaiting-evidence
          to: in-review
          event: Receive required evidence
          guard: Revalidate relevance and rights
        - id: DATA-support-case.T6
          from: awaiting-policy
          to: in-review
          event: Approve applicable policy
          guard: Record decision version
        - id: DATA-support-case.T7
          from: received
          to: cancelled
          event: Requester cancels supported request
          guard: No already fulfilled action is falsely undone
      invariants:
        - Closing a case cannot convert unresolved activation or deletion into completion.
      decisionRefs:
        - D03
        - D04
        - D08
      privacy:
        access: Apply current owner, role, resource and audience grants. A selected-public field is exposed
          only after authorized publication.
        retention: D08 selects retention/export/closure behavior. No storage duration or automatic deletion
          policy is inferred.
        referenceWithdrawal: Preserve permitted provenance while preventing newly unauthorized source
          access; retained snapshots require approved D08 purpose and scope.
      validationCases:
        - given: An actor without current rights references this support-case.
          when: Read or mutate the record.
          then: Deny the unauthorized action without disclosing restricted fields.
        - given: A record in a declared state and an attributed authorized event.
          when: Apply a listed transition.
          then: Require its guard, retain the prior version attribution and reject a transition unsupported by
            policy.
      featureOwner: operations
      ownership: Defined once in this feature. Other features reference the stable
        requirement/data/journey ID and current Work node ID.

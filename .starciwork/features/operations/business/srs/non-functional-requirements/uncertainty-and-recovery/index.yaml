extensions:
  work3:
    srs:
      schema: starci/srs-non-functional-requirement@1
      status: draft
      authority: proposed-detail-from-accepted-product-scope
      id: NFR-RELIABILITY
      title: Uncertainty and recoverable operations
      scope:
        - all
      requirement: Processing failures and unknown completion have observable states and an allowed
        continuation without false success or lost acknowledged work.
      decisionRefs:
        - D03
        - D07
        - D12
      measurement:
        metric: Measure acknowledged-request recovery, unknown-state resolution time and durable-history
          loss; RTO/RPO/availability targets await D12.
        conditions: Interrupt after acceptance, during evaluation, after payment confirmation and before
          response; restore the capability and query the original request.
        thresholdStatus: Quantitative/policy targets referenced above are open; deterministic invariants
          below are reviewable now.
        evidenceRequired: Record scenario, input/source/policy versions, environment/load, observation
          timestamps, actual outcomes and metric calculation; do not substitute a document check for
          runtime evidence.
      acceptanceCriteria:
        - id: NFR-RELIABILITY.AC1
          given: Interrupt after acceptance, during evaluation, after payment confirmation and before
            response; restore the capability and query the original request.
          when: Follow the documented status/recovery path for each interruption.
          then: Existing accepted work and confirmed financial evidence remain identifiable; no invented pass,
            duplicate purchase or unsupported completed state; timed targets remain unapproved.
      tradeoffBoundary: SDS proposes optimizations and capacity choices within these obligations. Privacy,
        consent, financial truth and evidence provenance cannot be relaxed to improve latency or
        cost.
      featureOwner: operations
      ownership: Defined once in this feature. Other features reference the stable
        requirement/data/journey ID and current Work node ID.

refs:
  - starci-next.business.srs.business-rules.policy-decisions.subscription-policy
  - starci-next.business.srs.business-rules.policy-decisions.failed-ai-usage
extensions:
  work3:
    srs:
      schema: starci/srs-non-functional-requirement@1
      status: draft
      authority: proposed-detail-from-accepted-product-scope
      id: NFR-REPEAT
      title: Repeat and concurrent-action consistency
      scope:
        - all
      requirement: Retries, duplicate notifications and concurrent edits preserve one logical effect and
        expose conflicting new actions.
      decisionRefs:
        - D03
        - D07
      measurement:
        metric: One benefit, award or usage effect per identified qualifying event; no silent overwrite of a
          reviewed different revision.
        conditions: Submit the same purchase/award/review request repeatedly; interleave two
          plan/profile/role revisions and two last-allowance requests.
        thresholdStatus: Quantitative/policy targets referenced above are open; deterministic invariants
          below are reviewable now.
        evidenceRequired: Record scenario, input/source/policy versions, environment/load, observation
          timestamps, actual outcomes and metric calculation; do not substitute a document check for
          runtime evidence.
      acceptanceCriteria:
        - id: NFR-REPEAT.AC1
          given: Submit the same purchase/award/review request repeatedly; interleave two plan/profile/role
            revisions and two last-allowance requests.
          when: Inspect resulting business records and visible outcomes after all requests settle.
          then: Duplicates return the existing effect, intentional new attempts stay distinct, conflicting
            edits require review, and allowance is not overcommitted.
      tradeoffBoundary: SDS proposes optimizations and capacity choices within these obligations. Privacy,
        consent, financial truth and evidence provenance cannot be relaxed to improve latency or
        cost.
      featureOwner: operations
      ownership: Defined once in this feature. Other features reference the stable
        requirement/data/journey ID and current Work node ID.

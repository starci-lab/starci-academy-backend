kind: business
required: true
state: todo
description: Accessible, clear and recoverable interaction
refs:
  - starci-next.business.srs.business-rules.policy-decisions.delivery-and-service-targets
extensions:
  work3:
    srs:
      schema: starci/srs-non-functional-requirement@1
      status: draft
      authority: proposed-detail-from-accepted-product-scope
      id: NFR-USABILITY
      title: Accessible, clear and recoverable interaction
      scope:
        - all
      requirement: A user can understand access, validation, processing, source provenance and the next
        available action without relying on color alone.
      decisionRefs:
        - D12
      measurement:
        metric: Critical journeys are operable by the accepted assistive input/display modes; supported
          device and accessibility conformance targets await D12.
        conditions: Use missing-field, quota-exhausted, pending-payment, source-unavailable and
          failed-review cases with keyboard and assistive reading scenarios.
        thresholdStatus: Quantitative/policy targets referenced above are open; deterministic invariants
          below are reviewable now.
        evidenceRequired: Record scenario, input/source/policy versions, environment/load, observation
          timestamps, actual outcomes and metric calculation; do not substitute a document check for
          runtime evidence.
      acceptanceCriteria:
        - id: NFR-USABILITY.AC1
          given: Use missing-field, quota-exhausted, pending-payment, source-unavailable and failed-review
            cases with keyboard and assistive reading scenarios.
          when: Complete or recover each journey using clear labels, ordered focus and explicit feedback.
          then: Required fields and errors are associated, focus allows continuation, status changes are
            perceivable and no recoverable failure silently discards a draft.
      tradeoffBoundary: SDS proposes optimizations and capacity choices within these obligations. Privacy,
        consent, financial truth and evidence provenance cannot be relaxed to improve latency or
        cost.
      featureOwner: operations
      ownership: Defined once in this feature. Other features reference the stable
        requirement/data/journey ID and current Work node ID.

schema: work/node@2
id: starci-next.business.srs.business-rules.one-logical-effect
kind: business
required: true
state: todo
description: One logical effect per confirmed action
refs:
  - starci-next.business.srs.business-rules.policy-decisions.subscription-policy
  - starci-next.business.srs.business-rules.policy-decisions.failed-ai-usage
extensions:
  work3:
    srs:
      schema: starci/srs-business-rule@1
      status: draft
      authority: proposed-detail-from-accepted-product-scope
      id: BR-REPEAT
      title: One logical effect per confirmed action
      statements:
        - Repeated delivery, refresh or rechecking an existing logical request must return its
          current outcome without duplicating its business effect.
        - A deliberately new submission/review is explicitly identified and retains its parent
          attempt relationship.
        - Unknown completion is reconciled using existing evidence; timeout alone does not establish
          failure or authorize another payment.
      decisionRefs:
        - D03
        - D07
      example: A payment confirmation delivered twice creates one resulting entitlement.
      acceptanceCriteria:
        - id: BR-REPEAT.AC1
          given: A feature reaches a condition governed by this rule.
          when: The governed business outcome is produced or inspected.
          then: Repeated delivery, refresh or rechecking an existing logical request must return its current
            outcome without duplicating its business effect.
        - id: BR-REPEAT.AC2
          given: A feature reaches a condition governed by this rule.
          when: The governed business outcome is produced or inspected.
          then: A deliberately new submission/review is explicitly identified and retains its parent attempt
            relationship.
        - id: BR-REPEAT.AC3
          given: A feature reaches a condition governed by this rule.
          when: The governed business outcome is produced or inspected.
          then: Unknown completion is reconciled using existing evidence; timeout alone does not establish
            failure or authorize another payment.
      featureOwner: operations
      ownership: Defined once in this feature. Other features reference the stable
        requirement/data/journey ID and current Work node ID.

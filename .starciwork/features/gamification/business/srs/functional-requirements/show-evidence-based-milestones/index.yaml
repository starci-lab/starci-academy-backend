extensions:
  work3:
    srs:
      schema: starci/srs-functional-requirement@1
      status: draft
      authority: proposed-detail-from-accepted-product-scope
      id: FR-GAME-02
      title: Show competency milestones with supporting evidence
      domain: gamification
      goal: Show competency milestones with supporting evidence
      priority: release-priority-awaits-D01
      actors:
        - learner
      preconditions:
        - Activity and competency criteria are represented separately, with approved rules required
          before an award.
        - Each protected step checks the acting identity, current resource/action/audience rights
          and any applicable entitlement.
        - Policy-dependent effects run only with the relevant approved policy; unresolved values
          remain explicit decision dependencies and do not block writing/reviewing this draft.
      inputs:
        - id: FR-GAME-02.IN1
          name: milestoneCriteria
          validation: Approved competency rubric and milestone
          dataRefs:
            - DATA-progress
            - DATA-evidence
            - DATA-assessment
            - DATA-activity-award
        - id: FR-GAME-02.IN2
          name: applicableEvidence
          validation: Permitted, version-compatible assessment/project evidence
          dataRefs:
            - DATA-progress
            - DATA-evidence
            - DATA-assessment
            - DATA-activity-award
      outputs:
        - name: result-1
          fromStep: FR-GAME-02.MAIN.S1
          meaning: Show criteria and the evidence needed
          effect: XP and reading activity are not sufficient by themselves.
        - name: result-2
          fromStep: FR-GAME-02.MAIN.S2
          meaning: Evaluate only evidence applicable to the selected criteria/version
          effect: Missing or incompatible evidence is identified.
        - name: result-3
          fromStep: FR-GAME-02.MAIN.S3
          meaning: Explain achieved, partially supported or not-yet-demonstrated criteria
          effect: Every positive claim links to its evidence.
        - name: result-4
          fromStep: FR-GAME-02.MAIN.S4
          meaning: Open the relevant learning or practice activity
          effect: A recommendation does not award the milestone.
      businessRuleRefs:
        - BR-MASTERY
        - BR-EVIDENCE
        - BR-VERSION
      dataRefs:
        - DATA-progress
        - DATA-evidence
        - DATA-assessment
        - DATA-activity-award
      nonFunctionalRefs:
        - NFR-SEC
        - NFR-PRIV
        - NFR-INTEGRITY
        - NFR-RELIABILITY
        - NFR-REPEAT
        - NFR-LATENCY
        - NFR-USABILITY
        - NFR-AUDIT
      decisionRefs:
        - D05
        - D08
        - D07
        - D11
        - D03
        - D12
      directPolicyRefs:
        - D05
      decisionTreatment: Direct policy refs affect the named feature behavior; inherited refs govern
        cross-cutting rules and measurement targets. Open policies are not selected by this draft.
      mainFlow:
        id: FR-GAME-02.MAIN
        trigger: Open a competency milestone
        steps:
          - id: FR-GAME-02.MAIN.S1
            actor: learner
            request: Open a competency milestone
            systemResponse: Show criteria and the evidence needed
            businessEffect: XP and reading activity are not sufficient by themselves.
            acceptanceRefs:
              - FR-GAME-02.AC.M1
          - id: FR-GAME-02.MAIN.S2
            actor: learner
            request: Inspect submitted practice or project results
            systemResponse: Evaluate only evidence applicable to the selected criteria/version
            businessEffect: Missing or incompatible evidence is identified.
            acceptanceRefs:
              - FR-GAME-02.AC.M2
          - id: FR-GAME-02.MAIN.S3
            actor: learner
            request: Read the milestone state
            systemResponse: Explain achieved, partially supported or not-yet-demonstrated criteria
            businessEffect: Every positive claim links to its evidence.
            acceptanceRefs:
              - FR-GAME-02.AC.M3
          - id: FR-GAME-02.MAIN.S4
            actor: learner
            request: Choose a gap to improve
            systemResponse: Open the relevant learning or practice activity
            businessEffect: A recommendation does not award the milestone.
            acceptanceRefs:
              - FR-GAME-02.AC.M4
        end:
          type: completed-main-flow
          outcome: A recommendation does not award the milestone.
      alternativeFlows:
        - id: FR-GAME-02.ALT1
          title: Only some criteria have sufficient evidence
          fromStep: FR-GAME-02.MAIN.S2
          condition: Only some criteria have sufficient evidence
          steps:
            - id: FR-GAME-02.ALT1.S1
              actor: learner
              request: Inspect partial progress
              systemResponse: Show satisfied criteria and remaining work
              businessEffect: No all-or-nothing exaggeration of mastery.
              acceptanceRefs:
                - FR-GAME-02.AC.ALT1
          resume:
            type: end
            outcome: No all-or-nothing exaggeration of mastery.
          postconditions:
            - No all-or-nothing exaggeration of mastery.
          continuation: This flow instance ends with the stated outcome. A permitted correction, status lookup
            or deliberate new request follows the response and current policy; it does not imply a
            successful main outcome.
          acceptanceRefs:
            - FR-GAME-02.AC.ALT1
      exceptionFlows:
        - id: FR-GAME-02.EX1
          title: Evidence becomes inaccessible or a rubric changes
          fromStep: FR-GAME-02.MAIN.S3
          condition: Evidence becomes inaccessible or a rubric changes
          steps:
            - id: FR-GAME-02.EX1.S1
              actor: learner
              request: Inspect the milestone
              systemResponse: Explain historical achievement and current verification/reassessment needs
              businessEffect: Do not silently rewrite past results or claim fresh verification.
              acceptanceRefs:
                - FR-GAME-02.AC.EX1
          resume:
            type: end
            outcome: Do not silently rewrite past results or claim fresh verification.
          postconditions:
            - Do not silently rewrite past results or claim fresh verification.
          continuation: This flow instance ends with the stated outcome. A permitted correction, status lookup
            or deliberate new request follows the response and current policy; it does not imply a
            successful main outcome.
          acceptanceRefs:
            - FR-GAME-02.AC.EX1
        - id: FR-GAME-02.EX2
          title: The mastery rule has not been selected
          fromStep: FR-GAME-02.MAIN.S2
          condition: The mastery rule has not been selected
          steps:
            - id: FR-GAME-02.EX2.S1
              actor: learner
              request: Evaluate the milestone
              systemResponse: Show a pending policy decision
              businessEffect: No invented threshold or certification.
              acceptanceRefs:
                - FR-GAME-02.AC.EX2
          resume:
            type: end
            outcome: No invented threshold or certification.
          postconditions:
            - No invented threshold or certification.
          continuation: This flow instance ends with the stated outcome. A permitted correction, status lookup
            or deliberate new request follows the response and current policy; it does not imply a
            successful main outcome.
          acceptanceRefs:
            - FR-GAME-02.AC.EX2
      postconditions:
        success:
          - XP and reading activity are not sufficient by themselves.
          - Missing or incompatible evidence is identified.
          - Every positive claim links to its evidence.
          - A recommendation does not award the milestone.
        failure:
          - Only effects explicitly completed before the branch remain, with their original
            attribution.
          - No rejected or unresolved operation is presented as the successful main outcome.
          - Do not silently rewrite past results or claim fresh verification.
          - No invented threshold or certification.
      acceptanceCriteria:
        - id: FR-GAME-02.AC.M1
          flowRef: FR-GAME-02.MAIN
          stepRefs:
            - FR-GAME-02.MAIN.S1
          given:
            - Activity and competency criteria are represented separately, with approved rules
              required before an award.
            - Each protected step checks the acting identity, current resource/action/audience
              rights and any applicable entitlement.
            - Policy-dependent effects run only with the relevant approved policy; unresolved values
              remain explicit decision dependencies and do not block writing/reviewing this draft.
          when: Open a competency milestone
          then:
            - Show criteria and the evidence needed
            - XP and reading activity are not sufficient by themselves.
        - id: FR-GAME-02.AC.M2
          flowRef: FR-GAME-02.MAIN
          stepRefs:
            - FR-GAME-02.MAIN.S2
          given:
            - The previous main-flow step FR-GAME-02.MAIN.S1 completed with its stated result.
            - Each protected step checks the acting identity, current resource/action/audience
              rights and any applicable entitlement.
            - Policy-dependent effects run only with the relevant approved policy; unresolved values
              remain explicit decision dependencies and do not block writing/reviewing this draft.
          when: Inspect submitted practice or project results
          then:
            - Evaluate only evidence applicable to the selected criteria/version
            - Missing or incompatible evidence is identified.
        - id: FR-GAME-02.AC.M3
          flowRef: FR-GAME-02.MAIN
          stepRefs:
            - FR-GAME-02.MAIN.S3
          given:
            - The previous main-flow step FR-GAME-02.MAIN.S2 completed with its stated result.
            - Each protected step checks the acting identity, current resource/action/audience
              rights and any applicable entitlement.
            - Policy-dependent effects run only with the relevant approved policy; unresolved values
              remain explicit decision dependencies and do not block writing/reviewing this draft.
          when: Read the milestone state
          then:
            - Explain achieved, partially supported or not-yet-demonstrated criteria
            - Every positive claim links to its evidence.
        - id: FR-GAME-02.AC.M4
          flowRef: FR-GAME-02.MAIN
          stepRefs:
            - FR-GAME-02.MAIN.S4
          given:
            - The previous main-flow step FR-GAME-02.MAIN.S3 completed with its stated result.
            - Each protected step checks the acting identity, current resource/action/audience
              rights and any applicable entitlement.
            - Policy-dependent effects run only with the relevant approved policy; unresolved values
              remain explicit decision dependencies and do not block writing/reviewing this draft.
          when: Choose a gap to improve
          then:
            - Open the relevant learning or practice activity
            - A recommendation does not award the milestone.
        - id: FR-GAME-02.AC.ALT1
          flowRef: FR-GAME-02.ALT1
          stepRefs:
            - FR-GAME-02.ALT1.S1
          given:
            - Execution reaches FR-GAME-02.MAIN.S2.
            - Only some criteria have sufficient evidence
          when: Inspect partial progress
          then:
            - Show satisfied criteria and remaining work
            - No all-or-nothing exaggeration of mastery.
        - id: FR-GAME-02.AC.EX1
          flowRef: FR-GAME-02.EX1
          stepRefs:
            - FR-GAME-02.EX1.S1
          given:
            - Execution reaches FR-GAME-02.MAIN.S3.
            - Evidence becomes inaccessible or a rubric changes
          when: Inspect the milestone
          then:
            - Explain historical achievement and current verification/reassessment needs
            - Do not silently rewrite past results or claim fresh verification.
        - id: FR-GAME-02.AC.EX2
          flowRef: FR-GAME-02.EX2
          stepRefs:
            - FR-GAME-02.EX2.S1
          given:
            - Execution reaches FR-GAME-02.MAIN.S2.
            - The mastery rule has not been selected
          when: Evaluate the milestone
          then:
            - Show a pending policy decision
            - No invented threshold or certification.
      nonFunctionalApplication:
        - id: NFR-SEC
          scope: Main flow and every alternative/exception, including re-entry and current-rights checks.
        - id: NFR-PRIV
          scope: Main flow and every alternative/exception, including re-entry and current-rights checks.
        - id: NFR-INTEGRITY
          scope: Main flow and every alternative/exception, including re-entry and current-rights checks.
        - id: NFR-RELIABILITY
          scope: Main flow and every alternative/exception, including re-entry and current-rights checks.
        - id: NFR-REPEAT
          scope: Main flow and every alternative/exception, including re-entry and current-rights checks.
        - id: NFR-LATENCY
          scope: Main flow and every alternative/exception, including re-entry and current-rights checks.
        - id: NFR-USABILITY
          scope: Main flow and every alternative/exception, including re-entry and current-rights checks.
        - id: NFR-AUDIT
          scope: Main flow and every alternative/exception, including re-entry and current-rights checks.
      designHandoff: SDS must map these requirement/flow/step IDs to actual entry points, boundaries, data
        operations, failure paths and verification evidence. This SRS chooses no monolith,
        microservice, source file, queue or database design.
      featureOwner: gamification
      ownership: Defined once in this feature. Other features reference the stable
        requirement/data/journey ID and current Work node ID.
      authorityRefs:
        - artifact: SRC-BUSINESS
          sections:
            - "9.1"
            - "4.3"
        - artifact: SRC-BRIEF
          sections:
            - "4"
            - "5"
            - "6"
            - "7"
      trigger: Open a competency milestone

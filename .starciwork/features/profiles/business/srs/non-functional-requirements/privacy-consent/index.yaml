extensions:
  work3:
    srs:
      schema: starci/srs-non-functional-requirement@1
      status: draft
      authority: proposed-detail-from-accepted-product-scope
      id: NFR-PRIV
      title: Privacy and consent propagation
      scope:
        - all
      requirement: Private learning data stays private across profile, CV, mentoring, community and
        recruitment; withdrawal affects future access.
      decisionRefs:
        - D08
      measurement:
        metric: No field outside the explicit resource/audience share selection in the defined sharing
          matrix; retention windows await D08.
        conditions: Create private weak-area and failed-attempt fixtures plus selected public evidence; open
          existing links before and after withdrawal.
        thresholdStatus: Quantitative/policy targets referenced above are open; deterministic invariants
          below are reviewable now.
        evidenceRequired: Record scenario, input/source/policy versions, environment/load, observation
          timestamps, actual outcomes and metric calculation; do not substitute a document check for
          runtime evidence.
      acceptanceCriteria:
        - id: NFR-PRIV.AC1
          given: Create private weak-area and failed-attempt fixtures plus selected public evidence; open
            existing links before and after withdrawal.
          when: Publish a selected profile, apply with a selected CV, then withdraw one source permission.
          then: Only selected fields are visible; future disallowed reads fail; authorized history and
            unavailable evidence are labeled; no promise of erasing external exports.
      tradeoffBoundary: SDS proposes optimizations and capacity choices within these obligations. Privacy,
        consent, financial truth and evidence provenance cannot be relaxed to improve latency or
        cost.
      featureOwner: profiles
      ownership: Defined once in this feature. Other features reference the stable
        requirement/data/journey ID and current Work node ID.

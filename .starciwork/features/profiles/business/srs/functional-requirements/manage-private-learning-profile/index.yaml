extensions:
  work3:
    srs:
      schema: starci/srs-functional-requirement@1
      status: draft
      authority: proposed-detail-from-accepted-product-scope
      id: FR-PROFILE-01
      title: Manage the private learning profile and its evidence
      domain: profiles
      goal: Manage the private learning profile and its evidence
      priority: release-priority-awaits-D01
      actors:
        - learner
      preconditions:
        - The actor owns the profile or holds explicitly scoped representation authority.
        - Each protected step checks the acting identity, current resource/action/audience rights
          and any applicable entitlement.
        - Policy-dependent effects run only with the relevant approved policy; unresolved values
          remain explicit decision dependencies and do not block writing/reviewing this draft.
      inputs:
        - id: FR-PROFILE-01.IN1
          name: privateProfile
          validation: Owned learning profile and underlying evidence references
          dataRefs:
            - DATA-profile
            - DATA-progress
            - DATA-evidence
            - DATA-interview
        - id: FR-PROFILE-01.IN2
          name: selfDescriptionChange
          validation: Learner-supplied fields; cannot rewrite assessment evidence
          dataRefs:
            - DATA-profile
            - DATA-progress
            - DATA-evidence
            - DATA-interview
      outputs:
        - name: result-1
          fromStep: FR-PROFILE-01.MAIN.S1
          meaning: Show owned goals, learning progress, attempts and feedback
          effect: Learning history is separate from the public career presentation.
        - name: result-2
          fromStep: FR-PROFILE-01.MAIN.S2
          meaning: Show the source, version, assessment method and current availability
          effect: Reading, practice and verified outcomes remain distinguishable.
        - name: result-3
          fromStep: FR-PROFILE-01.MAIN.S3
          meaning: Preview the changed learner-provided information
          effect: Self-description does not change assessment evidence.
        - name: result-4
          fromStep: FR-PROFILE-01.MAIN.S4
          meaning: Record the updated private profile fields
          effect: Public profile fields change only through their own sharing action.
      businessRuleRefs:
        - BR-PRIVACY
        - BR-EVIDENCE
        - BR-MASTERY
      dataRefs:
        - DATA-profile
        - DATA-progress
        - DATA-evidence
        - DATA-interview
      nonFunctionalRefs:
        - NFR-SEC
        - NFR-PRIV
        - NFR-INTEGRITY
        - NFR-RELIABILITY
        - NFR-REPEAT
        - NFR-LATENCY
        - NFR-USABILITY
        - NFR-AUDIT
      decisionRefs:
        - D08
        - D05
        - D07
        - D11
        - D03
        - D12
      directPolicyRefs:
        - D08
      decisionTreatment: Direct policy refs affect the named feature behavior; inherited refs govern
        cross-cutting rules and measurement targets. Open policies are not selected by this draft.
      mainFlow:
        id: FR-PROFILE-01.MAIN
        trigger: Open the personal learning profile
        steps:
          - id: FR-PROFILE-01.MAIN.S1
            actor: learner
            request: Open the personal learning profile
            systemResponse: Show owned goals, learning progress, attempts and feedback
            businessEffect: Learning history is separate from the public career presentation.
            acceptanceRefs:
              - FR-PROFILE-01.AC.M1
          - id: FR-PROFILE-01.MAIN.S2
            actor: learner
            request: Inspect a progress or evidence item
            systemResponse: Show the source, version, assessment method and current availability
            businessEffect: Reading, practice and verified outcomes remain distinguishable.
            acceptanceRefs:
              - FR-PROFILE-01.AC.M2
          - id: FR-PROFILE-01.MAIN.S3
            actor: learner
            request: Update self-description or learning goals
            systemResponse: Preview the changed learner-provided information
            businessEffect: Self-description does not change assessment evidence.
            acceptanceRefs:
              - FR-PROFILE-01.AC.M3
          - id: FR-PROFILE-01.MAIN.S4
            actor: learner
            request: Save the reviewed changes
            systemResponse: Record the updated private profile fields
            businessEffect: Public profile fields change only through their own sharing action.
            acceptanceRefs:
              - FR-PROFILE-01.AC.M4
        end:
          type: completed-main-flow
          outcome: Public profile fields change only through their own sharing action.
      alternativeFlows:
        - id: FR-PROFILE-01.ALT1
          title: The learner follows a gap back to learning
          fromStep: FR-PROFILE-01.MAIN.S2
          condition: The learner follows a gap back to learning
          steps:
            - id: FR-PROFILE-01.ALT1.S1
              actor: learner
              request: Open the linked concept or practice activity
              systemResponse: Preserve the profile context
              businessEffect: No competency is awarded by navigation.
              acceptanceRefs:
                - FR-PROFILE-01.AC.ALT1
          resume:
            type: end
            outcome: No competency is awarded by navigation.
          postconditions:
            - No competency is awarded by navigation.
          continuation: This flow instance ends with the stated outcome. A permitted correction, status lookup
            or deliberate new request follows the response and current policy; it does not imply a
            successful main outcome.
          acceptanceRefs:
            - FR-PROFILE-01.AC.ALT1
      exceptionFlows:
        - id: FR-PROFILE-01.EX1
          title: Another actor lacks access to the private profile
          fromStep: FR-PROFILE-01.MAIN.S1
          condition: Another actor lacks access to the private profile
          steps:
            - id: FR-PROFILE-01.EX1.S1
              actor: learner
              request: Request the learning history
              systemResponse: Deny access
              businessEffect: Mentor status alone does not grant access.
              acceptanceRefs:
                - FR-PROFILE-01.AC.EX1
          resume:
            type: end
            outcome: Mentor status alone does not grant access.
          postconditions:
            - Mentor status alone does not grant access.
          continuation: This flow instance ends with the stated outcome. A permitted correction, status lookup
            or deliberate new request follows the response and current policy; it does not imply a
            successful main outcome.
          acceptanceRefs:
            - FR-PROFILE-01.AC.EX1
        - id: FR-PROFILE-01.EX2
          title: An evidence source is no longer available
          fromStep: FR-PROFILE-01.MAIN.S2
          condition: An evidence source is no longer available
          steps:
            - id: FR-PROFILE-01.EX2.S1
              actor: learner
              request: Inspect the evidence
              systemResponse: Show historical attribution and current availability limits
              businessEffect: No false current verification claim.
              acceptanceRefs:
                - FR-PROFILE-01.AC.EX2
          resume:
            type: end
            outcome: No false current verification claim.
          postconditions:
            - No false current verification claim.
          continuation: This flow instance ends with the stated outcome. A permitted correction, status lookup
            or deliberate new request follows the response and current policy; it does not imply a
            successful main outcome.
          acceptanceRefs:
            - FR-PROFILE-01.AC.EX2
      postconditions:
        success:
          - Learning history is separate from the public career presentation.
          - Reading, practice and verified outcomes remain distinguishable.
          - Self-description does not change assessment evidence.
          - Public profile fields change only through their own sharing action.
        failure:
          - Only effects explicitly completed before the branch remain, with their original
            attribution.
          - No rejected or unresolved operation is presented as the successful main outcome.
          - Mentor status alone does not grant access.
          - No false current verification claim.
      acceptanceCriteria:
        - id: FR-PROFILE-01.AC.M1
          flowRef: FR-PROFILE-01.MAIN
          stepRefs:
            - FR-PROFILE-01.MAIN.S1
          given:
            - The actor owns the profile or holds explicitly scoped representation authority.
            - Each protected step checks the acting identity, current resource/action/audience
              rights and any applicable entitlement.
            - Policy-dependent effects run only with the relevant approved policy; unresolved values
              remain explicit decision dependencies and do not block writing/reviewing this draft.
          when: Open the personal learning profile
          then:
            - Show owned goals, learning progress, attempts and feedback
            - Learning history is separate from the public career presentation.
        - id: FR-PROFILE-01.AC.M2
          flowRef: FR-PROFILE-01.MAIN
          stepRefs:
            - FR-PROFILE-01.MAIN.S2
          given:
            - The previous main-flow step FR-PROFILE-01.MAIN.S1 completed with its stated result.
            - Each protected step checks the acting identity, current resource/action/audience
              rights and any applicable entitlement.
            - Policy-dependent effects run only with the relevant approved policy; unresolved values
              remain explicit decision dependencies and do not block writing/reviewing this draft.
          when: Inspect a progress or evidence item
          then:
            - Show the source, version, assessment method and current availability
            - Reading, practice and verified outcomes remain distinguishable.
        - id: FR-PROFILE-01.AC.M3
          flowRef: FR-PROFILE-01.MAIN
          stepRefs:
            - FR-PROFILE-01.MAIN.S3
          given:
            - The previous main-flow step FR-PROFILE-01.MAIN.S2 completed with its stated result.
            - Each protected step checks the acting identity, current resource/action/audience
              rights and any applicable entitlement.
            - Policy-dependent effects run only with the relevant approved policy; unresolved values
              remain explicit decision dependencies and do not block writing/reviewing this draft.
          when: Update self-description or learning goals
          then:
            - Preview the changed learner-provided information
            - Self-description does not change assessment evidence.
        - id: FR-PROFILE-01.AC.M4
          flowRef: FR-PROFILE-01.MAIN
          stepRefs:
            - FR-PROFILE-01.MAIN.S4
          given:
            - The previous main-flow step FR-PROFILE-01.MAIN.S3 completed with its stated result.
            - Each protected step checks the acting identity, current resource/action/audience
              rights and any applicable entitlement.
            - Policy-dependent effects run only with the relevant approved policy; unresolved values
              remain explicit decision dependencies and do not block writing/reviewing this draft.
          when: Save the reviewed changes
          then:
            - Record the updated private profile fields
            - Public profile fields change only through their own sharing action.
        - id: FR-PROFILE-01.AC.ALT1
          flowRef: FR-PROFILE-01.ALT1
          stepRefs:
            - FR-PROFILE-01.ALT1.S1
          given:
            - Execution reaches FR-PROFILE-01.MAIN.S2.
            - The learner follows a gap back to learning
          when: Open the linked concept or practice activity
          then:
            - Preserve the profile context
            - No competency is awarded by navigation.
        - id: FR-PROFILE-01.AC.EX1
          flowRef: FR-PROFILE-01.EX1
          stepRefs:
            - FR-PROFILE-01.EX1.S1
          given:
            - Execution reaches FR-PROFILE-01.MAIN.S1.
            - Another actor lacks access to the private profile
          when: Request the learning history
          then:
            - Deny access
            - Mentor status alone does not grant access.
        - id: FR-PROFILE-01.AC.EX2
          flowRef: FR-PROFILE-01.EX2
          stepRefs:
            - FR-PROFILE-01.EX2.S1
          given:
            - Execution reaches FR-PROFILE-01.MAIN.S2.
            - An evidence source is no longer available
          when: Inspect the evidence
          then:
            - Show historical attribution and current availability limits
            - No false current verification claim.
      nonFunctionalApplication:
        - id: NFR-SEC
          scope: Main flow and every alternative/exception, including re-entry and current-rights checks.
        - id: NFR-PRIV
          scope: Main flow and every alternative/exception, including re-entry and current-rights checks.
        - id: NFR-INTEGRITY
          scope: Main flow and every alternative/exception, including re-entry and current-rights checks.
        - id: NFR-RELIABILITY
          scope: Main flow and every alternative/exception, including re-entry and current-rights checks.
        - id: NFR-REPEAT
          scope: Main flow and every alternative/exception, including re-entry and current-rights checks.
        - id: NFR-LATENCY
          scope: Main flow and every alternative/exception, including re-entry and current-rights checks.
        - id: NFR-USABILITY
          scope: Main flow and every alternative/exception, including re-entry and current-rights checks.
        - id: NFR-AUDIT
          scope: Main flow and every alternative/exception, including re-entry and current-rights checks.
      designHandoff: SDS must map these requirement/flow/step IDs to actual entry points, boundaries, data
        operations, failure paths and verification evidence. This SRS chooses no monolith,
        microservice, source file, queue or database design.
      featureOwner: profiles
      ownership: Defined once in this feature. Other features reference the stable

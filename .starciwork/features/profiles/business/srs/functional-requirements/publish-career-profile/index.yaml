      id: FR-PROFILE-02
      title: Publish selected career evidence to a chosen audience
      domain: profiles
      goal: Publish selected career evidence to a chosen audience
      priority: release-priority-awaits-D01
      actors:
        - learner
      preconditions:
        - The actor owns the profile or holds explicitly scoped representation authority.
        - Each protected step checks the acting identity, current resource/action/audience rights
          and any applicable entitlement.
        - Policy-dependent effects run only with the relevant approved policy; unresolved values
          remain explicit decision dependencies and do not block writing/reviewing this draft.
      inputs:
        - id: FR-PROFILE-02.IN1
          name: careerFields
          validation: Selected claims and shareable evidence
          dataRefs:
            - DATA-profile
            - DATA-evidence
            - DATA-share-grant
            - DATA-cv
        - id: FR-PROFILE-02.IN2
          name: audienceChoice
          validation: Explicit recipient scope and reviewed publication version
          dataRefs:
            - DATA-profile
            - DATA-evidence
            - DATA-share-grant
            - DATA-cv
      outputs:
        - name: result-1
          fromStep: FR-PROFILE-02.MAIN.S1
          meaning: Show a preview of the selected professional profile
          effect: Private practice history is excluded unless explicitly selected and permitted.
        - name: result-2
          fromStep: FR-PROFILE-02.MAIN.S2
          meaning: Explain which profile fields and evidence can be viewed
          effect: Sharing a profile does not grant all underlying source access.
        - name: result-3
          fromStep: FR-PROFILE-02.MAIN.S3
          meaning: Record the selected version and share scope
          effect: Recipients can view only the permitted presentation.
        - name: result-4
          fromStep: FR-PROFILE-02.MAIN.S4
          meaning: Show evidence labels, sources and limitations
          effect: The learner can inspect exactly what the audience sees.

      mainFlow:
        id: FR-PROFILE-02.MAIN
        trigger: Choose career profile fields and evidence to present
        steps:
          - id: FR-PROFILE-02.MAIN.S1
            actor: learner
            request: Choose career profile fields and evidence to present
            systemResponse: Show a preview of the selected professional profile
            businessEffect: Private practice history is excluded unless explicitly selected and permitted.
            acceptanceRefs:
              - FR-PROFILE-02.AC.M1
          - id: FR-PROFILE-02.MAIN.S2
            actor: learner
            request: Choose the audience and sharing scope
            systemResponse: Explain which profile fields and evidence can be viewed
            businessEffect: Sharing a profile does not grant all underlying source access.
            acceptanceRefs:
              - FR-PROFILE-02.AC.M2
          - id: FR-PROFILE-02.MAIN.S3
            actor: learner
            request: Publish the reviewed profile
            systemResponse: Record the selected version and share scope
            businessEffect: Recipients can view only the permitted presentation.
            acceptanceRefs:
              - FR-PROFILE-02.AC.M3
          - id: FR-PROFILE-02.MAIN.S4
            actor: learner
            request: View the profile as the intended audience
            systemResponse: Show evidence labels, sources and limitations
            businessEffect: The learner can inspect exactly what the audience sees.
            acceptanceRefs:
              - FR-PROFILE-02.AC.M4
        end:
          type: completed-main-flow
          outcome: The learner can inspect exactly what the audience sees.
      alternativeFlows:
        - id: FR-PROFILE-02.ALT1
          title: The learner keeps the profile private
          fromStep: FR-PROFILE-02.MAIN.S2
          condition: The learner keeps the profile private
          steps:
            - id: FR-PROFILE-02.ALT1.S1
              actor: learner
              request: Cancel publishing
              systemResponse: Preserve the private draft
              businessEffect: No public or recruiter visibility.
              acceptanceRefs:
                - FR-PROFILE-02.AC.ALT1
          resume:
            type: end
            outcome: No public or recruiter visibility.
          postconditions:
            - No public or recruiter visibility.
          continuation: This flow instance ends with the stated outcome. A permitted correction, status lookup
            or deliberate new request follows the response and current policy; it does not imply a
            successful main outcome.
          acceptanceRefs:
            - FR-PROFILE-02.AC.ALT1
      exceptionFlows:
        - id: FR-PROFILE-02.EX1
          title: A selected evidence item is not owned or shareable
          fromStep: FR-PROFILE-02.MAIN.S3
          condition: A selected evidence item is not owned or shareable
          steps:
            - id: FR-PROFILE-02.EX1.S1
              actor: learner
              request: Publish the profile
              systemResponse: Identify the excluded item and require a revised preview
              businessEffect: No unauthorized evidence disclosure.
              acceptanceRefs:
                - FR-PROFILE-02.AC.EX1
          resume:
            type: end
            outcome: No unauthorized evidence disclosure.
          postconditions:
            - No unauthorized evidence disclosure.
          continuation: This flow instance ends with the stated outcome. A permitted correction, status lookup

            successful main outcome.
          acceptanceRefs:
            - FR-PROFILE-02.AC.EX1
        - id: FR-PROFILE-02.EX2
          title: The recipient lacks the selected audience right
          fromStep: FR-PROFILE-02.MAIN.S4
          condition: The recipient lacks the selected audience right
          steps:
            - id: FR-PROFILE-02.EX2.S1
              actor: learner
              request: Open the profile
              systemResponse: Show safe denial or the permitted public subset
              businessEffect: No private learning history leaks.
              acceptanceRefs:
                - FR-PROFILE-02.AC.EX2
          resume:
            type: end
            outcome: No private learning history leaks.
          postconditions:
            - No private learning history leaks.
          continuation: This flow instance ends with the stated outcome. A permitted correction, status lookup
            or deliberate new request follows the response and current policy; it does not imply a
            successful main outcome.
          acceptanceRefs:
            - FR-PROFILE-02.AC.EX2
      postconditions:
        success:
          - Private practice history is excluded unless explicitly selected and permitted.
          - Sharing a profile does not grant all underlying source access.
          - Recipients can view only the permitted presentation.
          - The learner can inspect exactly what the audience sees.
        failure:
          - Only effects explicitly completed before the branch remain, with their original
            attribution.
          - No rejected or unresolved operation is presented as the successful main outcome.
          - No unauthorized evidence disclosure.
          - No private learning history leaks.

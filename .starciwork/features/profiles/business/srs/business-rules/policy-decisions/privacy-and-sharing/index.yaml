      title: Privacy, sharing, retention and withdrawal
      decisionStatus: open
      accountableRole: Product owner with privacy and data owners
      ownerAssignmentStatus: Proposed accountable business role; named person not assigned by this document.
      question: What can each audience see, how long is data retained, and what happens to applications,
        reviews and exports when evidence or consent is withdrawn?
      requiredDecisions:
        - Approve a resource/action/audience matrix and consent scope.
        - Define live references versus retained authorized snapshots and their expiry.
        - Define export, closure, deletion and external-copy limitations.
      safeDisposition: Default to owner-scoped private learning records; no automatic public profile or
        guarantee of deleting external copies.

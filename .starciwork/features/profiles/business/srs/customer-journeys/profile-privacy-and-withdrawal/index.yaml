description: Control learning privacy and career sharing
refs:
  - starci-next.business.srs.functional-requirements.profiles.manage-private-learning-profile
  - starci-next.business.srs.functional-requirements.profiles.publish-career-profile
  - starci-next.business.srs.functional-requirements.cv.export-and-share-cv
  - starci-next.business.srs.functional-requirements.profiles.revise-or-withdraw-sharing

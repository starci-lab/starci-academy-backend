schema: work/node@2
id: starci-next.business.srs.data.profile
kind: business
required: true
state: todo
description: Private, career, mentor or organization profile
refs:
  - starci-next.business.srs.business-rules.policy-decisions.privacy-and-sharing
  - starci-next.business.srs.business-rules.policy-decisions.mentor-service
  - starci-next.business.srs.business-rules.policy-decisions.recruitment-trust
extensions:
  work3:
    srs:
      schema: starci/srs-data-definition@1
      status: draft
      authority: proposed-detail-from-accepted-product-scope
      id: DATA-profile
      title: Private, career, mentor or organization profile
      modelLevel: Proposed logical business contract; physical storage, indexes and APIs belong to SDS.
      owner: profile subject or scoped representative
      fields:
        - name: id
          meaning: Stable logical record identity
          validation: Required, unique and not changed by a state transition
          classification: context-scoped
        - name: version
          meaning: Record/content revision used for attribution and confirmation
          validation: Identify the reviewed version; changed content must not impersonate an earlier revision
          classification: context-scoped
        - name: profileKind
          meaning: Learning, career, mentor or organization context
          validation: Required visibility/authority type
          classification: restricted
        - name: fieldSelections
          meaning: Included facts, claims and evidence
          validation: Each field has owner and allowed audience
          classification: private
        - name: verificationLabels
          meaning: Self-reported, supported or independently verified claims
          validation: Must match actual proof and approved verification policy
          classification: selected-public
        - name: publicationVersion
          meaning: Reviewed display version and audience
          validation: No automatic public release from account creation
          classification: restricted
      relations:
        - dataRef: DATA-account
          meaning: Referenced business identity/version; lookup never grants access by itself.
        - dataRef: DATA-organization
          meaning: Referenced business identity/version; lookup never grants access by itself.
        - dataRef: DATA-evidence
          meaning: Referenced business identity/version; lookup never grants access by itself.
        - dataRef: DATA-share-grant
          meaning: Referenced business identity/version; lookup never grants access by itself.
      states:
        - private-draft
        - published
        - needs-review
        - withdrawn
      transitions:
        - id: DATA-profile.T1
          from: private-draft
          to: published
          event: Owner approves selected sharing
          guard: Current authority and field-level consent valid
        - id: DATA-profile.T2
          from: published
          to: needs-review
          event: Evidence or permission changes
          guard: Expose applicable verification limits
        - id: DATA-profile.T3
          from: needs-review
          to: published
          event: Approve corrected profile
          guard: Selected claims and rights reviewed
        - id: DATA-profile.T4
          from: published
          to: withdrawn
          event: Owner withdraws managed profile
          guard: Future audience access follows D08
      invariants:
        - Private learning gaps are not implicitly career profile fields.
      decisionRefs:
        - D08
        - D10
        - D11
      privacy:
        access: Apply current owner, role, resource and audience grants. A selected-public field is exposed
          only after authorized publication.
        retention: D08 selects retention/export/closure behavior. No storage duration or automatic deletion
          policy is inferred.
        referenceWithdrawal: Preserve permitted provenance while preventing newly unauthorized source
          access; retained snapshots require approved D08 purpose and scope.
      validationCases:
        - given: An actor without current rights references this profile.
          when: Read or mutate the record.
          then: Deny the unauthorized action without disclosing restricted fields.
        - given: A record in a declared state and an attributed authorized event.
          when: Apply a listed transition.
          then: Require its guard, retain the prior version attribution and reject a transition unsupported by
            policy.
      featureOwner: profiles
      ownership: Defined once in this feature. Other features reference the stable
        requirement/data/journey ID and current Work node ID.

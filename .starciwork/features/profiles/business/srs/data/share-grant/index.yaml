schema: work/node@2
id: starci-next.business.srs.data.share-grant
kind: business
required: true
state: todo
description: Purpose and audience-specific sharing grant
refs:
  - starci-next.business.srs.business-rules.policy-decisions.privacy-and-sharing
extensions:
  work3:
    srs:
      schema: starci/srs-data-definition@1
      status: draft
      authority: proposed-detail-from-accepted-product-scope
      id: DATA-share-grant
      title: Purpose and audience-specific sharing grant
      modelLevel: Proposed logical business contract; physical storage, indexes and APIs belong to SDS.
      owner: resource owner or authorized controller
      fields:
        - name: id
          meaning: Stable logical record identity
          validation: Required, unique and not changed by a state transition
          classification: context-scoped
        - name: version
          meaning: Record/content revision used for attribution and confirmation
          validation: Identify the reviewed version; changed content must not impersonate an earlier revision
          classification: context-scoped
        - name: resourcesAndVersions
          meaning: Selected content for sharing
          validation: Explicit owned/authorized resources and version scope
          classification: restricted
        - name: audienceAndPurpose
          meaning: Who may see what and why
          validation: Required resource/action/audience boundaries
          classification: restricted
        - name: effectiveConditions
          meaning: Grant duration and permitted retained use
          validation: D08 policy required; no invented indefinite retention
          classification: restricted
        - name: consentRecord
          meaning: Actor and reviewed scope
          validation: Required for publication/application consent
          classification: restricted
      relations:
        - dataRef: DATA-account
          meaning: Referenced business identity/version; lookup never grants access by itself.
        - dataRef: DATA-evidence
          meaning: Referenced business identity/version; lookup never grants access by itself.
        - dataRef: DATA-profile
          meaning: Referenced business identity/version; lookup never grants access by itself.
        - dataRef: DATA-cv
          meaning: Referenced business identity/version; lookup never grants access by itself.
        - dataRef: DATA-application
          meaning: Referenced business identity/version; lookup never grants access by itself.
      states:
        - proposed
        - active
        - withdrawn
        - expired
      transitions:
        - id: DATA-share-grant.T1
          from: proposed
          to: active
          event: Owner confirms reviewed scope
          guard: Authority and D08 policy satisfied
        - id: DATA-share-grant.T2
          from: active
          to: withdrawn
          event: Owner withdraws managed access
          guard: Record effective withdrawal and allowed retained use
        - id: DATA-share-grant.T3
          from: active
          to: expired
          event: Reach approved grant boundary
          guard: Future access denied outside remaining valid rights
      invariants:
        - An application grant does not expose the whole learning account.
      decisionRefs:
        - D08
      privacy:
        access: Apply current owner, role, resource and audience grants. A selected-public field is exposed
          only after authorized publication.
        retention: D08 selects retention/export/closure behavior. No storage duration or automatic deletion
          policy is inferred.
        referenceWithdrawal: Preserve permitted provenance while preventing newly unauthorized source
          access; retained snapshots require approved D08 purpose and scope.
      validationCases:
        - given: An actor without current rights references this share-grant.
          when: Read or mutate the record.
          then: Deny the unauthorized action without disclosing restricted fields.
        - given: A record in a declared state and an attributed authorized event.
          when: Apply a listed transition.
          then: Require its guard, retain the prior version attribution and reject a transition unsupported by
            policy.
      featureOwner: profiles
      ownership: Defined once in this feature. Other features reference the stable
        requirement/data/journey ID and current Work node ID.

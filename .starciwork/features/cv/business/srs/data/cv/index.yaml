schema: work/node@2
id: starci-next.business.srs.data.cv
kind: business
required: true
state: todo
description: Learner-reviewed CV version
refs:
  - starci-next.business.srs.business-rules.policy-decisions.privacy-and-sharing
extensions:
  work3:
    srs:
      schema: starci/srs-data-definition@1
      status: draft
      authority: proposed-detail-from-accepted-product-scope
      id: DATA-cv
      title: Learner-reviewed CV version
      modelLevel: Proposed logical business contract; physical storage, indexes and APIs belong to SDS.
      owner: learner
      fields:
        - name: id
          meaning: Stable logical record identity
          validation: Required, unique and not changed by a state transition
          classification: context-scoped
        - name: version
          meaning: Record/content revision used for attribution and confirmation
          validation: Identify the reviewed version; changed content must not impersonate an earlier revision
          classification: context-scoped
        - name: targetRole
          meaning: Role/context for this CV
          validation: Optional learner selection; no automatic application
          classification: private
        - name: selectedFacts
          meaning: Chosen experience and evidence-supported claims
          validation: Unsupported generated claims must be corrected or explicitly self-reported
          classification: private
        - name: renderedContent
          meaning: Learner-edited candidate and accepted wording
          validation: Export binds the reviewed version
          classification: private
        - name: evidenceRefs
          meaning: Sources supporting individual claims
          validation: Exact version and current visibility known
          classification: restricted
      relations:
        - dataRef: DATA-evidence
          meaning: Referenced business identity/version; lookup never grants access by itself.
        - dataRef: DATA-profile
          meaning: Referenced business identity/version; lookup never grants access by itself.
        - dataRef: DATA-share-grant
          meaning: Referenced business identity/version; lookup never grants access by itself.
        - dataRef: DATA-application
          meaning: Referenced business identity/version; lookup never grants access by itself.
      states:
        - draft
        - accepted
        - shared
        - superseded
        - withdrawn
      transitions:
        - id: DATA-cv.T1
          from: draft
          to: accepted
          event: Learner accepts reviewed wording
          guard: No invented factual claim remains presented as verified
        - id: DATA-cv.T2
          from: accepted
          to: shared
          event: Confirm export/share audience
          guard: Selected version and grant reviewed
        - id: DATA-cv.T3
          from: accepted
          to: superseded
          event: Accept replacement CV
          guard: Old version and applications remain attributable
        - id: DATA-cv.T4
          from: shared
          to: withdrawn
          event: Withdraw managed sharing
          guard: D08 retention and external-copy limits explained
      invariants:
        - AI suggestions do not overwrite accepted user wording.
      decisionRefs:
        - D08
      privacy:
        access: Apply current owner, role, resource and audience grants. A selected-public field is exposed
          only after authorized publication.
        retention: D08 selects retention/export/closure behavior. No storage duration or automatic deletion
          policy is inferred.
        referenceWithdrawal: Preserve permitted provenance while preventing newly unauthorized source
          access; retained snapshots require approved D08 purpose and scope.
      validationCases:
        - given: An actor without current rights references this cv.
          when: Read or mutate the record.
          then: Deny the unauthorized action without disclosing restricted fields.
        - given: A record in a declared state and an attributed authorized event.
          when: Apply a listed transition.
          then: Require its guard, retain the prior version attribution and reject a transition unsupported by
            policy.
      featureOwner: cv
      ownership: Defined once in this feature. Other features reference the stable
        requirement/data/journey ID and current Work node ID.

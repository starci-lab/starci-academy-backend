            - No persistent exposure through an old profile version.
        - id: FR-MENT-01.AC.EX2
          flowRef: FR-MENT-01.EX2
          stepRefs:
            - FR-MENT-01.EX2.S1
          given:
            - Execution reaches FR-MENT-01.MAIN.S2.
            - The claimed expertise lacks supporting evidence
          when: Save the description
          then:
            - Label it self-reported where permitted
            - Do not grant a verified credential.

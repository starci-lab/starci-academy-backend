      mainFlow:
        id: FR-MENT-01.MAIN
        trigger: Open mentor profile editing under a held role
        steps:
          - id: FR-MENT-01.MAIN.S1
            actor: mentor
            request: Open mentor profile editing under a held role
            systemResponse: Show the owner-controlled mentor profile and permitted fields
            businessEffect: Mentor role does not grant access to learner records.
            acceptanceRefs:
              - FR-MENT-01.AC.M1
          - id: FR-MENT-01.MAIN.S2
            actor: mentor
            request: Describe expertise and select evidence for display
            systemResponse: Separate self-description, evidence and independently verified claims
            businessEffect: No verification badge is implied by editing a profile.
            acceptanceRefs:
              - FR-MENT-01.AC.M2
          - id: FR-MENT-01.MAIN.S3
            actor: mentor
            request: Review audience and support availability
            systemResponse: Show the selected public information and approved service terms if applicable
            businessEffect: Unapproved paid support or response commitments cannot be advertised as available.
            acceptanceRefs:
              - FR-MENT-01.AC.M3
          - id: FR-MENT-01.MAIN.S4
            actor: mentor
            request: Publish the reviewed profile
            systemResponse: Show the scoped mentor presence and a permitted request path
            businessEffect: Private learner or project evidence is included only with current permission.
            acceptanceRefs:
              - FR-MENT-01.AC.M4
        end:
          type: completed-main-flow
          outcome: Private learner or project evidence is included only with current permission.
      alternativeFlows:
        - id: FR-MENT-01.ALT1
          title: Mentor service policy is not yet enabled
          fromStep: FR-MENT-01.MAIN.S3
          condition: Mentor service policy is not yet enabled
          steps:
            - id: FR-MENT-01.ALT1.S1
              actor: mentor
              request: Publish an informational profile without paid commitments
              systemResponse: Show expertise with supported contact/request capabilities only
              businessEffect: No fee or SLA is invented.
              acceptanceRefs:
                - FR-MENT-01.AC.ALT1
          resume:
            type: end
            outcome: No fee or SLA is invented.
          postconditions:
            - No fee or SLA is invented.
          continuation: This flow instance ends with the stated outcome. A permitted correction, status lookup
            or deliberate new request follows the response and current policy; it does not imply a
            successful main outcome.
          acceptanceRefs:
            - FR-MENT-01.AC.ALT1
      exceptionFlows:
        - id: FR-MENT-01.EX1
          title: The mentor role or supporting evidence permission is withdrawn
          fromStep: FR-MENT-01.MAIN.S4
          condition: The mentor role or supporting evidence permission is withdrawn
          steps:
            - id: FR-MENT-01.EX1.S1
              actor: mentor
              request: Publish or revisit the profile
              systemResponse: Withhold newly unauthorized claims/content and explain affected fields
              businessEffect: No persistent exposure through an old profile version.
              acceptanceRefs:
                - FR-MENT-01.AC.EX1
          resume:
            type: end
            outcome: No persistent exposure through an old profile version.
          postconditions:
            - No persistent exposure through an old profile version.
          continuation: This flow instance ends with the stated outcome. A permitted correction, status lookup
            or deliberate new request follows the response and current policy; it does not imply a
            successful main outcome.
          acceptanceRefs:
            - FR-MENT-01.AC.EX1
        - id: FR-MENT-01.EX2
          title: The claimed expertise lacks supporting evidence
          fromStep: FR-MENT-01.MAIN.S2
          condition: The claimed expertise lacks supporting evidence
          steps:
            - id: FR-MENT-01.EX2.S1
              actor: mentor
              request: Save the description
              systemResponse: Label it self-reported where permitted
              businessEffect: Do not grant a verified credential.
              acceptanceRefs:
                - FR-MENT-01.AC.EX2
          resume:
            type: end
            outcome: Do not grant a verified credential.
          postconditions:
            - Do not grant a verified credential.
          continuation: This flow instance ends with the stated outcome. A permitted correction, status lookup
            or deliberate new request follows the response and current policy; it does not imply a
            successful main outcome.
          acceptanceRefs:
            - FR-MENT-01.AC.EX2
      postconditions:
        success:
          - Mentor role does not grant access to learner records.
          - No verification badge is implied by editing a profile.
          - Unapproved paid support or response commitments cannot be advertised as available.
          - Private learner or project evidence is included only with current permission.
        failure:
          - Only effects explicitly completed before the branch remain, with their original
            attribution.
          - No rejected or unresolved operation is presented as the successful main outcome.
          - No persistent exposure through an old profile version.
          - Do not grant a verified credential.
      acceptanceCriteria:

      status: draft
      authority: proposed-detail-from-accepted-product-scope
      id: FR-MENT-01
      title: Present mentor expertise and available support scope
      domain: mentoring
      goal: Present mentor expertise and available support scope
      priority: release-priority-awaits-D01
      actors:
        - mentor
      preconditions:
        - The held mentor role or learner request scope is identifiable; service commitments require
          enabled terms.
        - Each protected step checks the acting identity, current resource/action/audience rights
          and any applicable entitlement.
        - Policy-dependent effects run only with the relevant approved policy; unresolved values
          remain explicit decision dependencies and do not block writing/reviewing this draft.
      inputs:
        - id: FR-MENT-01.IN1
          name: heldMentorContext
          validation: Mentor role and owner profile
          dataRefs:
            - DATA-profile
            - DATA-account
            - DATA-share-grant
        - id: FR-MENT-01.IN2
          name: expertiseSelections
          validation: Description, selected evidence, audience and approved support scope
          dataRefs:
            - DATA-profile
            - DATA-account
            - DATA-share-grant
      outputs:
        - name: result-1
          fromStep: FR-MENT-01.MAIN.S1
          meaning: Show the owner-controlled mentor profile and permitted fields
          effect: Mentor role does not grant access to learner records.
        - name: result-2
          fromStep: FR-MENT-01.MAIN.S2
          meaning: Separate self-description, evidence and independently verified claims
          effect: No verification badge is implied by editing a profile.
        - name: result-3
          fromStep: FR-MENT-01.MAIN.S3
          meaning: Show the selected public information and approved service terms if applicable
          effect: Unapproved paid support or response commitments cannot be advertised as available.
        - name: result-4
          fromStep: FR-MENT-01.MAIN.S4
          meaning: Show the scoped mentor presence and a permitted request path
          effect: Private learner or project evidence is included only with current permission.
      businessRuleRefs:
        - BR-PRIVACY
        - BR-EVIDENCE
        - BR-RIGHTS
      dataRefs:
        - DATA-profile
        - DATA-account
        - DATA-share-grant

            - No fee or SLA is invented.
        - id: FR-MENT-01.AC.EX1
          flowRef: FR-MENT-01.EX1
          stepRefs:
            - FR-MENT-01.EX1.S1
          given:
            - Execution reaches FR-MENT-01.MAIN.S4.
            - The mentor role or supporting evidence permission is withdrawn
          when: Publish or revisit the profile
          then:

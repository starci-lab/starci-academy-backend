      mainFlow:
        id: FR-MENT-02.MAIN
        trigger: Choose a mentor and the evidence requiring feedback
        steps:
          - id: FR-MENT-02.MAIN.S1
            actor: learner
            request: Choose a mentor and the evidence requiring feedback
            systemResponse: Show the intended reviewer, evidence versions and share scope
            businessEffect: The learner private profile is excluded unless explicitly selected.
            acceptanceRefs:
              - FR-MENT-02.AC.M1
          - id: FR-MENT-02.MAIN.S2
            actor: learner
            request: Review available support terms and consent to the request
            systemResponse: Create the request only under enabled mentor policy
            businessEffect: Consent is scoped to this evidence and purpose.
            acceptanceRefs:
              - FR-MENT-02.AC.M2
          - id: FR-MENT-02.MAIN.S3
            actor: mentor
            request: Have the mentor accept or decline the request
            systemResponse: Show the request disposition and any approved completion expectation
            businessEffect: A sent request is not an accepted service or completed review.
            acceptanceRefs:
              - FR-MENT-02.AC.M3
          - id: FR-MENT-02.MAIN.S4
            actor: mentor
            request: Have the authorized mentor submit feedback
            systemResponse: Link feedback to the viewed evidence and rubric with reviewer attribution
            businessEffect: Human feedback is distinguishable from AI output and objective tests.
            acceptanceRefs:
              - FR-MENT-02.AC.M4
          - id: FR-MENT-02.MAIN.S5
            actor: learner
            request: Read feedback and choose a revision
            systemResponse: Retain the review and link the learner next attempt
            businessEffect: Feedback alone does not change private source work or guarantee certification.
            acceptanceRefs:
              - FR-MENT-02.AC.M5
        end:
          type: completed-main-flow
          outcome: Feedback alone does not change private source work or guarantee certification.
      alternativeFlows:
        - id: FR-MENT-02.ALT1
          title: The mentor declines or the learner cancels before acceptance
          fromStep: FR-MENT-02.MAIN.S3
          condition: The mentor declines or the learner cancels before acceptance
          steps:
            - id: FR-MENT-02.ALT1.S1
              actor: learner
              request: Inspect the request
              systemResponse: Show the declined/cancelled state and permitted next action
              businessEffect: No fabricated delivered service; any fee handling follows D10.
              acceptanceRefs:
                - FR-MENT-02.AC.ALT1
          resume:
            type: end
            outcome: No fabricated delivered service; any fee handling follows D10.
          postconditions:
            - No fabricated delivered service; any fee handling follows D10.
          continuation: This flow instance ends with the stated outcome. A permitted correction, status lookup
            or deliberate new request follows the response and current policy; it does not imply a
            successful main outcome.
          acceptanceRefs:
            - FR-MENT-02.AC.ALT1
      exceptionFlows:
        - id: FR-MENT-02.EX1
          title: The learner withdraws the review permission
          fromStep: FR-MENT-02.MAIN.S4
          condition: The learner withdraws the review permission
          steps:
            - id: FR-MENT-02.EX1.S1
              actor: learner
              request: Open the work to continue review
              systemResponse: Deny further access and mark the request unable to continue
              businessEffect: No new access through stored request references.
              acceptanceRefs:
                - FR-MENT-02.AC.EX1
          resume:
            type: end
            outcome: No new access through stored request references.
          postconditions:
            - No new access through stored request references.
          continuation: This flow instance ends with the stated outcome. A permitted correction, status lookup

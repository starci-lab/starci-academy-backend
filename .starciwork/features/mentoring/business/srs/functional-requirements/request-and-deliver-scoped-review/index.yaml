        - id: FR-MENT-02.EX2
          title: Fees, availability or service policy is undefined
          fromStep: FR-MENT-02.MAIN.S2
          condition: Fees, availability or service policy is undefined
          steps:
            - id: FR-MENT-02.EX2.S1
              actor: learner
              request: Confirm an unavailable service
              systemResponse: Explain the pending D10 policy
              businessEffect: No paid request or response deadline is promised.
              acceptanceRefs:
                - FR-MENT-02.AC.EX2
          resume:
            type: end
            outcome: No paid request or response deadline is promised.
          postconditions:
            - No paid request or response deadline is promised.
          continuation: This flow instance ends with the stated outcome. A permitted correction, status lookup
            or deliberate new request follows the response and current policy; it does not imply a
            successful main outcome.
          acceptanceRefs:
            - FR-MENT-02.AC.EX2
      postconditions:
        success:
          - The learner private profile is excluded unless explicitly selected.
          - Consent is scoped to this evidence and purpose.
          - A sent request is not an accepted service or completed review.
          - Human feedback is distinguishable from AI output and objective tests.
          - Feedback alone does not change private source work or guarantee certification.
        failure:
          - Only effects explicitly completed before the branch remain, with their original
            attribution.
          - No rejected or unresolved operation is presented as the successful main outcome.
          - No new access through stored request references.
          - No paid request or response deadline is promised.

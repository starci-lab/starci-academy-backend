    srs:
      schema: starci/srs-functional-requirement@1
      status: draft
      authority: proposed-detail-from-accepted-product-scope
      id: FR-MENT-02
      title: Request mentor review of selected learning evidence
      domain: mentoring
      goal: Request mentor review of selected learning evidence
      priority: release-priority-awaits-D01
      actors:
        - learner
        - mentor
      preconditions:
        - The held mentor role or learner request scope is identifiable; service commitments require
          enabled terms.
        - Each protected step checks the acting identity, current resource/action/audience rights
          and any applicable entitlement.
        - Policy-dependent effects run only with the relevant approved policy; unresolved values
          remain explicit decision dependencies and do not block writing/reviewing this draft.
      inputs:
        - id: FR-MENT-02.IN1
          name: reviewSelection
          validation: Eligible mentor and exact evidence shared for the request
          dataRefs:
            - DATA-review
            - DATA-evidence
            - DATA-share-grant
            - DATA-profile
        - id: FR-MENT-02.IN2
          name: requestConsent
          validation: Reviewed purpose, audience and enabled service terms
          dataRefs:
            - DATA-review
            - DATA-evidence
            - DATA-share-grant
            - DATA-profile
      outputs:
        - name: result-1
          fromStep: FR-MENT-02.MAIN.S1
          meaning: Show the intended reviewer, evidence versions and share scope
          effect: The learner private profile is excluded unless explicitly selected.
        - name: result-2
          fromStep: FR-MENT-02.MAIN.S2
          meaning: Create the request only under enabled mentor policy
          effect: Consent is scoped to this evidence and purpose.
        - name: result-3
          fromStep: FR-MENT-02.MAIN.S3
          meaning: Show the request disposition and any approved completion expectation
          effect: A sent request is not an accepted service or completed review.
        - name: result-4
          fromStep: FR-MENT-02.MAIN.S4
          meaning: Link feedback to the viewed evidence and rubric with reviewer attribution
          effect: Human feedback is distinguishable from AI output and objective tests.
        - name: result-5
          fromStep: FR-MENT-02.MAIN.S5
          meaning: Retain the review and link the learner next attempt
          effect: Feedback alone does not change private source work or guarantee certification.
      businessRuleRefs:
        - BR-EVIDENCE
        - BR-PRIVACY
        - BR-RIGHTS
      dataRefs:
        - DATA-review
        - DATA-evidence
        - DATA-share-grant
        - DATA-profile

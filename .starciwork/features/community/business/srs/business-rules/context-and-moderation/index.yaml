kind: business
required: true
state: todo
description: Contextual community and moderation
refs:
  - starci-next.business.srs.business-rules.policy-decisions.community-policy
extensions:
  work3:
    srs:
      schema: starci/srs-business-rule@1
      status: draft
      authority: proposed-detail-from-accepted-product-scope
      id: BR-COMMUNITY
      title: Contextual community and moderation
      statements:
        - Contributions and peer reviews identify the context, source work version, author and
          intended audience.
        - Report submission is an allegation requiring applicable policy and authorized review;
          count alone is not proof.
        - Contribution recognition concerns useful contribution under the configured rule; posting
          volume is not automatically mastery or source trust.
      decisionRefs:
        - D09
      example: Two peers can comment on the same authorized project revision while later revisions remain
        separately attributable.
      acceptanceCriteria:
        - id: BR-COMMUNITY.AC1
          given: A feature reaches a condition governed by this rule.
          when: The governed business outcome is produced or inspected.
          then: Contributions and peer reviews identify the context, source work version, author and intended
            audience.
        - id: BR-COMMUNITY.AC2
          given: A feature reaches a condition governed by this rule.
          when: The governed business outcome is produced or inspected.
          then: Report submission is an allegation requiring applicable policy and authorized review; count
            alone is not proof.
        - id: BR-COMMUNITY.AC3
          given: A feature reaches a condition governed by this rule.
          when: The governed business outcome is produced or inspected.
          then: Contribution recognition concerns useful contribution under the configured rule; posting
            volume is not automatically mastery or source trust.
      featureOwner: community
      ownership: Defined once in this feature. Other features reference the stable
        requirement/data/journey ID and current Work node ID.

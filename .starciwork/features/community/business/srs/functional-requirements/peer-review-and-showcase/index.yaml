extensions:
  work3:
    srs:
      schema: starci/srs-functional-requirement@1
      status: draft
      authority: proposed-detail-from-accepted-product-scope
      id: FR-COM-02
      title: Share work and provide attributed peer feedback
      domain: community
      goal: Share work and provide attributed peer feedback
      priority: release-priority-awaits-D01
      actors:
        - member
      preconditions:
        - The relevant context, group/resource audience and contribution authority are identifiable.
        - Each protected step checks the acting identity, current resource/action/audience rights
          and any applicable entitlement.
        - Policy-dependent effects run only with the relevant approved policy; unresolved values
          remain explicit decision dependencies and do not block writing/reviewing this draft.
      inputs:
        - id: FR-COM-02.IN1
          name: sharedWorkVersion
          validation: Owner-permitted evidence for peer review/showcase
          dataRefs:
            - DATA-discussion
            - DATA-project
            - DATA-evidence
            - DATA-review
            - DATA-share-grant
        - id: FR-COM-02.IN2
          name: feedback
          validation: Criterion-specific comment and contributor attribution
          dataRefs:
            - DATA-discussion
            - DATA-project
            - DATA-evidence
            - DATA-review
            - DATA-share-grant
      outputs:
        - name: result-1
          fromStep: FR-COM-02.MAIN.S1
          meaning: Preview selected work and audience
          effect: Original private submissions stay separately protected.
        - name: result-2
          fromStep: FR-COM-02.MAIN.S2
          meaning: Record the shared revision and context
          effect: Viewers can identify what is being reviewed.
        - name: result-3
          fromStep: FR-COM-02.MAIN.S3
          meaning: Show the contributor role, rationale and cited work
          effect: Peer feedback is distinct from official rubric assessment.
        - name: result-4
          fromStep: FR-COM-02.MAIN.S4
          meaning: Preserve original feedback attribution and link a new revision where relevant
          effect: Recognition follows configured contribution rules.
      businessRuleRefs:
        - BR-COMMUNITY
        - BR-EVIDENCE
        - BR-PRIVACY
      dataRefs:
        - DATA-discussion
        - DATA-project
        - DATA-evidence
        - DATA-review
        - DATA-share-grant
      nonFunctionalRefs:
        - NFR-SEC
        - NFR-PRIV
        - NFR-INTEGRITY
        - NFR-RELIABILITY
        - NFR-REPEAT
        - NFR-LATENCY
        - NFR-USABILITY
        - NFR-AUDIT
      decisionRefs:
        - D05
        - D09
        - D10
        - D08
        - D07
        - D11
        - D03
        - D12
      directPolicyRefs:
        - D05
        - D09
        - D10
      decisionTreatment: Direct policy refs affect the named feature behavior; inherited refs govern
        cross-cutting rules and measurement targets. Open policies are not selected by this draft.
      mainFlow:
        id: FR-COM-02.MAIN
        trigger: Select a project revision for showcase or peer feedback
        steps:
          - id: FR-COM-02.MAIN.S1
            actor: member
            request: Select a project revision for showcase or peer feedback
            systemResponse: Preview selected work and audience
            businessEffect: Original private submissions stay separately protected.
            acceptanceRefs:
              - FR-COM-02.AC.M1
          - id: FR-COM-02.MAIN.S2
            actor: member
            request: Publish the permitted showcase or review request
            systemResponse: Record the shared revision and context
            businessEffect: Viewers can identify what is being reviewed.
            acceptanceRefs:
              - FR-COM-02.AC.M2
          - id: FR-COM-02.MAIN.S3
            actor: member
            request: Provide or receive feedback on specific evidence
            systemResponse: Show the contributor role, rationale and cited work
            businessEffect: Peer feedback is distinct from official rubric assessment.
            acceptanceRefs:
              - FR-COM-02.AC.M3
          - id: FR-COM-02.MAIN.S4
            actor: member
            request: Respond, improve or acknowledge useful feedback
            systemResponse: Preserve original feedback attribution and link a new revision where relevant
            businessEffect: Recognition follows configured contribution rules.
            acceptanceRefs:
              - FR-COM-02.AC.M4
        end:
          type: completed-main-flow
          outcome: Recognition follows configured contribution rules.
      alternativeFlows:
        - id: FR-COM-02.ALT1
          title: The reviewer lacks enough evidence
          fromStep: FR-COM-02.MAIN.S3
          condition: The reviewer lacks enough evidence
          steps:
            - id: FR-COM-02.ALT1.S1
              actor: member
              request: State the limitation and request permitted clarification
              systemResponse: Show feedback as incomplete or limited
              businessEffect: No unsupported pass/fail claim.
              acceptanceRefs:
                - FR-COM-02.AC.ALT1
          resume:
            type: end
            outcome: No unsupported pass/fail claim.
          postconditions:
            - No unsupported pass/fail claim.
          continuation: This flow instance ends with the stated outcome. A permitted correction, status lookup
            or deliberate new request follows the response and current policy; it does not imply a
            successful main outcome.
          acceptanceRefs:
            - FR-COM-02.AC.ALT1
      exceptionFlows:
        - id: FR-COM-02.EX1
          title: The work owner withdraws sharing
          fromStep: FR-COM-02.MAIN.S3
          condition: The work owner withdraws sharing
          steps:
            - id: FR-COM-02.EX1.S1
              actor: member
              request: Open the previously shared work
              systemResponse: Recheck current access and withhold withdrawn material
              businessEffect: Existing references do not bypass withdrawn permission.
              acceptanceRefs:
                - FR-COM-02.AC.EX1
          resume:
            type: end
            outcome: Existing references do not bypass withdrawn permission.
          postconditions:
            - Existing references do not bypass withdrawn permission.
          continuation: This flow instance ends with the stated outcome. A permitted correction, status lookup
            or deliberate new request follows the response and current policy; it does not imply a
            successful main outcome.
          acceptanceRefs:
            - FR-COM-02.AC.EX1
        - id: FR-COM-02.EX2
          title: A new project revision replaces the reviewed version
          fromStep: FR-COM-02.MAIN.S4
          condition: A new project revision replaces the reviewed version
          steps:
            - id: FR-COM-02.EX2.S1
              actor: member
              request: Inspect old feedback
              systemResponse: Label which revision each comment concerns
              businessEffect: No automatic transfer of peer endorsement to new work.
              acceptanceRefs:
                - FR-COM-02.AC.EX2
          resume:
            type: end
            outcome: No automatic transfer of peer endorsement to new work.
          postconditions:
            - No automatic transfer of peer endorsement to new work.
          continuation: This flow instance ends with the stated outcome. A permitted correction, status lookup
            or deliberate new request follows the response and current policy; it does not imply a
            successful main outcome.
          acceptanceRefs:
            - FR-COM-02.AC.EX2
      postconditions:
        success:
          - Original private submissions stay separately protected.
          - Viewers can identify what is being reviewed.
          - Peer feedback is distinct from official rubric assessment.
          - Recognition follows configured contribution rules.
        failure:
          - Only effects explicitly completed before the branch remain, with their original
            attribution.
          - No rejected or unresolved operation is presented as the successful main outcome.
          - Existing references do not bypass withdrawn permission.
          - No automatic transfer of peer endorsement to new work.
      acceptanceCriteria:
        - id: FR-COM-02.AC.M1
          flowRef: FR-COM-02.MAIN
          stepRefs:
            - FR-COM-02.MAIN.S1
          given:
            - The relevant context, group/resource audience and contribution authority are
              identifiable.
            - Each protected step checks the acting identity, current resource/action/audience
              rights and any applicable entitlement.
            - Policy-dependent effects run only with the relevant approved policy; unresolved values
              remain explicit decision dependencies and do not block writing/reviewing this draft.
          when: Select a project revision for showcase or peer feedback
          then:
            - Preview selected work and audience
            - Original private submissions stay separately protected.
        - id: FR-COM-02.AC.M2
          flowRef: FR-COM-02.MAIN
          stepRefs:
            - FR-COM-02.MAIN.S2
          given:
            - The previous main-flow step FR-COM-02.MAIN.S1 completed with its stated result.
            - Each protected step checks the acting identity, current resource/action/audience
              rights and any applicable entitlement.
            - Policy-dependent effects run only with the relevant approved policy; unresolved values
              remain explicit decision dependencies and do not block writing/reviewing this draft.
          when: Publish the permitted showcase or review request
          then:
            - Record the shared revision and context
            - Viewers can identify what is being reviewed.
        - id: FR-COM-02.AC.M3
          flowRef: FR-COM-02.MAIN
          stepRefs:
            - FR-COM-02.MAIN.S3
          given:
            - The previous main-flow step FR-COM-02.MAIN.S2 completed with its stated result.
            - Each protected step checks the acting identity, current resource/action/audience
              rights and any applicable entitlement.
            - Policy-dependent effects run only with the relevant approved policy; unresolved values
              remain explicit decision dependencies and do not block writing/reviewing this draft.
          when: Provide or receive feedback on specific evidence
          then:
            - Show the contributor role, rationale and cited work
            - Peer feedback is distinct from official rubric assessment.
        - id: FR-COM-02.AC.M4
          flowRef: FR-COM-02.MAIN
          stepRefs:
            - FR-COM-02.MAIN.S4
          given:
            - The previous main-flow step FR-COM-02.MAIN.S3 completed with its stated result.
            - Each protected step checks the acting identity, current resource/action/audience
              rights and any applicable entitlement.
            - Policy-dependent effects run only with the relevant approved policy; unresolved values
              remain explicit decision dependencies and do not block writing/reviewing this draft.
          when: Respond, improve or acknowledge useful feedback
          then:
            - Preserve original feedback attribution and link a new revision where relevant
            - Recognition follows configured contribution rules.
        - id: FR-COM-02.AC.ALT1
          flowRef: FR-COM-02.ALT1
          stepRefs:
            - FR-COM-02.ALT1.S1
          given:
            - Execution reaches FR-COM-02.MAIN.S3.
            - The reviewer lacks enough evidence
          when: State the limitation and request permitted clarification
          then:
            - Show feedback as incomplete or limited
            - No unsupported pass/fail claim.
        - id: FR-COM-02.AC.EX1
          flowRef: FR-COM-02.EX1
          stepRefs:
            - FR-COM-02.EX1.S1
          given:
            - Execution reaches FR-COM-02.MAIN.S3.
            - The work owner withdraws sharing
          when: Open the previously shared work
          then:
            - Recheck current access and withhold withdrawn material
            - Existing references do not bypass withdrawn permission.
        - id: FR-COM-02.AC.EX2
          flowRef: FR-COM-02.EX2
          stepRefs:
            - FR-COM-02.EX2.S1
          given:
            - Execution reaches FR-COM-02.MAIN.S4.
            - A new project revision replaces the reviewed version
          when: Inspect old feedback
          then:
            - Label which revision each comment concerns
            - No automatic transfer of peer endorsement to new work.
      nonFunctionalApplication:
        - id: NFR-SEC
          scope: Main flow and every alternative/exception, including re-entry and current-rights checks.
        - id: NFR-PRIV
          scope: Main flow and every alternative/exception, including re-entry and current-rights checks.
        - id: NFR-INTEGRITY
          scope: Main flow and every alternative/exception, including re-entry and current-rights checks.
        - id: NFR-RELIABILITY
          scope: Main flow and every alternative/exception, including re-entry and current-rights checks.
        - id: NFR-REPEAT
          scope: Main flow and every alternative/exception, including re-entry and current-rights checks.
        - id: NFR-LATENCY
          scope: Main flow and every alternative/exception, including re-entry and current-rights checks.
        - id: NFR-USABILITY
          scope: Main flow and every alternative/exception, including re-entry and current-rights checks.
        - id: NFR-AUDIT
          scope: Main flow and every alternative/exception, including re-entry and current-rights checks.
      designHandoff: SDS must map these requirement/flow/step IDs to actual entry points, boundaries, data
        operations, failure paths and verification evidence. This SRS chooses no monolith,
        microservice, source file, queue or database design.
      featureOwner: community
      ownership: Defined once in this feature. Other features reference the stable

          when: Participate in group learning and discussions
          then:
            - Allow contributions and work sharing within current group/resource permission
            - Group membership does not expose private learning records by default.
        - id: FR-COM-04.AC.M4
          flowRef: FR-COM-04.MAIN
          stepRefs:
            - FR-COM-04.MAIN.S4
          given:
            - The previous main-flow step FR-COM-04.MAIN.S3 completed with its stated result.

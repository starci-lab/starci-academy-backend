          when: Leave the group or inspect a membership change
          then:
            - Explain remaining contribution attribution and revoked member access
            - Future reads and posts use current membership.
        - id: FR-COM-04.AC.ALT1
          flowRef: FR-COM-04.ALT1
          stepRefs:
            - FR-COM-04.ALT1.S1
          given:
            - Execution reaches FR-COM-04.MAIN.S2.
            - The group requires an admission decision
          when: Wait for an authorized decision
          then:
            - Show the pending request
            - No premature membership grant.
        - id: FR-COM-04.AC.EX1
          flowRef: FR-COM-04.EX1
          stepRefs:
            - FR-COM-04.EX1.S1
          given:
            - Execution reaches FR-COM-04.MAIN.S3.
            - The member tries to share another learner private submission
          when: Publish the reference/content
          then:
            - Deny unauthorized disclosure
            - No group role overrides submission ownership.
        - id: FR-COM-04.AC.EX2
          flowRef: FR-COM-04.EX2
          stepRefs:
            - FR-COM-04.EX2.S1
          given:
            - Execution reaches FR-COM-04.MAIN.S4.
            - A former member follows an old private group link
          when: Open the linked discussion
          then:
            - Deny newly unauthorized access
            - No retained link bypasses withdrawal.
      nonFunctionalApplication:

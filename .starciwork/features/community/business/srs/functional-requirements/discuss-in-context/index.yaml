extensions:
  work3:
    srs:
      schema: starci/srs-functional-requirement@1
      status: draft
      authority: proposed-detail-from-accepted-product-scope
      id: FR-COM-01
      title: Discuss a concept, challenge or project in context
      domain: community
      goal: Discuss a concept, challenge or project in context
      priority: release-priority-awaits-D01
      actors:
        - member
      preconditions:
        - The relevant context, group/resource audience and contribution authority are identifiable.
        - Each protected step checks the acting identity, current resource/action/audience rights
          and any applicable entitlement.
        - Policy-dependent effects run only with the relevant approved policy; unresolved values
          remain explicit decision dependencies and do not block writing/reviewing this draft.
      inputs:
        - id: FR-COM-01.IN1
          name: contextRef
          validation: Permitted Concept, question, group or work version
          dataRefs:
            - DATA-discussion
            - DATA-concept
            - DATA-project
            - DATA-share-grant
        - id: FR-COM-01.IN2
          name: contribution
          validation: Draft text and allowed attachments with reviewed audience
          dataRefs:
            - DATA-discussion
            - DATA-concept
            - DATA-project
            - DATA-share-grant
      outputs:
        - name: result-1
          fromStep: FR-COM-01.MAIN.S1
          meaning: Show the context and audience
          effect: Restricted source content is not exposed by a public discussion.
        - name: result-2
          fromStep: FR-COM-01.MAIN.S2
          meaning: Preview the contribution and attached evidence
          effect: The author sees who may read it.
        - name: result-3
          fromStep: FR-COM-01.MAIN.S3
          meaning: Validate current posting rights and record attribution
          effect: The contribution appears in the selected discussion.
        - name: result-4
          fromStep: FR-COM-01.MAIN.S4
          meaning: Show updates and the status of answers
          effect: Popularity is not official content certification.
      businessRuleRefs:
        - BR-COMMUNITY
        - BR-PRIVACY
        - BR-SOURCES
      dataRefs:
        - DATA-discussion
        - DATA-concept
        - DATA-project
        - DATA-share-grant
      nonFunctionalRefs:
        - NFR-SEC
        - NFR-PRIV
        - NFR-INTEGRITY
        - NFR-RELIABILITY
        - NFR-REPEAT
        - NFR-LATENCY
        - NFR-USABILITY
        - NFR-AUDIT
      decisionRefs:
        - D09
        - D08
        - D06
        - D11
        - D05
        - D03
        - D07
        - D12
      directPolicyRefs:
        - D09
      decisionTreatment: Direct policy refs affect the named feature behavior; inherited refs govern
        cross-cutting rules and measurement targets. Open policies are not selected by this draft.
      mainFlow:
        id: FR-COM-01.MAIN
        trigger: Open a permitted learning or project discussion
        steps:
          - id: FR-COM-01.MAIN.S1
            actor: member
            request: Open a permitted learning or project discussion
            systemResponse: Show the context and audience
            businessEffect: Restricted source content is not exposed by a public discussion.
            acceptanceRefs:
              - FR-COM-01.AC.M1
          - id: FR-COM-01.MAIN.S2
            actor: member
            request: Write a question, answer or explanation
            systemResponse: Preview the contribution and attached evidence
            businessEffect: The author sees who may read it.
            acceptanceRefs:
              - FR-COM-01.AC.M2
          - id: FR-COM-01.MAIN.S3
            actor: member
            request: Publish the contribution
            systemResponse: Validate current posting rights and record attribution
            businessEffect: The contribution appears in the selected discussion.
            acceptanceRefs:
              - FR-COM-01.AC.M3
          - id: FR-COM-01.MAIN.S4
            actor: member
            request: Read and respond to the discussion
            systemResponse: Show updates and the status of answers
            businessEffect: Popularity is not official content certification.
            acceptanceRefs:
              - FR-COM-01.AC.M4
        end:
          type: completed-main-flow
          outcome: Popularity is not official content certification.
      alternativeFlows:
        - id: FR-COM-01.ALT1
          title: The member keeps the contribution as a draft
          fromStep: FR-COM-01.MAIN.S2
          condition: The member keeps the contribution as a draft
          steps:
            - id: FR-COM-01.ALT1.S1
              actor: member
              request: Cancel publishing
              systemResponse: Retain or discard the draft explicitly
              businessEffect: No public post.
              acceptanceRefs:
                - FR-COM-01.AC.ALT1
          resume:
            type: end
            outcome: No public post.
          postconditions:
            - No public post.
          continuation: This flow instance ends with the stated outcome. A permitted correction, status lookup
            or deliberate new request follows the response and current policy; it does not imply a
            successful main outcome.
          acceptanceRefs:
            - FR-COM-01.AC.ALT1
      exceptionFlows:
        - id: FR-COM-01.EX1
          title: The contribution exposes restricted or unshareable material
          fromStep: FR-COM-01.MAIN.S3
          condition: The contribution exposes restricted or unshareable material
          steps:
            - id: FR-COM-01.EX1.S1
              actor: member
              request: Publish the contribution
              systemResponse: Require removal of unauthorized material or refuse publication
              businessEffect: No disclosure through attachments or quoted private submissions.
              acceptanceRefs:
                - FR-COM-01.AC.EX1
          resume:
            type: end
            outcome: No disclosure through attachments or quoted private submissions.
          postconditions:
            - No disclosure through attachments or quoted private submissions.
          continuation: This flow instance ends with the stated outcome. A permitted correction, status lookup
            or deliberate new request follows the response and current policy; it does not imply a
            successful main outcome.
          acceptanceRefs:
            - FR-COM-01.AC.EX1
        - id: FR-COM-01.EX2
          title: Posting is restricted by current moderation state
          fromStep: FR-COM-01.MAIN.S3
          condition: Posting is restricted by current moderation state
          steps:
            - id: FR-COM-01.EX2.S1
              actor: member
              request: Submit a contribution
              systemResponse: Show the applicable restriction and review path
              businessEffect: No bypass through another context.
              acceptanceRefs:
                - FR-COM-01.AC.EX2
          resume:
            type: end
            outcome: No bypass through another context.
          postconditions:
            - No bypass through another context.
          continuation: This flow instance ends with the stated outcome. A permitted correction, status lookup
            or deliberate new request follows the response and current policy; it does not imply a
            successful main outcome.
          acceptanceRefs:
            - FR-COM-01.AC.EX2
      postconditions:
        success:
          - Restricted source content is not exposed by a public discussion.
          - The author sees who may read it.
          - The contribution appears in the selected discussion.
          - Popularity is not official content certification.
        failure:
          - Only effects explicitly completed before the branch remain, with their original
            attribution.
          - No rejected or unresolved operation is presented as the successful main outcome.
          - No disclosure through attachments or quoted private submissions.
          - No bypass through another context.
      acceptanceCriteria:
        - id: FR-COM-01.AC.M1
          flowRef: FR-COM-01.MAIN
          stepRefs:
            - FR-COM-01.MAIN.S1
          given:
            - The relevant context, group/resource audience and contribution authority are
              identifiable.
            - Each protected step checks the acting identity, current resource/action/audience
              rights and any applicable entitlement.
            - Policy-dependent effects run only with the relevant approved policy; unresolved values
              remain explicit decision dependencies and do not block writing/reviewing this draft.
          when: Open a permitted learning or project discussion
          then:
            - Show the context and audience
            - Restricted source content is not exposed by a public discussion.
        - id: FR-COM-01.AC.M2
          flowRef: FR-COM-01.MAIN
          stepRefs:
            - FR-COM-01.MAIN.S2
          given:
            - The previous main-flow step FR-COM-01.MAIN.S1 completed with its stated result.
            - Each protected step checks the acting identity, current resource/action/audience
              rights and any applicable entitlement.
            - Policy-dependent effects run only with the relevant approved policy; unresolved values
              remain explicit decision dependencies and do not block writing/reviewing this draft.
          when: Write a question, answer or explanation
          then:
            - Preview the contribution and attached evidence
            - The author sees who may read it.
        - id: FR-COM-01.AC.M3
          flowRef: FR-COM-01.MAIN
          stepRefs:
            - FR-COM-01.MAIN.S3
          given:
            - The previous main-flow step FR-COM-01.MAIN.S2 completed with its stated result.
            - Each protected step checks the acting identity, current resource/action/audience
              rights and any applicable entitlement.
            - Policy-dependent effects run only with the relevant approved policy; unresolved values
              remain explicit decision dependencies and do not block writing/reviewing this draft.
          when: Publish the contribution
          then:
            - Validate current posting rights and record attribution
            - The contribution appears in the selected discussion.
        - id: FR-COM-01.AC.M4
          flowRef: FR-COM-01.MAIN
          stepRefs:
            - FR-COM-01.MAIN.S4
          given:
            - The previous main-flow step FR-COM-01.MAIN.S3 completed with its stated result.
            - Each protected step checks the acting identity, current resource/action/audience
              rights and any applicable entitlement.
            - Policy-dependent effects run only with the relevant approved policy; unresolved values
              remain explicit decision dependencies and do not block writing/reviewing this draft.
          when: Read and respond to the discussion
          then:
            - Show updates and the status of answers
            - Popularity is not official content certification.
        - id: FR-COM-01.AC.ALT1
          flowRef: FR-COM-01.ALT1
          stepRefs:
            - FR-COM-01.ALT1.S1
          given:
            - Execution reaches FR-COM-01.MAIN.S2.
            - The member keeps the contribution as a draft
          when: Cancel publishing
          then:
            - Retain or discard the draft explicitly
            - No public post.
        - id: FR-COM-01.AC.EX1
          flowRef: FR-COM-01.EX1
          stepRefs:
            - FR-COM-01.EX1.S1
          given:
            - Execution reaches FR-COM-01.MAIN.S3.
            - The contribution exposes restricted or unshareable material
          when: Publish the contribution
          then:
            - Require removal of unauthorized material or refuse publication
            - No disclosure through attachments or quoted private submissions.
        - id: FR-COM-01.AC.EX2
          flowRef: FR-COM-01.EX2
          stepRefs:
            - FR-COM-01.EX2.S1
          given:
            - Execution reaches FR-COM-01.MAIN.S3.
            - Posting is restricted by current moderation state
          when: Submit a contribution
          then:
            - Show the applicable restriction and review path
            - No bypass through another context.
      nonFunctionalApplication:
        - id: NFR-SEC
          scope: Main flow and every alternative/exception, including re-entry and current-rights checks.
        - id: NFR-PRIV
          scope: Main flow and every alternative/exception, including re-entry and current-rights checks.
        - id: NFR-INTEGRITY
          scope: Main flow and every alternative/exception, including re-entry and current-rights checks.
        - id: NFR-RELIABILITY
          scope: Main flow and every alternative/exception, including re-entry and current-rights checks.
        - id: NFR-REPEAT
          scope: Main flow and every alternative/exception, including re-entry and current-rights checks.
        - id: NFR-LATENCY
          scope: Main flow and every alternative/exception, including re-entry and current-rights checks.
        - id: NFR-USABILITY
          scope: Main flow and every alternative/exception, including re-entry and current-rights checks.
        - id: NFR-AUDIT
          scope: Main flow and every alternative/exception, including re-entry and current-rights checks.
      designHandoff: SDS must map these requirement/flow/step IDs to actual entry points, boundaries, data
        operations, failure paths and verification evidence. This SRS chooses no monolith,
        microservice, source file, queue or database design.
      featureOwner: community
      ownership: Defined once in this feature. Other features reference the stable

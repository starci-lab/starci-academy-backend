schema: work/node@2
id: starci-next.business.srs.data.purchase
kind: business
required: true
state: todo
description: Purchase and authoritative financial outcome
refs:
  - starci-next.business.srs.business-rules.policy-decisions.commercial-offers
  - starci-next.business.srs.business-rules.policy-decisions.subscription-policy
extensions:
  work3:
    srs:
      schema: starci/srs-data-definition@1
      status: draft
      authority: proposed-detail-from-accepted-product-scope
      id: DATA-purchase
      title: Purchase and authoritative financial outcome
      modelLevel: Proposed logical business contract; physical storage, indexes and APIs belong to SDS.
      owner: buyer; scoped commercial operations
      fields:
        - name: id
          meaning: Stable logical record identity
          validation: Required, unique and not changed by a state transition
          classification: context-scoped
        - name: version
          meaning: Record/content revision used for attribution and confirmation
          validation: Identify the reviewed version; changed content must not impersonate an earlier revision
          classification: context-scoped
        - name: buyerAndOffer
          meaning: Authenticated buyer and reviewed offer version
          validation: Exact amount/currency/terms immutable for this intent
          classification: private
        - name: paymentEvidence
          meaning: Authoritative settlement references
          validation: User return or assertion cannot substitute for settlement
          classification: restricted
        - name: financialState
          meaning: Known payment/refund status
          validation: Keep pending, failed and unknown explicit
          classification: private
        - name: activationState
          meaning: Resulting benefit state
          validation: Separate pending activation from payment confirmation
          classification: private
      relations:
        - dataRef: DATA-account
          meaning: Referenced business identity/version; lookup never grants access by itself.
        - dataRef: DATA-offer
          meaning: Referenced business identity/version; lookup never grants access by itself.
        - dataRef: DATA-subscription
          meaning: Referenced business identity/version; lookup never grants access by itself.
        - dataRef: DATA-entitlement
          meaning: Referenced business identity/version; lookup never grants access by itself.
        - dataRef: DATA-support-case
          meaning: Referenced business identity/version; lookup never grants access by itself.
      states:
        - created
        - payment-pending
        - settlement-unknown
        - payment-failed
        - paid
        - refund-pending
        - refunded
      transitions:
        - id: DATA-purchase.T1
          from: created
          to: payment-pending
          event: Start confirmed payment action
          guard: Reviewed approved offer valid
        - id: DATA-purchase.T2
          from: payment-pending
          to: settlement-unknown
          event: Lose definitive response
          guard: Keep same purchase identity
        - id: DATA-purchase.T3
          from: payment-pending
          to: payment-failed
          event: Receive authoritative failure
          guard: Evidence proves failure, not timeout alone
        - id: DATA-purchase.T4
          from: payment-pending
          to: paid
          event: Receive authoritative success
          guard: Amount/currency/purchase association validates
        - id: DATA-purchase.T5
          from: settlement-unknown
          to: paid
          event: Reconcile confirmed success
          guard: Authoritative evidence found
        - id: DATA-purchase.T6
          from: settlement-unknown
          to: payment-failed
          event: Reconcile confirmed failure
          guard: Authoritative evidence found
        - id: DATA-purchase.T7
          from: paid
          to: refund-pending
          event: Approve permitted refund action
          guard: D03 approval and operator scope valid
        - id: DATA-purchase.T8
          from: refund-pending
          to: refunded
          event: Confirm refund settlement
          guard: External evidence confirms actual outcome
      invariants:
        - Duplicate settlement has one financial/entitlement effect.
        - Paid and activation-pending can coexist.
      decisionRefs:
        - D02
        - D03
      privacy:
        access: Apply current owner, role, resource and audience grants. A selected-public field is exposed
          only after authorized publication.
        retention: D08 selects retention/export/closure behavior. No storage duration or automatic deletion
          policy is inferred.
        referenceWithdrawal: Preserve permitted provenance while preventing newly unauthorized source
          access; retained snapshots require approved D08 purpose and scope.
      validationCases:
        - given: An actor without current rights references this purchase.
          when: Read or mutate the record.
          then: Deny the unauthorized action without disclosing restricted fields.
        - given: A record in a declared state and an attributed authorized event.
          when: Apply a listed transition.
          then: Require its guard, retain the prior version attribution and reject a transition unsupported by
            policy.
      featureOwner: commerce
      ownership: Defined once in this feature. Other features reference the stable
        requirement/data/journey ID and current Work node ID.

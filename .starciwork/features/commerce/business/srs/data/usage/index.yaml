schema: work/node@2
id: starci-next.business.srs.data.usage
kind: business
required: true
state: todo
description: AI/review usage disposition
refs:
  - starci-next.business.srs.business-rules.policy-decisions.commercial-offers
  - starci-next.business.srs.business-rules.policy-decisions.failed-ai-usage
extensions:
  work3:
    srs:
      schema: starci/srs-data-definition@1
      status: draft
      authority: proposed-detail-from-accepted-product-scope
      id: DATA-usage
      title: AI/review usage disposition
      modelLevel: Proposed logical business contract; physical storage, indexes and APIs belong to SDS.
      owner: account allowance owner
      fields:
        - name: id
          meaning: Stable logical record identity
          validation: Required, unique and not changed by a state transition
          classification: context-scoped
        - name: version
          meaning: Record/content revision used for attribution and confirmation
          validation: Identify the reviewed version; changed content must not impersonate an earlier revision
          classification: context-scoped
        - name: operationRef
          meaning: Identified operation being accounted for
          validation: Required unique logical effect within the usage policy
          classification: private
        - name: capabilityAndRule
          meaning: Allowance class and policy version
          validation: Required before counting consumption
          classification: private
        - name: quantityAndUnit
          meaning: Amount counted under approved rule
          validation: Unit, precision and bounds from D02, never guessed
          classification: private
        - name: outcomeBasis
          meaning: Processing evidence for usage disposition
          validation: Unknown completion remains distinguishable
          classification: restricted
      relations:
        - dataRef: DATA-account
          meaning: Referenced business identity/version; lookup never grants access by itself.
        - dataRef: DATA-review
          meaning: Referenced business identity/version; lookup never grants access by itself.
        - dataRef: DATA-rag-session
          meaning: Referenced business identity/version; lookup never grants access by itself.
      states:
        - pending
        - counted
        - not-counted
        - adjusted
        - unresolved
      transitions:
        - id: DATA-usage.T1
          from: pending
          to: counted
          event: Apply successful/chargeable outcome rule
          guard: Approved D07 evidence supports counting
        - id: DATA-usage.T2
          from: pending
          to: not-counted
          event: Apply nonchargeable outcome rule
          guard: Approved D07 exception supports release
        - id: DATA-usage.T3
          from: pending
          to: unresolved
          event: Completion cannot be established
          guard: Keep operation and allowance disposition inspectable
        - id: DATA-usage.T4
          from: unresolved
          to: counted
          event: Resolve authoritative outcome
          guard: D07 approves counting
        - id: DATA-usage.T5
          from: unresolved
          to: not-counted
          event: Resolve nonchargeable outcome
          guard: D07 approves release
        - id: DATA-usage.T6
          from: counted
          to: adjusted
          event: Authorize a correction
          guard: Record reason and original effect
      invariants:
        - Duplicate delivery of one operation cannot double usage.
      decisionRefs:
        - D02
        - D07
      privacy:
        access: Apply current owner, role, resource and audience grants. A selected-public field is exposed
          only after authorized publication.
        retention: D08 selects retention/export/closure behavior. No storage duration or automatic deletion
          policy is inferred.
        referenceWithdrawal: Preserve permitted provenance while preventing newly unauthorized source
          access; retained snapshots require approved D08 purpose and scope.
      validationCases:
        - given: An actor without current rights references this usage.
          when: Read or mutate the record.
          then: Deny the unauthorized action without disclosing restricted fields.
        - given: A record in a declared state and an attributed authorized event.
          when: Apply a listed transition.
          then: Require its guard, retain the prior version attribution and reject a transition unsupported by
            policy.
      featureOwner: commerce
      ownership: Defined once in this feature. Other features reference the stable
        requirement/data/journey ID and current Work node ID.

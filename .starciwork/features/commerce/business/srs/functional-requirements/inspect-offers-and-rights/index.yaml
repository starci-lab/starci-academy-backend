extensions:
  work3:
    srs:
      schema: starci/srs-functional-requirement@1
      status: draft
      authority: proposed-detail-from-accepted-product-scope
      id: FR-SUB-01
      title: Inspect paid offers and current rights
      domain: commerce
      goal: Inspect paid offers and current rights
      priority: release-priority-awaits-D01
      actors:
        - learner
      preconditions:
        - The buyer account and current known rights are identifiable; commercial effects require
          approved terms and authoritative evidence.
        - Each protected step checks the acting identity, current resource/action/audience rights
          and any applicable entitlement.
        - Policy-dependent effects run only with the relevant approved policy; unresolved values
          remain explicit decision dependencies and do not block writing/reviewing this draft.
      inputs:
        - id: FR-SUB-01.IN1
          name: currentRights
          validation: Authenticated account benefit context
          dataRefs:
            - DATA-offer
            - DATA-entitlement
            - DATA-subscription
            - DATA-usage
        - id: FR-SUB-01.IN2
          name: offerChoice
          validation: Published approved offer version for comparison or purchase review
          dataRefs:
            - DATA-offer
            - DATA-entitlement
            - DATA-subscription
            - DATA-usage
      outputs:
        - name: result-1
          fromStep: FR-SUB-01.MAIN.S1
          meaning: Show available offer versions and current account rights separately
          effect: A listed offer does not grant access.
        - name: result-2
          fromStep: FR-SUB-01.MAIN.S2
          meaning: Explain content access, AI/review usage, community/profile/recruitment benefits where
            offered
          effect: Unspecified benefits are not represented as included.
        - name: result-3
          fromStep: FR-SUB-01.MAIN.S3
          meaning: Show the approved amount, currency, billing period and applicable cancellation/renewal
            terms
          effect: An offer without approved commercial terms cannot be purchased.
        - name: result-4
          fromStep: FR-SUB-01.MAIN.S4
          meaning: Carry the reviewed offer version into purchase review
          effect: Existing rights are preserved until an authorized lifecycle change.
      businessRuleRefs:
        - BR-COMMERCE
        - BR-USAGE
        - BR-RIGHTS
      dataRefs:
        - DATA-offer
        - DATA-entitlement
        - DATA-subscription
        - DATA-usage
      nonFunctionalRefs:
        - NFR-SEC
        - NFR-PRIV
        - NFR-INTEGRITY
        - NFR-RELIABILITY
        - NFR-REPEAT
        - NFR-LATENCY
        - NFR-USABILITY
        - NFR-COST
        - NFR-AUDIT
      decisionRefs:
        - D02
        - D03
        - D08
        - D11
        - D07
        - D05
        - D12
      directPolicyRefs:
        - D02
        - D03
      decisionTreatment: Direct policy refs affect the named feature behavior; inherited refs govern
        cross-cutting rules and measurement targets. Open policies are not selected by this draft.
      mainFlow:
        id: FR-SUB-01.MAIN
        trigger: Open the offers or account rights view
        steps:
          - id: FR-SUB-01.MAIN.S1
            actor: learner
            request: Open the offers or account rights view
            systemResponse: Show available offer versions and current account rights separately
            businessEffect: A listed offer does not grant access.
            acceptanceRefs:
              - FR-SUB-01.AC.M1
          - id: FR-SUB-01.MAIN.S2
            actor: learner
            request: Compare an offer with current needs
            systemResponse: Explain content access, AI/review usage, community/profile/recruitment benefits
              where offered
            businessEffect: Unspecified benefits are not represented as included.
            acceptanceRefs:
              - FR-SUB-01.AC.M2
          - id: FR-SUB-01.MAIN.S3
            actor: learner
            request: Inspect price and lifecycle terms
            systemResponse: Show the approved amount, currency, billing period and applicable
              cancellation/renewal terms
            businessEffect: An offer without approved commercial terms cannot be purchased.
            acceptanceRefs:
              - FR-SUB-01.AC.M3
          - id: FR-SUB-01.MAIN.S4
            actor: learner
            request: Select an available offer
            systemResponse: Carry the reviewed offer version into purchase review
            businessEffect: Existing rights are preserved until an authorized lifecycle change.
            acceptanceRefs:
              - FR-SUB-01.AC.M4
        end:
          type: completed-main-flow
          outcome: Existing rights are preserved until an authorized lifecycle change.
      alternativeFlows:
        - id: FR-SUB-01.ALT1
          title: The learner keeps the existing access
          fromStep: FR-SUB-01.MAIN.S4
          condition: The learner keeps the existing access
          steps:
            - id: FR-SUB-01.ALT1.S1
              actor: learner
              request: Leave purchase review
              systemResponse: Return to current rights
              businessEffect: No purchase or subscription change.
              acceptanceRefs:
                - FR-SUB-01.AC.ALT1
          resume:
            type: end
            outcome: No purchase or subscription change.
          postconditions:
            - No purchase or subscription change.
          continuation: This flow instance ends with the stated outcome. A permitted correction, status lookup
            or deliberate new request follows the response and current policy; it does not imply a
            successful main outcome.
          acceptanceRefs:
            - FR-SUB-01.AC.ALT1
      exceptionFlows:
        - id: FR-SUB-01.EX1
          title: Price or lifecycle policy is not approved
          fromStep: FR-SUB-01.MAIN.S3
          condition: Price or lifecycle policy is not approved
          steps:
            - id: FR-SUB-01.EX1.S1
              actor: learner
              request: Inspect the proposed offer
              systemResponse: Label it unavailable for purchase and identify missing policy
              businessEffect: No guessed price, renewal or quota promise.
              acceptanceRefs:
                - FR-SUB-01.AC.EX1
          resume:
            type: end
            outcome: No guessed price, renewal or quota promise.
          postconditions:
            - No guessed price, renewal or quota promise.
          continuation: This flow instance ends with the stated outcome. A permitted correction, status lookup
            or deliberate new request follows the response and current policy; it does not imply a
            successful main outcome.
          acceptanceRefs:
            - FR-SUB-01.AC.EX1
        - id: FR-SUB-01.EX2
          title: The offer changed after review
          fromStep: FR-SUB-01.MAIN.S4
          condition: The offer changed after review
          steps:
            - id: FR-SUB-01.EX2.S1
              actor: learner
              request: Continue with the stale offer
              systemResponse: Show changes and require another review
              businessEffect: No purchase under silently substituted terms.
              acceptanceRefs:
                - FR-SUB-01.AC.EX2
          resume:
            type: end
            outcome: No purchase under silently substituted terms.
          postconditions:
            - No purchase under silently substituted terms.
          continuation: This flow instance ends with the stated outcome. A permitted correction, status lookup
            or deliberate new request follows the response and current policy; it does not imply a
            successful main outcome.
          acceptanceRefs:
            - FR-SUB-01.AC.EX2
      postconditions:
        success:
          - A listed offer does not grant access.
          - Unspecified benefits are not represented as included.
          - An offer without approved commercial terms cannot be purchased.
          - Existing rights are preserved until an authorized lifecycle change.
        failure:
          - Only effects explicitly completed before the branch remain, with their original
            attribution.
          - No rejected or unresolved operation is presented as the successful main outcome.
          - No guessed price, renewal or quota promise.
          - No purchase under silently substituted terms.
      acceptanceCriteria:
        - id: FR-SUB-01.AC.M1
          flowRef: FR-SUB-01.MAIN
          stepRefs:
            - FR-SUB-01.MAIN.S1
          given:
            - The buyer account and current known rights are identifiable; commercial effects
              require approved terms and authoritative evidence.
            - Each protected step checks the acting identity, current resource/action/audience
              rights and any applicable entitlement.
            - Policy-dependent effects run only with the relevant approved policy; unresolved values
              remain explicit decision dependencies and do not block writing/reviewing this draft.
          when: Open the offers or account rights view
          then:
            - Show available offer versions and current account rights separately
            - A listed offer does not grant access.
        - id: FR-SUB-01.AC.M2
          flowRef: FR-SUB-01.MAIN
          stepRefs:
            - FR-SUB-01.MAIN.S2
          given:
            - The previous main-flow step FR-SUB-01.MAIN.S1 completed with its stated result.
            - Each protected step checks the acting identity, current resource/action/audience
              rights and any applicable entitlement.
            - Policy-dependent effects run only with the relevant approved policy; unresolved values
              remain explicit decision dependencies and do not block writing/reviewing this draft.
          when: Compare an offer with current needs
          then:
            - Explain content access, AI/review usage, community/profile/recruitment benefits where
              offered
            - Unspecified benefits are not represented as included.
        - id: FR-SUB-01.AC.M3
          flowRef: FR-SUB-01.MAIN
          stepRefs:
            - FR-SUB-01.MAIN.S3
          given:
            - The previous main-flow step FR-SUB-01.MAIN.S2 completed with its stated result.
            - Each protected step checks the acting identity, current resource/action/audience
              rights and any applicable entitlement.
            - Policy-dependent effects run only with the relevant approved policy; unresolved values
              remain explicit decision dependencies and do not block writing/reviewing this draft.
          when: Inspect price and lifecycle terms
          then:
            - Show the approved amount, currency, billing period and applicable cancellation/renewal
              terms
            - An offer without approved commercial terms cannot be purchased.
        - id: FR-SUB-01.AC.M4
          flowRef: FR-SUB-01.MAIN
          stepRefs:
            - FR-SUB-01.MAIN.S4
          given:
            - The previous main-flow step FR-SUB-01.MAIN.S3 completed with its stated result.
            - Each protected step checks the acting identity, current resource/action/audience
              rights and any applicable entitlement.
            - Policy-dependent effects run only with the relevant approved policy; unresolved values
              remain explicit decision dependencies and do not block writing/reviewing this draft.
          when: Select an available offer
          then:
            - Carry the reviewed offer version into purchase review
            - Existing rights are preserved until an authorized lifecycle change.
        - id: FR-SUB-01.AC.ALT1
          flowRef: FR-SUB-01.ALT1
          stepRefs:
            - FR-SUB-01.ALT1.S1
          given:
            - Execution reaches FR-SUB-01.MAIN.S4.
            - The learner keeps the existing access
          when: Leave purchase review
          then:
            - Return to current rights
            - No purchase or subscription change.
        - id: FR-SUB-01.AC.EX1
          flowRef: FR-SUB-01.EX1
          stepRefs:
            - FR-SUB-01.EX1.S1
          given:
            - Execution reaches FR-SUB-01.MAIN.S3.
            - Price or lifecycle policy is not approved
          when: Inspect the proposed offer
          then:
            - Label it unavailable for purchase and identify missing policy
            - No guessed price, renewal or quota promise.
        - id: FR-SUB-01.AC.EX2
          flowRef: FR-SUB-01.EX2
          stepRefs:
            - FR-SUB-01.EX2.S1
          given:
            - Execution reaches FR-SUB-01.MAIN.S4.
            - The offer changed after review
          when: Continue with the stale offer
          then:
            - Show changes and require another review
            - No purchase under silently substituted terms.
      nonFunctionalApplication:
        - id: NFR-SEC
          scope: Main flow and every alternative/exception, including re-entry and current-rights checks.
        - id: NFR-PRIV
          scope: Main flow and every alternative/exception, including re-entry and current-rights checks.
        - id: NFR-INTEGRITY
          scope: Main flow and every alternative/exception, including re-entry and current-rights checks.
        - id: NFR-RELIABILITY
          scope: Main flow and every alternative/exception, including re-entry and current-rights checks.
        - id: NFR-REPEAT
          scope: Main flow and every alternative/exception, including re-entry and current-rights checks.
        - id: NFR-LATENCY
          scope: Main flow and every alternative/exception, including re-entry and current-rights checks.
        - id: NFR-USABILITY
          scope: Main flow and every alternative/exception, including re-entry and current-rights checks.
        - id: NFR-COST
          scope: Main flow and every alternative/exception, including re-entry and current-rights checks.
        - id: NFR-AUDIT
          scope: Main flow and every alternative/exception, including re-entry and current-rights checks.
      designHandoff: SDS must map these requirement/flow/step IDs to actual entry points, boundaries, data
        operations, failure paths and verification evidence. This SRS chooses no monolith,
        microservice, source file, queue or database design.
      featureOwner: commerce
      ownership: Defined once in this feature. Other features reference the stable
        requirement/data/journey ID and current Work node ID.
      authorityRefs:
        - artifact: SRC-BUSINESS
          sections:
            - "11.1"
        - artifact: SRC-BRIEF
          sections:
            - "4"
            - "5"
            - "6"
            - "7"
      trigger: Open the offers or account rights view

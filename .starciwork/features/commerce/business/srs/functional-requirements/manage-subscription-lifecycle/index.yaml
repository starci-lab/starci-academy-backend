extensions:
  work3:
    srs:
      schema: starci/srs-functional-requirement@1
      status: draft
      authority: proposed-detail-from-accepted-product-scope
      id: FR-SUB-03
      title: Review renewal, plan change and cancellation
      domain: commerce
      goal: Review renewal, plan change and cancellation
      priority: release-priority-awaits-D01
      actors:
        - learner
      preconditions:
        - The buyer account and current known rights are identifiable; commercial effects require
          approved terms and authoritative evidence.
        - Each protected step checks the acting identity, current resource/action/audience rights
          and any applicable entitlement.
        - Policy-dependent effects run only with the relevant approved policy; unresolved values
          remain explicit decision dependencies and do not block writing/reviewing this draft.
      inputs:
        - id: FR-SUB-03.IN1
          name: subscriptionVersion
          validation: Current agreement and schedule
          dataRefs:
            - DATA-subscription
            - DATA-offer
            - DATA-entitlement
            - DATA-purchase
        - id: FR-SUB-03.IN2
          name: lifecycleChoice
          validation: Supported renew/change/cancel action with reviewed effective impact
          dataRefs:
            - DATA-subscription
            - DATA-offer
            - DATA-entitlement
            - DATA-purchase
      outputs:
        - name: result-1
          fromStep: FR-SUB-03.MAIN.S1
          meaning: Show effective dates, current benefits and configured renewal behavior
          effect: Current access is separated from future scheduled changes.
        - name: result-2
          fromStep: FR-SUB-03.MAIN.S2
          meaning: Preview cost, effective date and impact under the approved policy
          effect: No unapproved proration or immediate access-loss assumption.
        - name: result-3
          fromStep: FR-SUB-03.MAIN.S3
          meaning: Recheck the current subscription and terms
          effect: Record the authorized request and its effective or pending state.
        - name: result-4
          fromStep: FR-SUB-03.MAIN.S4
          meaning: Apply only the confirmed and approved entitlement transition
          effect: Show which capabilities continue, change or expire; historical work stays attributed.
      businessRuleRefs:
        - BR-COMMERCE
        - BR-RIGHTS
        - BR-VERSION
      dataRefs:
        - DATA-subscription
        - DATA-offer
        - DATA-entitlement
        - DATA-purchase
      nonFunctionalRefs:
        - NFR-SEC
        - NFR-PRIV
        - NFR-INTEGRITY
        - NFR-RELIABILITY
        - NFR-REPEAT
        - NFR-LATENCY
        - NFR-USABILITY
        - NFR-COST
        - NFR-AUDIT
      decisionRefs:
        - D02
        - D03
        - D08
        - D11
        - D05
        - D07
        - D12
      directPolicyRefs:
        - D02
        - D03
        - D08
      decisionTreatment: Direct policy refs affect the named feature behavior; inherited refs govern
        cross-cutting rules and measurement targets. Open policies are not selected by this draft.
      mainFlow:
        id: FR-SUB-03.MAIN
        trigger: Open the active subscription
        steps:
          - id: FR-SUB-03.MAIN.S1
            actor: learner
            request: Open the active subscription
            systemResponse: Show effective dates, current benefits and configured renewal behavior
            businessEffect: Current access is separated from future scheduled changes.
            acceptanceRefs:
              - FR-SUB-03.AC.M1
          - id: FR-SUB-03.MAIN.S2
            actor: learner
            request: Choose renewal, plan change or cancellation from supported actions
            systemResponse: Preview cost, effective date and impact under the approved policy
            businessEffect: No unapproved proration or immediate access-loss assumption.
            acceptanceRefs:
              - FR-SUB-03.AC.M2
          - id: FR-SUB-03.MAIN.S3
            actor: learner
            request: Confirm the reviewed change
            systemResponse: Recheck the current subscription and terms
            businessEffect: Record the authorized request and its effective or pending state.
            acceptanceRefs:
              - FR-SUB-03.AC.M3
          - id: FR-SUB-03.MAIN.S4
            actor: learner
            request: Inspect the outcome at the effective boundary
            systemResponse: Apply only the confirmed and approved entitlement transition
            businessEffect: Show which capabilities continue, change or expire; historical work stays attributed.
            acceptanceRefs:
              - FR-SUB-03.AC.M4
        end:
          type: completed-main-flow
          outcome: Show which capabilities continue, change or expire; historical work stays attributed.
      alternativeFlows:
        - id: FR-SUB-03.ALT1
          title: The learner cancels the preview
          fromStep: FR-SUB-03.MAIN.S2
          condition: The learner cancels the preview
          steps:
            - id: FR-SUB-03.ALT1.S1
              actor: learner
              request: Keep the current subscription
              systemResponse: Return to its existing schedule
              businessEffect: No lifecycle mutation.
              acceptanceRefs:
                - FR-SUB-03.AC.ALT1
          resume:
            type: end
            outcome: No lifecycle mutation.
          postconditions:
            - No lifecycle mutation.
          continuation: This flow instance ends with the stated outcome. A permitted correction, status lookup
            or deliberate new request follows the response and current policy; it does not imply a
            successful main outcome.
          acceptanceRefs:
            - FR-SUB-03.AC.ALT1
        - id: FR-SUB-03.ALT2
          title: The learner chooses an available cancellation action
          fromStep: FR-SUB-03.MAIN.S2
          condition: The learner chooses an available cancellation action
          steps:
            - id: FR-SUB-03.ALT2.S1
              actor: learner
              request: Review and confirm cancellation
              systemResponse: Show the approved effective end boundary, current rights and any remaining schedule
              businessEffect: Record cancellation as requested/effective according to D03; do not assume immediate
                access loss.
              acceptanceRefs:
                - FR-SUB-03.AC.ALT2
          resume:
            type: end
            outcome: Record cancellation as requested/effective according to D03; do not assume immediate access
              loss.
          postconditions:
            - Record cancellation as requested/effective according to D03; do not assume immediate
              access loss.
          continuation: This flow instance ends with the stated outcome. A permitted correction, status lookup
            or deliberate new request follows the response and current policy; it does not imply a
            successful main outcome.
          acceptanceRefs:
            - FR-SUB-03.AC.ALT2
        - id: FR-SUB-03.ALT3
          title: The learner chooses an available offer change
          fromStep: FR-SUB-03.MAIN.S2
          condition: The learner chooses an available offer change
          steps:
            - id: FR-SUB-03.ALT3.S1
              actor: learner
              request: Review and confirm the new offer and timing
              systemResponse: Show approved price difference, settlement condition and effective benefits
              businessEffect: Apply the confirmed policy-governed change; no invented proration or discarded
                learning history.
              acceptanceRefs:
                - FR-SUB-03.AC.ALT3
          resume:
            type: end
            outcome: Apply the confirmed policy-governed change; no invented proration or discarded learning
              history.
          postconditions:
            - Apply the confirmed policy-governed change; no invented proration or discarded
              learning history.
          continuation: This flow instance ends with the stated outcome. A permitted correction, status lookup
            or deliberate new request follows the response and current policy; it does not imply a
            successful main outcome.
          acceptanceRefs:
            - FR-SUB-03.AC.ALT3
        - id: FR-SUB-03.ALT4
          title: A previously authorized renewal reaches its scheduled boundary
          fromStep: FR-SUB-03.MAIN.S4
          condition: A previously authorized renewal reaches its scheduled boundary
          steps:
            - id: FR-SUB-03.ALT4.S1
              actor: learner
              request: Inspect the renewal outcome
              systemResponse: Show the associated settlement and resulting service interval
              businessEffect: Only confirmed settlement and approved lifecycle policy extend the corresponding
                benefit.
              acceptanceRefs:
                - FR-SUB-03.AC.ALT4
          resume:
            type: end
            outcome: Only confirmed settlement and approved lifecycle policy extend the corresponding benefit.
          postconditions:
            - Only confirmed settlement and approved lifecycle policy extend the corresponding
              benefit.
          continuation: This flow instance ends with the stated outcome. A permitted correction, status lookup
            or deliberate new request follows the response and current policy; it does not imply a
            successful main outcome.
          acceptanceRefs:
            - FR-SUB-03.AC.ALT4
      exceptionFlows:
        - id: FR-SUB-03.EX1
          title: Another action changed the subscription during review
          fromStep: FR-SUB-03.MAIN.S3
          condition: Another action changed the subscription during review
          steps:
            - id: FR-SUB-03.EX1.S1
              actor: learner
              request: Confirm the stale request
              systemResponse: Require review of the current subscription
              businessEffect: No conflicting change silently overwrites another.
              acceptanceRefs:
                - FR-SUB-03.AC.EX1
          resume:
            type: end
            outcome: No conflicting change silently overwrites another.
          postconditions:
            - No conflicting change silently overwrites another.
          continuation: This flow instance ends with the stated outcome. A permitted correction, status lookup
            or deliberate new request follows the response and current policy; it does not imply a
            successful main outcome.
          acceptanceRefs:
            - FR-SUB-03.AC.EX1
        - id: FR-SUB-03.EX2
          title: Renewal fails or confirmation is unknown
          fromStep: FR-SUB-03.MAIN.S4
          condition: Renewal fails or confirmation is unknown
          steps:
            - id: FR-SUB-03.EX2.S1
              actor: learner
              request: Inspect current access
              systemResponse: Show settlement status and rights according to the configured grace/expiry policy
              businessEffect: Do not invent grace duration or erase learning data.
              acceptanceRefs:
                - FR-SUB-03.AC.EX2
          resume:
            type: end
            outcome: Do not invent grace duration or erase learning data.
          postconditions:
            - Do not invent grace duration or erase learning data.
          continuation: This flow instance ends with the stated outcome. A permitted correction, status lookup
            or deliberate new request follows the response and current policy; it does not imply a
            successful main outcome.
          acceptanceRefs:
            - FR-SUB-03.AC.EX2
        - id: FR-SUB-03.EX3
          title: Lifecycle policy has not been approved
          fromStep: FR-SUB-03.MAIN.S2
          condition: Lifecycle policy has not been approved
          steps:
            - id: FR-SUB-03.EX3.S1
              actor: learner
              request: Choose the undefined change
              systemResponse: Explain unavailable action and identify D03
              businessEffect: No guessed cancellation, refund or renewal behavior.
              acceptanceRefs:
                - FR-SUB-03.AC.EX3
          resume:
            type: end
            outcome: No guessed cancellation, refund or renewal behavior.
          postconditions:
            - No guessed cancellation, refund or renewal behavior.
          continuation: This flow instance ends with the stated outcome. A permitted correction, status lookup
            or deliberate new request follows the response and current policy; it does not imply a
            successful main outcome.
          acceptanceRefs:
            - FR-SUB-03.AC.EX3
        - id: FR-SUB-03.EX4
          title: The approved entitlement interval ends without a confirmed continuation
          fromStep: FR-SUB-03.MAIN.S4
          condition: The approved entitlement interval ends without a confirmed continuation
          steps:
            - id: FR-SUB-03.EX4.S1
              actor: learner
              request: Open an affected capability
              systemResponse: Show the expired capability and available approved continuation while checking other
                independent rights
              businessEffect: No extension or loss of unrelated rights is inferred; data retention follows D08.
              acceptanceRefs:
                - FR-SUB-03.AC.EX4
          resume:
            type: end
            outcome: No extension or loss of unrelated rights is inferred; data retention follows D08.
          postconditions:
            - No extension or loss of unrelated rights is inferred; data retention follows D08.
          continuation: This flow instance ends with the stated outcome. A permitted correction, status lookup
            or deliberate new request follows the response and current policy; it does not imply a
            successful main outcome.
          acceptanceRefs:
            - FR-SUB-03.AC.EX4
      postconditions:
        success:
          - Current access is separated from future scheduled changes.
          - No unapproved proration or immediate access-loss assumption.
          - Record the authorized request and its effective or pending state.
          - Show which capabilities continue, change or expire; historical work stays attributed.
        failure:
          - Only effects explicitly completed before the branch remain, with their original
            attribution.
          - No rejected or unresolved operation is presented as the successful main outcome.
          - No conflicting change silently overwrites another.
          - Do not invent grace duration or erase learning data.
          - No guessed cancellation, refund or renewal behavior.
          - No extension or loss of unrelated rights is inferred; data retention follows D08.
      acceptanceCriteria:
        - id: FR-SUB-03.AC.M1
          flowRef: FR-SUB-03.MAIN
          stepRefs:
            - FR-SUB-03.MAIN.S1
          given:
            - The buyer account and current known rights are identifiable; commercial effects
              require approved terms and authoritative evidence.
            - Each protected step checks the acting identity, current resource/action/audience
              rights and any applicable entitlement.
            - Policy-dependent effects run only with the relevant approved policy; unresolved values
              remain explicit decision dependencies and do not block writing/reviewing this draft.
          when: Open the active subscription
          then:
            - Show effective dates, current benefits and configured renewal behavior
            - Current access is separated from future scheduled changes.
        - id: FR-SUB-03.AC.M2
          flowRef: FR-SUB-03.MAIN
          stepRefs:
            - FR-SUB-03.MAIN.S2
          given:
            - The previous main-flow step FR-SUB-03.MAIN.S1 completed with its stated result.
            - Each protected step checks the acting identity, current resource/action/audience
              rights and any applicable entitlement.
            - Policy-dependent effects run only with the relevant approved policy; unresolved values
              remain explicit decision dependencies and do not block writing/reviewing this draft.
          when: Choose renewal, plan change or cancellation from supported actions
          then:
            - Preview cost, effective date and impact under the approved policy
            - No unapproved proration or immediate access-loss assumption.
        - id: FR-SUB-03.AC.M3
          flowRef: FR-SUB-03.MAIN
          stepRefs:
            - FR-SUB-03.MAIN.S3
          given:
            - The previous main-flow step FR-SUB-03.MAIN.S2 completed with its stated result.
            - Each protected step checks the acting identity, current resource/action/audience
              rights and any applicable entitlement.
            - Policy-dependent effects run only with the relevant approved policy; unresolved values
              remain explicit decision dependencies and do not block writing/reviewing this draft.
          when: Confirm the reviewed change
          then:
            - Recheck the current subscription and terms
            - Record the authorized request and its effective or pending state.
        - id: FR-SUB-03.AC.M4
          flowRef: FR-SUB-03.MAIN
          stepRefs:
            - FR-SUB-03.MAIN.S4
          given:
            - The previous main-flow step FR-SUB-03.MAIN.S3 completed with its stated result.
            - Each protected step checks the acting identity, current resource/action/audience
              rights and any applicable entitlement.
            - Policy-dependent effects run only with the relevant approved policy; unresolved values
              remain explicit decision dependencies and do not block writing/reviewing this draft.
          when: Inspect the outcome at the effective boundary
          then:
            - Apply only the confirmed and approved entitlement transition
            - Show which capabilities continue, change or expire; historical work stays attributed.
        - id: FR-SUB-03.AC.ALT1
          flowRef: FR-SUB-03.ALT1
          stepRefs:
            - FR-SUB-03.ALT1.S1
          given:
            - Execution reaches FR-SUB-03.MAIN.S2.
            - The learner cancels the preview
          when: Keep the current subscription
          then:
            - Return to its existing schedule
            - No lifecycle mutation.
        - id: FR-SUB-03.AC.ALT2
          flowRef: FR-SUB-03.ALT2
          stepRefs:
            - FR-SUB-03.ALT2.S1
          given:
            - Execution reaches FR-SUB-03.MAIN.S2.
            - The learner chooses an available cancellation action
          when: Review and confirm cancellation
          then:
            - Show the approved effective end boundary, current rights and any remaining schedule
            - Record cancellation as requested/effective according to D03; do not assume immediate
              access loss.
        - id: FR-SUB-03.AC.ALT3
          flowRef: FR-SUB-03.ALT3
          stepRefs:
            - FR-SUB-03.ALT3.S1
          given:
            - Execution reaches FR-SUB-03.MAIN.S2.
            - The learner chooses an available offer change
          when: Review and confirm the new offer and timing
          then:
            - Show approved price difference, settlement condition and effective benefits
            - Apply the confirmed policy-governed change; no invented proration or discarded
              learning history.
        - id: FR-SUB-03.AC.ALT4
          flowRef: FR-SUB-03.ALT4
          stepRefs:
            - FR-SUB-03.ALT4.S1
          given:
            - Execution reaches FR-SUB-03.MAIN.S4.
            - A previously authorized renewal reaches its scheduled boundary
          when: Inspect the renewal outcome
          then:
            - Show the associated settlement and resulting service interval
            - Only confirmed settlement and approved lifecycle policy extend the corresponding
              benefit.
        - id: FR-SUB-03.AC.EX1
          flowRef: FR-SUB-03.EX1
          stepRefs:
            - FR-SUB-03.EX1.S1
          given:
            - Execution reaches FR-SUB-03.MAIN.S3.
            - Another action changed the subscription during review
          when: Confirm the stale request
          then:
            - Require review of the current subscription
            - No conflicting change silently overwrites another.
        - id: FR-SUB-03.AC.EX2
          flowRef: FR-SUB-03.EX2
          stepRefs:
            - FR-SUB-03.EX2.S1
          given:
            - Execution reaches FR-SUB-03.MAIN.S4.
            - Renewal fails or confirmation is unknown
          when: Inspect current access
          then:
            - Show settlement status and rights according to the configured grace/expiry policy
            - Do not invent grace duration or erase learning data.
        - id: FR-SUB-03.AC.EX3
          flowRef: FR-SUB-03.EX3
          stepRefs:
            - FR-SUB-03.EX3.S1
          given:
            - Execution reaches FR-SUB-03.MAIN.S2.
            - Lifecycle policy has not been approved
          when: Choose the undefined change
          then:
            - Explain unavailable action and identify D03
            - No guessed cancellation, refund or renewal behavior.
        - id: FR-SUB-03.AC.EX4
          flowRef: FR-SUB-03.EX4
          stepRefs:
            - FR-SUB-03.EX4.S1
          given:
            - Execution reaches FR-SUB-03.MAIN.S4.
            - The approved entitlement interval ends without a confirmed continuation
          when: Open an affected capability
          then:
            - Show the expired capability and available approved continuation while checking other
              independent rights
            - No extension or loss of unrelated rights is inferred; data retention follows D08.
      nonFunctionalApplication:
        - id: NFR-SEC
          scope: Main flow and every alternative/exception, including re-entry and current-rights checks.
        - id: NFR-PRIV
          scope: Main flow and every alternative/exception, including re-entry and current-rights checks.
        - id: NFR-INTEGRITY
          scope: Main flow and every alternative/exception, including re-entry and current-rights checks.
        - id: NFR-RELIABILITY
          scope: Main flow and every alternative/exception, including re-entry and current-rights checks.
        - id: NFR-REPEAT
          scope: Main flow and every alternative/exception, including re-entry and current-rights checks.
        - id: NFR-LATENCY
          scope: Main flow and every alternative/exception, including re-entry and current-rights checks.
        - id: NFR-USABILITY
          scope: Main flow and every alternative/exception, including re-entry and current-rights checks.
        - id: NFR-COST
          scope: Main flow and every alternative/exception, including re-entry and current-rights checks.
        - id: NFR-AUDIT
          scope: Main flow and every alternative/exception, including re-entry and current-rights checks.
      designHandoff: SDS must map these requirement/flow/step IDs to actual entry points, boundaries, data
        operations, failure paths and verification evidence. This SRS chooses no monolith,
        microservice, source file, queue or database design.
      featureOwner: commerce
      ownership: Defined once in this feature. Other features reference the stable
        requirement/data/journey ID and current Work node ID.
      authorityRefs:
        - artifact: SRC-BUSINESS
          sections:
            - "11.2"
        - artifact: SRC-BRIEF
          sections:
            - "4"
            - "5"
            - "6"
            - "7"
      trigger: Open the active subscription

schema: work/node@2
id: starci-next.business.srs.business-rules.capability-specific-usage
kind: business
required: true
state: todo
description: Capability-specific usage
refs:
  - starci-next.business.srs.business-rules.policy-decisions.commercial-offers
  - starci-next.business.srs.business-rules.policy-decisions.failed-ai-usage
extensions:
  work3:
    srs:
      schema: starci/srs-business-rule@1
      status: draft
      authority: proposed-detail-from-accepted-product-scope
      id: BR-USAGE
      title: Capability-specific usage
      statements:
        - Content entitlement and AI/review allowance are independent rights unless approved offer
          terms explicitly connect them.
        - Each usage outcome links to an identified request and published charging rule; retries and
          unknown completion are visible.
        - Exhausted AI allowance does not remove an otherwise active reading right.
      decisionRefs:
        - D02
        - D07
      example: After using the permitted review allowance the learner can still open a purchased lesson.
      acceptanceCriteria:
        - id: BR-USAGE.AC1
          given: A feature reaches a condition governed by this rule.
          when: The governed business outcome is produced or inspected.
          then: Content entitlement and AI/review allowance are independent rights unless approved offer terms
            explicitly connect them.
        - id: BR-USAGE.AC2
          given: A feature reaches a condition governed by this rule.
          when: The governed business outcome is produced or inspected.
          then: Each usage outcome links to an identified request and published charging rule; retries and
            unknown completion are visible.
        - id: BR-USAGE.AC3
          given: A feature reaches a condition governed by this rule.
          when: The governed business outcome is produced or inspected.
          then: Exhausted AI allowance does not remove an otherwise active reading right.
      featureOwner: commerce
      ownership: Defined once in this feature. Other features reference the stable
        requirement/data/journey ID and current Work node ID.

schema: work/node@2
id: starci-next.business.srs.data.opportunity
kind: business
required: true
state: todo
description: Organization-owned recruitment opportunity
refs:
  - starci-next.business.srs.business-rules.policy-decisions.recruitment-trust
extensions:
  work3:
    srs:
      schema: starci/srs-data-definition@1
      status: draft
      authority: proposed-detail-from-accepted-product-scope
      id: DATA-opportunity
      title: Organization-owned recruitment opportunity
      modelLevel: Proposed logical business contract; physical storage, indexes and APIs belong to SDS.
      owner: authorized organization representative
      fields:
        - name: id
          meaning: Stable logical record identity
          validation: Required, unique and not changed by a state transition
          classification: context-scoped
        - name: version
          meaning: Record/content revision used for attribution and confirmation
          validation: Identify the reviewed version; changed content must not impersonate an earlier revision
          classification: context-scoped
        - name: roleAndRequirements
          meaning: Role expectations and required evidence
          validation: Required accurate description of role and gaps
          classification: published
        - name: organizationRef
          meaning: Accountable offering organization
          validation: Representation authority verified according to D11
          classification: published
        - name: availability
          meaning: Open/closed status and applicable conditions
          validation: Current state checked at application confirmation
          classification: published
        - name: matchExplanation
          meaning: Evidence supporting/limiting relevance when suggested
          validation: Uses only permitted profile evidence; no employment guarantee
          classification: private
      relations:
        - dataRef: DATA-organization
          meaning: Referenced business identity/version; lookup never grants access by itself.
        - dataRef: DATA-application
          meaning: Referenced business identity/version; lookup never grants access by itself.
      states:
        - draft
        - in-review
        - open
        - closed
        - restricted
      transitions:
        - id: DATA-opportunity.T1
          from: draft
          to: in-review
          event: Submit opportunity candidate
          guard: Required role and organization context complete
        - id: DATA-opportunity.T2
          from: in-review
          to: open
          event: Approve eligible publication
          guard: D11 publication/verification policy satisfied
        - id: DATA-opportunity.T3
          from: open
          to: closed
          event: Close intake
          guard: Current applicants retain attributable history
        - id: DATA-opportunity.T4
          from: open
          to: restricted
          event: Apply authorized trust restriction
          guard: Explain allowed disposition under D11
      invariants:
        - Organization identity and representative authority are distinct.
      decisionRefs:
        - D11
      privacy:
        access: Apply current owner, role, resource and audience grants. A selected-public field is exposed
          only after authorized publication.
        retention: D08 selects retention/export/closure behavior. No storage duration or automatic deletion
          policy is inferred.
        referenceWithdrawal: Preserve permitted provenance while preventing newly unauthorized source
          access; retained snapshots require approved D08 purpose and scope.
      validationCases:
        - given: An actor without current rights references this opportunity.
          when: Read or mutate the record.
          then: Deny the unauthorized action without disclosing restricted fields.
        - given: A record in a declared state and an attributed authorized event.
          when: Apply a listed transition.
          then: Require its guard, retain the prior version attribution and reject a transition unsupported by
            policy.
      featureOwner: recruitment
      ownership: Defined once in this feature. Other features reference the stable
        requirement/data/journey ID and current Work node ID.

schema: work/node@2
id: starci-next.business.srs.data.application
kind: business
required: true
state: todo
description: Candidate-approved opportunity application
refs:
  - starci-next.business.srs.business-rules.policy-decisions.privacy-and-sharing
  - starci-next.business.srs.business-rules.policy-decisions.recruitment-trust
extensions:
  work3:
    srs:
      schema: starci/srs-data-definition@1
      status: draft
      authority: proposed-detail-from-accepted-product-scope
      id: DATA-application
      title: Candidate-approved opportunity application
      modelLevel: Proposed logical business contract; physical storage, indexes and APIs belong to SDS.
      owner: candidate; scoped receiving organization
      fields:
        - name: id
          meaning: Stable logical record identity
          validation: Required, unique and not changed by a state transition
          classification: context-scoped
        - name: version
          meaning: Record/content revision used for attribution and confirmation
          validation: Identify the reviewed version; changed content must not impersonate an earlier revision
          classification: context-scoped
        - name: opportunityVersion
          meaning: Opportunity selected by candidate
          validation: Must be open and authorized at confirmation
          classification: selected-recipients
        - name: candidateSelections
          meaning: Selected CV/profile/evidence versions
          validation: Require current candidate review and permission
          classification: selected-recipients
        - name: processingHistory
          meaning: Received, reviewed and decision events
          validation: Actor and business meaning of each event recorded
          classification: selected-recipients
        - name: contactPermission
          meaning: Permitted contact and message scope
          validation: D11 contact policy and consent required
          classification: restricted
      relations:
        - dataRef: DATA-opportunity
          meaning: Referenced business identity/version; lookup never grants access by itself.
        - dataRef: DATA-cv
          meaning: Referenced business identity/version; lookup never grants access by itself.
        - dataRef: DATA-profile
          meaning: Referenced business identity/version; lookup never grants access by itself.
        - dataRef: DATA-share-grant
          meaning: Referenced business identity/version; lookup never grants access by itself.
      states:
        - draft
        - submitted
        - under-review
        - contact-requested
        - closed
        - withdrawn
      transitions:
        - id: DATA-application.T1
          from: draft
          to: submitted
          event: Candidate confirms application
          guard: Opportunity and selected disclosure revalidated
        - id: DATA-application.T2
          from: submitted
          to: under-review
          event: Authorized representative reviews
          guard: Organization scope valid
        - id: DATA-application.T3
          from: under-review
          to: contact-requested
          event: Request permitted contact
          guard: D11/D08 candidate scope valid
        - id: DATA-application.T4
          from: under-review
          to: closed
          event: Record organization disposition
          guard: Explain state without guaranteeing employment
        - id: DATA-application.T5
          from: submitted
          to: withdrawn
          event: Candidate withdraws application
          guard: Approved D08 handling of prior authorized copies
        - id: DATA-application.T6
          from: under-review
          to: withdrawn
          event: Candidate withdraws during processing
          guard: Future access/contact follows approved policy
      invariants:
        - Viewing a match never submits an application.
      decisionRefs:
        - D08
        - D11
      privacy:
        access: Apply current owner, role, resource and audience grants. A selected-public field is exposed
          only after authorized publication.
        retention: D08 selects retention/export/closure behavior. No storage duration or automatic deletion
          policy is inferred.
        referenceWithdrawal: Preserve permitted provenance while preventing newly unauthorized source
          access; retained snapshots require approved D08 purpose and scope.
      validationCases:
        - given: An actor without current rights references this application.
          when: Read or mutate the record.
          then: Deny the unauthorized action without disclosing restricted fields.
        - given: A record in a declared state and an attributed authorized event.
          when: Apply a listed transition.
          then: Require its guard, retain the prior version attribution and reject a transition unsupported by
            policy.
      featureOwner: recruitment
      ownership: Defined once in this feature. Other features reference the stable
        requirement/data/journey ID and current Work node ID.

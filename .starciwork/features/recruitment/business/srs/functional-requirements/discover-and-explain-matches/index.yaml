        - D08
        - D11
      decisionTreatment: Direct policy refs affect the named feature behavior; inherited refs govern
        cross-cutting rules and measurement targets. Open policies are not selected by this draft.
      mainFlow:
        id: FR-HIRE-02.MAIN
        trigger: Browse active opportunities or request suggestions
        steps:
          - id: FR-HIRE-02.MAIN.S1
            actor: learner
            request: Browse active opportunities or request suggestions
            systemResponse: Show available roles and their requirements
            businessEffect: A suggestion is not an application.
            acceptanceRefs:
              - FR-HIRE-02.AC.M1
          - id: FR-HIRE-02.MAIN.S2
            actor: learner
            request: Select permitted profile evidence for matching
            systemResponse: Explain which information will be used
            businessEffect: Private answers and drafts are not included without permission.
            acceptanceRefs:
              - FR-HIRE-02.AC.M2
          - id: FR-HIRE-02.MAIN.S3
            actor: learner
            request: Inspect a suggested match
            systemResponse: Explain supported matches, gaps and uncertainty from the allowed evidence
            businessEffect: AI inference is labeled separately from demonstrated qualifications.
            acceptanceRefs:
              - FR-HIRE-02.AC.M3
          - id: FR-HIRE-02.MAIN.S4
            actor: learner
            request: Choose to inspect, save or apply to an opportunity
            systemResponse: Show the next action and its sharing implications
            businessEffect: Only an explicit application starts the application flow.
            acceptanceRefs:
              - FR-HIRE-02.AC.M4
        end:
          type: completed-main-flow
          outcome: Only an explicit application starts the application flow.
      alternativeFlows:
        - id: FR-HIRE-02.ALT1
          title: The learner disagrees with a suggested match
          fromStep: FR-HIRE-02.MAIN.S3
          condition: The learner disagrees with a suggested match
          steps:
            - id: FR-HIRE-02.ALT1.S1
              actor: learner
              request: Change criteria or browse manually
              systemResponse: Offer the revised discovery path
              businessEffect: No forced recommendation or application.
              acceptanceRefs:
                - FR-HIRE-02.AC.ALT1
          resume:
            type: end
            outcome: No forced recommendation or application.
          postconditions:
            - No forced recommendation or application.
          continuation: This flow instance ends with the stated outcome. A permitted correction, status lookup
            or deliberate new request follows the response and current policy; it does not imply a
            successful main outcome.
          acceptanceRefs:
            - FR-HIRE-02.AC.ALT1
      exceptionFlows:
        - id: FR-HIRE-02.EX1
          title: Evidence is insufficient or no opportunity matches
          fromStep: FR-HIRE-02.MAIN.S3
          condition: Evidence is insufficient or no opportunity matches
          steps:
            - id: FR-HIRE-02.EX1.S1
              actor: learner
              request: Inspect suggestions
              systemResponse: State the gap or no-match result
              businessEffect: No invented qualification or employment promise.
              acceptanceRefs:
                - FR-HIRE-02.AC.EX1
          resume:
            type: end
            outcome: No invented qualification or employment promise.
          postconditions:
            - No invented qualification or employment promise.
          continuation: This flow instance ends with the stated outcome. A permitted correction, status lookup
            or deliberate new request follows the response and current policy; it does not imply a
            successful main outcome.
          acceptanceRefs:
            - FR-HIRE-02.AC.EX1
        - id: FR-HIRE-02.EX2
          title: Evidence sharing is withdrawn
          fromStep: FR-HIRE-02.MAIN.S3
          condition: Evidence sharing is withdrawn
          steps:
            - id: FR-HIRE-02.EX2.S1
              actor: learner
              request: Request a new match
              systemResponse: Exclude withdrawn information
              businessEffect: No new recruiting disclosure based on stale consent.
              acceptanceRefs:
                - FR-HIRE-02.AC.EX2
          resume:
            type: end
            outcome: No new recruiting disclosure based on stale consent.
          postconditions:
            - No new recruiting disclosure based on stale consent.
          continuation: This flow instance ends with the stated outcome. A permitted correction, status lookup
            or deliberate new request follows the response and current policy; it does not imply a
            successful main outcome.
          acceptanceRefs:
            - FR-HIRE-02.AC.EX2
      postconditions:
        success:
          - A suggestion is not an application.
          - Private answers and drafts are not included without permission.
          - AI inference is labeled separately from demonstrated qualifications.
          - Only an explicit application starts the application flow.
        failure:
          - Only effects explicitly completed before the branch remain, with their original
            attribution.
          - No rejected or unresolved operation is presented as the successful main outcome.
          - No invented qualification or employment promise.
          - No new recruiting disclosure based on stale consent.
      acceptanceCriteria:

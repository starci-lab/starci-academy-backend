            - No invented qualification or employment promise.
        - id: FR-HIRE-02.AC.EX2
          flowRef: FR-HIRE-02.EX2
          stepRefs:
            - FR-HIRE-02.EX2.S1
          given:
            - Execution reaches FR-HIRE-02.MAIN.S3.
            - Evidence sharing is withdrawn
          when: Request a new match
          then:

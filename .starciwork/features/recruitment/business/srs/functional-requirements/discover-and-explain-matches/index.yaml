    srs:
      schema: starci/srs-functional-requirement@1
      status: draft
      authority: proposed-detail-from-accepted-product-scope
      id: FR-HIRE-02
      title: Discover opportunities and explain evidence-based matches
      domain: recruitment
      goal: Discover opportunities and explain evidence-based matches
      priority: release-priority-awaits-D01
      actors:
        - learner
      preconditions:
        - The actor can use personal discovery or a currently held organization role;
          publication/contact requires its separate policy.
        - Each protected step checks the acting identity, current resource/action/audience rights
          and any applicable entitlement.
        - Policy-dependent effects run only with the relevant approved policy; unresolved values
          remain explicit decision dependencies and do not block writing/reviewing this draft.
      inputs:
        - id: FR-HIRE-02.IN1
          name: opportunityCriteria
          validation: Role preferences or selected discovery criteria
          dataRefs:
            - DATA-opportunity
            - DATA-profile
            - DATA-evidence
            - DATA-share-grant
        - id: FR-HIRE-02.IN2
          name: matchingEvidence
          validation: Only candidate-approved profile/evidence scope
          dataRefs:
            - DATA-opportunity
            - DATA-profile
            - DATA-evidence
            - DATA-share-grant
      outputs:
        - name: result-1
          fromStep: FR-HIRE-02.MAIN.S1
          meaning: Show available roles and their requirements
          effect: A suggestion is not an application.
        - name: result-2
          fromStep: FR-HIRE-02.MAIN.S2
          meaning: Explain which information will be used
          effect: Private answers and drafts are not included without permission.
        - name: result-3
          fromStep: FR-HIRE-02.MAIN.S3
          meaning: Explain supported matches, gaps and uncertainty from the allowed evidence
          effect: AI inference is labeled separately from demonstrated qualifications.
        - name: result-4
          fromStep: FR-HIRE-02.MAIN.S4
          meaning: Show the next action and its sharing implications
          effect: Only an explicit application starts the application flow.
      businessRuleRefs:
        - BR-RECRUIT
        - BR-PRIVACY
        - BR-EVIDENCE
        - BR-AI
      dataRefs:

        - NFR-INTEGRITY
        - NFR-RELIABILITY
        - NFR-REPEAT
        - NFR-LATENCY
        - NFR-USABILITY
        - NFR-AUDIT
      decisionRefs:
        - D08
        - D11
        - D05
        - D03
        - D07
        - D06
        - D12
      directPolicyRefs:
        - D08
        - D11
      decisionTreatment: Direct policy refs affect the named feature behavior; inherited refs govern
        cross-cutting rules and measurement targets. Open policies are not selected by this draft.
      mainFlow:
        id: FR-HIRE-03.MAIN
        trigger: Choose an active opportunity
        steps:
          - id: FR-HIRE-03.MAIN.S1
            actor: learner
            request: Choose an active opportunity
            systemResponse: Show the organization, current requirements and application conditions
            businessEffect: The learner knows the intended recipient.
            acceptanceRefs:
              - FR-HIRE-03.AC.M1
          - id: FR-HIRE-03.MAIN.S2
            actor: learner
            request: Select profile fields, CV version and shareable evidence
            systemResponse: Preview the exact submitted package and recipient visibility
            businessEffect: Private learning data remains outside the package.
            acceptanceRefs:
              - FR-HIRE-03.AC.M2
          - id: FR-HIRE-03.MAIN.S3
            actor: learner
            request: Explicitly submit the application
            systemResponse: Check current conditions and record an application receipt
            businessEffect: The selected versions and recipient are attributable; live access versus retained
              authorized snapshot follows D08.
            acceptanceRefs:
              - FR-HIRE-03.AC.M3
          - id: FR-HIRE-03.MAIN.S4
            actor: learner
            request: Track the application
            systemResponse: Show received, in-process or actual reported outcome
            businessEffect: Receipt is not a hiring decision.
            acceptanceRefs:
              - FR-HIRE-03.AC.M4
        end:
          type: completed-main-flow
          outcome: Receipt is not a hiring decision.
      alternativeFlows:
        - id: FR-HIRE-03.ALT1
          title: The learner cancels before submission
          fromStep: FR-HIRE-03.MAIN.S2
          condition: The learner cancels before submission
          steps:
            - id: FR-HIRE-03.ALT1.S1
              actor: learner
              request: Cancel the application preview
              systemResponse: Keep permitted drafts
              businessEffect: No application or recruiter contact.
              acceptanceRefs:
                - FR-HIRE-03.AC.ALT1
          resume:
            type: end
            outcome: No application or recruiter contact.
          postconditions:
            - No application or recruiter contact.
          continuation: This flow instance ends with the stated outcome. A permitted correction, status lookup
            or deliberate new request follows the response and current policy; it does not imply a
            successful main outcome.
          acceptanceRefs:
            - FR-HIRE-03.AC.ALT1
      exceptionFlows:
        - id: FR-HIRE-03.EX1
          title: The opportunity closed or consent changed
          fromStep: FR-HIRE-03.MAIN.S3
          condition: The opportunity closed or consent changed
          steps:
            - id: FR-HIRE-03.EX1.S1
              actor: learner
              request: Submit the application
              systemResponse: Explain the changed condition and retain the learner draft
              businessEffect: No submission under stale terms or unauthorized evidence.
              acceptanceRefs:
                - FR-HIRE-03.AC.EX1
          resume:
            type: end
            outcome: No submission under stale terms or unauthorized evidence.
          postconditions:
            - No submission under stale terms or unauthorized evidence.
          continuation: This flow instance ends with the stated outcome. A permitted correction, status lookup
            or deliberate new request follows the response and current policy; it does not imply a
            successful main outcome.
          acceptanceRefs:
            - FR-HIRE-03.AC.EX1
        - id: FR-HIRE-03.EX2
          title: The response to submission is lost
          fromStep: FR-HIRE-03.MAIN.S4
          condition: The response to submission is lost
          steps:
            - id: FR-HIRE-03.EX2.S1
              actor: learner
              request: Look up the same application intent
              systemResponse: Return the original receipt or unresolved status
              businessEffect: No duplicate application created just to recover the response.
              acceptanceRefs:
                - FR-HIRE-03.AC.EX2
          resume:
            type: end
            outcome: No duplicate application created just to recover the response.
          postconditions:
            - No duplicate application created just to recover the response.
          continuation: This flow instance ends with the stated outcome. A permitted correction, status lookup
            or deliberate new request follows the response and current policy; it does not imply a
            successful main outcome.
          acceptanceRefs:
            - FR-HIRE-03.AC.EX2
      postconditions:
        success:
          - The learner knows the intended recipient.
          - Private learning data remains outside the package.
          - The selected versions and recipient are attributable; live access versus retained
            authorized snapshot follows D08.
          - Receipt is not a hiring decision.
        failure:
          - Only effects explicitly completed before the branch remain, with their original
            attribution.
          - No rejected or unresolved operation is presented as the successful main outcome.
          - No submission under stale terms or unauthorized evidence.
          - No duplicate application created just to recover the response.
      acceptanceCriteria:
        - id: FR-HIRE-03.AC.M1
          flowRef: FR-HIRE-03.MAIN
          stepRefs:
            - FR-HIRE-03.MAIN.S1
          given:

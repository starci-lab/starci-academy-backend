        - id: FR-HIRE-03.AC.M3
          flowRef: FR-HIRE-03.MAIN
          stepRefs:
            - FR-HIRE-03.MAIN.S3
          given:
            - The previous main-flow step FR-HIRE-03.MAIN.S2 completed with its stated result.
            - Each protected step checks the acting identity, current resource/action/audience
              rights and any applicable entitlement.
            - Policy-dependent effects run only with the relevant approved policy; unresolved values
              remain explicit decision dependencies and do not block writing/reviewing this draft.
          when: Explicitly submit the application
          then:
            - Check current conditions and record an application receipt
            - The selected versions and recipient are attributable; live access versus retained
              authorized snapshot follows D08.
        - id: FR-HIRE-03.AC.M4
          flowRef: FR-HIRE-03.MAIN
          stepRefs:
            - FR-HIRE-03.MAIN.S4
          given:
            - The previous main-flow step FR-HIRE-03.MAIN.S3 completed with its stated result.
            - Each protected step checks the acting identity, current resource/action/audience
              rights and any applicable entitlement.
            - Policy-dependent effects run only with the relevant approved policy; unresolved values
              remain explicit decision dependencies and do not block writing/reviewing this draft.
          when: Track the application
          then:
            - Show received, in-process or actual reported outcome
            - Receipt is not a hiring decision.
        - id: FR-HIRE-03.AC.ALT1
          flowRef: FR-HIRE-03.ALT1
          stepRefs:
            - FR-HIRE-03.ALT1.S1
          given:
            - Execution reaches FR-HIRE-03.MAIN.S2.
            - The learner cancels before submission
          when: Cancel the application preview
          then:
            - Keep permitted drafts
            - No application or recruiter contact.
        - id: FR-HIRE-03.AC.EX1
          flowRef: FR-HIRE-03.EX1
          stepRefs:
            - FR-HIRE-03.EX1.S1
          given:
            - Execution reaches FR-HIRE-03.MAIN.S3.
            - The opportunity closed or consent changed
          when: Submit the application
          then:
            - Explain the changed condition and retain the learner draft
            - No submission under stale terms or unauthorized evidence.
        - id: FR-HIRE-03.AC.EX2
          flowRef: FR-HIRE-03.EX2
          stepRefs:
            - FR-HIRE-03.EX2.S1
          given:
            - Execution reaches FR-HIRE-03.MAIN.S4.
            - The response to submission is lost
          when: Look up the same application intent
          then:
            - Return the original receipt or unresolved status
            - No duplicate application created just to recover the response.

  work3:
    srs:
      schema: starci/srs-functional-requirement@1
      status: draft
      authority: proposed-detail-from-accepted-product-scope
      id: FR-HIRE-03
      title: Apply using reviewed profile and CV versions
      domain: recruitment
      goal: Apply using reviewed profile and CV versions
      priority: release-priority-awaits-D01
      actors:
        - learner
      preconditions:
        - The actor can use personal discovery or a currently held organization role;
          publication/contact requires its separate policy.
        - Each protected step checks the acting identity, current resource/action/audience rights
          and any applicable entitlement.
        - Policy-dependent effects run only with the relevant approved policy; unresolved values
          remain explicit decision dependencies and do not block writing/reviewing this draft.
      inputs:
        - id: FR-HIRE-03.IN1
          name: opportunityVersion
          validation: Current opportunity and intended recipient
          dataRefs:
            - DATA-application
            - DATA-opportunity
            - DATA-cv
            - DATA-profile
            - DATA-share-grant
        - id: FR-HIRE-03.IN2
          name: applicationSelections
          validation: Reviewed profile, CV and shareable evidence versions with explicit submit
          dataRefs:
            - DATA-application
            - DATA-opportunity
            - DATA-cv
            - DATA-profile
            - DATA-share-grant
      outputs:
        - name: result-1
          fromStep: FR-HIRE-03.MAIN.S1
          meaning: Show the organization, current requirements and application conditions
          effect: The learner knows the intended recipient.
        - name: result-2
          fromStep: FR-HIRE-03.MAIN.S2
          meaning: Preview the exact submitted package and recipient visibility
          effect: Private learning data remains outside the package.
        - name: result-3
          fromStep: FR-HIRE-03.MAIN.S3
          meaning: Check current conditions and record an application receipt
          effect: The selected versions and recipient are attributable; live access versus retained authorized
            snapshot follows D08.
        - name: result-4
          fromStep: FR-HIRE-03.MAIN.S4
          meaning: Show received, in-process or actual reported outcome
          effect: Receipt is not a hiring decision.
      businessRuleRefs:
        - BR-RECRUIT
        - BR-PRIVACY
        - BR-REPEAT
        - BR-VERSION
      dataRefs:
        - DATA-application
        - DATA-opportunity
        - DATA-cv
        - DATA-profile
        - DATA-share-grant
      nonFunctionalRefs:
        - NFR-SEC

extensions:
  work3:
    srs:
      schema: starci/srs-functional-requirement@1
      status: draft
      authority: proposed-detail-from-accepted-product-scope
      id: FR-HIRE-04
      title: Review applications and conduct permitted recruitment contact
      domain: recruitment
      goal: Review applications and conduct permitted recruitment contact
      priority: release-priority-awaits-D01
      actors:
        - recruiter
      preconditions:
        - The actor can use personal discovery or a currently held organization role;
          publication/contact requires its separate policy.
        - Each protected step checks the acting identity, current resource/action/audience rights
          and any applicable entitlement.
        - Policy-dependent effects run only with the relevant approved policy; unresolved values
          remain explicit decision dependencies and do not block writing/reviewing this draft.
      inputs:
        - id: FR-HIRE-04.IN1
          name: organizationApplication
          validation: Application within held representative scope
          dataRefs:
            - DATA-application
            - DATA-organization
            - DATA-share-grant
        - id: FR-HIRE-04.IN2
          name: processingChoice
          validation: Attributed disposition or contact request under current permission
          dataRefs:
            - DATA-application
            - DATA-organization
            - DATA-share-grant
      outputs:
        - name: result-1
          fromStep: FR-HIRE-04.MAIN.S1
          meaning: Show only applications accessible in the current recruiter role
          effect: No access to unrelated candidates private learning history.
        - name: result-2
          fromStep: FR-HIRE-04.MAIN.S2
          meaning: Show its version, evidence scope and current viewing rights
          effect: Unavailable evidence is labeled rather than reconstructed from private data.
        - name: result-3
          fromStep: FR-HIRE-04.MAIN.S3
          meaning: Preview the intended candidate and communication purpose
          effect: Policy and candidate contact scope are checked.
        - name: result-4
          fromStep: FR-HIRE-04.MAIN.S4
          meaning: Show current application state and actual communication status
          effect: A queued message or proposed match is not an accepted job offer.
      businessRuleRefs:
        - BR-RECRUIT
        - BR-RIGHTS
        - BR-PRIVACY
      dataRefs:
        - DATA-application
        - DATA-organization
        - DATA-share-grant
      nonFunctionalRefs:
        - NFR-SEC
        - NFR-PRIV
        - NFR-AI
        - NFR-INTEGRITY
        - NFR-RELIABILITY
        - NFR-REPEAT
        - NFR-LATENCY
        - NFR-USABILITY
        - NFR-AUDIT
      decisionRefs:
        - D08
        - D11
        - D06
        - D07
        - D05
        - D03
        - D12
      directPolicyRefs:
        - D08
        - D11
      decisionTreatment: Direct policy refs affect the named feature behavior; inherited refs govern
        cross-cutting rules and measurement targets. Open policies are not selected by this draft.
      mainFlow:
        id: FR-HIRE-04.MAIN
        trigger: Open applications for an organization opportunity
        steps:
          - id: FR-HIRE-04.MAIN.S1
            actor: recruiter
            request: Open applications for an organization opportunity
            systemResponse: Show only applications accessible in the current recruiter role
            businessEffect: No access to unrelated candidates private learning history.
            acceptanceRefs:
              - FR-HIRE-04.AC.M1
          - id: FR-HIRE-04.MAIN.S2
            actor: recruiter
            request: Inspect a selected submitted package
            systemResponse: Show its version, evidence scope and current viewing rights
            businessEffect: Unavailable evidence is labeled rather than reconstructed from private data.
            acceptanceRefs:
              - FR-HIRE-04.AC.M2
          - id: FR-HIRE-04.MAIN.S3
            actor: recruiter
            request: Choose a permitted next step or contact request
            systemResponse: Preview the intended candidate and communication purpose
            businessEffect: Policy and candidate contact scope are checked.
            acceptanceRefs:
              - FR-HIRE-04.AC.M3
          - id: FR-HIRE-04.MAIN.S4
            actor: recruiter
            request: Record the action and inspect its outcome
            systemResponse: Show current application state and actual communication status
            businessEffect: A queued message or proposed match is not an accepted job offer.
            acceptanceRefs:
              - FR-HIRE-04.AC.M4
        end:
          type: completed-main-flow
          outcome: A queued message or proposed match is not an accepted job offer.
      alternativeFlows:
        - id: FR-HIRE-04.ALT1
          title: The recruiter decides not to proceed
          fromStep: FR-HIRE-04.MAIN.S3
          condition: The recruiter decides not to proceed
          steps:
            - id: FR-HIRE-04.ALT1.S1
              actor: recruiter
              request: Record the applicable application outcome
              systemResponse: Show the recorded outcome under the communication policy
              businessEffect: No unsolicited additional contact is implied.
              acceptanceRefs:
                - FR-HIRE-04.AC.ALT1
          resume:
            type: end
            outcome: No unsolicited additional contact is implied.
          postconditions:
            - No unsolicited additional contact is implied.
          continuation: This flow instance ends with the stated outcome. A permitted correction, status lookup
            or deliberate new request follows the response and current policy; it does not imply a
            successful main outcome.
          acceptanceRefs:
            - FR-HIRE-04.AC.ALT1
      exceptionFlows:
        - id: FR-HIRE-04.EX1
          title: Recruiter authority or candidate contact permission is absent
          fromStep: FR-HIRE-04.MAIN.S3
          condition: Recruiter authority or candidate contact permission is absent
          steps:
            - id: FR-HIRE-04.EX1.S1
              actor: recruiter
              request: Attempt the action
              systemResponse: Refuse and show the missing condition
              businessEffect: No foreign application mutation or unauthorized contact.
              acceptanceRefs:
                - FR-HIRE-04.AC.EX1
          resume:
            type: end
            outcome: No foreign application mutation or unauthorized contact.
          postconditions:
            - No foreign application mutation or unauthorized contact.
          continuation: This flow instance ends with the stated outcome. A permitted correction, status lookup
            or deliberate new request follows the response and current policy; it does not imply a
            successful main outcome.
          acceptanceRefs:
            - FR-HIRE-04.AC.EX1
        - id: FR-HIRE-04.EX2
          title: Communication or result delivery is uncertain
          fromStep: FR-HIRE-04.MAIN.S4
          condition: Communication or result delivery is uncertain
          steps:
            - id: FR-HIRE-04.EX2.S1
              actor: recruiter
              request: Inspect the same action
              systemResponse: Show pending/unknown with its original reference
              businessEffect: No invented delivered/read outcome or blind duplicate contact.
              acceptanceRefs:
                - FR-HIRE-04.AC.EX2
          resume:
            type: end
            outcome: No invented delivered/read outcome or blind duplicate contact.
          postconditions:
            - No invented delivered/read outcome or blind duplicate contact.
          continuation: This flow instance ends with the stated outcome. A permitted correction, status lookup
            or deliberate new request follows the response and current policy; it does not imply a
            successful main outcome.
          acceptanceRefs:
            - FR-HIRE-04.AC.EX2
      postconditions:
        success:
          - No access to unrelated candidates private learning history.
          - Unavailable evidence is labeled rather than reconstructed from private data.
          - Policy and candidate contact scope are checked.
          - A queued message or proposed match is not an accepted job offer.
        failure:
          - Only effects explicitly completed before the branch remain, with their original
            attribution.
          - No rejected or unresolved operation is presented as the successful main outcome.
          - No foreign application mutation or unauthorized contact.
          - No invented delivered/read outcome or blind duplicate contact.
      acceptanceCriteria:
        - id: FR-HIRE-04.AC.M1
          flowRef: FR-HIRE-04.MAIN
          stepRefs:
            - FR-HIRE-04.MAIN.S1
          given:
            - The actor can use personal discovery or a currently held organization role;
              publication/contact requires its separate policy.
            - Each protected step checks the acting identity, current resource/action/audience
              rights and any applicable entitlement.
            - Policy-dependent effects run only with the relevant approved policy; unresolved values
              remain explicit decision dependencies and do not block writing/reviewing this draft.
          when: Open applications for an organization opportunity
          then:
            - Show only applications accessible in the current recruiter role
            - No access to unrelated candidates private learning history.
        - id: FR-HIRE-04.AC.M2
          flowRef: FR-HIRE-04.MAIN
          stepRefs:
            - FR-HIRE-04.MAIN.S2
          given:
            - The previous main-flow step FR-HIRE-04.MAIN.S1 completed with its stated result.
            - Each protected step checks the acting identity, current resource/action/audience
              rights and any applicable entitlement.
            - Policy-dependent effects run only with the relevant approved policy; unresolved values
              remain explicit decision dependencies and do not block writing/reviewing this draft.
          when: Inspect a selected submitted package
          then:
            - Show its version, evidence scope and current viewing rights
            - Unavailable evidence is labeled rather than reconstructed from private data.
        - id: FR-HIRE-04.AC.M3
          flowRef: FR-HIRE-04.MAIN
          stepRefs:
            - FR-HIRE-04.MAIN.S3
          given:
            - The previous main-flow step FR-HIRE-04.MAIN.S2 completed with its stated result.
            - Each protected step checks the acting identity, current resource/action/audience
              rights and any applicable entitlement.
            - Policy-dependent effects run only with the relevant approved policy; unresolved values
              remain explicit decision dependencies and do not block writing/reviewing this draft.
          when: Choose a permitted next step or contact request
          then:
            - Preview the intended candidate and communication purpose
            - Policy and candidate contact scope are checked.
        - id: FR-HIRE-04.AC.M4
          flowRef: FR-HIRE-04.MAIN
          stepRefs:
            - FR-HIRE-04.MAIN.S4
          given:
            - The previous main-flow step FR-HIRE-04.MAIN.S3 completed with its stated result.
            - Each protected step checks the acting identity, current resource/action/audience
              rights and any applicable entitlement.
            - Policy-dependent effects run only with the relevant approved policy; unresolved values
              remain explicit decision dependencies and do not block writing/reviewing this draft.
          when: Record the action and inspect its outcome
          then:
            - Show current application state and actual communication status
            - A queued message or proposed match is not an accepted job offer.
        - id: FR-HIRE-04.AC.ALT1
          flowRef: FR-HIRE-04.ALT1
          stepRefs:
            - FR-HIRE-04.ALT1.S1
          given:
            - Execution reaches FR-HIRE-04.MAIN.S3.
            - The recruiter decides not to proceed
          when: Record the applicable application outcome
          then:
            - Show the recorded outcome under the communication policy
            - No unsolicited additional contact is implied.
        - id: FR-HIRE-04.AC.EX1
          flowRef: FR-HIRE-04.EX1
          stepRefs:
            - FR-HIRE-04.EX1.S1
          given:
            - Execution reaches FR-HIRE-04.MAIN.S3.
            - Recruiter authority or candidate contact permission is absent
          when: Attempt the action
          then:
            - Refuse and show the missing condition
            - No foreign application mutation or unauthorized contact.
        - id: FR-HIRE-04.AC.EX2
          flowRef: FR-HIRE-04.EX2
          stepRefs:
            - FR-HIRE-04.EX2.S1
          given:
            - Execution reaches FR-HIRE-04.MAIN.S4.
            - Communication or result delivery is uncertain
          when: Inspect the same action
          then:
            - Show pending/unknown with its original reference
            - No invented delivered/read outcome or blind duplicate contact.
      nonFunctionalApplication:
        - id: NFR-SEC
          scope: Main flow and every alternative/exception, including re-entry and current-rights checks.
        - id: NFR-PRIV
          scope: Main flow and every alternative/exception, including re-entry and current-rights checks.
        - id: NFR-AI
          scope: Main flow and every alternative/exception, including re-entry and current-rights checks.
        - id: NFR-INTEGRITY
          scope: Main flow and every alternative/exception, including re-entry and current-rights checks.
        - id: NFR-RELIABILITY
          scope: Main flow and every alternative/exception, including re-entry and current-rights checks.
        - id: NFR-REPEAT
          scope: Main flow and every alternative/exception, including re-entry and current-rights checks.
        - id: NFR-LATENCY
          scope: Main flow and every alternative/exception, including re-entry and current-rights checks.
        - id: NFR-USABILITY
          scope: Main flow and every alternative/exception, including re-entry and current-rights checks.
        - id: NFR-AUDIT
          scope: Main flow and every alternative/exception, including re-entry and current-rights checks.
      designHandoff: SDS must map these requirement/flow/step IDs to actual entry points, boundaries, data
        operations, failure paths and verification evidence. This SRS chooses no monolith,
        microservice, source file, queue or database design.
      featureOwner: recruitment
      ownership: Defined once in this feature. Other features reference the stable

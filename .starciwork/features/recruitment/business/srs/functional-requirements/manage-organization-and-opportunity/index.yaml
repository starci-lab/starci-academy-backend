              rights and any applicable entitlement.
            - Policy-dependent effects run only with the relevant approved policy; unresolved values
              remain explicit decision dependencies and do not block writing/reviewing this draft.
          when: Create or revise a role opportunity
          then:
            - Capture responsibilities, requirements and candidate-facing information
            - The opportunity remains a draft until publication conditions are met.
        - id: FR-HIRE-01.AC.M3
          flowRef: FR-HIRE-01.MAIN
          stepRefs:
            - FR-HIRE-01.MAIN.S3
          given:
            - The previous main-flow step FR-HIRE-01.MAIN.S2 completed with its stated result.
            - Each protected step checks the acting identity, current resource/action/audience
              rights and any applicable entitlement.
            - Policy-dependent effects run only with the relevant approved policy; unresolved values
              remain explicit decision dependencies and do not block writing/reviewing this draft.
          when: Review verification and publication conditions
          then:
            - Explain missing information and policy requirements
            - Unverified status is not presented as verified.
        - id: FR-HIRE-01.AC.M4
          flowRef: FR-HIRE-01.MAIN
          stepRefs:
            - FR-HIRE-01.MAIN.S4
          given:
            - The previous main-flow step FR-HIRE-01.MAIN.S3 completed with its stated result.
            - Each protected step checks the acting identity, current resource/action/audience
              rights and any applicable entitlement.
            - Policy-dependent effects run only with the relevant approved policy; unresolved values
              remain explicit decision dependencies and do not block writing/reviewing this draft.
          when: Publish the reviewed opportunity when eligible
          then:
            - Record the active opportunity version
            - Candidates see its current status and requirements.
        - id: FR-HIRE-01.AC.M5
          flowRef: FR-HIRE-01.MAIN
          stepRefs:
            - FR-HIRE-01.MAIN.S5
          given:
            - The previous main-flow step FR-HIRE-01.MAIN.S4 completed with its stated result.
            - Each protected step checks the acting identity, current resource/action/audience
              rights and any applicable entitlement.
            - Policy-dependent effects run only with the relevant approved policy; unresolved values
              remain explicit decision dependencies and do not block writing/reviewing this draft.
          when: Close or update the opportunity
          then:
            - Show consequences for new applications and existing applicants
            - Existing application history is retained under policy.
        - id: FR-HIRE-01.AC.ALT1
          flowRef: FR-HIRE-01.ALT1
          stepRefs:
            - FR-HIRE-01.ALT1.S1
          given:
            - Execution reaches FR-HIRE-01.MAIN.S3.
            - The recruiter keeps the opportunity as a draft
          when: Leave publication pending
          then:
            - Retain the editable opportunity
            - No candidate-facing active listing.
        - id: FR-HIRE-01.AC.EX1
          flowRef: FR-HIRE-01.EX1
          stepRefs:
            - FR-HIRE-01.EX1.S1
          given:
            - Execution reaches FR-HIRE-01.MAIN.S4.
            - Representation or publication authority is missing
          when: Publish the opportunity
          then:
            - Refuse publication and explain the requirement
            - No false organization verification.
        - id: FR-HIRE-01.AC.EX2
          flowRef: FR-HIRE-01.EX2
          stepRefs:
            - FR-HIRE-01.EX2.S1
          given:
            - Execution reaches FR-HIRE-01.MAIN.S5.
            - A concurrent change supersedes the recruiter view
          when: Save the outdated revision
          then:
            - Return a conflict with permitted current information
            - No lost opportunity update.
      nonFunctionalApplication:
        - id: NFR-SEC
          scope: Main flow and every alternative/exception, including re-entry and current-rights checks.
        - id: NFR-PRIV

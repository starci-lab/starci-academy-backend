    srs:
      schema: starci/srs-functional-requirement@1
      status: draft
      authority: proposed-detail-from-accepted-product-scope
      id: FR-HIRE-01
      title: Manage an organization profile and recruitment opportunity
      domain: recruitment
      goal: Manage an organization profile and recruitment opportunity
      priority: release-priority-awaits-D01
      actors:
        - recruiter
      preconditions:
        - The actor can use personal discovery or a currently held organization role;
          publication/contact requires its separate policy.
        - Each protected step checks the acting identity, current resource/action/audience rights
          and any applicable entitlement.
        - Policy-dependent effects run only with the relevant approved policy; unresolved values
          remain explicit decision dependencies and do not block writing/reviewing this draft.
      inputs:
        - id: FR-HIRE-01.IN1
          name: organizationContext
          validation: Held representation and current trust status
          dataRefs:
            - DATA-organization
            - DATA-opportunity
        - id: FR-HIRE-01.IN2
          name: opportunityFields
          validation: Role, requirements, publication/update/closure choice
          dataRefs:
            - DATA-organization
            - DATA-opportunity
      outputs:
        - name: result-1
          fromStep: FR-HIRE-01.MAIN.S1
          meaning: Show current representation and verification status
          effect: A personal account does not automatically represent an organization.
        - name: result-2
          fromStep: FR-HIRE-01.MAIN.S2
          meaning: Capture responsibilities, requirements and candidate-facing information
          effect: The opportunity remains a draft until publication conditions are met.
        - name: result-3
          fromStep: FR-HIRE-01.MAIN.S3
          meaning: Explain missing information and policy requirements
          effect: Unverified status is not presented as verified.
        - name: result-4
          fromStep: FR-HIRE-01.MAIN.S4
          meaning: Record the active opportunity version
          effect: Candidates see its current status and requirements.
        - name: result-5
          fromStep: FR-HIRE-01.MAIN.S5
          meaning: Show consequences for new applications and existing applicants
          effect: Existing application history is retained under policy.
      businessRuleRefs:
        - BR-RIGHTS
        - BR-RECRUIT
        - BR-PRIVACY
      dataRefs:
        - DATA-organization
        - DATA-opportunity
      nonFunctionalRefs:
        - NFR-SEC
        - NFR-PRIV
        - NFR-AI
        - NFR-INTEGRITY
        - NFR-RELIABILITY
        - NFR-REPEAT
        - NFR-LATENCY
        - NFR-USABILITY
        - NFR-AUDIT
      decisionRefs:
        - D11
        - D08
        - D06
        - D07
        - D05
        - D03
        - D12
      directPolicyRefs:
        - D11
      decisionTreatment: Direct policy refs affect the named feature behavior; inherited refs govern
        cross-cutting rules and measurement targets. Open policies are not selected by this draft.
      mainFlow:
        id: FR-HIRE-01.MAIN
        trigger: Open the organization profile in a held role
        steps:
          - id: FR-HIRE-01.MAIN.S1
            actor: recruiter
            request: Open the organization profile in a held role
            systemResponse: Show current representation and verification status
            businessEffect: A personal account does not automatically represent an organization.
            acceptanceRefs:
              - FR-HIRE-01.AC.M1
          - id: FR-HIRE-01.MAIN.S2
            actor: recruiter
            request: Create or revise a role opportunity
            systemResponse: Capture responsibilities, requirements and candidate-facing information
            businessEffect: The opportunity remains a draft until publication conditions are met.
            acceptanceRefs:
              - FR-HIRE-01.AC.M2
          - id: FR-HIRE-01.MAIN.S3
            actor: recruiter
            request: Review verification and publication conditions
            systemResponse: Explain missing information and policy requirements
            businessEffect: Unverified status is not presented as verified.
            acceptanceRefs:
              - FR-HIRE-01.AC.M3
          - id: FR-HIRE-01.MAIN.S4
            actor: recruiter
            request: Publish the reviewed opportunity when eligible
            systemResponse: Record the active opportunity version
            businessEffect: Candidates see its current status and requirements.
            acceptanceRefs:
              - FR-HIRE-01.AC.M4
          - id: FR-HIRE-01.MAIN.S5
            actor: recruiter
            request: Close or update the opportunity
            systemResponse: Show consequences for new applications and existing applicants
            businessEffect: Existing application history is retained under policy.
            acceptanceRefs:
              - FR-HIRE-01.AC.M5
        end:
          type: completed-main-flow
          outcome: Existing application history is retained under policy.
      alternativeFlows:
        - id: FR-HIRE-01.ALT1
          title: The recruiter keeps the opportunity as a draft
          fromStep: FR-HIRE-01.MAIN.S3
          condition: The recruiter keeps the opportunity as a draft
          steps:
            - id: FR-HIRE-01.ALT1.S1
              actor: recruiter
              request: Leave publication pending
              systemResponse: Retain the editable opportunity
              businessEffect: No candidate-facing active listing.
              acceptanceRefs:
                - FR-HIRE-01.AC.ALT1
          resume:
            type: end
            outcome: No candidate-facing active listing.
          postconditions:
            - No candidate-facing active listing.
          continuation: This flow instance ends with the stated outcome. A permitted correction, status lookup
            or deliberate new request follows the response and current policy; it does not imply a
            successful main outcome.
          acceptanceRefs:
            - FR-HIRE-01.AC.ALT1
      exceptionFlows:
        - id: FR-HIRE-01.EX1
          title: Representation or publication authority is missing
          fromStep: FR-HIRE-01.MAIN.S4
          condition: Representation or publication authority is missing
          steps:
            - id: FR-HIRE-01.EX1.S1
              actor: recruiter
              request: Publish the opportunity
              systemResponse: Refuse publication and explain the requirement
              businessEffect: No false organization verification.
              acceptanceRefs:
                - FR-HIRE-01.AC.EX1
          resume:
            type: end
            outcome: No false organization verification.
          postconditions:
            - No false organization verification.
          continuation: This flow instance ends with the stated outcome. A permitted correction, status lookup
            or deliberate new request follows the response and current policy; it does not imply a
            successful main outcome.
          acceptanceRefs:
            - FR-HIRE-01.AC.EX1
        - id: FR-HIRE-01.EX2
          title: A concurrent change supersedes the recruiter view
          fromStep: FR-HIRE-01.MAIN.S5
          condition: A concurrent change supersedes the recruiter view
          steps:
            - id: FR-HIRE-01.EX2.S1
              actor: recruiter
              request: Save the outdated revision
              systemResponse: Return a conflict with permitted current information
              businessEffect: No lost opportunity update.
              acceptanceRefs:
                - FR-HIRE-01.AC.EX2
          resume:
            type: end
            outcome: No lost opportunity update.
          postconditions:
            - No lost opportunity update.
          continuation: This flow instance ends with the stated outcome. A permitted correction, status lookup
            or deliberate new request follows the response and current policy; it does not imply a
            successful main outcome.
          acceptanceRefs:
            - FR-HIRE-01.AC.EX2
      postconditions:
        success:
          - A personal account does not automatically represent an organization.
          - The opportunity remains a draft until publication conditions are met.
          - Unverified status is not presented as verified.
          - Candidates see its current status and requirements.
          - Existing application history is retained under policy.
        failure:
          - Only effects explicitly completed before the branch remain, with their original
            attribution.
          - No rejected or unresolved operation is presented as the successful main outcome.
          - No false organization verification.
          - No lost opportunity update.
      acceptanceCriteria:
        - id: FR-HIRE-01.AC.M1
          flowRef: FR-HIRE-01.MAIN
          stepRefs:
            - FR-HIRE-01.MAIN.S1
          given:
            - The actor can use personal discovery or a currently held organization role;
              publication/contact requires its separate policy.
            - Each protected step checks the acting identity, current resource/action/audience
              rights and any applicable entitlement.
            - Policy-dependent effects run only with the relevant approved policy; unresolved values

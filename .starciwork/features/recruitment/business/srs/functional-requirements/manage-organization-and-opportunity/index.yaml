          when: Open the organization profile in a held role
          then:
            - Show current representation and verification status
            - A personal account does not automatically represent an organization.
        - id: FR-HIRE-01.AC.M2
          flowRef: FR-HIRE-01.MAIN
          stepRefs:
            - FR-HIRE-01.MAIN.S2
          given:
            - The previous main-flow step FR-HIRE-01.MAIN.S1 completed with its stated result.

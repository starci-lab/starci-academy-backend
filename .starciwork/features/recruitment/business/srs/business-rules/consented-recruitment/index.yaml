schema: work/node@2
id: starci-next.business.srs.business-rules.consented-recruitment
kind: business
required: true
state: todo
description: Consented recruitment
refs:
  - starci-next.business.srs.business-rules.policy-decisions.privacy-and-sharing
  - starci-next.business.srs.business-rules.policy-decisions.recruitment-trust
extensions:
  work3:
    srs:
      schema: starci/srs-business-rule@1
      status: draft
      authority: proposed-detail-from-accepted-product-scope
      id: BR-RECRUIT
      title: Consented recruitment
      statements:
        - A matching suggestion explains supporting and missing evidence; it is not a job guarantee,
          application or hiring decision.
        - The candidate explicitly chooses the application and disclosed versions; organization
          representatives access only the permitted recruitment scope.
        - Self-declared organizations or mentor expertise cannot acquire verified status without
          approved verification.
      decisionRefs:
        - D08
        - D11
      example: A candidate views a matching job without notifying the recruiter or exposing the private
        learning profile.
      acceptanceCriteria:
        - id: BR-RECRUIT.AC1
          given: A feature reaches a condition governed by this rule.
          when: The governed business outcome is produced or inspected.
          then: A matching suggestion explains supporting and missing evidence; it is not a job guarantee,
            application or hiring decision.
        - id: BR-RECRUIT.AC2
          given: A feature reaches a condition governed by this rule.
          when: The governed business outcome is produced or inspected.
          then: The candidate explicitly chooses the application and disclosed versions; organization
            representatives access only the permitted recruitment scope.
        - id: BR-RECRUIT.AC3
          given: A feature reaches a condition governed by this rule.
          when: The governed business outcome is produced or inspected.
          then: Self-declared organizations or mentor expertise cannot acquire verified status without
            approved verification.
      featureOwner: recruitment
      ownership: Defined once in this feature. Other features reference the stable
        requirement/data/journey ID and current Work node ID.

          given: A learner wants to develop engineering capability, including Automation or AI Harness.
          when: Complete each relevant stage under its declared prerequisites and inspect branch outcomes.
          then: The learner has an attributable learning-to-career evidence chain and a deliberately submitted
            application; employment is not guaranteed.

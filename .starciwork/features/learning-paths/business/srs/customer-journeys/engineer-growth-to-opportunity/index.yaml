        - id: CJ-01.B1
          atStageRefs:
            - CJ-01.S4
          requirementRef: FR-RAG-01
          flowRef: FR-RAG-01.EX1
          condition: No sufficiently relevant and trusted source is found
          handling: At the question stage, insufficient sources lead back to concept study or permitted source
            review; the learner is not shown a fabricated answer.
          acceptanceRefs:
            - FR-RAG-01.AC.EX1
          outcome:
            - No fabricated citation or confident unsupported source claim.
        - id: CJ-01.B2
          atStageRefs:
            - CJ-01.S6
          requirementRef: FR-PROJ-03
          flowRef: FR-PROJ-03.EX1
          condition: Evidence cannot support a requested conclusion
          handling: At project review, incomplete/unavailable evaluation stays visible; improve input or
            follow recovery before claiming mastery.
          acceptanceRefs:
            - FR-PROJ-03.AC.EX1
          outcome:
            - No assertion that a feature works solely from its description.
        - id: CJ-01.B3
          atStageRefs:
            - CJ-01.S12
          requirementRef: FR-HIRE-03
          flowRef: FR-HIRE-03.EX1
          condition: The opportunity closed or consent changed
          handling: At application confirmation, unavailable or changed opportunity/evidence is reviewed
            before submission.
          acceptanceRefs:
            - FR-HIRE-03.AC.EX1
          outcome:
            - No submission under stale terms or unauthorized evidence.

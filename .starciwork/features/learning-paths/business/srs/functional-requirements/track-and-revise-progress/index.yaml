extensions:
  work3:
    srs:
      schema: starci/srs-functional-requirement@1
      status: draft
      authority: proposed-detail-from-accepted-product-scope
      id: FR-PATH-02
      title: Review progress and revise the learning plan
      domain: learning-paths
      goal: Review progress and revise the learning plan
      priority: release-priority-awaits-D01
      actors:
        - learner
      preconditions:
        - The learner can access their own goal, plan and learning evidence.
        - Each protected step checks the acting identity, current resource/action/audience rights
          and any applicable entitlement.
        - Policy-dependent effects run only with the relevant approved policy; unresolved values
          remain explicit decision dependencies and do not block writing/reviewing this draft.
      inputs:
        - id: FR-PATH-02.IN1
          name: planAndMilestone
          validation: Current accepted plan and criterion being inspected
          dataRefs:
            - DATA-learning-plan
            - DATA-progress
            - DATA-review
            - DATA-submission
        - id: FR-PATH-02.IN2
          name: revisionChoice
          validation: Proposed changed goal or explicit accept/decline decision
          dataRefs:
            - DATA-learning-plan
            - DATA-progress
            - DATA-review
            - DATA-submission
      outputs:
        - name: result-1
          fromStep: FR-PATH-02.MAIN.S1
          meaning: Show reading, practice, assessment and reviewed project evidence separately
          effect: Each reported milestone links to the criteria and evidence it uses.
        - name: result-2
          fromStep: FR-PATH-02.MAIN.S2
          meaning: Explain achieved criteria, remaining gaps and evidence limitations
          effect: No unsupported mastery upgrade occurs.
        - name: result-3
          fromStep: FR-PATH-02.MAIN.S3
          meaning: Propose review, new practice or a changed learning plan
          effect: The recommendation remains proposed.
        - name: result-4
          fromStep: FR-PATH-02.MAIN.S4
          meaning: Explain retained achievements and criteria requiring new evidence
          effect: Record a new accepted plan version without rewriting historical results.
      businessRuleRefs:
        - BR-MASTERY
        - BR-EVIDENCE
        - BR-PLAN
      dataRefs:
        - DATA-learning-plan
        - DATA-progress
        - DATA-review
        - DATA-submission
      nonFunctionalRefs:
        - NFR-SEC
        - NFR-PRIV
        - NFR-AI
        - NFR-INTEGRITY
        - NFR-RELIABILITY
        - NFR-REPEAT
        - NFR-LATENCY
        - NFR-USABILITY
        - NFR-LANGUAGE
        - NFR-AUDIT
      decisionRefs:
        - D05
        - D07
        - D01
        - D08
        - D11
        - D06
        - D03
        - D12
      directPolicyRefs:
        - D05
      decisionTreatment: Direct policy refs affect the named feature behavior; inherited refs govern
        cross-cutting rules and measurement targets. Open policies are not selected by this draft.
      mainFlow:
        id: FR-PATH-02.MAIN
        trigger: Open learning progress
        steps:
          - id: FR-PATH-02.MAIN.S1
            actor: learner
            request: Open learning progress
            systemResponse: Show reading, practice, assessment and reviewed project evidence separately
            businessEffect: Each reported milestone links to the criteria and evidence it uses.
            acceptanceRefs:
              - FR-PATH-02.AC.M1
          - id: FR-PATH-02.MAIN.S2
            actor: learner
            request: Inspect a milestone or a failed attempt
            systemResponse: Explain achieved criteria, remaining gaps and evidence limitations
            businessEffect: No unsupported mastery upgrade occurs.
            acceptanceRefs:
              - FR-PATH-02.AC.M2
          - id: FR-PATH-02.MAIN.S3
            actor: learner
            request: Request the next step or a revised goal
            systemResponse: Propose review, new practice or a changed learning plan
            businessEffect: The recommendation remains proposed.
            acceptanceRefs:
              - FR-PATH-02.AC.M3
          - id: FR-PATH-02.MAIN.S4
            actor: learner
            request: Review changes and accept if desired
            systemResponse: Explain retained achievements and criteria requiring new evidence
            businessEffect: Record a new accepted plan version without rewriting historical results.
            acceptanceRefs:
              - FR-PATH-02.AC.M4
        end:
          type: completed-main-flow
          outcome: Record a new accepted plan version without rewriting historical results.
      alternativeFlows:
        - id: FR-PATH-02.ALT1
          title: The learner keeps the current plan
          fromStep: FR-PATH-02.MAIN.S3
          condition: The learner keeps the current plan
          steps:
            - id: FR-PATH-02.ALT1.S1
              actor: learner
              request: Decline the recommendation
              systemResponse: Continue with the existing milestones
              businessEffect: No plan change.
              acceptanceRefs:
                - FR-PATH-02.AC.ALT1
          resume:
            type: end
            outcome: No plan change.
          postconditions:
            - No plan change.
          continuation: This flow instance ends with the stated outcome. A permitted correction, status lookup
            or deliberate new request follows the response and current policy; it does not imply a
            successful main outcome.
          acceptanceRefs:
            - FR-PATH-02.AC.ALT1
      exceptionFlows:
        - id: FR-PATH-02.EX1
          title: Referenced evidence is withdrawn or no longer inspectable
          fromStep: FR-PATH-02.MAIN.S1
          condition: Referenced evidence is withdrawn or no longer inspectable
          steps:
            - id: FR-PATH-02.EX1.S1
              actor: learner
              request: Inspect the affected achievement
              systemResponse: Show historical attribution and current verification limits
              businessEffect: No false claim of currently verified evidence.
              acceptanceRefs:
                - FR-PATH-02.AC.EX1
          resume:
            type: end
            outcome: No false claim of currently verified evidence.
          postconditions:
            - No false claim of currently verified evidence.
          continuation: This flow instance ends with the stated outcome. A permitted correction, status lookup
            or deliberate new request follows the response and current policy; it does not imply a
            successful main outcome.
          acceptanceRefs:
            - FR-PATH-02.AC.EX1
        - id: FR-PATH-02.EX2
          title: The update conflicts with a newer accepted plan
          fromStep: FR-PATH-02.MAIN.S4
          condition: The update conflicts with a newer accepted plan
          steps:
            - id: FR-PATH-02.EX2.S1
              actor: learner
              request: Submit the stale revision
              systemResponse: Show current plan and request a new review
              businessEffect: No lost plan update.
              acceptanceRefs:
                - FR-PATH-02.AC.EX2
          resume:
            type: end
            outcome: No lost plan update.
          postconditions:
            - No lost plan update.
          continuation: This flow instance ends with the stated outcome. A permitted correction, status lookup
            or deliberate new request follows the response and current policy; it does not imply a
            successful main outcome.
          acceptanceRefs:
            - FR-PATH-02.AC.EX2
      postconditions:
        success:
          - Each reported milestone links to the criteria and evidence it uses.
          - No unsupported mastery upgrade occurs.
          - The recommendation remains proposed.
          - Record a new accepted plan version without rewriting historical results.
        failure:
          - Only effects explicitly completed before the branch remain, with their original
            attribution.
          - No rejected or unresolved operation is presented as the successful main outcome.
          - No false claim of currently verified evidence.
          - No lost plan update.
      acceptanceCriteria:
        - id: FR-PATH-02.AC.M1
          flowRef: FR-PATH-02.MAIN
          stepRefs:
            - FR-PATH-02.MAIN.S1
          given:
            - The learner can access their own goal, plan and learning evidence.
            - Each protected step checks the acting identity, current resource/action/audience
              rights and any applicable entitlement.
            - Policy-dependent effects run only with the relevant approved policy; unresolved values
              remain explicit decision dependencies and do not block writing/reviewing this draft.
          when: Open learning progress
          then:
            - Show reading, practice, assessment and reviewed project evidence separately
            - Each reported milestone links to the criteria and evidence it uses.
        - id: FR-PATH-02.AC.M2
          flowRef: FR-PATH-02.MAIN
          stepRefs:
            - FR-PATH-02.MAIN.S2
          given:
            - The previous main-flow step FR-PATH-02.MAIN.S1 completed with its stated result.
            - Each protected step checks the acting identity, current resource/action/audience
              rights and any applicable entitlement.
            - Policy-dependent effects run only with the relevant approved policy; unresolved values
              remain explicit decision dependencies and do not block writing/reviewing this draft.
          when: Inspect a milestone or a failed attempt
          then:
            - Explain achieved criteria, remaining gaps and evidence limitations
            - No unsupported mastery upgrade occurs.
        - id: FR-PATH-02.AC.M3
          flowRef: FR-PATH-02.MAIN
          stepRefs:
            - FR-PATH-02.MAIN.S3
          given:
            - The previous main-flow step FR-PATH-02.MAIN.S2 completed with its stated result.
            - Each protected step checks the acting identity, current resource/action/audience
              rights and any applicable entitlement.
            - Policy-dependent effects run only with the relevant approved policy; unresolved values
              remain explicit decision dependencies and do not block writing/reviewing this draft.
          when: Request the next step or a revised goal
          then:
            - Propose review, new practice or a changed learning plan
            - The recommendation remains proposed.
        - id: FR-PATH-02.AC.M4
          flowRef: FR-PATH-02.MAIN
          stepRefs:
            - FR-PATH-02.MAIN.S4
          given:
            - The previous main-flow step FR-PATH-02.MAIN.S3 completed with its stated result.
            - Each protected step checks the acting identity, current resource/action/audience
              rights and any applicable entitlement.
            - Policy-dependent effects run only with the relevant approved policy; unresolved values
              remain explicit decision dependencies and do not block writing/reviewing this draft.
          when: Review changes and accept if desired
          then:
            - Explain retained achievements and criteria requiring new evidence
            - Record a new accepted plan version without rewriting historical results.
        - id: FR-PATH-02.AC.ALT1
          flowRef: FR-PATH-02.ALT1
          stepRefs:
            - FR-PATH-02.ALT1.S1
          given:
            - Execution reaches FR-PATH-02.MAIN.S3.
            - The learner keeps the current plan
          when: Decline the recommendation
          then:
            - Continue with the existing milestones
            - No plan change.
        - id: FR-PATH-02.AC.EX1
          flowRef: FR-PATH-02.EX1
          stepRefs:
            - FR-PATH-02.EX1.S1
          given:
            - Execution reaches FR-PATH-02.MAIN.S1.
            - Referenced evidence is withdrawn or no longer inspectable
          when: Inspect the affected achievement
          then:
            - Show historical attribution and current verification limits
            - No false claim of currently verified evidence.
        - id: FR-PATH-02.AC.EX2
          flowRef: FR-PATH-02.EX2
          stepRefs:
            - FR-PATH-02.EX2.S1
          given:
            - Execution reaches FR-PATH-02.MAIN.S4.
            - The update conflicts with a newer accepted plan
          when: Submit the stale revision
          then:
            - Show current plan and request a new review
            - No lost plan update.
      nonFunctionalApplication:
        - id: NFR-SEC
          scope: Main flow and every alternative/exception, including re-entry and current-rights checks.
        - id: NFR-PRIV
          scope: Main flow and every alternative/exception, including re-entry and current-rights checks.
        - id: NFR-AI
          scope: Main flow and every alternative/exception, including re-entry and current-rights checks.
        - id: NFR-INTEGRITY
          scope: Main flow and every alternative/exception, including re-entry and current-rights checks.
        - id: NFR-RELIABILITY
          scope: Main flow and every alternative/exception, including re-entry and current-rights checks.
        - id: NFR-REPEAT
          scope: Main flow and every alternative/exception, including re-entry and current-rights checks.
        - id: NFR-LATENCY
          scope: Main flow and every alternative/exception, including re-entry and current-rights checks.
        - id: NFR-USABILITY
          scope: Main flow and every alternative/exception, including re-entry and current-rights checks.
        - id: NFR-LANGUAGE
          scope: Main flow and every alternative/exception, including re-entry and current-rights checks.
        - id: NFR-AUDIT
          scope: Main flow and every alternative/exception, including re-entry and current-rights checks.
      designHandoff: SDS must map these requirement/flow/step IDs to actual entry points, boundaries, data
        operations, failure paths and verification evidence. This SRS chooses no monolith,
        microservice, source file, queue or database design.
      featureOwner: learning-paths
      ownership: Defined once in this feature. Other features reference the stable
        requirement/data/journey ID and current Work node ID.
      authorityRefs:

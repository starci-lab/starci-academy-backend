schema: work/node@2
id: starci-next.business.srs.data.rag-session
kind: business
required: true
state: todo
description: Contextual learning conversation
refs:
  - starci-next.business.srs.business-rules.policy-decisions.knowledge-and-ai-quality
  - starci-next.business.srs.business-rules.policy-decisions.failed-ai-usage
  - starci-next.business.srs.business-rules.policy-decisions.privacy-and-sharing
extensions:
  work3:
    srs:
      schema: starci/srs-data-definition@1
      status: draft
      authority: proposed-detail-from-accepted-product-scope
      id: DATA-rag-session
      title: Contextual learning conversation
      modelLevel: Proposed logical business contract; physical storage, indexes and APIs belong to SDS.
      owner: learner
      fields:
        - name: id
          meaning: Stable logical record identity
          validation: Required, unique and not changed by a state transition
          classification: context-scoped
        - name: version
          meaning: Record/content revision used for attribution and confirmation
          validation: Identify the reviewed version; changed content must not impersonate an earlier revision
          classification: context-scoped
        - name: questionAndContext
          meaning: Question and selected learning context
          validation: Use only current permitted source context
          classification: private
        - name: turns
          meaning: Questions, answers and follow-up relationships
          validation: Every turn retains its source and processing state
          classification: private
        - name: citations
          meaning: Source identity, version, location and trust class
          validation: Must resolve to a real permitted source or disclose unavailability
          classification: private
        - name: limitations
          meaning: Missing/conflicting sources or evaluation limits
          validation: Required when grounded answer is not supported
          classification: private
      relations:
        - dataRef: DATA-concept
          meaning: Referenced business identity/version; lookup never grants access by itself.
        - dataRef: DATA-content-source
          meaning: Referenced business identity/version; lookup never grants access by itself.
        - dataRef: DATA-usage
          meaning: Referenced business identity/version; lookup never grants access by itself.
      states:
        - accepted
        - processing
        - answered
        - insufficient-source
        - failed
        - cancelled
      transitions:
        - id: DATA-rag-session.T1
          from: accepted
          to: processing
          event: Begin eligible answer request
          guard: Current rights and allowance verified
        - id: DATA-rag-session.T2
          from: processing
          to: answered
          event: Produce supported response
          guard: Citations and limitations preserved
        - id: DATA-rag-session.T3
          from: processing
          to: insufficient-source
          event: No adequate source
          guard: Explicit abstention or limited answer
        - id: DATA-rag-session.T4
          from: processing
          to: failed
          event: Answer capability unavailable
          guard: Record process failure separately
        - id: DATA-rag-session.T5
          from: processing
          to: cancelled
          event: Cancel request where supported
          guard: Usage treatment follows D07
      invariants:
        - A new turn checks current rights again.
        - Conversation continuity cannot reveal withdrawn private content.
      decisionRefs:
        - D06
        - D07
        - D08
      privacy:
        access: Apply current owner, role, resource and audience grants. A selected-public field is exposed
          only after authorized publication.
        retention: D08 selects retention/export/closure behavior. No storage duration or automatic deletion
          policy is inferred.
        referenceWithdrawal: Preserve permitted provenance while preventing newly unauthorized source
          access; retained snapshots require approved D08 purpose and scope.
      validationCases:
        - given: An actor without current rights references this rag-session.
          when: Read or mutate the record.
          then: Deny the unauthorized action without disclosing restricted fields.
        - given: A record in a declared state and an attributed authorized event.
          when: Apply a listed transition.
          then: Require its guard, retain the prior version attribution and reject a transition unsupported by
            policy.
      featureOwner: rag
      ownership: Defined once in this feature. Other features reference the stable
        requirement/data/journey ID and current Work node ID.

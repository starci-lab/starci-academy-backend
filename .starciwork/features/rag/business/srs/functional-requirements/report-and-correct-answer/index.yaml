            - No report is submitted.
        - id: FR-RAG-02.AC.EX1
          flowRef: FR-RAG-02.EX1
          stepRefs:
            - FR-RAG-02.EX1.S1
          given:
            - Execution reaches FR-RAG-02.MAIN.S2.
            - The report references private material outside the reporter rights
          when: Submit the report
          then:
            - Refuse unauthorized disclosure and request a permitted description
            - No foreign content is attached.
        - id: FR-RAG-02.AC.EX2
          flowRef: FR-RAG-02.EX2
          stepRefs:
            - FR-RAG-02.EX2.S1
          given:
            - Execution reaches FR-RAG-02.MAIN.S3.
            - Sources conflict and the reviewer cannot establish a resolution
          when: Inspect the case
          then:

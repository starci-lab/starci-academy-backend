      status: draft
      authority: proposed-detail-from-accepted-product-scope
      id: FR-RAG-02
      title: Report an incorrect or conflicting learning answer
      domain: rag
      goal: Report an incorrect or conflicting learning answer
      priority: release-priority-awaits-D01
      actors:
        - learner
      preconditions:
        - The learner has a question and can select a permitted learning context.
        - Each protected step checks the acting identity, current resource/action/audience rights
          and any applicable entitlement.
        - Policy-dependent effects run only with the relevant approved policy; unresolved values
          remain explicit decision dependencies and do not block writing/reviewing this draft.
      inputs:
        - id: FR-RAG-02.IN1
          name: disputedAnswer
          validation: Exact answer and source version
          dataRefs:
            - DATA-rag-session
            - DATA-moderation-case
            - DATA-concept
        - id: FR-RAG-02.IN2
          name: report
          validation: Specific claim and permitted supporting explanation
          dataRefs:
            - DATA-rag-session
            - DATA-moderation-case
            - DATA-concept
      outputs:
        - name: result-1
          fromStep: FR-RAG-02.MAIN.S1
          meaning: Capture the answer/source version and a scoped report
          effect: The learner shares only report context they may disclose.
        - name: result-2
          fromStep: FR-RAG-02.MAIN.S2
          meaning: Acknowledge receipt and show a tracking state
          effect: The answer is flagged for the appropriate review process.
        - name: result-3
          fromStep: FR-RAG-02.MAIN.S3
          meaning: Show correction, explanation or unresolved disagreement with provenance
          effect: Receiving a report alone does not mark it resolved.
        - name: result-4
          fromStep: FR-RAG-02.MAIN.S4
          meaning: Explain which version changed and its scope
          effect: Historical answers remain attributed to their original sources.
      businessRuleRefs:
        - BR-SOURCES
        - BR-EVIDENCE
        - BR-PRIVACY
      dataRefs:
        - DATA-rag-session
        - DATA-moderation-case
        - DATA-concept
      nonFunctionalRefs:
        - NFR-SEC

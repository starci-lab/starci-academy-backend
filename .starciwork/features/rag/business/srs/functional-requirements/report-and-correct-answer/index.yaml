        - D06
        - D09
      decisionTreatment: Direct policy refs affect the named feature behavior; inherited refs govern
        cross-cutting rules and measurement targets. Open policies are not selected by this draft.
      mainFlow:
        id: FR-RAG-02.MAIN
        trigger: Select an answer and identify the disputed claim
        steps:
          - id: FR-RAG-02.MAIN.S1
            actor: learner
            request: Select an answer and identify the disputed claim
            systemResponse: Capture the answer/source version and a scoped report
            businessEffect: The learner shares only report context they may disclose.
            acceptanceRefs:
              - FR-RAG-02.AC.M1
          - id: FR-RAG-02.MAIN.S2
            actor: learner
            request: Submit the report with an explanation
            systemResponse: Acknowledge receipt and show a tracking state
            businessEffect: The answer is flagged for the appropriate review process.
            acceptanceRefs:
              - FR-RAG-02.AC.M2
          - id: FR-RAG-02.MAIN.S3
            actor: learner
            request: Inspect the report outcome when available
            systemResponse: Show correction, explanation or unresolved disagreement with provenance
            businessEffect: Receiving a report alone does not mark it resolved.
            acceptanceRefs:
              - FR-RAG-02.AC.M3
          - id: FR-RAG-02.MAIN.S4
            actor: learner
            request: Revisit the corrected source or answer
            systemResponse: Explain which version changed and its scope
            businessEffect: Historical answers remain attributed to their original sources.
            acceptanceRefs:
              - FR-RAG-02.AC.M4
        end:
          type: completed-main-flow
          outcome: Historical answers remain attributed to their original sources.
      alternativeFlows:
        - id: FR-RAG-02.ALT1
          title: The learner resolves the question before reporting
          fromStep: FR-RAG-02.MAIN.S1
          condition: The learner resolves the question before reporting
          steps:
            - id: FR-RAG-02.ALT1.S1
              actor: learner
              request: Cancel the draft report
              systemResponse: Return to the answer
              businessEffect: No report is submitted.
              acceptanceRefs:
                - FR-RAG-02.AC.ALT1
          resume:
            type: end
            outcome: No report is submitted.
          postconditions:
            - No report is submitted.
          continuation: This flow instance ends with the stated outcome. A permitted correction, status lookup
            or deliberate new request follows the response and current policy; it does not imply a
            successful main outcome.
          acceptanceRefs:
            - FR-RAG-02.AC.ALT1
      exceptionFlows:
        - id: FR-RAG-02.EX1
          title: The report references private material outside the reporter rights
          fromStep: FR-RAG-02.MAIN.S2
          condition: The report references private material outside the reporter rights
          steps:
            - id: FR-RAG-02.EX1.S1
              actor: learner
              request: Submit the report
              systemResponse: Refuse unauthorized disclosure and request a permitted description
              businessEffect: No foreign content is attached.
              acceptanceRefs:
                - FR-RAG-02.AC.EX1
          resume:
            type: end
            outcome: No foreign content is attached.
          postconditions:
            - No foreign content is attached.
          continuation: This flow instance ends with the stated outcome. A permitted correction, status lookup
            or deliberate new request follows the response and current policy; it does not imply a
            successful main outcome.
          acceptanceRefs:
            - FR-RAG-02.AC.EX1
        - id: FR-RAG-02.EX2
          title: Sources conflict and the reviewer cannot establish a resolution
          fromStep: FR-RAG-02.MAIN.S3
          condition: Sources conflict and the reviewer cannot establish a resolution
          steps:
            - id: FR-RAG-02.EX2.S1
              actor: learner
              request: Inspect the case
              systemResponse: Show unresolved with the responsible content review path
              businessEffect: Popularity or AI assertion does not settle source truth.
              acceptanceRefs:
                - FR-RAG-02.AC.EX2
          resume:
            type: end
            outcome: Popularity or AI assertion does not settle source truth.
          postconditions:
            - Popularity or AI assertion does not settle source truth.
          continuation: This flow instance ends with the stated outcome. A permitted correction, status lookup
            or deliberate new request follows the response and current policy; it does not imply a
            successful main outcome.
          acceptanceRefs:
            - FR-RAG-02.AC.EX2
      postconditions:
        success:
          - The learner shares only report context they may disclose.
          - The answer is flagged for the appropriate review process.
          - Receiving a report alone does not mark it resolved.
          - Historical answers remain attributed to their original sources.
        failure:
          - Only effects explicitly completed before the branch remain, with their original
            attribution.
          - No rejected or unresolved operation is presented as the successful main outcome.
          - No foreign content is attached.
          - Popularity or AI assertion does not settle source truth.
      acceptanceCriteria:
        - id: FR-RAG-02.AC.M1
          flowRef: FR-RAG-02.MAIN
          stepRefs:

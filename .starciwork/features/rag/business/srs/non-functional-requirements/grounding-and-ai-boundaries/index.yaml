extensions:
  work3:
    srs:
      schema: starci/srs-non-functional-requirement@1
      status: draft
      authority: proposed-detail-from-accepted-product-scope
      id: NFR-AI
      title: Grounding and AI instruction boundaries
      scope:
        - rag
        - learning-paths
        - challenges
        - projects
        - interviews
        - cv
        - recruitment
        - authoring
      requirement: AI results remain grounded, permission-scoped and distinguish uncertainty, suggestions
        and authoritative outcomes.
      decisionRefs:
        - D06
        - D07
      measurement:
        metric: Evaluate citation validity, supported-claim rate, abstention and instruction-injection
          resistance on versioned cases; numeric quality thresholds await D06.
        conditions: Use trusted, conflicting, missing, private, withdrawn and malicious-instruction source
          fixtures; hold input and source versions fixed.
        thresholdStatus: Quantitative/policy targets referenced above are open; deterministic invariants
          below are reviewable now.
        evidenceRequired: Record scenario, input/source/policy versions, environment/load, observation
          timestamps, actual outcomes and metric calculation; do not substitute a document check for
          runtime evidence.
      acceptanceCriteria:
        - id: NFR-AI.AC1
          given: Use trusted, conflicting, missing, private, withdrawn and malicious-instruction source
            fixtures; hold input and source versions fixed.
          when: Request answers/review with these sources, including requests to override rights, grades or
            invent CV evidence.
          then: No disallowed disclosure, fabricated source, role grant or rewritten objective result;
            unsupported claims are limited/declined; quality metrics await approved thresholds.
      tradeoffBoundary: SDS proposes optimizations and capacity choices within these obligations. Privacy,
        consent, financial truth and evidence provenance cannot be relaxed to improve latency or
        cost.
      featureOwner: rag
      ownership: Defined once in this feature. Other features reference the stable
        requirement/data/journey ID and current Work node ID.

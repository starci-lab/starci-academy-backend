
services:
  core:
    build:
      context: ../..
      dockerfile: apps/core/Dockerfile
    environment:
      # PostgreSQL
      POSTGRESQL_PRIMARY_HOST: ${POSTGRESQL_PRIMARY_HOST}
      POSTGRESQL_PRIMARY_PORT: ${POSTGRESQL_PRIMARY_PORT}
      POSTGRESQL_PRIMARY_USERNAME: ${POSTGRESQL_PRIMARY_USERNAME}
      POSTGRESQL_PRIMARY_PASSWORD: ${POSTGRESQL_PRIMARY_PASSWORD}
      POSTGRESQL_PRIMARY_DATABASE: ${POSTGRESQL_PRIMARY_DATABASE}
      POSTGRESQL_PRIMARY_SYNCHRONIZE: ${POSTGRESQL_PRIMARY_SYNCHRONIZE}

      # Qdrant
      QDRANT_URL: ${QDRANT_URL}
      QDRANT_API_KEY: ${QDRANT_API_KEY}

      # Redis
      REDIS_BULLMQ_HOST: ${REDIS_BULLMQ_HOST}
      REDIS_BULLMQ_PORT: ${REDIS_BULLMQ_PORT}
      REDIS_BULLMQ_PASSWORD: ${REDIS_BULLMQ_PASSWORD}
      REDIS_BULLMQ_USE_CLUSTER: ${REDIS_BULLMQ_USE_CLUSTER}

      REDIS_THROTTLER_HOST: ${REDIS_THROTTLER_HOST}
      REDIS_THROTTLER_PORT: ${REDIS_THROTTLER_PORT}
      REDIS_THROTTLER_PASSWORD: ${REDIS_THROTTLER_PASSWORD}
      REDIS_THROTTLER_USE_CLUSTER: ${REDIS_THROTTLER_USE_CLUSTER}

      REDIS_ADAPTER_HOST: ${REDIS_ADAPTER_HOST}
      REDIS_ADAPTER_PORT: ${REDIS_ADAPTER_PORT}
      REDIS_ADAPTER_PASSWORD: ${REDIS_ADAPTER_PASSWORD}
      REDIS_ADAPTER_USE_CLUSTER: ${REDIS_ADAPTER_USE_CLUSTER}

      REDIS_CACHE_HOST: ${REDIS_CACHE_HOST}
      REDIS_CACHE_PORT: ${REDIS_CACHE_PORT}
      REDIS_CACHE_PASSWORD: ${REDIS_CACHE_PASSWORD}
      REDIS_CACHE_USE_CLUSTER: ${REDIS_CACHE_USE_CLUSTER}

      # Config mount
      CONFIG_APP_MOUNT_PATH: ${CONFIG_APP_MOUNT_PATH}
      CONFIG_METADATA_MOUNT_PATH: ${CONFIG_METADATA_MOUNT_PATH}

      # Terraform secret file paths
      TERRAFORM_GITHUB_ACCESS_TOKEN_MOUNT_PATH: ${TERRAFORM_GITHUB_ACCESS_TOKEN_MOUNT_PATH}
      TERRAFORM_S3_SECRET_ACCESS_KEY_MOUNT_PATH: ${TERRAFORM_S3_SECRET_ACCESS_KEY_MOUNT_PATH}
      TERRAFORM_KEYCLOAK_CLIENT_SECRET_MOUNT_PATH: ${TERRAFORM_KEYCLOAK_CLIENT_SECRET_MOUNT_PATH}
      TERRAFORM_PAYOS_API_KEY_MOUNT_PATH: ${TERRAFORM_PAYOS_API_KEY_MOUNT_PATH}
      TERRAFORM_GEMINI_API_KEY_MOUNT_PATH: ${TERRAFORM_GEMINI_API_KEY_MOUNT_PATH}
      TERRAFORM_OPENAI_API_KEY_MOUNT_PATH: ${TERRAFORM_OPENAI_API_KEY_MOUNT_PATH}

services:
  core:
    build:
      context: ../..
      dockerfile: apps/core/Dockerfile
    ports:
      - "${CORE_PORT}:${CORE_PORT}"
    environment:
      # PostgreSQL
      POSTGRESQL_PRIMARY_HOST: ${POSTGRESQL_PRIMARY_HOST}
      POSTGRESQL_PRIMARY_PORT: ${POSTGRESQL_PRIMARY_PORT}
      POSTGRESQL_PRIMARY_PASSWORD: ${POSTGRESQL_PRIMARY_PASSWORD}

      # Qdrant
      QDRANT_URL: ${QDRANT_URL}
      QDRANT_API_KEY: ${QDRANT_API_KEY}

      # Redis
      REDIS_BULLMQ_HOST: ${REDIS_BULLMQ_HOST}
      REDIS_BULLMQ_PORT: ${REDIS_BULLMQ_PORT}
      REDIS_BULLMQ_PASSWORD: ${REDIS_BULLMQ_PASSWORD}

      REDIS_THROTTLER_HOST: ${REDIS_THROTTLER_HOST}
      REDIS_THROTTLER_PORT: ${REDIS_THROTTLER_PORT}
      REDIS_THROTTLER_PASSWORD: ${REDIS_THROTTLER_PASSWORD}

      REDIS_ADAPTER_HOST: ${REDIS_ADAPTER_HOST}
      REDIS_ADAPTER_PORT: ${REDIS_ADAPTER_PORT}
      REDIS_ADAPTER_PASSWORD: ${REDIS_ADAPTER_PASSWORD}

      REDIS_CACHE_HOST: ${REDIS_CACHE_HOST}
      REDIS_CACHE_PORT: ${REDIS_CACHE_PORT}
      REDIS_CACHE_PASSWORD: ${REDIS_CACHE_PASSWORD}

      CORS_ORIGIN_1: ${CORS_ORIGIN_1}

      # Init seeders (mount → PostgreSQL)
      ENABLE_INIT_SEEDERS: ${ENABLE_INIT_SEEDERS:-true}
      INIT_SEEDERS_COURSES_MODULES_FULLSTACK: ${INIT_SEEDERS_COURSES_MODULES_FULLSTACK:-all}
      INIT_SEEDERS_COURSES_MODULES_FULLSTACK_ENABLED: ${INIT_SEEDERS_COURSES_MODULES_FULLSTACK_ENABLED:-true}
      INIT_SEEDERS_COURSES_MILESTONES_FULLSTACK: ${INIT_SEEDERS_COURSES_MILESTONES_FULLSTACK:-all}
      INIT_SEEDERS_COURSES_MILESTONES_FULLSTACK_ENABLED: ${INIT_SEEDERS_COURSES_MILESTONES_FULLSTACK_ENABLED:-true}
      INIT_SEEDERS_COURSES_MODULES_SYSTEM_DESIGN_INDEXES: ${INIT_SEEDERS_COURSES_MODULES_SYSTEM_DESIGN_INDEXES:-all}
      INIT_SEEDERS_COURSES_MODULES_SYSTEM_DESIGN_ENABLED: ${INIT_SEEDERS_COURSES_MODULES_SYSTEM_DESIGN_ENABLED:-true}
      INIT_SEEDERS_COURSES_MILESTONES_SYSTEM_DESIGN_INDEXES: ${INIT_SEEDERS_COURSES_MILESTONES_SYSTEM_DESIGN_INDEXES:-all}
      INIT_SEEDERS_COURSES_MILESTONES_SYSTEM_DESIGN_ENABLED: ${INIT_SEEDERS_COURSES_MILESTONES_SYSTEM_DESIGN_ENABLED:-true}
      INIT_SEEDERS_CV: ${INIT_SEEDERS_CV:-true}
      INIT_SEEDERS_FOUNDATIONS: ${INIT_SEEDERS_FOUNDATIONS:-true}
      INIT_SEEDERS_HEADHUNTING: ${INIT_SEEDERS_HEADHUNTING:-true}

      # Init synchronizers (CDN / ES / bloom — after seeders)
      ENABLE_INIT_SYNCHRONIZERS: ${ENABLE_INIT_SYNCHRONIZERS:-true}
      INIT_SYNCHRONIZERS_COURSES_MODULES_FULLSTACK_CDN_INDEXES: ${INIT_SYNCHRONIZERS_COURSES_MODULES_FULLSTACK_CDN_INDEXES:-all}
      INIT_SYNCHRONIZERS_COURSES_MODULES_FULLSTACK_CDN_ENABLED: ${INIT_SYNCHRONIZERS_COURSES_MODULES_FULLSTACK_CDN_ENABLED:-true}
      INIT_SYNCHRONIZERS_COURSES_MODULES_FULLSTACK_ELASTICSEARCH_INDEXES: ${INIT_SYNCHRONIZERS_COURSES_MODULES_FULLSTACK_ELASTICSEARCH_INDEXES:-all}
      INIT_SYNCHRONIZERS_COURSES_MODULES_FULLSTACK_ELASTICSEARCH_ENABLED: ${INIT_SYNCHRONIZERS_COURSES_MODULES_FULLSTACK_ELASTICSEARCH_ENABLED:-true}
      INIT_SYNCHRONIZERS_COURSES_MILESTONES_FULLSTACK_CDN_INDEXES: ${INIT_SYNCHRONIZERS_COURSES_MILESTONES_FULLSTACK_CDN_INDEXES:-all}
      INIT_SYNCHRONIZERS_COURSES_MILESTONES_FULLSTACK_CDN_ENABLED: ${INIT_SYNCHRONIZERS_COURSES_MILESTONES_FULLSTACK_CDN_ENABLED:-true}
      INIT_SYNCHRONIZERS_COURSES_MILESTONES_FULLSTACK_ELASTICSEARCH_INDEXES: ${INIT_SYNCHRONIZERS_COURSES_MILESTONES_FULLSTACK_ELASTICSEARCH_INDEXES:-all}
      INIT_SYNCHRONIZERS_COURSES_MILESTONES_FULLSTACK_ELASTICSEARCH_ENABLED: ${INIT_SYNCHRONIZERS_COURSES_MILESTONES_FULLSTACK_ELASTICSEARCH_ENABLED:-true}
      INIT_SYNCHRONIZERS_COURSES_MODULES_SYSTEM_DESIGN_CDN_INDEXES: ${INIT_SYNCHRONIZERS_COURSES_MODULES_SYSTEM_DESIGN_CDN_INDEXES:-all}
      INIT_SYNCHRONIZERS_COURSES_MODULES_SYSTEM_DESIGN_CDN_ENABLED: ${INIT_SYNCHRONIZERS_COURSES_MODULES_SYSTEM_DESIGN_CDN_ENABLED:-true}
      INIT_SYNCHRONIZERS_COURSES_MODULES_SYSTEM_DESIGN_ELASTICSEARCH_INDEXES: ${INIT_SYNCHRONIZERS_COURSES_MODULES_SYSTEM_DESIGN_ELASTICSEARCH_INDEXES:-all}
      INIT_SYNCHRONIZERS_COURSES_MODULES_SYSTEM_DESIGN_ELASTICSEARCH_ENABLED: ${INIT_SYNCHRONIZERS_COURSES_MODULES_SYSTEM_DESIGN_ELASTICSEARCH_ENABLED:-true}
      INIT_SYNCHRONIZERS_COURSES_MILESTONES_SYSTEM_DESIGN_CDN_INDEXES: ${INIT_SYNCHRONIZERS_COURSES_MILESTONES_SYSTEM_DESIGN_CDN_INDEXES:-all}
      INIT_SYNCHRONIZERS_COURSES_MILESTONES_SYSTEM_DESIGN_CDN_ENABLED: ${INIT_SYNCHRONIZERS_COURSES_MILESTONES_SYSTEM_DESIGN_CDN_ENABLED:-true}
      INIT_SYNCHRONIZERS_COURSES_MILESTONES_SYSTEM_DESIGN_ELASTICSEARCH_INDEXES: ${INIT_SYNCHRONIZERS_COURSES_MILESTONES_SYSTEM_DESIGN_ELASTICSEARCH_INDEXES:-all}
      INIT_SYNCHRONIZERS_COURSES_MILESTONES_SYSTEM_DESIGN_ELASTICSEARCH_ENABLED: ${INIT_SYNCHRONIZERS_COURSES_MILESTONES_SYSTEM_DESIGN_ELASTICSEARCH_ENABLED:-true}
      INIT_SYNCHRONIZERS_CV: ${INIT_SYNCHRONIZERS_CV:-true}
      INIT_SYNCHRONIZERS_FOUNDATIONS: ${INIT_SYNCHRONIZERS_FOUNDATIONS:-true}
      INIT_SYNCHRONIZERS_HEADHUNTING: ${INIT_SYNCHRONIZERS_HEADHUNTING:-true}

      # Terraform secret file paths (inside container; volume: /root/academy/.mount → /usr/src/app/.mount)
      TERRAFORM_KEYCLOAK_ADMIN_MOUNT_PATH: ${TERRAFORM_KEYCLOAK_ADMIN_MOUNT_PATH:-/usr/src/app/.mount/terraform/keycloak-admin.json}
      TERRAFORM_GITHUB_ACCESS_TOKEN_MOUNT_PATH: ${TERRAFORM_GITHUB_ACCESS_TOKEN_MOUNT_PATH:-/usr/src/app/.mount/terraform/github-access-token.key}
      TERRAFORM_GITHUB_SECRET_KEY_MOUNT_PATH: ${TERRAFORM_GITHUB_SECRET_KEY_MOUNT_PATH:-/usr/src/app/.mount/terraform/github-secret-key.key}
      TERRAFORM_S3_SECRET_ACCESS_KEY_MOUNT_PATH: ${TERRAFORM_S3_SECRET_ACCESS_KEY_MOUNT_PATH:-/usr/src/app/.mount/terraform/s3-secret-access-key.key}
      TERRAFORM_KEYCLOAK_CLIENT_SECRET_MOUNT_PATH: ${TERRAFORM_KEYCLOAK_CLIENT_SECRET_MOUNT_PATH:-/usr/src/app/.mount/terraform/keycloak-client-secret.key}
      TERRAFORM_PAYOS_API_KEY_MOUNT_PATH: ${TERRAFORM_PAYOS_API_KEY_MOUNT_PATH:-/usr/src/app/.mount/terraform/payos-api-key.key}
      TERRAFORM_GEMINI_API_KEY_MOUNT_PATH: ${TERRAFORM_GEMINI_API_KEY_MOUNT_PATH:-/usr/src/app/.mount/terraform/gemini-api-key.key}
      TERRAFORM_OPENAI_API_KEY_MOUNT_PATH: ${TERRAFORM_OPENAI_API_KEY_MOUNT_PATH:-/usr/src/app/.mount/terraform/openai-api-key.key}
      TERRAFORM_SEPAY_API_KEY_MOUNT_PATH: ${TERRAFORM_SEPAY_API_KEY_MOUNT_PATH:-/usr/src/app/.mount/terraform/sepay-api-key.key}
      TERRAFORM_BREVO_SMTP_PASSWORD_MOUNT_PATH: ${TERRAFORM_BREVO_SMTP_PASSWORD_MOUNT_PATH:-/usr/src/app/.mount/terraform/keys/brevo-smtp-api-key.key}
      TERRAFORM_ENCRYPTION_KEY_MOUNT_PATH: ${TERRAFORM_ENCRYPTION_KEY_MOUNT_PATH:-/usr/src/app/.mount/terraform/encryption-key.key}
      TERRAFORM_GCP_SERVICE_ACCOUNT_JSON_MOUNT_PATH: ${TERRAFORM_GCP_SERVICE_ACCOUNT_JSON_MOUNT_PATH:-/usr/src/app/.mount/terraform/gcp-service-account.json}

      SYNCHRONIZER_ENABLE: ${SYNCHRONIZER_ENABLE:-false}

      CORE_PORT: ${CORE_PORT}

      KEYCLOAK_URL: ${KEYCLOAK_URL}
      KEYCLOAK_REDIRECT_URI: ${KEYCLOAK_REDIRECT_URI}

      S3_MINIO_ENDPOINT: ${S3_MINIO_ENDPOINT}
      S3_MINIO_PUBLIC_ENDPOINT: ${S3_MINIO_PUBLIC_ENDPOINT}
      S3_MINIO_SECRET_ACCESS_KEY: ${S3_MINIO_SECRET_ACCESS_KEY}

      ELASTICSEARCH_NODE: ${ELASTICSEARCH_NODE}
      ELASTICSEARCH_PASSWORD: ${ELASTICSEARCH_PASSWORD}

      NATS_SERVER_1_HOST: ${NATS_SERVER_1_HOST}
      NATS_AUTH_TOKEN: ${NATS_AUTH_TOKEN}

      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID}
      S3_PUBLIC_ENDPOINT: ${S3_PUBLIC_ENDPOINT}
      S3_REGION: ${S3_REGION}

      POSTGRESQL_KEYCLOAK_HOST: ${POSTGRESQL_KEYCLOAK_HOST}

      BACKUP_ENCRYPT_PASSWORD: ${BACKUP_ENCRYPT_PASSWORD}

      GITHUB_OAUTH_REDIRECT_URI: ${GITHUB_OAUTH_REDIRECT_URI}
    volumes:
      - /root/academy/.mount:/usr/src/app/.mount
    restart: always
      
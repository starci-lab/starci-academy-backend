
services:
  core:
    build:
      context: ../..
      dockerfile: apps/core/Dockerfile
    ports:
      - "${CORE_PORT}:${CORE_PORT}"
    environment:
      # PostgreSQL
      POSTGRESQL_PRIMARY_HOST: ${POSTGRESQL_PRIMARY_HOST}
      POSTGRESQL_PRIMARY_PORT: ${POSTGRESQL_PRIMARY_PORT}
      POSTGRESQL_PRIMARY_PASSWORD: ${POSTGRESQL_PRIMARY_PASSWORD}
      # Schema auto-sync. The `model_provider` enum has been trimmed in the DB to
      # match the code enum ({gemini, openai}), so synchronize no longer deadlocks
      # on it. Kept "false" on prod: enabling it triggered a heavier boot that lost
      # the race on the initial NATS dial (NatsError: TIMEOUT → crash-loop), since
      # NATS here is public-exposed and busy. Schema changes go through migrations;
      # only re-enable once NATS connect is made resilient (retry / longer timeout).
      # ENABLED 2026-06-28 (owner decision): the two prior blockers are gone — the
      # model_provider enum has 'local'/'free' re-added, and the NATS dial now has a
      # 60s timeout (was the crash-loop cause). Synchronize keeps the schema in
      # lock-step with the entities so drift can't silently break boot/seed again.
      POSTGRESQL_PRIMARY_SYNCHRONIZE: "true"

      # Qdrant
      QDRANT_URL: ${QDRANT_URL}
      QDRANT_API_KEY: ${QDRANT_API_KEY}

      # Redis
      REDIS_BULLMQ_HOST: ${REDIS_BULLMQ_HOST}
      REDIS_BULLMQ_PORT: ${REDIS_BULLMQ_PORT}
      REDIS_BULLMQ_PASSWORD: ${REDIS_BULLMQ_PASSWORD}

      REDIS_THROTTLER_HOST: ${REDIS_THROTTLER_HOST}
      REDIS_THROTTLER_PORT: ${REDIS_THROTTLER_PORT}
      REDIS_THROTTLER_PASSWORD: ${REDIS_THROTTLER_PASSWORD}

      REDIS_ADAPTER_HOST: ${REDIS_ADAPTER_HOST}
      REDIS_ADAPTER_PORT: ${REDIS_ADAPTER_PORT}
      REDIS_ADAPTER_PASSWORD: ${REDIS_ADAPTER_PASSWORD}

      REDIS_CACHE_HOST: ${REDIS_CACHE_HOST}
      REDIS_CACHE_PORT: ${REDIS_CACHE_PORT}
      REDIS_CACHE_PASSWORD: ${REDIS_CACHE_PASSWORD}

      CORS_ORIGIN_1: ${CORS_ORIGIN_1}

      # Parent-domain scope for the JS-readable csrf_token cookie (.academy.starci.org).
      COOKIE_DOMAIN: ${COOKIE_DOMAIN}

      # Self-hosted Judge0 (coding-practice sandbox) on the VPS.
      JUDGE0_BASE_URL: ${JUDGE0_BASE_URL}

      # Self-hosted qwen "free" grading/tutor lane runs on the GPU box, reached
      # via the Cloudflare tunnel (qwen.starci.org) — NOT localhost (there is no
      # Ollama on the VPS). The endpoint is open (no gate), so the local-provider
      # key stays the "ollama" placeholder; only the base URL needs wiring here.
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-https://qwen.starci.org/v1}

      # Data-sources root — holds the versioned commit snapshots + manifest.json.
      # Points at the dedicated `.datasources` bind volume (see volumes:) so the
      # snapshots survive `up --build` / recreate, enabling filesystem-diff seeding
      # instead of a full reseed each deploy.
      CONTEXT_1_URL: ${CONTEXT_1_URL:-/usr/src/app/.datasources}

      # Seed/sync scope is configured in .mount/config/seed.yaml (not env).

      # Terraform secret file paths (inside container; volume: /root/academy/.mount → /usr/src/app/.mount)
      TERRAFORM_KEYCLOAK_ADMIN_MOUNT_PATH: ${TERRAFORM_KEYCLOAK_ADMIN_MOUNT_PATH:-/usr/src/app/.mount/terraform/keycloak-admin.json}
      TERRAFORM_GITHUB_ACCESS_TOKEN_MOUNT_PATH: ${TERRAFORM_GITHUB_ACCESS_TOKEN_MOUNT_PATH:-/usr/src/app/.mount/terraform/github-access-token.key}
      TERRAFORM_GITHUB_SECRET_KEY_MOUNT_PATH: ${TERRAFORM_GITHUB_SECRET_KEY_MOUNT_PATH:-/usr/src/app/.mount/terraform/github-secret-key.key}
      TERRAFORM_S3_SECRET_ACCESS_KEY_MOUNT_PATH: ${TERRAFORM_S3_SECRET_ACCESS_KEY_MOUNT_PATH:-/usr/src/app/.mount/terraform/s3-secret-access-key.key}
      TERRAFORM_KEYCLOAK_CLIENT_SECRET_MOUNT_PATH: ${TERRAFORM_KEYCLOAK_CLIENT_SECRET_MOUNT_PATH:-/usr/src/app/.mount/terraform/keycloak-client-secret.key}
      TERRAFORM_PAYOS_API_KEY_MOUNT_PATH: ${TERRAFORM_PAYOS_API_KEY_MOUNT_PATH:-/usr/src/app/.mount/terraform/payos-api-key.key}
      TERRAFORM_SEPAY_API_KEY_MOUNT_PATH: ${TERRAFORM_SEPAY_API_KEY_MOUNT_PATH:-/usr/src/app/.mount/terraform/sepay-api-key.key}
      # SePay PG env + merchant (secret key comes from the mount path above)
      API_SEPAY_ENV: ${API_SEPAY_ENV:-sandbox}
      API_SEPAY_MERCHANT_ID: ${API_SEPAY_MERCHANT_ID:-SP-TEST-CNA92625}
      TERRAFORM_BREVO_SMTP_PASSWORD_MOUNT_PATH: ${TERRAFORM_BREVO_SMTP_PASSWORD_MOUNT_PATH:-/usr/src/app/.mount/terraform/brevo-smtp-api-key.key}
      TERRAFORM_ENCRYPTION_KEY_MOUNT_PATH: ${TERRAFORM_ENCRYPTION_KEY_MOUNT_PATH:-/usr/src/app/.mount/terraform/encryption-key.key}
      TERRAFORM_GCP_SERVICE_ACCOUNT_JSON_MOUNT_PATH: ${TERRAFORM_GCP_SERVICE_ACCOUNT_JSON_MOUNT_PATH:-/usr/src/app/.mount/terraform/gcp-service-account.json}

      SYNCHRONIZER_ENABLE: ${SYNCHRONIZER_ENABLE:-false}

      # Kafka (CDC progress-projection listener). Reaches the cdc-kafka broker via
      # the docker0 gateway (same host-gateway pattern as Postgres). The broker's
      # HOST listener is published on 172.17.0.1:29092 (see .containers/cdc.yaml).
      KAFKA_BROKERS: ${KAFKA_BROKERS:-172.17.0.1:29092}
      KAFKA_CDC_TOPIC_PREFIX: ${KAFKA_CDC_TOPIC_PREFIX:-starci.public.}

      CORE_PORT: ${CORE_PORT}

      KEYCLOAK_URL: ${KEYCLOAK_URL}
      KEYCLOAK_REDIRECT_URI: ${KEYCLOAK_REDIRECT_URI}

      S3_MINIO_ENDPOINT: ${S3_MINIO_ENDPOINT}
      S3_MINIO_PUBLIC_ENDPOINT: ${S3_MINIO_PUBLIC_ENDPOINT}
      S3_MINIO_SECRET_ACCESS_KEY: ${S3_MINIO_SECRET_ACCESS_KEY}

      ELASTICSEARCH_NODE: ${ELASTICSEARCH_NODE}
      ELASTICSEARCH_PASSWORD: ${ELASTICSEARCH_PASSWORD}

      NATS_SERVER_1_HOST: ${NATS_SERVER_1_HOST}
      NATS_AUTH_TOKEN: ${NATS_AUTH_TOKEN}

      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID}
      S3_PUBLIC_ENDPOINT: ${S3_PUBLIC_ENDPOINT}
      S3_REGION: ${S3_REGION}

      POSTGRESQL_KEYCLOAK_HOST: ${POSTGRESQL_KEYCLOAK_HOST}

      BACKUP_ENCRYPT_PASSWORD: ${BACKUP_ENCRYPT_PASSWORD}

      GITHUB_OAUTH_REDIRECT_URI: ${GITHUB_OAUTH_REDIRECT_URI}

      # OAuth client id of the prod GitHub App "StarCi Academy" (public, not a secret).
      GITHUB_CLIENT_ID: ${GITHUB_CLIENT_ID}
    volumes:
      - /root/academy/.mount:/usr/src/app/.mount
      # Versioned data-git snapshots (.datasources/<sha>/ + manifest.json) — its own
      # host bind so the snapshot store survives container recreate / redeploy.
      - /root/academy/.datasources:/usr/src/app/.datasources
    restart: always
      
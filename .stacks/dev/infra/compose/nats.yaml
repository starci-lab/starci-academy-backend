# NATS with JetStream — the event bus behind job-status streaming.
#
# The server is started WITH a token, so the app must send the same one. A
# mismatch surfaces as "Authorization Violation" rather than as a connection
# error, which reads like a bug in the app instead of a config mismatch — so
# the token must come from the same minted file the app's env points at.
services:
  nats:
    image: nats:2.10-alpine
    container_name: ${STARCI_CONTAINER_PREFIX:-starci-}nats
    command: ["-js", "--auth", "${NATS_AUTH_TOKEN:-REPLACE_ME}"]
    ports:
      - "${STARCI_PORT_NATS}:4222"
      - "${STARCI_PORT_NATSMONITOR}:8222"
    volumes:
      - nats-data:/data
    restart: unless-stopped

volumes:
  nats-data:

# Kafka — KRaft mode, single node. Carries the CDC stream the progress
# projection listener consumes.
#
# Three listeners, and the reason matters:
#   PLAINTEXT  :9092   in-network traffic (other containers)
#   CONTROLLER :9093   KRaft quorum, this node talking to itself
#   EXTERNAL   :29092  the host, i.e. the Nest app running outside docker
#
# EXTERNAL is advertised as `localhost:${STARCI_PORT_KAFKA}` — the HOST port,
# not the container port. A Kafka client bootstraps on one address and is then
# redirected to whatever the broker advertises, so advertising the container
# port would make the first connection succeed and every subsequent one hang.
services:
  kafka:
    image: apache/kafka:3.7.1
    container_name: ${STARCI_CONTAINER_PREFIX:-starci-}kafka
    environment:
      KAFKA_NODE_ID: "0"
      KAFKA_PROCESS_ROLES: "broker,controller"
      KAFKA_CONTROLLER_QUORUM_VOTERS: "0@kafka:9093"
      KAFKA_LISTENERS: "PLAINTEXT://:9092,CONTROLLER://:9093,EXTERNAL://:29092"
      KAFKA_ADVERTISED_LISTENERS: "PLAINTEXT://kafka:9092,EXTERNAL://localhost:${STARCI_PORT_KAFKA}"
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: "CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,EXTERNAL:PLAINTEXT"
      KAFKA_CONTROLLER_LISTENER_NAMES: "CONTROLLER"
      KAFKA_INTER_BROKER_LISTENER_NAME: "PLAINTEXT"
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: "1"
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: "0"
    ports:
      - "${STARCI_PORT_KAFKA}:29092"
    volumes:
      - kafka-data:/var/lib/kafka/data
    restart: unless-stopped

volumes:
  kafka-data:

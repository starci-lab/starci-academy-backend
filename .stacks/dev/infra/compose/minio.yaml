# MinIO — the S3-compatible CDN. AssetsModule syncs brand assets here at boot.
#
# `minio-init` is a one-shot that creates the bucket and opens it for anonymous
# download, so a first upload does not 404. It waits on the HEALTHCHECK rather
# than plain `depends_on`, because MinIO answers its port some seconds before
# it will accept a bucket creation.
#
# That container exits as soon as it is done, which is why `npm run compose`
# polls `docker compose ps` instead of using `up --wait`: `--wait` reads an
# exited container as a failed one and turns a healthy stack into exit code 1.
services:
  minio:
    image: minio/minio:RELEASE.2024-06-13T22-53-53Z
    container_name: ${STARCI_CONTAINER_PREFIX:-starci-}minio
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-REPLACE_ME}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-REPLACE_ME}
    ports:
      - "${STARCI_PORT_MINIO}:9000"
      - "${STARCI_PORT_MINIOCONSOLE}:9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:9000/minio/health/live || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  minio-init:
    image: minio/mc:RELEASE.2024-06-12T14-34-03Z
    container_name: ${STARCI_CONTAINER_PREFIX:-starci-}minio-init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint:
      - /bin/sh
      - -c
      - |
        mc alias set local http://minio:9000 ${MINIO_ROOT_USER:-REPLACE_ME} ${MINIO_ROOT_PASSWORD:-REPLACE_ME} &&
        mc mb --ignore-existing local/${S3_BUCKET:-starci-academy} &&
        mc anonymous set download local/${S3_BUCKET:-starci-academy} &&
        echo "minio bucket ready"
    restart: "no"

volumes:
  minio-data:

<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Khảo sát trải nghiệm workshop</title>
  <style>
    *{box-sizing:border-box}body{margin:0;background:#f5f2fa;color:#211d27;font:15px/1.5 Inter,system-ui,sans-serif}.wrap{width:min(680px,calc(100% - 32px));margin:48px auto}.head,.form{background:#fff;border:1px solid #e4ddec;border-radius:18px;box-shadow:0 16px 40px rgba(46,32,65,.08)}.head{border-top:7px solid #7c3aed;padding:28px;margin-bottom:16px}.head h1{margin:0 0 8px;font-size:28px}.head p{color:#696171;margin:0}.form{padding:28px;display:grid;gap:22px}label,legend{font-weight:700;font-size:13px}label span,legend span{color:#dc2626}input,textarea,select{width:100%;margin-top:8px;border:1px solid #cec6d7;border-radius:9px;padding:11px;font:inherit}fieldset{border:0;padding:0;margin:0}.choice{display:flex;gap:10px;align-items:center;margin-top:10px;font-weight:400}.choice input{width:auto;margin:0}button{border:0;border-radius:9px;padding:11px 18px;background:#7c3aed;color:#fff;font-weight:700}
  </style>
</head>
<body><main class="wrap"><section class="head"><h1>Khảo sát trải nghiệm workshop</h1><p>Form demo local để kiểm thử Form Copilot. Không có dữ liệu thật.</p></section><form class="form"><label>Họ và tên <span>*</span><input name="full_name" required placeholder="Nguyễn Văn An"></label><label>Thành phố<select name="city"><option value="">Chọn thành phố</option><option value="hanoi">Hà Nội</option><option value="danang">Đà Nẵng</option><option value="hcm">TP. Hồ Chí Minh</option></select></label><label>Tuổi<input type="number" name="age" min="18" max="65" step="1"></label><fieldset><legend>Mức độ hài lòng <span>*</span></legend><label class="choice"><input type="radio" name="satisfaction" value="great" required> Rất hài lòng</label><label class="choice"><input type="radio" name="satisfaction" value="good"> Hài lòng</label><label class="choice"><input type="radio" name="satisfaction" value="neutral"> Bình thường</label></fieldset><label>Điều bạn muốn cải thiện<textarea name="feedback" rows="4" maxlength="600"></textarea></label><label class="choice"><input type="checkbox" name="follow_up"> Tôi muốn nhận thông tin workshop tiếp theo</label><button type="submit">Gửi phản hồi</button></form></main><script>document.querySelector('form').addEventListener('submit',event=>{event.preventDefault();alert('Demo local: form không gửi đi.');});</script></body>
</html>

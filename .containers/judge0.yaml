# Self-hosted Judge0 (code-execution sandbox) for the coding-practice feature.
#
# Run under the same `containers` project as the other local services:
#   docker compose -f .containers/judge0.yaml -p containers up -d
#
# The NestJS backend talks to the server over REST at http://localhost:2358
# (JUDGE0_BASE_URL default). isolate (the sandbox) needs privileged + cgroup v1
# on the host; on a cgroup-v2-only host the workers may fail to execute code.
#
# Pinned to Judge0 CE 1.13.1 — the backend's default JUDGE0_LANGUAGE_IDS match
# this version's language ids.

x-judge0-image: &judge0-image judge0/judge0:1.13.1

services:
  # REST API server — the backend posts /submissions/batch here.
  judge0-server:
    image: *judge0-image
    container_name: judge0-server
    volumes:
      - ./judge0.conf:/judge0.conf:ro
    ports:
      - '2358:2358'
    privileged: true
    restart: always
    depends_on:
      - judge0-db
      - judge0-redis

  # Background workers that actually compile + run submissions.
  judge0-workers:
    image: *judge0-image
    container_name: judge0-workers
    command: ['./scripts/workers']
    volumes:
      - ./judge0.conf:/judge0.conf:ro
    privileged: true
    restart: always
    depends_on:
      - judge0-db
      - judge0-redis

  # Judge0's own PostgreSQL (separate from the app DB).
  judge0-db:
    image: postgres:16.2
    container_name: judge0-db
    env_file: judge0.conf
    volumes:
      - judge0-postgres-data:/var/lib/postgresql/data/
    restart: always

  # Judge0's own Redis (job queue + result store).
  judge0-redis:
    image: redis:7.2.4
    container_name: judge0-redis
    command:
      [
        'bash',
        '-c',
        'docker-entrypoint.sh --appendonly no --requirepass "$$REDIS_PASSWORD"',
      ]
    env_file: judge0.conf
    volumes:
      - judge0-redis-data:/data
    restart: always

volumes:
  judge0-postgres-data:
  judge0-redis-data:

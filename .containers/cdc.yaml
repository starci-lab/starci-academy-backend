# Minimal CDC stack: Kafka (KRaft, single node, PLAINTEXT — no ZooKeeper, no UI,
# no SASL) + Debezium Server. Kafka exists ONLY to carry Debezium change events.
# Joins the existing `containers_default` network so Debezium reaches `postgresql`.

services:
  kafka:
    image: docker.io/bitnamilegacy/kafka:3.9
    ports:
      - "29092:29092"   # host access (NestJS projector consumer)
    volumes:
      - "kafka_cdc_data:/bitnami"
    environment:
      # KRaft (broker + controller in one node, no ZooKeeper)
      - KAFKA_CFG_NODE_ID=0
      - KAFKA_CFG_PROCESS_ROLES=controller,broker
      - KAFKA_CFG_CONTROLLER_QUORUM_VOTERS=0@kafka:9093
      # 3 listeners: internal (debezium ↔ kafka), controller, external (host)
      - KAFKA_CFG_LISTENERS=PLAINTEXT://:9092,CONTROLLER://:9093,EXTERNAL://:29092
      - KAFKA_CFG_ADVERTISED_LISTENERS=PLAINTEXT://kafka:9092,EXTERNAL://localhost:29092
      - KAFKA_CFG_LISTENER_SECURITY_PROTOCOL_MAP=CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,EXTERNAL:PLAINTEXT
      - KAFKA_CFG_CONTROLLER_LISTENER_NAMES=CONTROLLER
      - KAFKA_CFG_INTER_BROKER_LISTENER_NAME=PLAINTEXT
      - KAFKA_CFG_AUTO_CREATE_TOPICS_ENABLE=true
      - ALLOW_PLAINTEXT_LISTENER=yes
      # keep it light — single CDC carrier
      - KAFKA_HEAP_OPTS=-Xmx512m -Xms512m

  debezium:
    image: debezium/server:2.7.3.Final
    depends_on:
      - kafka
    volumes:
      - "debezium_cdc_data:/debezium/data"
      - "./debezium.application.properties:/debezium/config/application.properties:ro"

volumes:
  kafka_cdc_data:
    driver: local
  debezium_cdc_data:
    driver: local

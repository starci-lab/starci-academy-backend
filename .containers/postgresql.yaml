services:
  postgresql:
    image: docker.io/bitnamilegacy/postgresql:latest
    ports:
      - '5433:5432'
    volumes:
      - 'postgresql_data:/bitnami/postgresql'
    environment:
      - 'ALLOW_EMPTY_PASSWORD=false'
      - 'POSTGRESQL_USERNAME=postgres'
      - 'POSTGRESQL_DATABASE=postgres'
      - 'POSTGRESQL_PASSWORD=Cuong123_A'
      # logical decoding so Debezium CDC can read the WAL
      - 'POSTGRESQL_WAL_LEVEL=logical'
      - 'POSTGRESQL_MAX_WAL_SENDERS=10'
      - 'POSTGRESQL_MAX_REPLICATION_SLOTS=10'

volumes:
  postgresql_data:
    driver: local

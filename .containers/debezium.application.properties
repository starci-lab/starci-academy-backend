# Debezium Server — Postgres CDC → Kafka sink. Watches only the 4 progress
# tables; their row-changes drive the progress-projection rebuild.

# ── sink: Kafka (internal plaintext listener) ────────────────────────────────
debezium.sink.type=kafka
debezium.sink.kafka.producer.bootstrap.servers=kafka:9092
debezium.sink.kafka.producer.key.serializer=org.apache.kafka.common.serialization.StringSerializer
debezium.sink.kafka.producer.value.serializer=org.apache.kafka.common.serialization.StringSerializer

# ── source: Postgres logical decoding (pgoutput) ─────────────────────────────
debezium.source.connector.class=io.debezium.connector.postgresql.PostgresConnector
debezium.source.offset.storage.file.filename=/debezium/data/offsets.dat
debezium.source.offset.flush.interval.ms=0
debezium.source.database.hostname=postgresql
debezium.source.database.port=5432
debezium.source.database.user=postgres
debezium.source.database.password=Cuong123_A
debezium.source.database.dbname=starci-academy
debezium.source.topic.prefix=starci
debezium.source.plugin.name=pgoutput
debezium.source.slot.name=debezium_progress
debezium.source.publication.name=dbz_progress
debezium.source.publication.autocreate.mode=filtered
debezium.source.table.include.list=public.user_contents,public.user_challenge_submission_attempts,public.user_milestone_task_attempts,public.enrollments,public.content_reactions,public.content_comments,public.user_follows,public.notifications
debezium.source.schema.include.list=public
# emit the new row state as a flat JSON value (easier for the projector to read)
debezium.transforms=unwrap
debezium.transforms.unwrap.type=io.debezium.transforms.ExtractNewRecordState
debezium.transforms.unwrap.drop.tombstones=false
debezium.transforms.unwrap.delete.handling.mode=rewrite

quarkus.log.console.json=false
quarkus.log.level=INFO

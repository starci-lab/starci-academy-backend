services:
  mailcowdockerized:
    image: mailcow/mailcow-dockerized:latest
    container_name: mailcow
    restart: always
    env_file:
      - mailcow.conf
    ports:
      - "25:25"
      - "587:587"
      - "465:465"
      - "110:110"
      - "995:995"
      - "143:143"
      - "993:993"
      - "8080:80"
      - "8443:443"
    volumes:
      - ./mailcow-data:/var/lib/mailcow
    extra_hosts:
      - "host.docker.internal:host-gateway"
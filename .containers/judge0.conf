# Judge0 configuration (consumed by the server, workers, db and redis).
# LOCAL/DEV defaults — do not commit production secrets here.

################################################################################
# Authentication (optional) — empty = open API for local dev.
################################################################################
AUTHN_HEADER=X-Auth-Token
AUTHN_TOKEN=

################################################################################
# PostgreSQL (Judge0's own database — separate from the app DB)
################################################################################
POSTGRES_HOST=judge0-db
POSTGRES_PORT=5432
POSTGRES_DB=judge0
POSTGRES_USER=judge0
POSTGRES_PASSWORD=judge0-local-password

################################################################################
# Redis (Judge0's own queue/store)
################################################################################
REDIS_HOST=judge0-redis
REDIS_PORT=6379
REDIS_PASSWORD=judge0-local-password

################################################################################
# Resource limits (safety caps; per-submission limits are sent by the backend)
################################################################################
MAX_CPU_TIME_LIMIT=15
MAX_WALL_TIME_LIMIT=20
MAX_MEMORY_LIMIT=512000
MAX_PROCESSES_AND_OR_THREADS=120
MAX_SUBMISSION_BATCH_SIZE=100
ENABLE_NETWORK=false

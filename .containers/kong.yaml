services:
  kong-migrations:
    image: kong:latest
    command: kong migrations bootstrap
    environment:
      - KONG_DATABASE=postgres
      - KONG_PG_HOST=host.docker.internal
      - KONG_PG_PORT=5432
      - KONG_PG_USER=postgres
      - KONG_PG_PASSWORD=Cuong123_A
      - KONG_PG_DATABASE=kong
  kong:
    image: kong:latest
    depends_on:
      - kong-migrations
    ports:
      - "8000:8000"
      - "8001:8001"
    environment:
      - KONG_DATABASE=postgres
      - KONG_PG_HOST=host.docker.internal
      - KONG_PG_PORT=5432
      - KONG_PG_USER=postgres
      - KONG_PG_PASSWORD=Cuong123_A
      - KONG_PG_DATABASE=kong
      - KONG_ADMIN_LISTEN=0.0.0.0:8001
    restart: unless-stopped
  konga:
    image: pantsel/konga:latest
    ports:
      - "1337:1337"
    environment:
      - NODE_ENV=production
    restart: unless-stopped

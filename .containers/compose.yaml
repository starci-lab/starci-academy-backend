# StarCi Academy backend — local-dev infrastructure.
#
# Brings up every service the core app (`apps/core`) connects to at boot, with
# ports/credentials matching `src/modules/env/config.ts` defaults + `.env.override`.
# The Nest app itself runs on the HOST (`npm run start:dev`), so every service
# publishes its port to localhost.
#
#   docker compose -f .containers/compose.yaml up -d
#   docker compose -f .containers/compose.yaml down          # keep volumes
#   docker compose -f .containers/compose.yaml down -v        # wipe data too
#
# NOTE: MongoDB is intentionally absent — it appears in the read-policy list but
# no Mongoose connection is wired in the app.

name: starci-academy-backend

services:
  # ── PostgreSQL (primary datasource; TypeORM synchronize builds the schema) ──
  postgres:
    image: postgres:16-alpine
    container_name: starci-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: Cuong123_A
      POSTGRES_DB: starci-academy
    ports:
      - "5433:5432"           # host 5433 → matches POSTGRESQL_PRIMARY_PORT in .env.override
    volumes:
      - pg-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d starci-academy"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  # ── Redis (cache + bullmq + throttler + adapter) ──
  redis:
    image: redis:7-alpine
    container_name: starci-redis
    command: ["redis-server", "--requirepass", "Cuong123_A"]
    ports:
      - "6380:6379"           # host 6380 → matches REDIS_*_PORT in .env.override
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "Cuong123_A", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  # ── Elasticsearch (content/course read source; security on, no TLS for dev) ──
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.13.4
    container_name: starci-elasticsearch
    environment:
      discovery.type: single-node
      ELASTIC_PASSWORD: "123456"          # matches ELASTICSEARCH_PASSWORD (user: elastic)
      xpack.security.enabled: "true"
      xpack.security.http.ssl.enabled: "false"
      ES_JAVA_OPTS: "-Xms512m -Xmx512m"
      bootstrap.memory_lock: "true"
    ulimits:
      memlock:
        soft: -1
        hard: -1
    ports:
      - "9200:9200"
    volumes:
      - es-data:/usr/share/elasticsearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -s -u elastic:123456 http://localhost:9200/_cluster/health | grep -qE 'green|yellow'"]
      interval: 10s
      timeout: 10s
      retries: 20
    restart: unless-stopped

  # ── Qdrant (vector store for langchain/embeddings) ──
  # v1.10+ required: the app's @qdrant/js-client-rest 1.17 (via QdrantVectorStore)
  # speaks the Universal Query API (POST /points/query), introduced in Qdrant
  # v1.10. On v1.9.2 that endpoint 404s and ContentRagRetrievalService swallows
  # the error → empty results (content-linking, chat grounding, interview
  # grounding all silently degrade). v1.10.1 = single-minor upgrade from v1.9.2
  # (supported storage step) that adds the Query API.
  qdrant:
    image: qdrant/qdrant:v1.10.1
    container_name: starci-qdrant
    environment:
      QDRANT__SERVICE__API_KEY: "Cuong123_A"   # matches QDRANT_API_KEY
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant-data:/qdrant/storage
    restart: unless-stopped

  # ── Kafka (KRaft, single node) — CDC progress-projection listener ──
  kafka:
    image: apache/kafka:3.7.1
    container_name: starci-kafka
    environment:
      KAFKA_NODE_ID: "0"
      KAFKA_PROCESS_ROLES: "broker,controller"
      KAFKA_CONTROLLER_QUORUM_VOTERS: "0@kafka:9093"
      KAFKA_LISTENERS: "PLAINTEXT://:9092,CONTROLLER://:9093,EXTERNAL://:29092"
      KAFKA_ADVERTISED_LISTENERS: "PLAINTEXT://kafka:9092,EXTERNAL://localhost:29092"
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: "CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,EXTERNAL:PLAINTEXT"
      KAFKA_CONTROLLER_LISTENER_NAMES: "CONTROLLER"
      KAFKA_INTER_BROKER_LISTENER_NAME: "PLAINTEXT"
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: "1"
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: "0"
    ports:
      - "29092:29092"          # matches KAFKA_BROKERS=localhost:29092
    volumes:
      - kafka-data:/var/lib/kafka/data
    restart: unless-stopped

  # ── MinIO (S3-compatible CDN; AssetsModule syncs brand assets here on boot) ──
  minio:
    image: minio/minio:RELEASE.2024-06-13T22-53-53Z
    container_name: starci-minio
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: minioadmin              # matches S3_MINIO_ACCESS_KEY_ID
      MINIO_ROOT_PASSWORD: minioadmin123        # matches S3_MINIO_SECRET_ACCESS_KEY
    ports:
      - "9000:9000"           # S3 API  (S3_MINIO_ENDPOINT)
      - "9001:9001"           # console UI
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:9000/minio/health/live || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  # one-shot: create the `starci-academy` bucket so the app doesn't 404 on first upload
  minio-init:
    image: minio/mc:RELEASE.2024-06-12T14-34-03Z
    container_name: starci-minio-init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint:
      - /bin/sh
      - -c
      - |
        mc alias set local http://minio:9000 minioadmin minioadmin123 &&
        mc mb --ignore-existing local/starci-academy &&
        mc anonymous set download local/starci-academy &&
        echo "minio bucket ready"
    restart: "no"

  # ── NATS (JetStream) — event bus for job-status streaming ──
  nats:
    image: nats:2.10-alpine
    container_name: starci-nats
    command: ["-js", "--auth", "starci@2026"]   # token matches NATS_AUTH_TOKEN
    ports:
      - "4222:4222"
      - "8222:8222"           # monitoring
    volumes:
      - nats-data:/data
    restart: unless-stopped

  # ── Keycloak (auth server; dev mode, embedded H2) ──
  keycloak:
    image: quay.io/keycloak/keycloak:24.0
    container_name: starci-keycloak
    command: ["start-dev", "--http-port=8080"]
    environment:
      KEYCLOAK_ADMIN: admin                     # matches KEYCLOAK_ADMIN_USERNAME
      KEYCLOAK_ADMIN_PASSWORD: bitnami123        # matches KEYCLOAK_ADMIN_PASSWORD
    ports:
      - "8080:8080"           # canonical local Keycloak origin: http://localhost:8080
    restart: unless-stopped

  # ── cAdvisor — exposes per-container CPU/memory/network metrics that
  #     Prometheus scrapes below. Powers the LIVE resource numbers on the
  #     public architecture page (postgres/redis/kafka/… containers only —
  #     Judge0/Ollama/mail/aiBalancer have no local container to measure). ──
  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.49.1
    container_name: starci-cadvisor
    privileged: true
    ports:
      - "8085:8080"
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:rw
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
      - /dev/disk/:/dev/disk:ro
    restart: unless-stopped

  # ── Prometheus — scrapes cAdvisor every 15s; queried by PrometheusMetricsService
  #     (BE runs on the HOST, so it reaches this at http://localhost:9090). ──
  prometheus:
    image: prom/prometheus:v2.53.0
    container_name: starci-prometheus
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    ports:
      - "9090:9090"           # matches PROMETHEUS_URL in .env.override
    depends_on:
      - cadvisor
    restart: unless-stopped

volumes:
  pg-data:
  redis-data:
  es-data:
  qdrant-data:
  kafka-data:
  minio-data:
  nats-data:
  prometheus-data:

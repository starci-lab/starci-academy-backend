sonar.projectKey=starci-academy-backend
sonar.projectName=StarCi Academy Backend
sonar.sourceEncoding=UTF-8

sonar.sources=src,apps
sonar.tests=src,apps
sonar.exclusions=**/*.spec.ts,**/*.int-spec.ts,**/*.e2e-spec.ts,**/*.harness-spec.ts,**/dist/**,**/coverage/**
sonar.test.inclusions=**/*.spec.ts,**/*.int-spec.ts,**/*.e2e-spec.ts,**/*.harness-spec.ts
sonar.javascript.lcov.reportPaths=coverage/lcov.info

# The JS/TS analyzer runs in a bridge Node process whose default heap is sized for a
# small project. This repository hands it ~4700 files, and at the default the bridge
# dies mid-analysis with "bridge server is unresponsive" — which surfaces as a failed
# scan, not as a coverage or quality result.
sonar.javascript.node.maxspace=8192
